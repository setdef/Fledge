# ffi_phone is a lone script with the ffi gem from rubygems.org, which
# calls C functions by name. It sits inside Fledge's own gem, so without
# this file fledge build would take Fledge's Gemfile for its own (ADR
# 005). The identifier is what iOS and Android know it by (ADR 012).
name: FfiPhone
identifier: com.setdef.fledge.FfiPhone
