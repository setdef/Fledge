# rust_phone is a lone script with a gem whose extension is Rust, built
# with rb-sys and magnus. It sits inside Fledge's own gem, so without this
# file fledge build would take Fledge's Gemfile for its own (ADR 005).
# The identifier is what iOS and Android know it by (ADR 012).
name: RustPhone
identifier: com.setdef.fledge.RustPhone
