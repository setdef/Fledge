    aarch64-linux:
      url: https://github.com/jdx/ruby/releases/download/4.1.0-preview1-1/ruby-4.1.0-preview1.arm64_linux.tar.gz
      sha256: f4ce52e44c6e472a1b89f324a5e89a3c42aa0ef8e5b2849fea4c99309a1fd047
