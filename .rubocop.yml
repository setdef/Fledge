inherit_from:
  - ./vendor/goodcop/base.yml

# The cops for the two kinds of Ruby this repository has besides lib/:
# Minitest tests and Rake tasks.
plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: "4.0"
  Exclude:
    # Build staging directory
    - "tmp/**/*"
    # The gems tasks/setup.rb installs here on CI
    - "vendor/bundle/**/*"
    # What fledge build writes
    - "dist/**/*"
    # The recipes the package-manager proof installs, as each manager reads
    # them: a Homebrew formula is not written in this repository's style.
    - "test/fixtures/package_managers/**/*"
# The LF every checkout has (.gitattributes), on Windows too, where
# goodcop's native would ask for CRLF and fail every file.
Layout/EndOfLine:
  EnforcedStyle: lf
# RDoc mis-parses endless methods: the methods after one lose their comments
# and visibility. Every
# file RDoc reads uses def ... end.
Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: disallow
  Include:
    - "lib/**/*.rb"
    - "exe/**/*"
    - "examples/**/*.rb"
