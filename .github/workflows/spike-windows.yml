# SPIKE (Plan 001, spike 2): does a Windows launcher run an app on
# RubyInstaller's Ruby? Throwaway; see spike/windows/FINDINGS.md.
# Build compiles the launcher with MSYS2 UCRT64 gcc against the pinned
# RubyInstaller archive and assembles test apps; Delivery runs them on a
# fresh runner from another drive, with no Ruby on PATH.

name: Spike (Windows)

on:
  push:
    branches: [spike/windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RI_TAG: RubyInstaller-4.0.9-1
  RI_ASSET: rubyinstaller-4.0.9-1-x64.7z
  RI_SHA256: 1dc0715916251a13c4f6a550a3da1f2c726bff869371fd573a65234c008f47b4
  # "appveyor ri2 package signing key", from rubyinstaller2's own repo at
  # a pinned commit (recipes/unpack/appveyor-repo-key.asc).
  RI_KEY_URL: https://raw.githubusercontent.com/oneclick/rubyinstaller2/866be16701f052d01f03fb28807cb3689c65b92d/recipes/unpack/appveyor-repo-key.asc
  RI_KEY_FPR: 79D1D4E12FF93365DEAA8DCEF98B8484BE8BF1C5

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify RubyInstaller
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/oneclick/rubyinstaller2/releases/download/$RI_TAG"
          curl -fsSLO "$base/$RI_ASSET"
          curl -fsSLO "$base/$RI_ASSET.asc"
          echo "$RI_SHA256  $RI_ASSET" | sha256sum -c -
          curl -fsSL "$RI_KEY_URL" -o ri-key.asc
          export GNUPGHOME="$PWD/.gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          gpg --batch --import ri-key.asc
          gpg --batch --status-fd 1 --verify "$RI_ASSET.asc" "$RI_ASSET" | tee gpg.out
          grep -q "^\[GNUPG:\] VALIDSIG $RI_KEY_FPR " gpg.out
          7z x -y -bd "$RI_ASSET" > /dev/null
          ls rubyinstaller-4.0.9-1-x64

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          release: false
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build launchers and apps
        shell: msys2 {0}
        run: bash spike/windows/build.sh rubyinstaller-4.0.9-1-x64 dist

      - name: Inspect RubyInstaller's own executables
        shell: msys2 {0}
        run: |
          for f in rubyinstaller-4.0.9-1-x64/bin/ruby.exe rubyinstaller-4.0.9-1-x64/bin/rubyw.exe rubyinstaller-4.0.9-1-x64/bin/x64-ucrt-ruby400.dll; do
            echo "== $f"; objdump -p "$f" | grep -E 'Subsystem|DLL Name'
          done
          echo "== exports the launcher needs"
          objdump -p rubyinstaller-4.0.9-1-x64/bin/x64-ucrt-ruby400.dll | grep -E '\b(ruby_sysinit|ruby_init_stack|ruby_init|ruby_options|ruby_run_node|ruby_setup)$'

      # One zip, as a person would download it (the artifact service's own
      # extraction failed on the bare tree in an earlier run).
      - name: Zip the apps
        shell: bash
        run: cd dist/apps && 7z a -tzip -mx=9 -bd ../apps.zip . > /dev/null && ls -l ../apps.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps
          path: dist/apps.zip
          if-no-files-found: error

  # Plan 001 asks whether the launcher can be built off Windows. It needs
  # only Ruby's headers (the default mode links no Ruby library), so try
  # a mingw-w64 UCRT cross compiler.
  cross:
    name: Cross-compile on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ubuntu 26.04 dropped gcc-mingw-w64-ucrt64, and its plain mingw-w64
      # targets msvcrt, a different C runtime from RubyInstaller's UCRT (the
      # launcher's _wputenv_s must edit the same environment copy Ruby's
      # CRT reads). llvm-mingw's UCRT build, pinned by hash, instead.
      - name: Install llvm-mingw (UCRT)
        env:
          LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $LLVM_MINGW.tar.xz" | sha256sum -c -
          tar -xJf "$LLVM_MINGW.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" --version | head -1

      - name: Download RubyInstaller's headers
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/oneclick/rubyinstaller2/releases/download/$RI_TAG/$RI_ASSET"
          echo "$RI_SHA256  $RI_ASSET" | sha256sum -c -
          7z x -y -bd "$RI_ASSET" 'rubyinstaller-4.0.9-1-x64/include' > /dev/null

      - name: Cross-compile the launcher
        run: |
          set -euo pipefail
          ri=$PWD/rubyinstaller-4.0.9-1-x64
          mkdir -p cross
          (cd spike/windows && x86_64-w64-mingw32-windres launcher.rc -O coff -o ../../cross/launcher.res.o)
          x86_64-w64-mingw32-clang -std=gnu11 -O2 -Wall -Wextra -Werror -municode \
            -isystem "$ri/include/ruby-4.0.0" -isystem "$ri/include/ruby-4.0.0/x64-mingw-ucrt" \
            spike/windows/launcher.c cross/launcher.res.o -municode -s -mconsole \
            -o cross/launcher-cross.exe
          llvm-objdump -p cross/launcher-cross.exe | grep -E 'Subsystem|DLL Name'
          ls -l cross/launcher-cross.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross
          path: cross/launcher-cross.exe
          if-no-files-found: error

  delivery:
    name: Delivery
    needs: [build, cross]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: spike/windows

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps
          path: ${{ runner.temp }}/dl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross
          path: ${{ runner.temp }}/cross

      - name: Unzip the apps
        shell: pwsh
        run: |
          7z x -y -bd "-o$env:RUNNER_TEMP\apps" "$env:RUNNER_TEMP\dl\apps.zip" | Select-Object -Last 3
          Copy-Item "$env:RUNNER_TEMP\cross\launcher-cross.exe" "$env:RUNNER_TEMP\apps\hello\hello-cross.exe"

      - name: Run the apps elsewhere, without Ruby, in a hostile environment
        shell: pwsh
        run: pwsh -NoProfile -File spike/windows/test.ps1 -Apps "$env:RUNNER_TEMP\apps"
