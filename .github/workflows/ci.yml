# The trial of ADR 012, section 9, on the experiment/android-aab branch:
# only the Mobile apps (Android) jobs, building each app's Android App
# Bundle beside its APKs, checking it with bundletool, and running it on
# the emulators from the APKs bundletool makes, with the runtimes of
# trunk's run 42428270566 (5f851d2), since the change touches no runtime.
name: CI
on:
  push:
    branches:
      - experiment/android-aab
permissions:
  contents: read
  actions: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: 'false'
  BUNDLE_FROZEN: 'true'
  RUNTIMES_RUN: '42428270566'
jobs:
  mobile-apps-android:
    name: Mobile apps (Android emulator, API 36, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          cmake --version

      # Every Gradle wrapper in a project fledge build writes must be the
      # one Gradle released (runtime/sources.yml pins its SHA-256 too).
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-x86_64-linux
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      # fledge build android compiles a gem's extension with the NDK on the
      # computer (ADR 022), as a developer's own: the very NDK the runtime
      # is built with, pinned by SHA-256.
      - name: Install the pinned NDK
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile ndk hosts x86_64-linux)
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_ROOT=$(echo "$RUNNER_TEMP"/ndk/android-ndk-*)" >> "$GITHUB_ENV"

      # bundletool makes and installs the APKs Play would serve from a
      # bundle, pinned by SHA-256 (runtime/sources.yml).
      - name: Fetch the pinned bundletool
        run: |
          jar=$(ruby .github/scripts/fetch_pin.rb mobile bundletool)
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      - name: Build the apps with fledge build android and Gradle, as APKs and bundles, and check each for 16 KB pages, API 36, and Play's size limit
        run: ruby tasks/mobile_parity.rb android-build "$RUNNER_TEMP/runtimes"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 4 GB of RAM, as the phones that ship 16 KB pages have at least
      # twice that: with the emulator's default, the 16 KB system ran out
      # of memory and its low-memory killer killed the app in front, one
      # app in one run and another in the next.
      - name: Run the apps on the emulator, from their APKs and from their bundles
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ruby tasks/mobile_parity.rb android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-apps-android-${{ matrix.target }}
          path: tmp/mobile-parity/android/logcat-*.txt
          retention-days: 14

  # An Android app's project is built on macOS and Windows too, as Google
  # supports its SDK there and Briefcase, Flutter, React Native, and Tauri
  # build Android apps there (ADR 012): examples/mobile_app, written with
  # fledge build android and built with its Gradle wrapper and the
  # runner's Android SDK, as an APK and as the release bundle Play takes,
  # which is signed, validated, and made into Play's APKs with bundletool.
  mobile-apps-android-hosts:
    name: Mobile apps (Android project on ${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: arm64-darwin
          - os: windows-latest
            host: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Ruby pin
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      # RubyInstaller's Ruby on Windows, whose platform is the
      # x64-mingw-ucrt Fledge builds on; Ruby's own elsewhere.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - name: Use Java 21
        run: echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME_21_arm64}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - name: Write examples/mobile_app's Android project with fledge build android
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: ruby -I lib exe/fledge build android -o dist examples/mobile_app

      - name: Fetch the pinned bundletool
        run: |
          jar=$(ruby .github/scripts/fetch_pin.rb mobile bundletool)
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      - name: Build it with its Gradle wrapper and check the APK and the bundle
        run: |
          cd "dist/Mobile App-android"
          if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat --no-daemon assembleDebug bundleRelease; else ./gradlew --no-daemon assembleDebug bundleRelease; fi
          cd ../..
          ruby tasks/mobile_parity.rb android-check "dist/Mobile App-android/build/outputs/apk/debug/Mobile App-debug.apk"
          ruby tasks/mobile_parity.rb android-bundle "dist/Mobile App-android/build/outputs/bundle/release/Mobile App-release.aab"

