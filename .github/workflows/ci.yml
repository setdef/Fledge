# Trial for experiment/ci-jobs only: ci-speed-changes' ci.yml without the
# tests, parity, musl apps, Android apps, and license jobs, which these
# changes do not touch.
#
# Plan 001's pipeline, on every push and pull request: the gate, then a
# runtime per platform, then the tests on each platform with its own
# runtime, then each platform building the examples for itself on a
# runner of its own (ADR 010), then Delivery: each built app unpacked and
# run on a fresh computer that has never had Ruby.
#
# The gate runs once, on Linux: its lints (RuboCop, Steep, RDoc
# coverage, REUSE, actionlint, clang-format) read the same files on
# every OS, so one run answers for all three.
#
# A pushed pin commit, which changes only lib/fledge/SHA256SUMS (ADR
# 014, section 5), runs only the gate and a check that its pins match
# the runtimes of its parent's run; every other job is skipped (the
# Changes job). Every other commit runs everything below.
#
# The macOS and Linux runtimes build on each platform's own runner
# (macos-15 is Apple Silicon, ubuntu-24.04-arm is aarch64), because their
# launchers link Ruby itself. The Windows runtime builds on Linux: its
# launcher loads Ruby's DLL when it runs, so it cross-compiles with a
# pinned llvm-mingw from Ruby's headers alone (runtime/sources.yml), and
# Windows runners test it, build apps with it, and deliver them. Each
# platform's apps are built on that platform, as developers build them.
#
# A windowed app gets an installer too (ADR 009): a disk image for macOS,
# an NSIS setup program for Windows, and an AppImage for Linux (and a
# .deb, which windowed_app asks for), each written on its own platform's
# runner; and Delivery installs each on a
# fresh runner and runs the app it installed.
#
# The mobile runtimes (ADR 011) build from Ruby's source, iOS's on a Mac
# with Xcode and Android's on Linux with the NDK, and their Delivery is
# apps built with fledge build ios and fledge build android (ADR 012),
# whose Xcode and Gradle projects build unsigned, run in the iOS
# Simulator on an iPhone and an iPad and on Android emulators with 4 KB
# and 16 KB pages: hello, a gem-shaped app with pure-Ruby gems, a script
# that requires json and a bundled gem and reaches a server over HTTPS,
# and the parity probe (tasks/mobile_parity.rb).
#
# Every runtime build runs the license audit and refuses to archive a
# runtime that breaks Fledge's license policy (ADR 004). The Licenses
# jobs check what it wrote and that it still fails on GPL code; the
# upstream jobs show it catching what rv-ruby and RubyInstaller ship and
# runtimes remove; the licensing page job keeps doc/licensing.md true to
# the runtimes; and the Replace jobs prove that whoever receives an app
# can replace its LGPL libraries, as that page tells developers.
#
# release.yml, on a v* tag, publishes the runtimes this workflow built
# from the release commit, once it has passed on trunk on the release
# commit and on the pin commit tagged (ADR 014). It looks those runs up
# and does not run this again. Nothing here, or ever, publishes to
# RubyGems.org (ADR 001).

name: CI

on:
  push:
    # Not on tags: release.yml looks up the tagged commit's run on trunk.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds where they exist
  # (mise's Ruby documentation); false makes a missing build fail instead
  # of compiling Ruby for ten minutes.
  MISE_RUBY_COMPILE: "false"
  # The Rust that compiles the examples' Rust gems in the Build from
  # source jobs, the release Ferro's gems are tested with (its mise.toml).
  RUST_TOOLCHAIN: "1.99.1"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # musl Linux (ADR 017): the Alpine a developer with Ruby builds apps
  # on, and the bare Alpine Delivery runs them on, pinned by digest.
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins the tools contributors use (bin/setup): Ruby, the
      # REUSE tool, actionlint, shellcheck, and clang-format. CI installs
      # the same pins the same way. Its cache is keyed by mise.toml's hash.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      # Bundler keeps its files outside the checkout, where RuboCop and
      # the REUSE tool would read them.
      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      # Gems with native extensions compile against one Ruby on one OS, so
      # the key names both, with the lockfile. Only an exact match
      # restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      # Minitest prints each test's name and time (A is Minitest::TestTask's
      # argument variable), so a stuck test shows which it is.
      - name: Run the gate
        timeout-minutes: 15
        env:
          A: --verbose
          # Every test of a compiled file runs, with this runner's GNU
          # objdump for ELF and LLVM's for the rest (test/test_helper.rb).
          FLEDGE_REQUIRE_READERS: "1"
        run: bundle exec rake

      # The gate starts with lint:fix, which corrects RuboCop offenses and
      # adds missing license headers, so an offense would pass as a fix
      # nobody committed. A changed or new file fails here instead.
      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

  # A pin commit (ADR 014, section 5) changes only lib/fledge/SHA256SUMS
  # from a parent whose run built and delivered every runtime it pins.
  # No runtime, app, or check below reads that file, so a pushed pin
  # commit runs the gate, which does, and this job, and every other job
  # is skipped: each job with no needs of its own waits for this one and
  # runs only for any other commit, and the jobs that need those are
  # skipped with them. Pull requests always run everything.
  #
  # On a pin commit, this job also checks that the pins are exactly the
  # runtimes its parent's run built, in which every job ran and passed:
  # the run release.yml will publish them from (tasks/ci_runs.rb),
  # checked as release.yml checks them. On any other commit those steps
  # are skipped and the job passes. It is one job that always runs, not
  # a second one skipped on every other commit, because release.yml
  # requires the release commit's run to have skipped no job.
  changes:
    name: Changes, and a pin commit's pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Finding the parent's run and downloading its runtimes.
      actions: read
    outputs:
      pins-only: ${{ steps.kind.outputs.pins-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Tell whether this is a pin commit
        id: kind
        run: |
          pins_only=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then pins_only=$(.github/scripts/pins-only.sh); fi
          echo "Pin commit: $pins_only"
          echo "pins-only=$pins_only" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: steps.kind.outputs.pins-only == 'true'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Find the parent's run, in which every job passed
        if: steps.kind.outputs.pins-only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(git rev-parse HEAD^)
          run=$(ruby tasks/ci_runs.rb green "$built" --every-job --branch "$GITHUB_REF_NAME")
          echo "The pins name the runtimes of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, built from $built"
          echo "RUN=$run" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.kind.outputs.pins-only == 'true'
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Check the runtimes against the pins
        if: steps.kind.outputs.pins-only == 'true'
        run: .github/scripts/check-pins.sh "$RUNNER_TEMP/runtimes" lib/fledge/SHA256SUMS

  # One runtime per platform (rake runtime): the launcher compiled with
  # warnings as errors and the compiler's static analyzer, the pinned
  # Ruby's standard library pruned beside it (rv-ruby's, or for Windows
  # RubyInstaller's, checked against its PGP signature), and the license
  # audit (ADR 004), which fails the build of a runtime that breaks
  # Fledge's license policy and writes its NOTICES and SBOM. Beside each
  # archive go the release assets that describe it: the SBOM, the
  # NOTICES, and the source of its LGPL libraries.
  runtime:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          # Cross-compiled; the runner's 7z unpacks RubyInstaller's archive
          # and its gpgv checks the signature. Windows on ARM64 too (ADR 018).
          - os: ubuntu-24.04
            platform: x64-mingw-ucrt
          - os: ubuntu-24.04
            platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder needs only Ruby's standard library, so mise installs
      # only Ruby, and no bundle.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # patchelf removes the RUNPATHs rv-ruby's build left in its
      # extensions, pinned to Ubuntu 24.04's build; gcc, make, perl, and
      # xz, which libxcrypt's build needs, are on the runner already.
      - name: Install patchelf
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-mingw-ucrt')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf=0.18.0-1.1build1

      # rv-ruby, RubyInstaller, llvm-mingw, and libxcrypt downloads, keyed
      # by the file that pins their SHA-256s, so a changed pin downloads
      # afresh. The builder checks every cached file's SHA-256 again
      # before using it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      # The archive's timestamps are the commit's, so two builds of one
      # commit differ only where the compiler's output does.
      - name: Build the runtime
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      # The Windows source bundle holds MSYS2's source package of GMP as
      # the exact source of RubyInstaller's libgmp-10.dll. That holds only
      # if MSYS2's binary package of that build holds the very file the
      # runtime ships, byte for byte.
      - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
        if: endsWith(matrix.platform, '-mingw-ucrt')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            x64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp package) folder=ucrt64 ;;
            aarch64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp arm64 package) folder=clangarm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gmp-package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" "$folder/bin/libgmp-10.dll"
          cmp "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll" tmp/runtime/"$PLATFORM"/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
          sha256sum "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

  # The musl Linux runtimes (ADR 017): CRuby built from its pinned source
  # in Alpine, on a runner of each architecture, as rv-ruby builds its
  # own musl Rubies, with docker run rather than a job container, since
  # GitHub's JavaScript actions cannot run in an Alpine container on an
  # ARM runner (rv-ruby's build-alpine.yml says the same).
  runtime-musl:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime in Alpine
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e SOURCE_DATE_EPOCH -e PLATFORM "$ALPINE_RUBY" \
            sh -c '.github/scripts/alpine-packages.sh build && ruby tasks/runtime_builder.rb "$PLATFORM"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: runtime-${{ matrix.platform }}-logs
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  # The mobile runtimes (ADR 011): CRuby built from its pinned source for
  # iOS and iPadOS, on a Mac with the pinned Xcode, and for Android, on
  # Linux with the pinned NDK and Gradle, each audited like every other
  # runtime. Xcode 26.5 is the newest on macos-26 and the one whose iOS
  # 26.5 Simulator runtime the image installs; the image's default Xcode
  # has none (spike/mobile/FINDINGS.txt).
  runtime-mobile:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: ios
          - os: ubuntu-24.04
            platform: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        if: matrix.platform == 'ios'
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcodebuild -version

      # The Android Gradle plugin runs on Java 17 or newer; the runner's
      # Android SDK gives it the API 36 platform.
      - name: Use Java 21
        if: matrix.platform == 'android'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime
        run: ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: runtime-${{ matrix.platform }}-logs
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  # Delivery on phones (ADR 011, section 6; ADR 012): apps built as a
  # developer builds them, with fledge build ios, and their Xcode projects
  # built with xcodebuild for the Simulator and, unsigned, for devices, to
  # show the device slice links and the privacy manifest names every
  # category of API the app's executable imports that Apple asks a reason
  # for; then each run in the Simulator on an iPhone and an iPad, its
  # output read from os_log: examples/hello; examples/mobile_app, whose
  # pure-Ruby gems Bundler sets up; a script that requires json and csv,
  # a bundled gem, and reaches rubygems.org over HTTPS; and the parity
  # probe, against ruby main.rb on this Mac's desktop Ruby, with every
  # difference justified for a phone (tasks/mobile_parity.rb).
  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad)
    needs: [runtime, runtime-mobile]
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: mobile-parity-downloads-ios-${{ hashFiles('runtime/sources.yml') }}

      # XcodeGen writes each app's Xcode project in fledge build ios, as a
      # developer installs it; pinned by SHA-256.
      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes

      # The runtime of this Mac, whose Ruby runs mkmf to compile a gem's
      # extension for the phone (ADR 022).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes

      - name: Build the apps with fledge build ios, and run them in the iOS Simulator
        run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mobile-apps-ios
          path: |
            tmp/mobile-parity/ios/*.ndjson
            tmp/mobile-parity/ios/*.log
            tmp/mobile-parity/ios/*.ips
          retention-days: 14

  # Each platform's apps, built on a runner of that platform from the
  # runtime the runtime job built for it, with that platform's own tools
  # (ADR 010), as a developer builds them: examples/hello, the parity
  # probe (test/fixtures/parity), which Delivery asks what a child Ruby
  # sees, and the probe as a gem-shaped app's program (Parity.gem_probe),
  # which Delivery asks what Bundler.with_original_env and
  # with_unbundled_env give a child; examples/my_cool_app, whose gems come
  # from RubyGems.org, each checked against its Gemfile.lock's checksum,
  # precompiled for the platform (ADR 005); examples/windowed_app, a
  # windowed app (ADR 008) with its installer (ADR 009); examples/programs,
  # a windowed and a console program of one project in one folder (ADR
  # 024); and
  # examples/native_app, whose gems must be compiled (ADR 006): redcarpet,
  # a C gem published only as source, ferro-idna, a Rust gem (rb-sys) from
  # its git tag, and bigdecimal, which spreadsheet, a GPL gem, needs, each
  # compiled against the runtime's own Ruby and its build-only companion.
  # examples/real_gems (ADR 020): the gems real apps lock, from a credentialed
  # mirror, a folder outside the project, a path gem with an extension, git
  # with a submodule, and an optional group. The Mac and Windows build
  # examples/nokogiri_app too, nokogiri from
  # source: with macOS's own iconv on the Mac, and with GNU libiconv
  # linked in on Windows, which ships as any gem's compiled code does (ADR
  # 007). Each records what bundle exec prints, which the built app must
  # print too.
  #
  # Each platform's build is a job of its own, and so is each platform's
  # leg of every job that delivers what a build made, the steps written
  # once and shared through a YAML anchor (&build-steps, *build-steps).
  # A job's needs cannot name one leg of a matrix, so with one Build
  # matrix the Mac's and Linux's Delivery waited for Windows' build,
  # fifteen minutes after their own had finished; now each waits for its
  # own platform's build only.
  build-arm64-darwin:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            rust: ""
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      # RubyInstaller's Ruby, with the MSYS2 UCRT64 toolchain ridk installs,
      # which fledge build finds as RubyInstaller does (MSYS2_PATH first).
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: matrix.platform != 'aarch64-mingw-ucrt'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}${{ matrix.rust }}

      # bindgen, which rb-sys runs, parses Ruby's MinGW headers, so clang
      # must target MinGW and find the MSYS2 tree setup-ruby installs, as
      # Ferro's CI sets it up (after oxidize-rb/actions' setup-ruby-and-rust,
      # with its two AVX-512 defines, rust-bindgen #2500); libclang comes
      # from the LLVM the runner image ships.
      # SPDX-SnippetBegin
      # SPDX-License-Identifier: AGPL-3.0-or-later
      # SPDX-SnippetCopyrightText: 2026 Kerrick Long <me@kerricklong.com>
      # SPDX-SnippetComment: Adapted from Ferro's .github/workflows/ci.yml at
      #   ef2407b1f44cd3c23d98c5085042857761598b85 (setdef/Ferro), its step
      #   "Point bindgen at Ruby's MSYS2 headers".
      - name: Point bindgen and RubyInstaller at MSYS2
        if: matrix.platform == 'x64-mingw-ucrt'
        run: |
          sysroot="${RI_DEVKIT//\\//}${MSYSTEM_PREFIX:?setup-ruby did not set MSYSTEM_PREFIX}"
          libclang="C:/Program Files/LLVM/bin"
          test -f "$sysroot/include/stdio.h" || { echo "::error::no C headers (stdio.h) in $sysroot/include"; exit 1; }
          test -f "$libclang/libclang.dll" || { echo "::error::no libclang.dll in $libclang"; exit 1; }
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-gnu --sysroot=$sysroot -D__AVX512VLFP16INTRIN_H -D__AVX512FP16INTRIN_H"
            echo "LIBCLANG_PATH=$libclang"
            echo "MSYS2_PATH=$RI_DEVKIT"
          } >> "$GITHUB_ENV"
      # SPDX-SnippetEnd

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # mksquashfs, which writes windowed_app's AppImage, pinned to Ubuntu
      # 24.04's build, as a developer installs it.
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      - name: Build hello, the parity and console probes, my_cool_app, windowed_app, programs, and native_app for ${{ matrix.platform }}
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle")' "$RUNNER_TEMP/parity-bundle"
          apps=(examples/hello test/fixtures/parity test/fixtures/console "$RUNNER_TEMP/parity-bundle" examples/my_cool_app examples/windowed_app examples/programs examples/native_app)
          [ "${{ matrix.platform }}" != aarch64-mingw-ucrt ] || apps=(examples/hello test/fixtures/parity test/fixtures/console examples/windowed_app examples/programs)
          for app in "${apps[@]}"; do
            ruby -I lib exe/fledge build -o dist "$app"
          done

      # ADR 016: hello and windowed_app again, signed with a self-signed
      # identity made for this run, as a developer signs with their own;
      # Delivery verifies them on a fresh runner with the certificate.
      - name: Make a code signing identity
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-signed
          .github/scripts/make-test-identity.sh dist-signed/certificate.pem

      - name: Make a code signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-signed | Out-Null
          pwsh -NoProfile -File .github/scripts/make-test-identity.ps1 -Certificate dist-signed/certificate.cer

      - name: Build hello and windowed_app, signed, for ${{ matrix.platform }}
        if: runner.os != 'Linux'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          for app in examples/hello examples/windowed_app; do
            ruby -I lib exe/fledge build --sign "$FLEDGE_TEST_SIGN_IDENTITY" -o dist-signed "$app"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'Linux'
        with:
          name: signed-${{ matrix.platform }}
          path: |
            dist-signed/*-${{ matrix.platform }}.tar.gz
            dist-signed/*-${{ matrix.platform }}.zip
            dist-signed/*-${{ matrix.platform }}.dmg
            dist-signed/*-${{ matrix.platform }}-setup.exe
            dist-signed/certificate.*
          if-no-files-found: error
          retention-days: 14

      - name: Build nokogiri_app from source for ${{ matrix.platform }}
        if: matrix.platform == 'arm64-darwin' || matrix.platform == 'x64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: ruby -I lib exe/fledge build -o dist examples/nokogiri_app

      # ADR 020: the gems real apps lock. examples/real_gems takes RubyGems.org
      # through a mirror that wants a login, as its .bundle/config says in
      # Bundler's own settings, from a loopback server of ours
      # (.github/scripts/gem-mirror.rb); a gem from a folder outside its
      # project, with an executable; a path gem with a C extension; a gem from
      # git with a submodule (the experiment/submodule-gem branch); and an
      # optional group. Its Delivery prints what a person with no Ruby sees,
      # which no bundle exec can: Bundler compiles no path gem's extension.
      - name: Build real_gems through a credentialed mirror for ${{ matrix.platform }}
        if: matrix.platform != 'aarch64-mingw-ucrt'
        shell: bash
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          ruby .github/scripts/gem-mirror.rb 9292 fledge:mirror-password "$RUNNER_TEMP/mirror.log" &
          mirror=$!
          sleep 3
          status=0
          ruby -I lib exe/fledge build -o dist examples/real_gems || status=$?
          kill "$mirror" || true
          cat "$RUNNER_TEMP/mirror.log"
          [ "$status" = 0 ] || exit "$status"
          for gem in wisper-2.0.1 paint-2.3.0; do
            grep -q "^GET /gems/$gem.gem 200\$" "$RUNNER_TEMP/mirror.log" || { echo "::error::$gem did not come through the mirror, with its login"; exit 1; }
          done
          echo "wisper 2.0.1 through a mirror that wanted a login; shared from outside the project; greeter compiled for the runtime's Ruby; fledge_submodule_gem says Hello World!; paint 2.3.0 from an optional group; shared-cli says shared from outside the project" > dist/real_gems.expected

      # The gems bundle exec runs the examples with below, installed for
      # this runner's own Ruby, kept between runs: on Windows, compiling
      # nokogiri and the Rust gems for that Ruby took most of nine
      # minutes of the longest chain in CI. They only make the .expected
      # files; fledge build compiled each app's gems afresh above, for the
      # runtime's Ruby, which is the check (ADR 006). The key names the
      # Ruby, the Rust, and each lockfile and Bundler setting, and only an
      # exact match restores.
      - name: Read the runner's Ruby
        if: matrix.platform != 'aarch64-mingw-ucrt'
        id: host
        run: echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform != 'aarch64-mingw-ucrt'
        with:
          path: ${{ runner.temp }}/examples-bundle
          key: examples-bundle-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.ruby }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('examples/my_cool_app/Gemfile.lock', 'examples/native_app/Gemfile.lock', 'examples/nokogiri_app/Gemfile.lock', 'examples/nokogiri_app/.bundle/config') }}

      # What each app prints as its developer runs it, which its built app
      # must print too.
      - name: Run the examples with bundle exec
        if: matrix.platform != 'aarch64-mingw-ucrt'
        env:
          BUNDLE_PATH: ${{ runner.temp }}/examples-bundle
        run: |
          (cd examples/my_cool_app && bundle install)
          (cd examples/my_cool_app && bundle exec ruby exe/my_cool_app) | tee dist/my_cool_app.expected
          examples=native_app
          case "${{ matrix.platform }}" in arm64-darwin | x64-mingw-ucrt) examples="native_app nokogiri_app" ;; esac
          for example in $examples; do
            (cd "examples/$example" && bundle install)
            (cd "examples/$example" && bundle exec ruby main.rb) | tee "dist/$example.expected"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.tar.gz
            dist/*-${{ matrix.platform }}.zip
            dist/*-${{ matrix.platform }}.dmg
            dist/*-${{ matrix.platform }}-setup.exe
            dist/*-${{ matrix.platform }}.AppImage
            dist/*-${{ matrix.platform }}.deb
            dist/*.expected
          if-no-files-found: error
          retention-days: 14

  build-x86_64-linux:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
            rust: ""
    steps: *build-steps

  build-aarch64-linux:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            rust: ""
    steps: *build-steps

  build-x64-mingw-ucrt:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # RubyInstaller's Ruby is a MinGW build, and rb-sys refuses to
          # build for it with Rust's MSVC target (Ferro's ci.yml), so
          # Windows takes the GNU host toolchain.
          - os: windows-latest
            platform: x64-mingw-ucrt
            rust: -x86_64-pc-windows-gnu
    steps: *build-steps

  build-aarch64-mingw-ucrt:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows on ARM64 (ADR 018) builds what needs no gem compiled for
          # it: sqlite3 publishes no aarch64-mingw-ucrt build and its source
          # does not configure there, so no my_cool_app, gem-shaped probe,
          # or native_app.
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            rust: ""
    steps: *build-steps

  # Delivery of native_app and nokogiri_app, on a fresh runner of each
  # platform, as Delivery runs the others.
  delivery-native-arm64-darwin:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
    steps: &delivery-native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run native_app as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NativeApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/native_app.expected")"

      - name: Run nokogiri_app as someone with no Ruby would
        if: matrix.platform == 'arm64-darwin'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NokogiriApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/nokogiri_app.expected")"

      - name: Run real_gems as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/RealGems-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/real_gems.expected")"

      - name: Run NativeApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NativeApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/native_app.expected" -Raw).TrimEnd()

      - name: Run RealGems.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/RealGems-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/real_gems.expected" -Raw).TrimEnd()

      - name: Run NokogiriApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NokogiriApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/nokogiri_app.expected" -Raw).TrimEnd()

  delivery-native-x86_64-linux:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-native-steps

  delivery-native-aarch64-linux:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-native-steps

  delivery-native-x64-mingw-ucrt:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: *delivery-native-steps

  # Delivery (Plan 001): each app on a fresh runner of its platform, with
  # nothing of Fledge but the archive and the script that checks it, and
  # no Ruby set up. Runners come with Rubies installed, so the script runs
  # the app with an empty PATH and checks that no ruby is on it, then
  # runs it in a clean and in a hostile environment
  # (.github/scripts/deliver.sh).
  delivery-arm64-darwin:
    name: Delivery (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            ruby-platform: arm64-darwin23
    steps: &delivery-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run hello as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.ruby-platform }}"

      - name: Run my_cool_app as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/my_cool_app.expected")"

      # ADR 015: the console probe in a terminal of its own, a
      # pseudo-terminal, ended by Ctrl-C typed into it and by a hangup,
      # must end as ruby main.rb does (.github/scripts/deliver-console.sh).
      - name: Interrupt the console probe in a terminal, as a person would
        run: .github/scripts/deliver-console.sh "$RUNNER_TEMP/delivered/Console-${{ matrix.platform }}.tar.gz"

      # ADR 016: the signed build, verified by Apple's codesign on a fresh
      # Mac that trusts the run's test certificate, and run
      # (.github/scripts/deliver-signed.sh).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'macOS'
        with:
          name: signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/signed

      - name: Verify and run the signed apps
        if: runner.os == 'macOS'
        run: >-
          .github/scripts/deliver-signed.sh "$RUNNER_TEMP/signed/Hello-arm64-darwin.tar.gz"
          "$RUNNER_TEMP/signed/Hello Window-arm64-darwin.tar.gz" "$RUNNER_TEMP/signed/Hello Window-arm64-darwin.dmg"
          "$RUNNER_TEMP/signed/certificate.pem"

  delivery-x86_64-linux:
    name: Delivery (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
            ruby-platform: x86_64-linux
    steps: *delivery-steps

  delivery-aarch64-linux:
    name: Delivery (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-platform: aarch64-linux
    steps: *delivery-steps

  # Delivery of the windowed app (ADR 008), on a fresh runner of each
  # platform: on macOS its .app bundle must pass codesign --verify --strict
  # --deep, plutil must read its identity, and it must run through open -W,
  # as Finder starts it, and through its own program; on Linux
  # desktop-file-validate must accept its desktop entry, and its icons and
  # program must be there and run (.github/scripts/deliver-windowed.sh).
  # Then its installer (ADR 009): on macOS the disk image, attached,
  # verified, and dragged to an Applications folder, with the app run from
  # both (deliver-dmg.sh); on Linux the AppImage, mounted with FUSE, and
  # extracted with APPIMAGE_EXTRACT_AND_RUN=1, where there is none, run
  # each way and in a hostile environment, and unpacked by
  # --appimage-extract (deliver-appimage.sh). And examples/programs (ADR
  # 024): a windowed and a console program from one folder, with one
  # project and one Ruby, sharing one save (deliver-programs.sh).
  delivery-windowed-arm64-darwin:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
    steps: &delivery-windowed-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      # freedesktop.org's validator, pinned to Ubuntu 24.04's build of it.
      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Run Shared Save and shared-save from one folder, with one save
        run: .github/scripts/deliver-programs.sh "$RUNNER_TEMP/delivered/Shared Save-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.dmg"

      # FUSE 3, which desktops ship and the runner's image may not,
      # pinned to Ubuntu 24.04's build: the AppImage's runtime mounts with
      # its fusermount3.
      - name: Install FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fuse3=3.14.0-5build1
          ls -l /dev/fuse

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.AppImage" fuse

  delivery-windowed-x86_64-linux:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-windowed-steps

  delivery-windowed-aarch64-linux:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-windowed-steps

  # Delivery again, in Debian 13 containers with no Ruby installed at all
  # (deliver.sh --no-ruby-installed checks), glibc 2.41, and no CA
  # certificates package.
  delivery-debian-x86_64-linux:
    name: Delivery (${{ matrix.platform }}, debian:trixie-slim)
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    container: debian:trixie-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &delivery-debian-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Run hello on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/Hello-${{ matrix.platform }}.tar.gz"
          "delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.platform }}" --no-ruby-installed

      - name: Run my_cool_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat delivered/my_cool_app.expected)" --no-ruby-installed

      # A container has no FUSE, so the AppImage says so, and extracts
      # itself and runs when asked to, as AppImage documents.
      - name: Run Hello Window as an AppImage on a computer with no FUSE
        run: .github/scripts/deliver-appimage.sh "delivered/Hello Window-${{ matrix.platform }}.AppImage" extract

      # native_app, compiled on Ubuntu 24.04, on Debian 13's newer glibc.
      - name: Run native_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/NativeApp-${{ matrix.platform }}.tar.gz"
          "delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat delivered/native_app.expected)" --no-ruby-installed

  delivery-debian-aarch64-linux:
    name: Delivery (${{ matrix.platform }}, debian:trixie-slim)
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    container: debian:trixie-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-debian-steps

  # Delivery of the windowed app's .deb (ADR 021), in a fresh Debian and a
  # fresh Ubuntu container of each architecture, with no Ruby installed:
  # apt installs it as a person would, its dependency on glibc 2.39 met by
  # Ubuntu 24.04's, which is the oldest there is, and by Debian 13's; the
  # app runs from /usr/lib, as root and as an ordinary user; and removing
  # the package leaves nothing of it (.github/scripts/deliver-deb.sh).
  delivery-deb-x86_64-linux:
    name: Delivery of a .deb (${{ matrix.platform }}, ${{ matrix.image }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie-slim", "ubuntu:24.04"]
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &delivery-deb-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      # freedesktop.org's validator, which a desktop has.
      - name: Install desktop-file-validate
        run: |
          apt-get update -qq
          apt-get install -y -qq desktop-file-utils

      - name: Install Hello Window from its .deb with apt, run it, and remove it
        run: .github/scripts/deliver-deb.sh "delivered/Hello Window-${{ matrix.platform }}.deb"

  delivery-deb-aarch64-linux:
    name: Delivery of a .deb (${{ matrix.platform }}, ${{ matrix.image }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie-slim", "ubuntu:24.04"]
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-deb-steps

  # Delivery on a fresh Windows runner, with nothing of Fledge but the
  # .zip and the script that checks it, and no Ruby set up: the runner's
  # own Rubies and MSYS2 are kept off the app's PATH, and the script runs
  # Hello.exe and MyCoolApp.exe from another drive, under a folder name
  # outside ASCII, in a clean and in a hostile environment, and checks
  # the version information each carries (.github/scripts/deliver.ps1).
  delivery-windows-x64-mingw-ucrt:
    name: Delivery (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    env:
      PLATFORM: ${{ matrix.platform }}
    steps: &delivery-windows-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run Hello.exe as someone with no Ruby would
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/Parity-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected "Hello from Ruby 4.0.9 on $env:PLATFORM"

      - name: Run MyCoolApp.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/MyCoolApp-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/my_cool_app.expected" -Raw).TrimEnd()

      # ADR 015: the console probe in a console of its own, ended by
      # Ctrl-C on code pages 65001 and 437 and by its window closing, and
      # the windowed app typed into a console, which gets none, each as
      # ruby.exe and rubyw.exe do (.github/scripts/deliver-console.ps1).
      - name: Interrupt the console probe in a console, close it, and start the windowed app from one
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-console.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Console-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.zip"

      # The windowed app (ADR 008): a GUI program with its version
      # information and icon, started as Explorer starts it, with no
      # console and its identifier as its AppUserModelID
      # (.github/scripts/deliver-windowed.ps1).
      - name: Start Hello Window.exe as Explorer would
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.zip"

      # examples/programs (ADR 024): a GUI and a console program from one
      # folder, with one project and one Ruby, sharing one save
      # (.github/scripts/deliver-programs.ps1).
      - name: Run Shared Save.exe and shared-save.exe from one folder, with one save
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-programs.ps1 -Archive "$env:RUNNER_TEMP/delivered/Shared Save-$env:PLATFORM.zip"

      # The NSIS installer (ADR 009): installed silently for this person,
      # its Start menu shortcut's AppUserModelID read back and matched to
      # the app's own, the app started from it, installed again over
      # itself, and uninstalled (.github/scripts/deliver-installer.ps1).
      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM-setup.exe"

      # ADR 016: the signed build, refused by signtool on a fresh Windows
      # until it trusts the run's test certificate, then verified, every
      # PE file, the setup program, and the uninstaller it installs
      # (.github/scripts/deliver-signed.ps1).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/signed

      - name: Verify, install, and run the signed apps
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-signed.ps1
          -Hello "$env:RUNNER_TEMP/signed/Hello-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/signed/Hello Window-$env:PLATFORM.zip"
          -Installer "$env:RUNNER_TEMP/signed/Hello Window-$env:PLATFORM-setup.exe"
          -Certificate "$env:RUNNER_TEMP/signed/certificate.cer"

  delivery-windows-aarch64-mingw-ucrt:
    name: Delivery (${{ matrix.platform }})
    needs: build-aarch64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Natively on Windows 11 on ARM64 (ADR 018).
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    env:
      PLATFORM: ${{ matrix.platform }}
    steps: *delivery-windows-steps

  # Whoever receives a Linux app may replace lib/libcrypt.so.2 (LGPL-2.1,
  # section 6(b)), as doc/licensing.md tells app developers. The built
  # hello, with libxcrypt rebuilt with only its strong hashes, and with
  # musl's crypt in its place, must load each and behave as each does
  # (.github/scripts/replace-libcrypt.sh), which also measures what
  # String#crypt loses without libxcrypt.
  replace-libcrypt-x86_64-linux:
    name: Replace libcrypt (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &replace-libcrypt-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Replace lib/libcrypt.so.2 and run the app with each replacement
        run: |
          tar -xzf "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP"
          # Assigned first, so a download that fails stops the step here:
          # bash -e ignores a failed $(...) inside another command's arguments.
          xcrypt=$(ruby .github/scripts/fetch_pin.rb libxcrypt)
          musl=$(ruby .github/scripts/fetch_pin.rb replaceability musl)
          sh .github/scripts/replace-libcrypt.sh "$RUNNER_TEMP/Hello-${{ matrix.platform }}" Hello "$xcrypt" "$musl"

  replace-libcrypt-aarch64-linux:
    name: Replace libcrypt (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *replace-libcrypt-steps

  # Another GNU MP for Windows, cross-built with the pinned llvm-mingw
  # against the UCRT, for Replace GMP to swap in.
  gmp-replacement:
    name: Build a replacement libgmp-10.dll (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-mingw-ucrt
            triple: x86_64-w64-mingw32
          - platform: aarch64-mingw-ucrt
            triple: aarch64-w64-mingw32
    env:
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Cross-build GNU MP as libgmp-10.dll
        run: |
          toolchain="$RUNNER_TEMP/llvm-mingw"
          source="$RUNNER_TEMP/gmp"
          mkdir -p "$toolchain" "$source" "$RUNNER_TEMP/gmp-dll"
          llvm_mingw=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          gmp=$(ruby .github/scripts/fetch_pin.rb replaceability gmp)
          tar -xJf "$llvm_mingw" -C "$toolchain" --strip-components=1
          tar -xJf "$gmp" -C "$source" --strip-components=1
          export PATH="$toolchain/bin:$PATH"
          cd "$source"
          # GMP 6.2.1's config.sub predates aarch64-w64-mingw32; llvm-mingw's
          # own autoconf scripts know it.
          cp /usr/share/misc/config.sub configfsf.sub 2>/dev/null || true
          ./configure --quiet --host="$TRIPLE" CC="$TRIPLE-clang" CC_FOR_BUILD=cc \
            --enable-shared --disable-static --disable-assembly
          make --quiet -j"$(nproc)" > /dev/null
          cp .libs/libgmp-10.dll "$RUNNER_TEMP/gmp-dll/"
          "$TRIPLE-objdump" -p .libs/libgmp-10.dll | grep 'DLL Name'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmp-replacement-${{ matrix.platform }}
          path: ${{ runner.temp }}/gmp-dll/libgmp-10.dll
          if-no-files-found: error
          retention-days: 14

  # Whoever receives a Windows app may replace
  # ruby\bin\ruby_builtin_dlls\libgmp-10.dll (LGPL-3.0, section 4(d)(1)),
  # as doc/licensing.md tells app developers: the built hello must load
  # the replacement (Integer::GMP_VERSION changes) and compute the same
  # big numbers (.github/scripts/replace-gmp.ps1).
  replace-gmp-x64-mingw-ucrt:
    name: Replace GMP (${{ matrix.platform }})
    needs: [build-x64-mingw-ucrt, gmp-replacement]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: &replace-gmp-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gmp-replacement-${{ matrix.platform }}
          path: ${{ runner.temp }}/gmp-dll

      - name: Replace libgmp-10.dll and run the app
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/replace-gmp.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.zip"
          -Dll "$env:RUNNER_TEMP/gmp-dll/libgmp-10.dll" -Version 6.2.1

  replace-gmp-aarch64-mingw-ucrt:
    name: Replace GMP (${{ matrix.platform }})
    needs: [build-aarch64-mingw-ucrt, gmp-replacement]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    steps: *replace-gmp-steps
