---
name: CI
on:
  push:
    branches:
    - experiment/sdl-phones
permissions:
  contents: read
  actions: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: 'false'
  BUNDLE_FROZEN: 'true'
  # The runtimes of trunk's run 41508388336 (b6629ae), which hold ADR
  # 022's fledge_ruby_add_extension; the spike changes no runtime.
  RUNTIMES_RUN: '41508388336'
jobs:
  sdl-ios:
    name: SDL3 spike (iOS Simulator, iPhone and iPad)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Select the pinned Xcode
      run: |
        xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
        sudo xcode-select -s "/Applications/Xcode_$xcode.app"
        xcodebuild -version
        cmake --version
    - name: Install XcodeGen
      run: |
        unzip -q "$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)" -d "$RUNNER_TEMP/xcodegen"
        echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-ios
        path: "${{ runner.temp }}/runtimes"
        run-id: "${{ env.RUNTIMES_RUN }}"
        github-token: "${{ github.token }}"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-arm64-darwin
        path: "${{ runner.temp }}/runtimes"
        run-id: "${{ env.RUNTIMES_RUN }}"
        github-token: "${{ github.token }}"
    - name: Build SDL3 for the iOS slices
      run: examples/sdl_phone/sdl3/build.sh ios "$RUNNER_TEMP/sdl3"
    - name: Build the game with fledge build ios, and run it in the Simulator with a tap
      run: ruby .github/scripts/sdl_phone.rb ios "$RUNNER_TEMP/runtimes" "$RUNNER_TEMP/sdl3" tmp/sdl-phone
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: sdl-ios
        path: |
          tmp/sdl-phone/*.png
          tmp/sdl-phone/*.log
        retention-days: 14
  sdl-android-build:
    name: SDL3 spike (Android project, arm64-v8a and x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Use Java 21
      run: |
        echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
        cmake --version
    - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-android
        path: "${{ runner.temp }}/runtimes"
        run-id: "${{ env.RUNTIMES_RUN }}"
        github-token: "${{ github.token }}"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-x86_64-linux
        path: "${{ runner.temp }}/runtimes"
        run-id: "${{ env.RUNTIMES_RUN }}"
        github-token: "${{ github.token }}"
    - name: Install the pinned NDK
      run: |
        unzip -q "$(ruby .github/scripts/fetch_pin.rb mobile ndk hosts x86_64-linux)" -d "$RUNNER_TEMP/ndk"
        echo "ANDROID_NDK_ROOT=$(echo "$RUNNER_TEMP"/ndk/android-ndk-*)" >> "$GITHUB_ENV"
    - name: Build SDL3 for the Android ABIs
      run: examples/sdl_phone/sdl3/build.sh android "$RUNNER_TEMP/sdl3"
    - name: Build the game with fledge build android and Gradle, and check the APKs
      run: ruby .github/scripts/sdl_phone.rb android-build "$RUNNER_TEMP/runtimes" "$RUNNER_TEMP/sdl3" tmp/sdl-phone
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sdl-android-apk
        path: tmp/sdl-phone/SdlPhone-debug.apk
        if-no-files-found: error
        retention-days: 14
  sdl-android:
    name: SDL3 spike (Android emulator, API 36, ${{ matrix.target }})
    needs: sdl-android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
        - google_apis
        - google_apis_ps16k
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: sdl-android-apk
        path: tmp/sdl-phone
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run the game on the emulator with a tap
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: "${{ matrix.target }}"
        arch: x86_64
        ram-size: 4096M
        disable-animations: true
        emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot"
        script: ruby .github/scripts/sdl_phone.rb android tmp/sdl-phone
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: sdl-android-${{ matrix.target }}
        path: |
          tmp/sdl-phone/*.png
          tmp/sdl-phone/logcat.txt
        retention-days: 14
