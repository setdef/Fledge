# Experiment only (experiment/symlink-delivery), never for trunk: Delivery
# of hello, with the symlink, junction, and shim checks deliver.sh and
# deliver.ps1 gained, on all seven desktop platforms. macOS and Linux
# deliver the apps trunk's CI run RUN built at ece8356, whose launchers
# this branch does not change. Windows builds its runtime from this
# branch's launcher, as ci.yml's Runtime job does, builds hello and the
# parity probe with it on a Windows runner, as its Build job does, and
# delivers them.

name: Symlink delivery

on:
  push:
    branches: ["experiment/symlink-delivery"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  RUN: "41966470848"
  MISE_RUBY_COMPILE: "false"
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

jobs:
  deliver:
    name: Symlink delivery (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin, ruby-platform: arm64-darwin23 }
          - { os: ubuntu-24.04, platform: x86_64-linux, ruby-platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux, ruby-platform: aarch64-linux }
          - { os: ubuntu-24.04, platform: x86_64-linux-musl, ruby-platform: x86_64-linux-musl }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl, ruby-platform: aarch64-linux-musl }
    env:
      PLATFORM: ${{ matrix.platform }}
      RUBY_PLATFORM: ${{ matrix.ruby-platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Run hello through links and a shim
        if: "!endsWith(matrix.platform, '-musl')"
        run: .github/scripts/deliver.sh "delivered/Hello-$PLATFORM.tar.gz" "delivered/Parity-$PLATFORM.tar.gz" "Hello from Ruby 4.0.9 on $RUBY_PLATFORM"

      - name: Run hello through links and a shim, on Alpine
        if: endsWith(matrix.platform, '-musl')
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work -e PLATFORM "$ALPINE"
          sh -c '.github/scripts/deliver.sh "delivered/Hello-$PLATFORM.tar.gz" "delivered/Parity-$PLATFORM.tar.gz" "Hello from Ruby 4.0.9 on $PLATFORM" --no-ruby-installed'

  runtime-windows:
    name: Runtime (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64-mingw-ucrt, aarch64-mingw-ucrt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 3

  deliver-windows:
    name: Symlink delivery (${{ matrix.platform }})
    needs: runtime-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Ruby pin
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      - name: Build hello and the parity probe
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          for app in examples/hello test/fixtures/parity; do
            ruby -I lib exe/fledge build -o dist "$app"
          done
          ls dist
          cat dist/*.sha256

      - name: Run Hello.exe through a symbolic link and a junction
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "dist/Hello-$env:PLATFORM.zip"
          -Probe "dist/Parity-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected "Hello from Ruby 4.0.9 on $env:PLATFORM"
