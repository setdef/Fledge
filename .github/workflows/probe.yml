# Experiment (Plan 003, "Android on arm64"): can a GitHub-hosted runner
# run an arm64-v8a Android emulator with hardware acceleration?
name: Android arm64 probe

on:
  push:
    branches:
      - experiment/android-arm64

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-14, macos-15, macos-26, windows-11-arm]
    steps:
      - name: Facts
        shell: bash
        run: |
          uname -a
          if [ "$RUNNER_OS" = Linux ]; then
            ls -l /dev/kvm || echo "no /dev/kvm"
            grep -c -E 'vmx|svm' /proc/cpuinfo || true
            lscpu | head -20
            dmesg 2>/dev/null | grep -i -E 'kvm|hyp' | head || true
            sudo dmesg 2>/dev/null | grep -i -E 'kvm|hyp' | head || true
          elif [ "$RUNNER_OS" = macOS ]; then
            sysctl kern.hv_support kern.hv_vmm_present machdep.cpu.brand_string hw.model hw.ncpu hw.memsize || true
            sw_vers
          else
            systeminfo | grep -i -E 'hyper|virtual|System Type|OS Name' || true
            powershell -c "Get-ComputerInfo -Property HyperV*,CsProcessors | Format-List" || true
            powershell -c "Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform,Microsoft-Hyper-V-All | Format-List" || true
          fi
