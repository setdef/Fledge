# A spike for Plan 002's musl story: rake runtime for musl Linux, in
# Alpine, from Fledge at 81bd656 with musl.patch. Not part of trunk.
name: Spike (musl runtime)
on:
  push:
    branches: ["experiment/signing"]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime in Alpine
        run: |
          git clone -q https://github.com/setdef/Fledge fledge
          cd fledge && git checkout -q 81bd656 && git apply ../musl.patch && cd ..
          cat > build.sh <<'SH'
          set -eux
          apk add --no-cache build-base linux-headers rust cargo perl git file binutils patchelf xz tar zstd
          apk info -v | sort > /work/apk-versions.txt
          cd /work/fledge
          ruby -v
          ruby -e 'require "./tasks/runtime_builder"; RuntimeBuilder.new.call'
          SH
          docker run --rm -v "$PWD:/work" ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3 sh /work/build.sh 2>&1 | tail -300
          ls -l fledge/tmp/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musl-${{ matrix.platform }}
          path: |
            fledge/tmp/runtime/fledge-runtime-*
            fledge/tmp/runtime/*/logs
            apk-versions.txt
