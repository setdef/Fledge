# Gems whose files hold more than their specification says: another
# license, or a license text the gem's own files do not carry (a
# default gem's code is in lib/ruby/{abi}, and its license file is not).
gems:
  minitest:
    text: README.rdoc
  prism:
    notice: prism
  syntax_suggest:
    notice: syntax_suggest
  win32-registry:
    license: Ruby OR BSD-2-Clause
    why: >-
      Its specification declares no license; it is Ruby's ext/win32, and
      its repository (ruby/win32-registry) carries Ruby's COPYING.
  rdoc:
    license: Ruby AND BSD-3-Clause AND MIT AND OFL-1.1 AND CC-BY-2.5
    why: >-
      rdoc's LEGAL.rdoc: Darkfish is BSD-3-Clause, Aliki and the SDoc and
      peg-markdown parts MIT, its Lato and Source Code Pro fonts OFL-1.1,
      and Darkfish's Silk icons (famfamfam) CC-BY-2.5.
  reline:
    license: Ruby AND BSD-3-Clause
    why: reline's license_of_rb-readline (rb-readline, Park Heesob, BSD-3-Clause).

# Text files whose words name a copyleft license, reviewed by a person.
# Each names why the file meets the policy anyway.
reviewed:
  - files: ["notices/sources/appimage-runtime/{BUILD.txt,LICENSE}"]
    why: >-
      AppImage's runtime is MIT; its LICENSE names the LGPL of the libfuse
      linked into it, and BUILD.txt says how to rebuild it with another
      libfuse, as LGPL-2.1, section 6(a), asks.
  - files: ["{prefix}lib/ruby/{abi}/net/{http,protocol}.rb", "{prefix}lib/ruby/{abi}/rubygems/vendor/net-{http,protocol}/lib/net/*.rb"]
    why: The old header offers the Ruby license or the GPL; Ruby's license applies.
  - files: ["{prefix}lib/ruby/{abi}/rubygems/{specification,util/licenses}.rb", "{prefix}lib/ruby/{abi}/bundler/**/*.rb"]
    why: RubyGems' and Bundler's lists of license identifiers name these licenses as data.
  - files: ["{prefix}lib/ruby/gems/{abi}/gems/rdoc-*/{LEGAL.rdoc,lib/rdoc/generator/template/darkfish/css/fonts.css}"]
    why: Names the OFL that covers rdoc's fonts, and the Perl terms of a test fixture rdoc's gem leaves out.
  - files: ["{prefix}lib/ruby/gems/{abi}/gems/test-unit-*/{PSFL,doc/text/news.md}"]
    why: The PSF license's own text, and a changelog entry; test-unit is Ruby OR BSD-2-Clause OR PSF-2.0.
  - files: ["{prefix}lib/ruby/gems/{abi}/cache/nkf-*.gem!nkf.gemspec"]
    why: >-
      nkf's own gemspec adds EPL-2.0 and LGPL-2.1 to its licenses only when
      it builds JRuby's java-platform gem, from ext/java, which runtimes
      prune (RuntimeBuilder::Pruning.prune_jruby); the gem CRuby installs is Ruby OR
      BSD-2-Clause.
  - files: ["{prefix}lib/ruby/gems/{abi}/gems/rdoc-*/{LICENSE.rdoc,lib/rdoc/rd.rb}"]
    why: Ruby's old license, which offers the GPL-2.0 or Ruby's own conditions; Ruby's apply.
  - files: ["{prefix}lib/ruby/gems/{abi}/gems/rdoc-*/rdoc.gemspec", "{prefix}lib/ruby/gems/{abi}/specifications/rdoc-*.gemspec"]
    why: rdoc 8's gemspec lists Ruby and GPL-2.0-only, the two choices of Ruby's old license (its LICENSE.rdoc); Ruby's apply.
  - files: ["{prefix}lib/ruby/gems/{abi}/gems/rbs-*/core/dir.rbs", "{prefix}{include/ruby-{abi},Headers}/ruby/internal/ctype.h"]
    why: Mentions the word (a file name in an example, a comment about compatibility); no license.
  - files: ["{prefix}share/doc/ruby/html/**"]
    why: >-
      Ruby's HTML documentation (RubyInstaller's whole tree only; a runtime
      leaves share/ out), which quotes LEGAL and the NEWS of past releases.
