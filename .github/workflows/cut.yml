# Cuts a release of a commit CI has proven, off trunk, and records it on
# trunk.
# The release commit and the pin commit are made on the branch
# release-next, which only this workflow writes, so that trunk never
# has to stand still for them: Cut makes both, has CI prove each there,
# tags the pin commit, and has release.yml publish it
# (.github/scripts/release-cut.sh). Record then writes, on trunk as it
# stands by then, the version, the pins, and the CHANGELOG's released
# entries, in one commit (.github/scripts/release-record.sh).
#
# pin-watch.yml calls it once a move of the pins is green on trunk, so
# that an upstream's fix reaches a release with nobody in the loop. By hand, on
# any commit whose CI passed on every job:
#
#   gh workflow run cut.yml -f commit=SHA              # stops before the tag
#   gh workflow run cut.yml -f commit=SHA -f publish=true
#
# The run fails, and so calls a person, when any run it waits for is
# red. It pushes release-next and the tag with a token of the GitHub App
# that may push workflow files, whose ID and private key the environment
# release holds: the run's own token may not push a workflow file that no
# branch holds, and starts no workflow by its pushes. The App's pushes
# do, so the push of the tag starts release.yml, which the cut waits for
# and does not start again. A token lasts an hour and the job longer, so
# one is minted before each push. The runs it needs on release-next, where
# ci.yml does not run by itself, it starts with workflow_dispatch, which
# the run's own token may, and waits for each in the job.

name: Cut a release

on:
  workflow_call:
    inputs:
      commit:
        description: The full SHA of the commit to release
        type: string
        required: true
      publish:
        description: Tag, publish, and record the release (false stops before the tag)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      commit:
        description: The full SHA of the commit to release
        type: string
        required: true
      publish:
        description: Tag, publish, and record the release (false stops before the tag)
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, and never one cancelled midway.
concurrency:
  group: cut
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cut:
    name: Cut the release
    runs-on: ubuntu-24.04
    # The release commit's full run takes one to three hours, beside
    # installed.yml's, and release.yml's run with its own installed.yml
    # an hour more; GitHub stops a job at six.
    timeout-minutes: 350
    # Limited to trunk, it holds the App's ID and private key.
    environment: release
    permissions:
      contents: read
      # Starting runs and waiting for them.
      actions: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      pin: ${{ steps.tag.outputs.pin }}
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ inputs.commit }}
      RELEASE_CUT_STOP: ${{ !inputs.publish && 'tag' || '' }}
    steps:
      # No credentials kept: each push names its own token, and the
      # repository is public to fetch from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: ruby

      - name: Install the bundle
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install

      # The App's ID is a number, which this release of the action still
      # takes as app-id and calls deprecated in favor of client-id.
      - name: Mint a token for the release commit's push
        id: branch-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Make the release commit, push it, and start its runs
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.branch-token.outputs.token }}
        run: .github/scripts/release-cut.sh branch "$COMMIT"

      - name: Wait for the release commit's CI and installed.yml
        run: .github/scripts/release-cut.sh wait

      - name: Mint a token for the pin commit's push
        id: pin-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Make the pin commit, push it, and wait for its CI
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.pin-token.outputs.token }}
        run: .github/scripts/release-cut.sh pin

      - name: Mint a token for the tag's push
        if: inputs.publish
        id: tag-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      # The tag's push starts release.yml, and this waits for that run.
      - name: Tag the pin commit and wait for release.yml
        if: inputs.publish
        id: tag
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.tag-token.outputs.token }}
        run: .github/scripts/release-cut.sh tag

      - name: Mint a token to delete the branch
        if: always()
        id: clean-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Delete the branch
        if: always()
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.clean-token.outputs.token }}
        run: .github/scripts/release-cut.sh clean

  record:
    name: Record the release on trunk
    needs: cut
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: ruby

      - name: Install the bundle
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install

      - name: Record the release on trunk
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cut.outputs.version }}
          COMMIT: ${{ inputs.commit }}
          PIN: ${{ needs.cut.outputs.pin }}
        run: .github/scripts/release-record.sh "$VERSION" "$COMMIT" "$PIN"
