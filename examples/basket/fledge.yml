# Basket is a lone script, with no Gemfile, so it needs no gem but those
# Ruby bundles: fiddle, which each phone's bridge to its widgets uses,
# and json. It sits inside Fledge's own gem, so without this file fledge
# build would take Fledge's Gemfile for Basket's. The identifier is what
# iOS and Android know it by (doc/contributors/design/phone-projects.md). kind: windowed says that its
# Ruby draws the app's screen, so a phone runs that Ruby on the thread
# its widgets belong to (doc/contributors/design/phone-widgets.md).
name: Basket
identifier: com.setdef.fledge.Basket
kind: windowed
