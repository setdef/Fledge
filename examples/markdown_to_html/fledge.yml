# Markdown to HTML: a droplet and a command of one project, in one app.
# markdown_to_html.rb is windowed, since a drop or a double-click starts
# it and it has no window of its own to show, and a console window would
# be noise; it takes the app's name. bin/md2html is console, for a
# terminal, named after its file. Both read Markdown through lib/, with
# one copy of kramdown.
name: Markdown to HTML
version: "1.0.0"
publisher: setdef
copyright: © 2026 setdef
description: Writes the HTML of Markdown files beside them
long_description: |
  Markdown to HTML writes the HTML of a Markdown file, read as
  GitHub-Flavored Markdown, beside the file, when you drop the file on
  it or open the file with it.

  It comes with md2html, which prints a Markdown file's HTML in a
  terminal.
homepage: https://github.com/setdef/Fledge
license_file: LICENSE.txt
installers: [dmg, nsis, appimage, deb]
programs:
  - path: markdown_to_html.rb
    kind: windowed
    identifier: com.setdef.fledge.MarkdownToHtml
    icon: icons/icon
  - path: bin/md2html
    kind: console

# Markdown files, by the extensions and the MIME type of RFC 7763, which
# Linux's shared MIME-info database already knows, so Markdown to HTML
# defines no type of its own. Each system offers the app for them and
# leaves the person's default alone. Every system starts
# markdown_to_html.rb with the file's path in ARGV, whether it was
# dropped on the app or opened with it: on macOS, Launch Services sends
# it as an Apple event, which Fledge's launcher turns into ARGV.
file_associations:
  - name: Markdown document
    extensions: [md, markdown]
    mime_types: [text/markdown]
