//
// An app targeting API 36, as Google Play requires of new apps since
// 2026-08-31, that runs on API 26 and later, as the runtime does, with
// its asset stored uncompressed (FledgeRuby unpacks it as a stream) and
// its native libraries stored aligned for 16 KB pages.
plugins {
    id 'com.android.application'
}

layout.buildDirectory = file(providers.gradleProperty('fledge.buildDir').get())

android {
    namespace = 'org.setdef.fledge.parity'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.setdef.fledge.parity'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    sourceSets {
        main {
            assets.srcDirs = [providers.gradleProperty('fledge.assets').get()]
        }
    }

    androidResources {
        noCompress += ['zip']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files(providers.gradleProperty('fledge.aar').get())
}
