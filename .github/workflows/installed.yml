# The shipped path, end to end (Plan 001's walking skeleton in
# production): on a fresh runner of each platform, a developer's project
# installs Fledge from its git tag with Bundler, as the README says, never
# from RubyGems.org; fledge build, with no FLEDGE_RUNTIME_DIR and an empty
# cache, downloads that version's runtime from the GitHub Release and
# checks it against the SHA-256 the gem pins (ADR 014), and, to compile
# examples/native_app's gems from source, its build-only companion; and
# each app it builds is delivered as CI delivers every push's
# (.github/scripts/deliver.sh, or deliver.ps1 on Windows). The windowed app's installer, made with the
# runtime's own tools, is installed and its app run, as CI installs every
# push's (ADR 009 and ADR 010). Another job writes phones' projects from
# the tag and builds them with Xcode and Gradle (ADR 012), and another
# downloads every asset of the release and checks it against SHA256SUMS,
# which must be the tag's lib/fledge/SHA256SUMS, the pins the gem ships.
# The last jobs build the .gem from the tag and install that file instead
# of the tag on each platform, which proves what the gemspec packs.
#
# release.yml calls this after it publishes a release; run it by hand
# (workflow_dispatch) to check any published tag again.

name: Installed from a tag

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to install, such as v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to install, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The Rust that compiles native_app's Rust gem, as in ci.yml.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # The built gem, which holds only what the gemspec's file list packs: a
  # tag's checkout has every file, so the jobs above cannot show a file the
  # list forgot, and from 1.0.0 people install this .gem from RubyGems.org
  # (Plan 003, "Fledge on RubyGems.org"). One Linux runner builds it, as a
  # person builds the one gem they push, and each platform installs that
  # file, with no Fledge checkout, and builds and delivers hello and the
  # windowed app, builds an app --from one that carries its tools, and on
  # a Mac and on Linux writes a phone's project from the gem's templates.
  gem:
    name: Build the gem from the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Build the gem from what the tag tracks
        run: gem build fledge.gemspec --output "$RUNNER_TEMP/fledge.gem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fledge-gem
          path: ${{ runner.temp }}/fledge.gem
          if-no-files-found: error
          retention-days: 14

  installed-gem:
    name: Install the built gem, build, and deliver (${{ matrix.platform }})
    needs: gem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            ruby-platform: arm64-darwin23
          - os: ubuntu-24.04
            platform: x86_64-linux
            ruby-platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            ruby-platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/windowed_app
            test/fixtures/parity
            mise.toml
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checks
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Put the checks where the steps run them
        run: |
          mkdir -p .github
          cp -R checks/.github/scripts .github/scripts

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fledge-gem
          path: ${{ runner.temp }}/gem

      # --local, and bundle install --local: only this file can answer.
      - name: Install the built gem, and name it in a Gemfile as RubyGems would resolve it
        env:
          TAG: ${{ inputs.tag }}
        run: |
          gem install --local --no-document "$RUNNER_TEMP/gem/fledge.gem"
          mkdir -p "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          printf 'source "https://rubygems.org"\ngem "fledge", "%s"\n' "${TAG#v}" > Gemfile
          bundle install --local
          bundle exec fledge --version
          fledge --version

      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      # hello through the gem's own executable, as after gem install, and
      # the others through bundle exec, as with a Gemfile.
      - name: Build hello, the parity probe, and windowed_app with runtimes from the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          fledge build -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/examples/hello" 2>> "$RUNNER_TEMP/build.err"
          for app in test/fixtures/parity examples/windowed_app; do
            bundle exec fledge build -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/$app" 2>> "$RUNNER_TEMP/build.err"
          done
          cat "$RUNNER_TEMP/build.err"
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" "$RUNNER_TEMP/build.err"

      # With an empty cache and a mirror that answers nothing, so --from
      # can only have what the gem and the app carry.
      - name: Build an app with build_tools, and another --from it with no runtime at hand
        run: |
          unset FLEDGE_RUNTIME_DIR
          mkdir -p "$RUNNER_TEMP/player" "$RUNNER_TEMP/game"
          printf 'puts "player"\n' > "$RUNNER_TEMP/player/main.rb"
          printf 'name: Player\nbuild_tools: true\n' > "$RUNNER_TEMP/player/fledge.yml"
          printf 'puts "game"\n' > "$RUNNER_TEMP/game/main.rb"
          printf 'name: Game\n' > "$RUNNER_TEMP/game/fledge.yml"
          cd "$RUNNER_TEMP/project"
          XDG_CACHE_HOME="$RUNNER_TEMP/cache" bundle exec fledge build -o "$RUNNER_TEMP/from" "$RUNNER_TEMP/player"
          XDG_CACHE_HOME="$RUNNER_TEMP/empty" FLEDGE_RUNTIME_MIRROR=http://127.0.0.1:9 \
            bundle exec fledge build --from "$RUNNER_TEMP/from/Player-${{ matrix.platform }}" -o "$RUNNER_TEMP/from" "$RUNNER_TEMP/game"
          [ "$("$RUNNER_TEMP/from/Game-${{ matrix.platform }}/Game" | tr -d '\r')" = game ]

      - name: Write hello's iOS project from the gem's templates
        if: matrix.platform == 'arm64-darwin'
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          bundle exec fledge build ios -o "$RUNNER_TEMP/phones" "$GITHUB_WORKSPACE/examples/hello"
          test -f "$RUNNER_TEMP/phones/Hello-ios/project.yml"
          test -f "$RUNNER_TEMP/phones/Hello-ios/Host/main.m"

      - name: Write hello's Android project from the gem's templates
        if: matrix.platform == 'x86_64-linux'
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          bundle exec fledge build android -o "$RUNNER_TEMP/phones" "$GITHUB_WORKSPACE/examples/hello"
          test -x "$RUNNER_TEMP/phones/Hello-android/gradlew"
          test -f "$RUNNER_TEMP/phones/Hello-android/gradle/wrapper/gradle-wrapper.jar"

      - name: Run hello as someone with no Ruby would
        if: runner.os != 'Windows'
        run: |
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/Hello-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.ruby-platform }}"

      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        if: runner.os != 'Windows'
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.dmg"

      - name: Install FUSE
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fuse3=3.14.0-5build1

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.AppImage" fuse

      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}-setup.exe"

      - name: Start Hello Window.exe as Explorer would
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.zip"

      - name: Run Hello.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/Hello-${{ matrix.platform }}.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.zip" -Platform ${{ matrix.platform }}
          -Expected "Hello from Ruby 4.0.9 on ${{ matrix.platform }}"

  installed-gem-musl:
    name: Install the built gem, build, and deliver (${{ matrix.platform }})
    needs: gem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/windowed_app
            test/fixtures/parity
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checks
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fledge-gem
          path: gem

      - name: Install the built gem in Alpine, and build hello, the parity probe, and windowed_app
        env:
          TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cat > "$RUNNER_TEMP/install.sh" <<'SH'
          set -eu
          /checks/.github/scripts/alpine-packages.sh apps
          gem install --local --no-document /work/gem/fledge.gem
          mkdir -p /project
          printf 'source "https://rubygems.org"\ngem "fledge", "%s"\n' "${TAG#v}" > /project/Gemfile
          cd /project
          bundle install --local
          bundle exec fledge --version
          fledge --version
          export XDG_CACHE_HOME=/tmp/cache
          fledge build -o /work/dist /work/examples/hello 2>> /tmp/build.err
          for app in test/fixtures/parity examples/windowed_app; do
            bundle exec fledge build -o /work/dist "/work/$app" 2>> /tmp/build.err
          done
          cat /tmp/build.err
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" /tmp/build.err
          mkdir -p /tmp/player /tmp/game
          printf 'puts "player"\n' > /tmp/player/main.rb
          printf 'name: Player\nbuild_tools: true\n' > /tmp/player/fledge.yml
          printf 'puts "game"\n' > /tmp/game/main.rb
          printf 'name: Game\n' > /tmp/game/fledge.yml
          bundle exec fledge build -o /tmp/from /tmp/player
          XDG_CACHE_HOME=/tmp/empty FLEDGE_RUNTIME_MIRROR=http://127.0.0.1:9 \
            bundle exec fledge build --from "/tmp/from/Player-$PLATFORM" -o /tmp/from /tmp/game
          [ "$("/tmp/from/Game-$PLATFORM/Game")" = game ]
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/checks:/checks" -v "$RUNNER_TEMP:/scripts" -e TAG -e PLATFORM \
            "$ALPINE_RUBY" sh /scripts/install.sh

      - name: Run hello and windowed_app on Alpine with no Ruby installed
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cat > "$RUNNER_TEMP/deliver.sh" <<'SH'
          set -eu
          checks/.github/scripts/alpine-packages.sh deliver
          checks/.github/scripts/deliver.sh "dist/Hello-$PLATFORM.tar.gz" "dist/Parity-$PLATFORM.tar.gz" "Hello from Ruby 4.0.9 on $PLATFORM" --no-ruby-installed
          checks/.github/scripts/deliver-windowed.sh "dist/Hello Window-$PLATFORM.tar.gz"
          checks/.github/scripts/deliver-appimage.sh "dist/Hello Window-$PLATFORM.AppImage" extract
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/scripts" -w /work -e PLATFORM "$ALPINE" sh /scripts/deliver.sh
