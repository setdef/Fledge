# Experiment only (experiment/file-associations), never for trunk. Two
# questions of ADR 032. Section 3: do macOS, Windows, and Linux read the
# file_associations of examples/windowed_app back with their own tools,
# and does the shell hand an opened file or folder to the app? Delivery's
# own scripts answer, on a fresh runner of each system. Section 4: can an
# app built with build_tools: true, with Fledge's own gem inside it, run
# fledge build --from from inside itself on a computer with no Ruby and
# no runtime, into a windowed app with its installers, on all seven
# desktop platforms? The runtimes are trunk's, from CI run RUN, whose
# launchers this branch does not change.

name: file-associations

on:
  push:
    branches: ["experiment/file-associations"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RUN: "42089720531"
  MISE_RUBY_COMPILE: "false"
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: ubuntu-24.04, platform: x86_64-linux-musl }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows' && !endsWith(matrix.platform, '-musl')
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - name: Install squashfs-tools and dpkg-dev for the AppImage and the .deb
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools dpkg-dev

      - name: Build Hello Window, and the builder app with build_tools and this checkout's fledge as a gem
        if: "!endsWith(matrix.platform, '-musl')"
        env:
          FLEDGE_RUNTIME_DIR: ${{ github.workspace }}/runtimes
        run: .github/file_associations/prepare.sh "$RUNNER_TEMP/file-associations" "${{ matrix.platform }}"

      - name: Build them in Alpine
        if: endsWith(matrix.platform, '-musl')
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e FLEDGE_RUNTIME_DIR=/fledge/runtimes "$ALPINE_RUBY"
          sh -c '.github/scripts/alpine-packages.sh apps && git config --global --add safe.directory /fledge &&
          .github/file_associations/prepare.sh /tmp/file-associations ${{ matrix.platform }}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  windowed:
    name: file associations (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would, and read what it opens
        if: runner.os != 'Windows'
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window with its setup program, open a file and a folder with it, and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}-setup.exe"

  deb:
    name: .deb (${{ matrix.platform }}, ubuntu:24.04)
    needs: build
    runs-on: ${{ matrix.os }}
    container: ubuntu:24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Install desktop-file-validate
        run: |
          apt-get update -qq
          apt-get install -y -qq desktop-file-utils

      - name: Install Hello Window from its .deb with apt, run it, and remove it
        run: .github/scripts/deliver-deb.sh "delivered/Hello Window-${{ matrix.platform }}.deb"

  prove:
    name: build --from with no runtime (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: ubuntu-24.04, platform: x86_64-linux-musl }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      # What an AppImage and a .deb need that a fresh Ubuntu runner may
      # not have, and that no app may carry: squashfs-tools is GPL-2.0.
      - name: Install squashfs-tools
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools

      - name: Run fledge build --from inside the builder with no Ruby and no runtime, and run what it wrote
        if: runner.os != 'Windows' && !endsWith(matrix.platform, '-musl')
        run: .github/file_associations/prove.sh "${{ matrix.platform }}" "$PWD/delivered/Builder-${{ matrix.platform }}.tar.gz" "$PWD/.github/file_associations/game"

      - name: The same on Alpine with no Ruby installed
        if: endsWith(matrix.platform, '-musl')
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$ALPINE"
          sh -c 'apk add --no-cache squashfs-tools >/dev/null && sh .github/file_associations/prove.sh "${{ matrix.platform }}"
          "/work/delivered/Builder-${{ matrix.platform }}.tar.gz" /work/.github/file_associations/game'

      - name: Run fledge build --from inside the builder with no Ruby and no runtime, and install and run what it wrote
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/file_associations/prove.ps1 -Platform ${{ matrix.platform }}
          -Archive "$PWD\delivered\Builder-${{ matrix.platform }}.zip" -Game "$PWD\.github\file_associations\game"
