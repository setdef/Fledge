version = 1

[[annotations]]
path = 'Gemfile.lock'
SPDX-FileCopyrightText = "2026 Kerrick Long <me@kerricklong.com>"
SPDX-License-Identifier = "CC0-1.0"

# Bundler writes a lockfile, and its own settings, and gives neither a
# place for a header.
[[annotations]]
path = ['examples/my_cool_app/Gemfile.lock', 'examples/native_app/Gemfile.lock', 'examples/nokogiri_app/Gemfile.lock',
  'examples/nokogiri_app/.bundle/config']
SPDX-FileCopyrightText = "2026 Kerrick Long <me@kerricklong.com>"
SPDX-License-Identifier = "MIT-0"

# The windowed example's icon, drawn by a script, saved as a PNG, and
# made into each system's files with sips and iconutil, none of which
# has a place for a header.
[[annotations]]
path = 'examples/windowed_app/icons/**'
SPDX-FileCopyrightText = "2026 Kerrick Long <me@kerricklong.com>"
SPDX-License-Identifier = "MIT-0"

[[annotations]]
path = 'README.rdoc'
SPDX-FileCopyrightText = "2026 Kerrick Long <me@kerricklong.com>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Third-party license texts the runtimes ship in their notices/ folder,
# copied unchanged from each project at the version runtime/sources.yml
# pins.
[[annotations]]
path = "runtime/notices/ruby/**"
precedence = "override"
SPDX-FileCopyrightText = "Yukihiro Matsumoto <matz@netlab.jp>"
SPDX-License-Identifier = "Ruby OR BSD-2-Clause"

