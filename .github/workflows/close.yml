# Experiment (Plan 003, "Closing a Windows console"): ways to close a
# console that GitHub's Windows runners honor.
name: Close experiment

on:
  push:
    branches:
      - experiment/windows-close

permissions:
  contents: read

jobs:
  close:
    name: Close (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Ruby pin
        id: pins
        shell: bash
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}
      - name: Build the console probe with the release's runtime
        shell: bash
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          ruby -I lib exe/fledge build -o dist test/fixtures/console
          ls dist
      - name: deliver-console.ps1 with ruby.exe
        shell: pwsh
        run: >-
          & .github/scripts/deliver-console.ps1
          -Reference @((Get-Command ruby.exe).Source, 'test/fixtures/console/main.rb')
      - name: deliver-console.ps1 with the built app, on a PATH without Ruby
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-console.ps1
          -Archive "dist/Console-${{ matrix.platform }}.zip"
  disk-image:
    name: Disk image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - name: hdiutil create, as Fledge runs it
        run: |
          sw_vers
          mkdir -p stage/A.app && echo hi > stage/A.app/f && ln -s /Applications stage/Applications
          hdiutil create -volname T -srcfolder stage -fs HFS+ -format UDZO -ov t.dmg; echo "exit=$?"
          hdiutil verify t.dmg | tail -1
          hdiutil attach t.dmg -nobrowse -mountpoint mnt | tail -1
          ls -l mnt
          hdiutil detach mnt
          diskutil image create from --format UDZO --volumeName T stage d.dmg; echo "diskutil exit=$?"
