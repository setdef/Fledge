# Experiment (experiment/path-probe only): what Ruby's own answers to
# "where am I" are inside an app built with a tagged Fledge and its
# released runtimes, and whether exec RbConfig.ruby, $0, *ARGV restarts
# the app. Each platform builds spike/path_probe's three probes, runs
# them where they were built, then a fresh runner of the same platform
# runs them again from their archives.
name: Path probe experiment

on:
  push:
    branches:
      - experiment/path-probe

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLEDGE_TAG: v0.2.1

jobs:
  build:
    name: Build and run (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1 fuse3=3.14.0-5build1

      - name: Install Fledge from the tag and build the probes with the release's runtime
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          printf 'source "https://rubygems.org"\ngem "fledge", git: "https://github.com/setdef/Fledge", tag: "%s"\n' "$FLEDGE_TAG" > "$RUNNER_TEMP/project/Gemfile"
          cd "$RUNNER_TEMP/project"
          bundle install
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          for probe in plain bundled windowed; do
            bundle exec fledge build -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/spike/path_probe/$probe"
          done
          ls -l "$RUNNER_TEMP/dist"

      - name: Run the probes where they were built
        if: runner.os != 'Windows'
        run: |
          for probe in PathProbe:plain BundledProbe:bundled "Windowed Probe:windowed"; do
            sh spike/path_probe/drive.sh "$RUNNER_TEMP/dist/${probe%%:*}-${{ matrix.platform }}.tar.gz" "$RUNNER_TEMP/out/build" "${probe##*:}"
          done

      - name: Run the probes where they were built
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($probe in @('PathProbe:plain', 'BundledProbe:bundled', 'Windowed Probe:windowed')) {
            $name, $label = $probe -split ':'
            pwsh -NoProfile -File spike/path_probe/drive.ps1 -Archive "$env:RUNNER_TEMP/dist/$name-${{ matrix.platform }}.zip" -Out "$env:RUNNER_TEMP/out/build" -Label $label
          }

      - name: Summarize
        if: always()
        run: ruby spike/path_probe/summarize.rb "$RUNNER_TEMP/out/build" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-out-${{ matrix.platform }}
          path: ${{ runner.temp }}/out
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  deliver:
    name: Run on a fresh runner (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: spike/path_probe
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/apps

      - name: Install FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3=3.14.0-5build1

      - name: Run the probes
        if: runner.os != 'Windows'
        run: |
          for probe in PathProbe:plain BundledProbe:bundled "Windowed Probe:windowed"; do
            sh spike/path_probe/drive.sh "$RUNNER_TEMP/apps/${probe%%:*}-${{ matrix.platform }}.tar.gz" "$RUNNER_TEMP/out/fresh" "${probe##*:}"
          done

      - name: Run the probes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($probe in @('PathProbe:plain', 'BundledProbe:bundled', 'Windowed Probe:windowed')) {
            $name, $label = $probe -split ':'
            pwsh -NoProfile -File spike/path_probe/drive.ps1 -Archive "$env:RUNNER_TEMP/apps/$name-${{ matrix.platform }}.zip" -Out "$env:RUNNER_TEMP/out/fresh" -Label $label
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fresh-out-${{ matrix.platform }}
          path: ${{ runner.temp }}/out
          retention-days: 7

  # musl Linux: built in Alpine with Ruby, as a developer on Alpine
  # builds, and run there and in a bare Alpine with no Ruby.
  musl:
    name: Build and run (x86_64-linux-musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in Alpine with Ruby, and run there
        run: |
          cat > "$RUNNER_TEMP/build.sh" <<'SH'
          set -eu
          /work/.github/scripts/alpine-packages.sh apps
          mkdir -p /project
          printf 'source "https://rubygems.org"\ngem "fledge", git: "https://github.com/setdef/Fledge", tag: "%s"\n' "$FLEDGE_TAG" > /project/Gemfile
          cd /project
          bundle install
          export XDG_CACHE_HOME=/tmp/cache
          for probe in plain bundled windowed; do
            bundle exec fledge build -o /work/dist "/work/spike/path_probe/$probe"
          done
          ls -l /work/dist
          cd /work
          for probe in PathProbe:plain BundledProbe:bundled "Windowed Probe:windowed"; do
            sh spike/path_probe/drive.sh "dist/${probe%%:*}-x86_64-linux-musl.tar.gz" /work/out/build "${probe##*:}"
          done
          ruby spike/path_probe/summarize.rb /work/out/build || true
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/scripts" -e FLEDGE_TAG "$ALPINE_RUBY" sh /scripts/build.sh

      - name: Run in a bare Alpine with no Ruby
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$ALPINE" sh -c '
          rm -rf dist/*-x86_64-linux-musl/ && for probe in PathProbe:plain BundledProbe:bundled "Windowed Probe:windowed"; do
            sh spike/path_probe/drive.sh "dist/${probe%%:*}-x86_64-linux-musl.tar.gz" /work/out/fresh "${probe##*:}"
          done'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: out-x86_64-linux-musl
          path: out
          retention-days: 7
