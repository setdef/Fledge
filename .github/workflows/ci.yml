# Plan 001's pipeline, on every push and pull request: the gate, then a
# runtime per platform, then the tests on each platform with its own
# runtime, then each platform building the examples for itself on a
# runner of its own (ADR 010), then Delivery: each built app unpacked and
# run on a fresh computer that has never had Ruby.
#
# The gate runs once, on Linux: its lints (RuboCop, Steep, RDoc
# coverage, REUSE, actionlint, clang-format) read the same files on
# every OS, so one run answers for all three.
#
# A pushed pin commit, which changes only lib/fledge/SHA256SUMS (ADR
# 053; doc/contributors/design/releases.md, "A pin commit's short CI"),
# runs only the gate and a check that its pins match
# the runtimes of its parent's run; every other job is skipped (the
# Changes job). Every other commit runs everything below.
#
# The macOS and Linux runtimes build on each platform's own runner
# (macos-15 is Apple Silicon, ubuntu-24.04-arm is aarch64), because their
# launchers link Ruby itself. The Windows runtime builds on Linux: its
# launcher loads Ruby's DLL when it runs, so it cross-compiles with a
# pinned llvm-mingw from Ruby's headers alone (runtime/sources.yml), and
# Windows runners test it, build apps with it, and deliver them. Each
# platform's apps are built on that platform, as developers build them.
#
# A windowed app gets an installer too (ADR 009): a disk image for macOS,
# an NSIS setup program for Windows, and an AppImage for Linux (and a
# .deb and an MSIX package, which windowed_app asks for), each written
# on its own platform's runner; and Delivery installs each on a fresh
# runner and runs the app it installed.
#
# The mobile runtimes (ADR 011) build from Ruby's source, iOS's on a Mac
# with Xcode and Android's on Linux with the NDK, and their Delivery is
# apps built with fledge build ios and fledge build android (ADR 012),
# whose Xcode and Gradle projects build unsigned, the Gradle ones as APKs
# and as the app bundles Google Play takes, run in the iOS Simulator on an
# iPhone and an iPad and on Android emulators with 4 KB and 16 KB pages,
# from an APK and from a bundle's APKs: hello, a gem-shaped app with pure-Ruby gems, a script
# that requires json and a bundled gem and reaches a server over HTTPS,
# and the parity probe (tasks/mobile_parity.rb).
#
# Every runtime build runs the license audit and refuses to archive a
# runtime that breaks Fledge's license policy (ADR 004). The Licenses
# jobs check what it wrote and that it still fails on GPL code; the
# upstream jobs show it catching what rv-ruby and RubyInstaller ship and
# runtimes remove; the licensing page job keeps doc/licensing.md true to
# the runtimes; and the Replace jobs prove that whoever receives an app
# can replace its LGPL libraries, as that page tells developers.
#
# ruby/spec runs on stock Ruby and in a built app from each runtime,
# desktop and phone, and any example that fails on one side only, unless
# justified, fails the job (ruby-spec.yml, tasks/ruby_spec.rb).
#
# release.yml, on a v* tag, publishes the runtimes this workflow built
# from the release commit, once it has passed on trunk on the release
# commit and on the pin commit tagged (ADR 053). It looks those runs up
# and does not run this again. Nothing here, or ever, publishes to
# RubyGems.org (doc/contributors/design/releases.md, "Where releases
# are").

name: CI

on:
  push:
    # Not on tags: release.yml looks up the tagged commit's run on trunk.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A push to a branch cancels that branch's run in progress. A push to
# trunk never does (ADR 071): GitHub keeps one run going and one waiting
# in a group, and a newer push replaces only the waiting one, so every
# run that starts finishes, and covers every commit pushed since the
# run before it started. A red run blames that batch, and a commit
# inside a batch has no run of its own. A release commit ("chore:
# release X.Y.Z") and a pin commit ("chore: pin ...") get a group of
# their own, named for the commit, so their runs start at once and no
# push replaces them (doc/contributors/design/releases.md, "Runs,
# batches, and the release commit"). fast.yml judges every push alone.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    (startsWith(github.event.head_commit.message, 'chore: release ')
    || startsWith(github.event.head_commit.message, 'chore: pin '))
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds where they exist
  # (mise's Ruby documentation); false makes a missing build fail instead
  # of compiling Ruby for ten minutes.
  MISE_RUBY_COMPILE: "false"
  # The Rust that compiles the examples' Rust gems in the Build from
  # source jobs, the release Ferro's gems are tested with (its mise.toml).
  RUST_TOOLCHAIN: "1.99.1"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # musl Linux (ADR 017): the Alpine a developer with Ruby builds apps
  # on, and the bare Alpine Delivery runs them on, pinned by digest.
  ALPINE_RUBY: ruby:4.1.0-preview1-alpine3.24@sha256:3377ef9d7e5c4c430ccc9c3459d172158c575771e1aac2010702dee54388ace0
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  # The status fledge build --from exits with for an APP of another release
  # or platform, or a folder Fledge did not build (Fledge::BuiltApp).
  FROM_REFUSES_A_BAD_APP_WITH: "1"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins the tools contributors use (bin/setup): Ruby, the
      # REUSE tool, actionlint, shellcheck, and clang-format. CI installs
      # the same pins the same way. Its cache is keyed by mise.toml's hash.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      # Bundler keeps its files outside the checkout, where RuboCop and
      # the REUSE tool would read them.
      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      # Gems with native extensions compile against one Ruby on one OS, so
      # the key names both, with the lockfile. Only an exact match
      # restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      # Minitest prints each test's name and time (A is Minitest::TestTask's
      # argument variable), so a stuck test shows which it is.
      - name: Run the gate
        timeout-minutes: 15
        env:
          A: --verbose
          # Every test of a compiled file runs, with this runner's GNU
          # objdump for ELF and LLVM's for the rest (test/test_helper.rb).
          FLEDGE_REQUIRE_READERS: "1"
        run: bundle exec rake

      # The gate starts with lint:fix, which corrects RuboCop offenses and
      # adds missing license headers, so an offense would pass as a fix
      # nobody committed. A changed or new file fails here instead.
      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

  # A pin commit (ADR 053; doc/contributors/design/releases.md, "A pin
  # commit's short CI") changes only lib/fledge/SHA256SUMS
  # from a parent whose run built and delivered every runtime it pins.
  # No runtime, app, or check below reads that file, so a pushed pin
  # commit runs the gate, which does, and this job, and every other job
  # is skipped: each job with no needs of its own waits for this one and
  # runs only for any other commit, and the jobs that need those are
  # skipped with them. Pull requests always run everything.
  #
  # On a pin commit, this job also checks that the pins are exactly the
  # runtimes its parent's run built, in which every job ran and passed:
  # the run release.yml will publish them from (tasks/ci_runs.rb),
  # checked as release.yml checks them. On any other commit those steps
  # are skipped and the job passes. It is one job that always runs, not
  # a second one skipped on every other commit, because release.yml
  # requires the release commit's run to have skipped no job.
  changes:
    name: Changes, and a pin commit's pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Finding the parent's run and downloading its runtimes.
      actions: read
    outputs:
      pins-only: ${{ steps.kind.outputs.pins-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Tell whether this is a pin commit
        id: kind
        run: |
          pins_only=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then pins_only=$(.github/scripts/pins-only.sh); fi
          echo "Pin commit: $pins_only"
          echo "pins-only=$pins_only" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: steps.kind.outputs.pins-only == 'true'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Find the parent's run, in which every job passed
        if: steps.kind.outputs.pins-only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(git rev-parse HEAD^)
          run=$(ruby tasks/ci_runs.rb green "$built" --every-job --branch "$GITHUB_REF_NAME")
          echo "The pins name the runtimes of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, built from $built"
          echo "RUN=$run" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.kind.outputs.pins-only == 'true'
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Check the runtimes against the pins
        if: steps.kind.outputs.pins-only == 'true'
        run: .github/scripts/check-pins.sh "$RUNNER_TEMP/runtimes" lib/fledge/SHA256SUMS

  # One runtime per platform (rake runtime): the launcher compiled with
  # warnings as errors and the compiler's static analyzer, the pinned
  # Ruby's standard library pruned beside it (rv-ruby's, or for Windows
  # RubyInstaller's, checked against its PGP signature), and the license
  # audit (ADR 004), which fails the build of a runtime that breaks
  # Fledge's license policy and writes its NOTICES and SBOM. Beside each
  # archive go the release assets that describe it: the SBOM, the
  # NOTICES, and the source of its LGPL libraries.
  runtime:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          # Cross-compiled; the runner's 7z unpacks RubyInstaller's archive
          # and its gpgv checks the signature. Windows on ARM64 too (ADR 035).
          - os: ubuntu-24.04
            platform: x64-mingw-ucrt
          - os: ubuntu-24.04
            platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder needs only Ruby's standard library, so mise installs
      # only Ruby, and no bundle.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # The compiler and linker that build the launcher, bin/ruby, and
      # libxcrypt, pinned to the Ubuntu 24.04 builds of gcc 13 and
      # binutils that built the runtimes before this pin, and patchelf,
      # which removes the RUNPATHs rv-ruby's build left in its extensions.
      # make, perl, and xz, which libxcrypt's build needs, are on the
      # runner already. Ubuntu's archive lists only a package's newest
      # update, so a pin that stops resolving fails the job, and is moved
      # on purpose.
      - name: Install the pinned compiler, linker, and patchelf
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-mingw-ucrt')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-13=13.3.0-6ubuntu2~24.04.1 binutils=2.42-4ubuntu2.10 patchelf=0.18.0-1.1build1
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          gcc-13 --version | head -n 1
          ld --version | head -n 1

      # The Xcode whose clang and linker build the launcher and bin/ruby,
      # chosen by version as the iOS runtime's is, since Apple publishes
      # no download to pin: 16.4, macos-15's default, whose macOS 15.5 SDK
      # built the runtimes before this pin.
      - name: Select the pinned Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      # rv-ruby, RubyInstaller, llvm-mingw, and libxcrypt downloads, keyed
      # by the file that pins their SHA-256s, so a changed pin downloads
      # afresh. The builder checks every cached file's SHA-256 again
      # before using it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      # The archive's timestamps are the commit's, so two builds of one
      # commit differ only where the compiler's output does.
      - name: Build the runtime
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      # The Windows source bundle holds MSYS2's source package of GMP as
      # the exact source of RubyInstaller's libgmp-10.dll. That holds only
      # if MSYS2's binary package of that build holds the very file the
      # runtime ships, byte for byte.
      - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
        if: endsWith(matrix.platform, '-mingw-ucrt')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            x64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp package) folder=ucrt64 ;;
            aarch64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp arm64 package) folder=clangarm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gmp-package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" "$folder/bin/libgmp-10.dll"
          cmp "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll" tmp/runtime/"$PLATFORM"/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
          sha256sum "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

  # The musl Linux runtimes (ADR 017): CRuby built from its pinned source
  # in Alpine, on a runner of each architecture, as rv-ruby builds its
  # own musl Rubies, with docker run rather than a job container, since
  # GitHub's JavaScript actions cannot run in an Alpine container on an
  # ARM runner (rv-ruby's build-alpine.yml says the same).
  runtime-musl:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime in Alpine
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e SOURCE_DATE_EPOCH -e PLATFORM "$ALPINE_RUBY" \
            sh -c '.github/scripts/alpine-packages.sh build && ruby tasks/runtime_builder.rb "$PLATFORM"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: runtime-${{ matrix.platform }}-logs
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  # The mobile runtimes (ADR 011): CRuby built from its pinned source for
  # iOS and iPadOS, on a Mac with the pinned Xcode, and for Android, on
  # Linux with the pinned NDK and Gradle, each audited like every other
  # runtime. Xcode 26.5 is the newest on macos-26 and the one whose iOS
  # 26.5 Simulator runtime the image installs; the image's default Xcode
  # has none (spike/mobile/FINDINGS.txt).
  runtime-mobile:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: ios
          - os: ubuntu-24.04
            platform: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        if: matrix.platform == 'ios'
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcodebuild -version

      # The Android Gradle plugin runs on Java 17 or newer; the runner's
      # Android SDK gives it the API 36 platform.
      - name: Use Java 21
        if: matrix.platform == 'android'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime
        run: ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: runtime-${{ matrix.platform }}-logs
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  # Delivery on phones (doc/contributors/design/phone-projects.md, "Parity on a
  # phone"; ADR 012): apps built as a
  # developer builds them, with fledge build ios, and their Xcode projects
  # built with xcodebuild for the Simulator and, unsigned, for devices, to
  # show the device slice links and the privacy manifest names every
  # category of API the app's executable imports that Apple asks a reason
  # for; then each run in the Simulator on an iPhone and an iPad, its
  # output read from os_log: examples/hello; examples/mobile_app, whose
  # pure-Ruby gems Bundler sets up; examples/native_phone,
  # examples/cmake_phone, and examples/rust_phone, whose gems' extensions
  # are compiled for the phone, the second's C++ library by CMake from
  # its extconf.rb, with the runner's CMake, and the third's Rust by
  # Cargo, with mise.toml's Rust and its phone targets (ADR 022, ADR
  # 027); examples/rake_phone, whose digest-crc builds its extensions
  # from a Rakefile (ADR 072); a script that requires json and csv,
  # a bundled gem, and reaches rubygems.org over HTTPS; and the parity
  # probe, against ruby main.rb on this Mac's desktop Ruby, with every
  # difference justified for a phone (tasks/mobile_parity.rb).
  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad)
    needs: [runtime, runtime-mobile]
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby rust

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes
          cmake --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: mobile-parity-downloads-ios-${{ hashFiles('runtime/sources.yml') }}

      # XcodeGen writes each app's Xcode project in fledge build ios, as a
      # developer installs it; pinned by SHA-256.
      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes

      # The runtime of this Mac, whose Ruby runs mkmf to compile a gem's
      # extension for the phone (ADR 022).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes

      - name: Build the apps with fledge build ios, and run them in the iOS Simulator
        run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mobile-apps-ios
          path: |
            tmp/mobile-parity/ios/*.ndjson
            tmp/mobile-parity/ios/*.log
            tmp/mobile-parity/ios/*.ips
          retention-days: 14

  # The same on Android emulators of API 36 with 4 KB and with 16 KB
  # pages: the apps built with fledge build android, each Gradle project
  # built with its own wrapper, debug and unsigned release, as APKs and as
  # the app bundles Google Play takes, and each APK checked for Play's 16
  # KB alignment and target API; each release bundle signed with a
  # throwaway upload key, validated with bundletool, made into the APKs
  # Play would serve, which are checked the same way and against Play's
  # size limit (doc/contributors/design/phone-projects.md, "The Android App Bundle
  # check"), and each app run from its debug APK
  # and again from its bundle's APKs, as Play installs them. No GitHub-hosted
  # runner boots an arm64-v8a emulator with hardware acceleration (ADR
  # 011), so the arm64-v8a library is built and checked but run on no
  # emulator here. examples/rust_phone's Rust is compiled with mise.toml's
  # Rust and its Android targets, and bindgen reads the phone's headers
  # with the runner's libclang.
  mobile-apps-android:
    name: Mobile apps (Android emulator, API 36, ${{ matrix.target }})
    needs: [runtime, runtime-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby rust

      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          cmake --version

      # Every Gradle wrapper in a project fledge build writes must be the
      # one Gradle released (runtime/sources.yml pins its SHA-256 too).
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-x86_64-linux
          path: ${{ runner.temp }}/runtimes

      # fledge build android compiles a gem's extension with the NDK on the
      # computer (ADR 022), as a developer's own: the very NDK the runtime
      # is built with, pinned by SHA-256.
      - name: Install the pinned NDK
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile ndk hosts x86_64-linux)
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_ROOT=$(echo "$RUNNER_TEMP"/ndk/android-ndk-*)" >> "$GITHUB_ENV"

      # bundletool makes and installs the APKs Play would serve from a
      # bundle, pinned by SHA-256 (runtime/sources.yml).
      - name: Fetch the pinned bundletool
        run: |
          jar=$(ruby .github/scripts/fetch_pin.rb mobile bundletool)
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      - name: Build the apps with fledge build android and Gradle, as APKs and bundles, and check each for 16 KB pages, API 36, and Play's size limit
        run: ruby tasks/mobile_parity.rb android-build "$RUNNER_TEMP/runtimes"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 4 GB of RAM, as the phones that ship 16 KB pages have at least
      # twice that: with the emulator's default, the 16 KB system ran out
      # of memory and its low-memory killer killed the app in front, one
      # app in one run and another in the next.
      - name: Run the apps on the emulator, from their APKs and from their bundles
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ruby tasks/mobile_parity.rb android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mobile-apps-android-${{ matrix.target }}
          path: tmp/mobile-parity/android/logcat-*.txt
          retention-days: 14

  # An Android app's project is built on macOS and Windows too, as Google
  # supports its SDK there and Briefcase, Flutter, React Native, and Tauri
  # build Android apps there (ADR 012): examples/mobile_app, written with
  # fledge build android and built with its Gradle wrapper and the
  # runner's Android SDK, as an APK and as the release bundle Play takes,
  # which is signed, validated, and made into Play's APKs with bundletool.
  mobile-apps-android-hosts:
    name: Mobile apps (Android project on ${{ matrix.host }})
    needs: runtime-mobile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: arm64-darwin
          - os: windows-latest
            host: x64-mingw-ucrt
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Ruby pin
        if: runner.os != 'Windows'
        id: pins
        run: echo "ruby=$(.github/scripts/ruby-pin.sh)" >> "$GITHUB_OUTPUT"

      # Ruby's own on macOS. On Windows, RubyInstaller's build the
      # x64-mingw-ucrt runtime came from, at mise.toml's pins, the
      # platform Fledge builds on there.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os != 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os == 'Windows'
        # mise-action unpacks mise under os.tmpdir(), which is TEMP on
        # Windows, then renames it into mise_dir; a rename cannot leave
        # its drive, so the unpacking happens on mise_dir's drive too.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise }}
          add_shims_to_path: false
          # On the runner's fast drive, where setup-ruby put Ruby and MSYS2.
          mise_dir: ${{ runner.temp }}\mise

      # What setup-ruby gave a Windows job beyond mise.toml's environment
      # (TMPDIR above all), so builds see what they saw under it.
      - name: Give Windows' Ruby the rest of setup-ruby's environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - name: Use Java 21
        run: echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME_21_arm64}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes

      - name: Write examples/mobile_app's Android project with fledge build android
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: ruby -I lib exe/fledge build android -o dist examples/mobile_app

      - name: Fetch the pinned bundletool
        run: |
          jar=$(ruby .github/scripts/fetch_pin.rb mobile bundletool)
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      - name: Build it with its Gradle wrapper and check the APK and the bundle
        run: |
          cd "dist/Mobile App-android"
          if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat --no-daemon assembleDebug bundleRelease; else ./gradlew --no-daemon assembleDebug bundleRelease; fi
          cd ../..
          ruby tasks/mobile_parity.rb android-check "dist/Mobile App-android/build/outputs/apk/debug/Mobile App-debug.apk"
          ruby tasks/mobile_parity.rb android-bundle "dist/Mobile App-android/build/outputs/bundle/release/Mobile App-release.aab"

  # Every test, both tiers, on each platform, with that platform's
  # runtime, so test/integration/built_app_test.rb builds and runs a
  # real app rather than skipping (FLEDGE_REQUIRE_RUNTIME turns a skip
  # into a failure); on Linux with squashfs-tools' mksquashfs, which
  # writes an AppImage's file system (ADR 010). No sqlite3 gem is built for Ruby 4.1 yet, so the
  # builds of examples/my_cool_app and the gem-shaped probe compile it
  # from source, which the limits below leave room for.
  test:
    name: Test (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests need only Ruby, so mise installs only Ruby, at
      # mise.toml's pin, as on a contributor's machine.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # Pinned to Ubuntu 24.04's build.
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1
          echo "FLEDGE_REQUIRE_MKSQUASHFS=1" >> "$GITHUB_ENV"
          echo "FLEDGE_REQUIRE_DPKG_DEB=1" >> "$GITHUB_ENV"

      # ADR 016: a self-signed identity for the signed build of
      # test/integration/built_app_test.rb, which no CI runner has
      # otherwise.
      - name: Make a code signing identity
        if: runner.os == 'macOS'
        run: .github/scripts/make-test-identity.sh "$RUNNER_TEMP/certificate.pem"

      - name: Run the tests
        timeout-minutes: 20
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_REQUIRE_RUNTIME: "1"
        run: bundle exec rake test:all

      # ADR 003 and ADR 005: the probe app, built from this runtime,
      # against rv-ruby's own ruby running the same main.rb, then the probe
      # as examples/my_cool_app's program, built with its gems, against
      # bundle exec on that Ruby. The report lands in the job summary; an
      # unjustified difference fails the job.
      - name: Check parity with ruby main.rb and bundle exec
        timeout-minutes: 10
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: bundle exec rake parity

      # ADR 003 (doc/contributors/design/parity.md, "Console checks"):
      # Ctrl-C and a hangup, in a terminal of the probe's own,
      # end ruby main.rb as the console Delivery expects of a built app.
      - name: Interrupt ruby main.rb in a terminal
        run: .github/scripts/deliver-console.sh --reference "$(command -v ruby)" test/fixtures/console/main.rb

  # ADR 003 on musl Linux (ADR 017): the probe app, built from this
  # runtime in Alpine, against the Ruby the runtime build compiled, as
  # ruby main.rb, then as my_cool_app's program against bundle exec.
  parity-musl:
    name: Parity (${{ matrix.platform }})
    needs: runtime-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes

      - name: Check parity with ruby main.rb and bundle exec, in Alpine
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e FLEDGE_RUNTIME_DIR=/fledge/runtimes "$ALPINE_RUBY"
          sh -c '.github/scripts/alpine-packages.sh apps && git config --global --add safe.directory /fledge && ruby tasks/parity.rb'

  # ruby/spec on stock Ruby and in a built app (ruby-spec.yml): on every
  # push for x86_64-linux and arm64-darwin and in phone apps in the iOS
  # Simulator and on Android emulators, and on a release commit for all
  # seven desktop platforms too, which also run every night.
  ruby-spec:
    name: ruby/spec
    needs: [runtime, runtime-musl, runtime-mobile]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ruby-spec.yml
    with:
      full: "${{ startsWith(github.event.head_commit.message, 'chore: release ') }}"

  # The tests on Windows, with the Windows runtime, on RubyInstaller's
  # Ruby, which the runtime ships too (ADR 035): the very build the
  # runtime came from, with the DLLs it lacks and the MSYS2 that compiles
  # gems for it, which mise installs at mise.toml's pins, as on a
  # contributor's Windows computer (matrix.mise names those tools).
  # test/integration/built_app_test.rb unpacks hello and my_cool_app
  # with Windows' own Expand-Archive, from the .zip Windows' own tar
  # wrote, and runs Hello.exe and MyCoolApp.exe. As on the other
  # platforms, sqlite3 compiles from source on Ruby 4.1, which the limits
  # below leave room for.
  test-windows:
    name: Test (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2
          # Windows 11 on ARM64, with RubyInstaller's ARM64 Ruby (ADR 035).
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PATH holds the tools' own folders, not mise's shims, so that
      # ruby.exe is RubyInstaller's (the console checks below).
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # mise-action unpacks mise under os.tmpdir(), which is TEMP on
        # Windows, then renames it into mise_dir; a rename cannot leave
        # its drive, so the unpacking happens on mise_dir's drive too.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise }}
          add_shims_to_path: false
          # On the runner's fast drive, where setup-ruby put Ruby and MSYS2.
          mise_dir: ${{ runner.temp }}\mise

      # What setup-ruby gave a Windows job beyond mise.toml's environment
      # (TMPDIR above all), so builds see what they saw under it.
      - name: Give Windows' Ruby the rest of setup-ruby's environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # ADR 016: a self-signed certificate for the signed build of
      # test/integration/built_app_test.rb, which no CI runner has
      # otherwise.
      - name: Make a code signing certificate
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/make-test-identity.ps1 -Certificate "$env:RUNNER_TEMP/certificate.cer"

      - name: Run the tests
        timeout-minutes: 35
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_REQUIRE_RUNTIME: "1"
        run: bundle exec rake test:all

      # ADR 003 and ADR 005: the probe app, built from this runtime,
      # against RubyInstaller's own ruby.exe running the same main.rb, then
      # both again under code page 437, then the probe as
      # examples/my_cool_app's program against bundle exec. The report
      # lands in the job summary; an unjustified difference fails the job.
      - name: Check parity with ruby main.rb and bundle exec
        timeout-minutes: 10
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: bundle exec rake parity

      # ADR 003 (doc/contributors/design/parity.md, "Console checks"):
      # Ctrl-C on two code pages and closing the console end
      # ruby.exe main.rb as the console Delivery expects of a built app,
      # and rubyw.exe, typed into a console, gets none.
      - name: Interrupt ruby.exe main.rb in a console, and close it
        shell: pwsh
        run: >-
          & .github/scripts/deliver-console.ps1
          -Reference @((Get-Command ruby.exe).Source, 'test/fixtures/console/main.rb')
          -WindowedReference @((Get-Command rubyw.exe).Source, 'examples/windowed_app/main.rb')

  # Each platform's apps, built on a runner of that platform from the
  # runtime the runtime job built for it, with that platform's own tools
  # (ADR 010), as a developer builds them: examples/hello, the parity
  # probe (test/fixtures/parity), which Delivery asks what a child Ruby
  # sees, and the probe as a gem-shaped app's program (Parity.gem_probe),
  # which Delivery asks what Bundler.with_original_env and
  # with_unbundled_env give a child; examples/my_cool_app, whose gems come
  # from RubyGems.org, each checked against its Gemfile.lock's checksum,
  # precompiled for the platform (ADR 005); test/fixtures/bundled_with,
  # whose Gemfile.lock names a Bundler no runtime ships (ADR 063);
  # examples/windowed_app, a
  # windowed app (ADR 037, ADR 008) with its installer (ADR 009);
  # examples/programs, a windowed and a console program of one project in
  # one folder (ADR 024); and
  # examples/native_app, whose gems must be compiled (ADR 006): redcarpet,
  # a C gem published only as source, ferro-idna, a Rust gem (rb-sys) from
  # its git tag, each compiled against the runtime's own Ruby and its
  # build-only companion; libusb, whose precompiled build ships on
  # Windows and which compiles from source elsewhere, with the ffi it
  # needs compiled everywhere; and spreadsheet, a GPL gem, with the
  # bigdecimal it needs, the one the runtime's Ruby bundles.
  # examples/real_gems (doc/contributors/design/gems.md, "Examples that
  # exercise these rules"): the gems real apps lock, from a credentialed
  # mirror, a folder outside the project, a path gem with an extension, git
  # with a submodule, and an optional group. The Mac and Windows build
  # examples/nokogiri_app too, nokogiri from
  # source: with macOS's own iconv on the Mac, and with GNU libiconv
  # linked in on Windows, which ships as any gem's compiled code does (ADR
  # 007). Each records what bundle exec prints, which the built app must
  # print too.
  #
  # Each platform's build is a job of its own, and so is each platform's
  # leg of every job that delivers what a build made, the steps written
  # once and shared through a YAML anchor (&build-steps, *build-steps).
  # A job's needs cannot name one leg of a matrix, so with one Build
  # matrix the Mac's and Linux's Delivery waited for Windows' build,
  # fifteen minutes after their own had finished; now each waits for its
  # own platform's build only.
  build-arm64-darwin:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            rust: ""
            mise: ruby
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ruby at mise.toml's pin; on Windows, RubyInstaller's build the
      # runtime came from, with the DLLs it lacks and the MSYS2 that
      # compiles gems for it, which fledge build finds as RubyInstaller
      # does (MSYS2_PATH, which mise sets, first), named by matrix.mise.
      # There PATH holds the tools' own folders, not mise's shims.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # mise-action unpacks mise under os.tmpdir(), which is TEMP on
        # Windows, then renames it into mise_dir; a rename cannot leave
        # its drive, so the unpacking happens on mise_dir's drive too.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise }}
          add_shims_to_path: ${{ runner.os != 'Windows' }}
          mise_dir: ${{ runner.os == 'Windows' && format('{0}\mise', runner.temp) || '' }}

      # What setup-ruby gave a Windows job beyond mise.toml's environment
      # (TMPDIR above all), so builds see what they saw under it.
      - name: Give Windows' Ruby the rest of setup-ruby's environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: matrix.platform != 'aarch64-mingw-ucrt'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}${{ matrix.rust }}

      # bindgen, which rb-sys runs, parses Ruby's MinGW headers, so clang
      # must target MinGW and find the MSYS2 tree mise installs, as
      # Ferro's CI sets it up (after oxidize-rb/actions' setup-ruby-and-rust,
      # with its two AVX-512 defines, rust-bindgen #2500); libclang comes
      # from the LLVM the runner image ships.
      # SPDX-SnippetBegin
      # SPDX-License-Identifier: MIT
      # SPDX-SnippetCopyrightText: 2026 setdef <kerrick@setdef.com>
      # SPDX-SnippetComment: Adapted from Ferro's .github/workflows/ci.yml at
      #   ef2407b1f44cd3c23d98c5085042857761598b85 (setdef/Ferro), its step
      #   "Point bindgen at Ruby's MSYS2 headers".
      - name: Point bindgen and RubyInstaller at MSYS2
        if: matrix.platform == 'x64-mingw-ucrt'
        run: |
          sysroot="${MSYS2_PATH:?mise did not set MSYS2_PATH}"
          sysroot="${sysroot//\\//}/ucrt64"
          libclang="C:/Program Files/LLVM/bin"
          test -f "$sysroot/include/stdio.h" || { echo "::error::no C headers (stdio.h) in $sysroot/include"; exit 1; }
          test -f "$libclang/libclang.dll" || { echo "::error::no libclang.dll in $libclang"; exit 1; }
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-gnu --sysroot=$sysroot -D__AVX512VLFP16INTRIN_H -D__AVX512FP16INTRIN_H"
            echo "LIBCLANG_PATH=$libclang"
          } >> "$GITHUB_ENV"
      # SPDX-SnippetEnd

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # mksquashfs, which writes windowed_app's AppImage, pinned to Ubuntu
      # 24.04's build, as a developer installs it.
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      - name: Build hello, the parity and console probes, my_cool_app, windowed_app, programs, and native_app for ${{ matrix.platform }}
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle")' "$RUNNER_TEMP/parity-bundle"
          apps=(examples/hello test/fixtures/parity test/fixtures/console "$RUNNER_TEMP/parity-bundle" examples/my_cool_app examples/windowed_app examples/programs examples/native_app test/fixtures/bundled_with/exe/bundled_with)
          [ "${{ matrix.platform }}" != aarch64-mingw-ucrt ] || apps=(examples/hello test/fixtures/parity test/fixtures/console examples/windowed_app examples/programs)
          for app in "${apps[@]}"; do
            ruby -I lib exe/fledge build -o dist "$app"
          done

      # ADR 030: examples/system_library, whose png_version gem links the
      # distribution's libpng, which fledge.yml lists under linux:
      # system_libraries. Its headers come from libpng-dev at the version
      # of the libpng the runner's image has; dpkg-dev, whose
      # dpkg-shlibdeps finds the package the .deb depends on, is on the
      # runner already. The same project without the list must fail,
      # naming the key.
      - name: Build system_library for ${{ matrix.platform }}, and refuse it without its list
        if: runner.os == 'Linux'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          sudo apt-get install -y -qq "libpng-dev=$(dpkg-query -W -f '${Version}' libpng16-16t64)"
          ruby -I lib exe/fledge build -o dist examples/system_library
          unlisted="$RUNNER_TEMP/unlisted"
          cp -R examples/system_library "$unlisted"
          sed -i '/^linux:/,$d' "$unlisted/fledge.yml"
          status=0
          ruby -I lib exe/fledge build -o "$RUNNER_TEMP/unlisted-dist" "$unlisted" 2> "$RUNNER_TEMP/unlisted.err" || status=$?
          cat "$RUNNER_TEMP/unlisted.err"
          [ "$status" = 1 ] || { echo "::error::system_library without its list exited with $status, not 1"; exit 1; }
          grep -q "needs libpng16.so.16, .*list it in fledge.yml as linux: { system_libraries: \[libpng16.so.16\] }" "$RUNNER_TEMP/unlisted.err" ||
            { echo "::error::the refusal does not name linux: system_libraries"; exit 1; }

      # Plan 003, "A Linux build takes the icon sizes a developer has":
      # windowed_app with only three of its PNGs builds, warns, and ships
      # three icons in its .deb and AppImage; with none it fails.
      - name: Build windowed_app with three icon sizes, and with none, for ${{ matrix.platform }}
        if: runner.os == 'Linux'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          mkdir "$RUNNER_TEMP/icon-sizes"
          .github/scripts/check-icon-sizes.sh "$RUNNER_TEMP/icon-sizes"

      # ADR 016: hello and windowed_app again, signed with a self-signed
      # identity made for this run, as a developer signs with their own;
      # Delivery verifies them on a fresh runner with the certificate.
      - name: Make a code signing identity
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-signed
          .github/scripts/make-test-identity.sh dist-signed/certificate.pem

      - name: Make a code signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-signed | Out-Null
          pwsh -NoProfile -File .github/scripts/make-test-identity.ps1 -Certificate dist-signed/certificate.cer

      - name: Build hello and windowed_app, signed, for ${{ matrix.platform }}
        if: runner.os != 'Linux'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          for app in examples/hello examples/windowed_app; do
            ruby -I lib exe/fledge build --sign "$FLEDGE_TEST_SIGN_IDENTITY" -o dist-signed "$app"
          done

      # ADR 051: the same two apps signed through the developer's own
      # command, here the Windows SDK's signtool with the same
      # certificate, as a developer runs a cloud signer's tool: hello
      # with --sign-command, typed in PowerShell, and windowed_app with
      # FLEDGE_SIGN_COMMAND. Delivery verifies them as it verifies
      # --sign's.
      - name: Build hello and windowed_app, signed through a signing command, for ${{ matrix.platform }}
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          $signtool = ruby -I lib -r fledge -e 'print Fledge::Nsis.host_path(Fledge::WindowsSigning.signtool(ENV))'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $command = "`"$signtool`" sign /sha1 $env:FLEDGE_TEST_SIGN_IDENTITY /fd sha256 /tr http://timestamp.digicert.com /td sha256 %1"
          ruby -I lib exe/fledge build --sign-command $command -o dist-signed/command examples/hello
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:FLEDGE_SIGN_COMMAND = $command
          ruby -I lib exe/fledge build -o dist-signed/command examples/windowed_app
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'Linux'
        with:
          name: signed-${{ matrix.platform }}
          path: |
            dist-signed/*-${{ matrix.platform }}.tar.gz
            dist-signed/*-${{ matrix.platform }}.zip
            dist-signed/*-${{ matrix.platform }}.dmg
            dist-signed/*-${{ matrix.platform }}-setup.exe
            dist-signed/*-${{ matrix.platform }}.msix
            dist-signed/command/*-${{ matrix.platform }}.zip
            dist-signed/command/*-${{ matrix.platform }}-setup.exe
            dist-signed/command/*-${{ matrix.platform }}.msix
            dist-signed/certificate.*
          if-no-files-found: error
          retention-days: 14

      - name: Build nokogiri_app from source for ${{ matrix.platform }}
        if: matrix.platform == 'arm64-darwin' || matrix.platform == 'x64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: ruby -I lib exe/fledge build -o dist examples/nokogiri_app

      # doc/contributors/design/gems.md, "Examples that exercise these
      # rules": the gems real apps lock. examples/real_gems takes RubyGems.org
      # through a mirror that wants a login, as its .bundle/config says in
      # Bundler's own settings, from a loopback server of ours
      # (.github/scripts/gem-mirror.rb); a gem from a folder outside its
      # project, with an executable; a path gem with a C extension; a gem from
      # git with a submodule (the experiment/submodule-gem branch); and an
      # optional group. Its Delivery prints what a person with no Ruby sees,
      # which no bundle exec can: Bundler compiles no path gem's extension.
      - name: Build real_gems through a credentialed mirror for ${{ matrix.platform }}
        if: matrix.platform != 'aarch64-mingw-ucrt'
        shell: bash
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          ruby .github/scripts/gem-mirror.rb 9292 fledge:mirror-password "$RUNNER_TEMP/mirror.log" &
          mirror=$!
          sleep 3
          status=0
          ruby -I lib exe/fledge build -o dist examples/real_gems || status=$?
          kill "$mirror" || true
          cat "$RUNNER_TEMP/mirror.log"
          [ "$status" = 0 ] || exit "$status"
          for gem in wisper-2.0.1 paint-2.3.0; do
            grep -q "^GET /gems/$gem.gem 200\$" "$RUNNER_TEMP/mirror.log" || { echo "::error::$gem did not come through the mirror, with its login"; exit 1; }
          done
          echo "wisper 2.0.1 through a mirror that wanted a login; shared from outside the project; greeter compiled for the runtime's Ruby; fledge_submodule_gem says Hello World!; paint 2.3.0 from an optional group; shared-cli says shared from outside the project" > dist/real_gems.expected

      # The gems bundle exec runs the examples with below, installed for
      # this runner's own Ruby, kept between runs: on Windows, compiling
      # nokogiri and the Rust gems for that Ruby took most of nine
      # minutes of the longest chain in CI. They only make the .expected
      # files; fledge build compiled each app's gems afresh above, for the
      # runtime's Ruby, which is the check (ADR 006). The key names the
      # Ruby, the Rust, and each lockfile and Bundler setting, and only an
      # exact match restores.
      - name: Read the runner's Ruby
        if: matrix.platform != 'aarch64-mingw-ucrt'
        id: host
        run: echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform != 'aarch64-mingw-ucrt'
        with:
          path: ${{ runner.temp }}/examples-bundle
          key: examples-bundle-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.ruby }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('examples/my_cool_app/Gemfile.lock', 'examples/native_app/Gemfile.lock', 'examples/nokogiri_app/Gemfile.lock', 'examples/nokogiri_app/.bundle/config') }}

      # What each app prints as its developer runs it, which its built app
      # must print too.
      - name: Run the examples with bundle exec
        if: matrix.platform != 'aarch64-mingw-ucrt'
        env:
          BUNDLE_PATH: ${{ runner.temp }}/examples-bundle
        run: |
          (cd examples/my_cool_app && bundle install)
          (cd examples/my_cool_app && bundle exec ruby exe/my_cool_app) | tee dist/my_cool_app.expected
          (cd test/fixtures/bundled_with && bundle install)
          (cd test/fixtures/bundled_with && bundle exec ruby exe/bundled_with) | tee dist/bundled_with.expected
          examples=native_app
          case "${{ matrix.platform }}" in arm64-darwin | x64-mingw-ucrt) examples="native_app nokogiri_app" ;; esac
          for example in $examples; do
            (cd "examples/$example" && bundle install)
            (cd "examples/$example" && bundle exec ruby main.rb) | tee "dist/$example.expected"
          done

      # The builder app Delivery runs fledge build --from inside (ADR 032;
      # doc/contributors/design/desktop-apps.md, "Building from a built
      # app"), on one platform of each operating system.
      - name: Build the app that builds apps, with build_tools and Fledge as a gem
        if: matrix.platform == 'arm64-darwin' || matrix.platform == 'x86_64-linux' || matrix.platform == 'x64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: .github/scripts/prepare-from.sh "$RUNNER_TEMP/from" "${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.tar.gz
            dist/*-${{ matrix.platform }}.zip
            dist/*-${{ matrix.platform }}.dmg
            dist/*-${{ matrix.platform }}-setup.exe
            dist/*-${{ matrix.platform }}.msix
            dist/*-${{ matrix.platform }}.AppImage
            dist/*-${{ matrix.platform }}.deb
            dist/*.expected
          if-no-files-found: error
          retention-days: 14

  build-x86_64-linux:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
            rust: ""
            mise: ruby
    steps: *build-steps

  build-aarch64-linux:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            rust: ""
            mise: ruby
    steps: *build-steps

  build-x64-mingw-ucrt:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # RubyInstaller's Ruby is a MinGW build, and rb-sys refuses to
          # build for it with Rust's MSVC target (Ferro's ci.yml), so
          # Windows takes the GNU host toolchain.
          - os: windows-latest
            platform: x64-mingw-ucrt
            rust: -x86_64-pc-windows-gnu
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2
    steps: *build-steps

  build-aarch64-mingw-ucrt:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows on ARM64 (ADR 035) builds what needs no gem compiled for
          # it: sqlite3 publishes no aarch64-mingw-ucrt build and its source
          # does not configure there, so no my_cool_app, gem-shaped probe,
          # or native_app.
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            rust: ""
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2
    steps: *build-steps

  # musl Linux's apps (ADR 017), built in Alpine with Ruby, as a developer
  # on Alpine builds them: hello, the parity and console probes, the
  # probe as a gem-shaped app's program, my_cool_app, whose sqlite3 is
  # precompiled for musl, windowed_app, with its AppImage, and programs.
  build-musl:
    name: Build (${{ matrix.platform }})
    needs: runtime-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes

      - name: Build the examples in Alpine, and run my_cool_app with bundle exec
        run: |
          cat > "$RUNNER_TEMP/build-apps.sh" <<'SH'
          set -eu
          .github/scripts/alpine-packages.sh apps
          git config --global --add safe.directory /fledge
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle")' /tmp/parity-bundle
          for app in examples/hello test/fixtures/parity test/fixtures/console /tmp/parity-bundle examples/my_cool_app examples/windowed_app examples/programs; do
            ruby -I lib exe/fledge build -o dist "$app"
          done
          (cd examples/my_cool_app && bundle install)
          (cd examples/my_cool_app && bundle exec ruby exe/my_cool_app) > dist/my_cool_app.expected
          cat dist/my_cool_app.expected
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -v "$RUNNER_TEMP:/scripts" -w /fledge -e FLEDGE_RUNTIME_DIR=/fledge/runtimes \
            -e BUNDLE_FROZEN "$ALPINE_RUBY" sh /scripts/build-apps.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.tar.gz
            dist/*-${{ matrix.platform }}.AppImage
            dist/*.expected
          if-no-files-found: error
          retention-days: 14

  # Delivery of native_app and nokogiri_app, on a fresh runner of each
  # platform, as Delivery runs the others.
  delivery-native-arm64-darwin:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
    steps: &delivery-native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run native_app as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NativeApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/native_app.expected")"

      - name: Run nokogiri_app as someone with no Ruby would
        if: matrix.platform == 'arm64-darwin'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NokogiriApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/nokogiri_app.expected")"

      - name: Run real_gems as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/RealGems-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/real_gems.expected")"

      - name: Run NativeApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NativeApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/native_app.expected" -Raw).TrimEnd()

      - name: Run RealGems.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/RealGems-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/real_gems.expected" -Raw).TrimEnd()

      - name: Run NokogiriApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NokogiriApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/nokogiri_app.expected" -Raw).TrimEnd()

  delivery-native-x86_64-linux:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-native-steps

  delivery-native-aarch64-linux:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-native-steps

  delivery-native-x64-mingw-ucrt:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: *delivery-native-steps

  # Delivery (Plan 001): each app on a fresh runner of its platform, with
  # nothing of Fledge but the archive and the script that checks it, and
  # no Ruby set up. Runners come with Rubies installed, so the script runs
  # the app with an empty PATH and checks that no ruby is on it, then
  # runs it in a clean and in a hostile environment
  # (.github/scripts/deliver.sh).
  delivery-arm64-darwin:
    name: Delivery (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            ruby-platform: arm64-darwin23
    steps: &delivery-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run hello as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.1.0 on ${{ matrix.ruby-platform }}"

      - name: Run my_cool_app as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/my_cool_app.expected")"

      # ADR 063: an app whose Gemfile.lock names a Bundler the runtime's
      # Ruby does not ship runs with it, as bundle exec did where it was
      # built.
      - name: Run bundled_with as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/BundledWith-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/bundled_with.expected")"

      # ADR 003 (doc/contributors/design/parity.md, "Console checks"):
      # the console probe in a terminal of its own, a
      # pseudo-terminal, ended by Ctrl-C typed into it and by a hangup,
      # must end as ruby main.rb does (.github/scripts/deliver-console.sh).
      - name: Interrupt the console probe in a terminal, as a person would
        run: .github/scripts/deliver-console.sh "$RUNNER_TEMP/delivered/Console-${{ matrix.platform }}.tar.gz"

      # ADR 016: the signed build, verified by Apple's codesign on a fresh
      # Mac that trusts the run's test certificate, and run
      # (.github/scripts/deliver-signed.sh).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'macOS'
        with:
          name: signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/signed

      - name: Verify and run the signed apps
        if: runner.os == 'macOS'
        run: >-
          .github/scripts/deliver-signed.sh "$RUNNER_TEMP/signed/Hello-arm64-darwin.tar.gz"
          "$RUNNER_TEMP/signed/Hello Window-arm64-darwin.tar.gz" "$RUNNER_TEMP/signed/Hello Window-arm64-darwin.dmg"
          "$RUNNER_TEMP/signed/certificate.pem"

  delivery-x86_64-linux:
    name: Delivery (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
            ruby-platform: x86_64-linux
    steps: *delivery-steps

  delivery-aarch64-linux:
    name: Delivery (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-platform: aarch64-linux
    steps: *delivery-steps

  # Delivery of the windowed app (ADR 037, ADR 008), on a fresh runner of each
  # platform: on macOS its .app bundle must pass codesign --verify --strict
  # --deep, plutil must read its identity, and it must run through open -W,
  # as Finder starts it, and through its own program; on Linux
  # desktop-file-validate must accept its desktop entry, and its icons and
  # program must be there and run (.github/scripts/deliver-windowed.sh).
  # Then its installer (ADR 009): on macOS the disk image, attached,
  # verified, and dragged to an Applications folder, with the app run from
  # both (deliver-dmg.sh); on Linux the AppImage, mounted with FUSE, and
  # extracted with APPIMAGE_EXTRACT_AND_RUN=1, where there is none, run
  # each way and in a hostile environment, and unpacked by
  # --appimage-extract (deliver-appimage.sh). And examples/programs (ADR
  # 024): a windowed and a console program from one folder, with one
  # project and one Ruby, sharing one save (deliver-programs.sh).
  delivery-windowed-arm64-darwin:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
    steps: &delivery-windowed-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      # freedesktop.org's validator, pinned to Ubuntu 24.04's build of it.
      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Run Shared Save and shared-save from one folder, with one save
        run: .github/scripts/deliver-programs.sh "$RUNNER_TEMP/delivered/Shared Save-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.dmg"

      # FUSE 3, which desktops ship and the runner's image may not,
      # pinned to Ubuntu 24.04's build: the AppImage's runtime mounts with
      # its fusermount3.
      - name: Install FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fuse3=3.14.0-5build1
          ls -l /dev/fuse

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.AppImage" fuse

  delivery-windowed-x86_64-linux:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-windowed-steps

  delivery-windowed-aarch64-linux:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-windowed-steps

  # Delivery again, in Debian 13 containers with no Ruby installed at all
  # (deliver.sh --no-ruby-installed checks), glibc 2.41, and no CA
  # certificates package.
  delivery-debian-x86_64-linux:
    name: Delivery (${{ matrix.platform }}, debian:trixie-slim)
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    container: debian:trixie-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &delivery-debian-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Run hello on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/Hello-${{ matrix.platform }}.tar.gz"
          "delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.1.0 on ${{ matrix.platform }}" --no-ruby-installed

      - name: Run my_cool_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat delivered/my_cool_app.expected)" --no-ruby-installed

      # A container has no FUSE, so the AppImage says so, and extracts
      # itself and runs when asked to, as AppImage documents.
      - name: Run Hello Window as an AppImage on a computer with no FUSE
        run: .github/scripts/deliver-appimage.sh "delivered/Hello Window-${{ matrix.platform }}.AppImage" extract

      # native_app, compiled on Ubuntu 24.04, on Debian 13's newer glibc.
      - name: Run native_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/NativeApp-${{ matrix.platform }}.tar.gz"
          "delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat delivered/native_app.expected)" --no-ruby-installed

  delivery-debian-aarch64-linux:
    name: Delivery (${{ matrix.platform }}, debian:trixie-slim)
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    container: debian:trixie-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-debian-steps

  # Delivery of the windowed app's .deb (ADR 021), in a fresh Debian and a
  # fresh Ubuntu container of each architecture, with no Ruby installed:
  # apt installs it as a person would, its dependency on glibc 2.39 met by
  # Ubuntu 24.04's, which is the oldest there is, and by Debian 13's; the
  # app runs from /usr/lib, as root and as an ordinary user; and removing
  # the package leaves nothing of it (.github/scripts/deliver-deb.sh).
  # First, examples/system_library (ADR 030) runs from its archive and
  # its AppImage without libpng, which its gem links, and says so; then
  # apt installs its .deb, which depends on libpng's package, and it runs
  # (.github/scripts/deliver-system-library.sh).
  delivery-deb-x86_64-linux:
    name: Delivery of a .deb (${{ matrix.platform }}, ${{ matrix.image }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie-slim", "ubuntu:24.04"]
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &delivery-deb-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      # ADR 030, before apt brings anything else: the app whose gem links
      # libpng names it, and exits with 72, from its archive and its
      # AppImage, until apt installs its .deb, which brings libpng.
      - name: Run System Library without libpng, then install its .deb with apt
        run: |
          apt-get update -qq
          .github/scripts/deliver-system-library.sh delivered

      # freedesktop.org's validator, which a desktop has.
      - name: Install desktop-file-validate
        run: |
          apt-get update -qq
          apt-get install -y -qq desktop-file-utils

      - name: Install Hello Window from its .deb with apt, run it, and remove it
        run: .github/scripts/deliver-deb.sh "delivered/Hello Window-${{ matrix.platform }}.deb"

  delivery-deb-aarch64-linux:
    name: Delivery of a .deb (${{ matrix.platform }}, ${{ matrix.image }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie-slim", "ubuntu:24.04"]
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-deb-steps

  # Delivery on musl Linux (ADR 017): each app in a bare Alpine container,
  # with no Ruby at all, as deliver.sh --no-ruby-installed checks: hello
  # and my_cool_app, the console probe interrupted in a terminal, and the
  # windowed app, its desktop entry, and its AppImage, which has no FUSE
  # in a container, so says so and runs extracted.
  delivery-musl:
    name: Delivery (${{ matrix.platform }}, alpine:3.24)
    needs: build-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Run hello, my_cool_app, the console probe, windowed_app, and programs on Alpine with no Ruby installed
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cat > "$RUNNER_TEMP/deliver-all.sh" <<'SH'
          set -eu
          .github/scripts/alpine-packages.sh deliver
          d=delivered
          .github/scripts/deliver.sh "$d/Hello-$PLATFORM.tar.gz" "$d/Parity-$PLATFORM.tar.gz" "Hello from Ruby 4.1.0 on $PLATFORM" --no-ruby-installed
          .github/scripts/deliver.sh "$d/MyCoolApp-$PLATFORM.tar.gz" "$d/ParityBundle-$PLATFORM.tar.gz" "$(cat "$d/my_cool_app.expected")" --no-ruby-installed
          .github/scripts/deliver-console.sh "$d/Console-$PLATFORM.tar.gz"
          .github/scripts/deliver-windowed.sh "$d/Hello Window-$PLATFORM.tar.gz"
          .github/scripts/deliver-appimage.sh "$d/Hello Window-$PLATFORM.AppImage" extract
          .github/scripts/deliver-programs.sh "$d/Shared Save-$PLATFORM.tar.gz"
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/scripts" -w /work -e PLATFORM "$ALPINE" sh /scripts/deliver-all.sh

  # Delivery on a fresh Windows runner, with nothing of Fledge but the
  # .zip and the script that checks it, and no Ruby set up: the runner's
  # own Rubies and MSYS2 are kept off the app's PATH, and the script runs
  # Hello.exe and MyCoolApp.exe from another drive, under a folder name
  # outside ASCII, in a clean and in a hostile environment, and checks
  # the version information each carries (.github/scripts/deliver.ps1).
  delivery-windows-x64-mingw-ucrt:
    name: Delivery (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    env:
      PLATFORM: ${{ matrix.platform }}
    steps: &delivery-windows-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run Hello.exe as someone with no Ruby would
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/Parity-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected "Hello from Ruby 4.1.0 on $env:PLATFORM"

      - name: Run MyCoolApp.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/MyCoolApp-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/my_cool_app.expected" -Raw).TrimEnd()

      # ADR 063, as on macOS and Linux.
      - name: Run BundledWith.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/BundledWith-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/bundled_with.expected" -Raw).TrimEnd()

      # ADR 003 (doc/contributors/design/parity.md, "Console checks"):
      # the console probe in a console of its own, ended by
      # Ctrl-C on code pages 65001 and 437 and by its window closing, and
      # the windowed app typed into a console, which gets none, each as
      # ruby.exe and rubyw.exe do (.github/scripts/deliver-console.ps1).
      - name: Interrupt the console probe in a console, close it, and start the windowed app from one
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-console.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Console-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.zip"

      # The windowed app (ADR 037, ADR 008): a GUI program with its version
      # information and icon, started as Explorer starts it, with no
      # console and its identifier as its AppUserModelID
      # (.github/scripts/deliver-windowed.ps1).
      - name: Start Hello Window.exe as Explorer would
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.zip"

      # examples/programs (ADR 024): a GUI and a console program from one
      # folder, with one project and one Ruby, sharing one save
      # (.github/scripts/deliver-programs.ps1).
      - name: Run Shared Save.exe and shared-save.exe from one folder, with one save
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-programs.ps1 -Archive "$env:RUNNER_TEMP/delivered/Shared Save-$env:PLATFORM.zip"

      # The NSIS installer (ADR 009): installed silently for this person,
      # its Start menu shortcut's AppUserModelID read back and matched to
      # the app's own, the app started from it, installed again over
      # itself, and uninstalled (.github/scripts/deliver-installer.ps1).
      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM-setup.exe"

      # ADR 016: the signed build, refused by signtool on a fresh Windows
      # until it trusts the run's test certificate, then verified, every
      # PE file, the setup program, and the uninstaller it installs
      # (.github/scripts/deliver-signed.ps1).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/signed

      # The MSIX package (Fledge::Msix): the unsigned one, as the
      # Microsoft Store takes it, read and refused; the ones --sign and
      # --sign-command signed, refused until the run's test certificate
      # is trusted, then installed, listed in the Start menu, started
      # through their AppUserModelID with the package's identity, and
      # removed (.github/scripts/deliver-msix.ps1). The certificate
      # leaves TrustedPeople after each, so the step after it still sees
      # a Windows that trusts it nowhere.
      - name: Install Hello Window's MSIX packages, run them, and remove them
        shell: pwsh
        run: |
          foreach ($signed in "signed", "signed/command") {
            pwsh -NoProfile -File .github/scripts/deliver-msix.ps1 `
              -Package "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.msix" `
              -Signed "$env:RUNNER_TEMP/$signed/Hello Window-$env:PLATFORM.msix" `
              -Certificate "$env:RUNNER_TEMP/signed/certificate.cer"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Verify, install, and run the signed apps
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-signed.ps1
          -Hello "$env:RUNNER_TEMP/signed/Hello-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/signed/Hello Window-$env:PLATFORM.zip"
          -Installer "$env:RUNNER_TEMP/signed/Hello Window-$env:PLATFORM-setup.exe"
          -Certificate "$env:RUNNER_TEMP/signed/certificate.cer"

      # ADR 051: the apps --sign-command signed with signtool, verified
      # the same way, with the certificate the step above trusted.
      - name: Verify, install, and run the apps signed through a signing command
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-signed.ps1
          -Hello "$env:RUNNER_TEMP/signed/command/Hello-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/signed/command/Hello Window-$env:PLATFORM.zip"
          -Installer "$env:RUNNER_TEMP/signed/command/Hello Window-$env:PLATFORM-setup.exe"
          -Certificate "$env:RUNNER_TEMP/signed/certificate.cer" -Trusted

  delivery-windows-aarch64-mingw-ucrt:
    name: Delivery (${{ matrix.platform }})
    needs: build-aarch64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Natively on Windows 11 on ARM64 (ADR 035).
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    env:
      PLATFORM: ${{ matrix.platform }}
    steps: *delivery-windows-steps

  # Delivery of fledge build --from (ADR 032): a console app built with
  # build_tools and Fledge as a gem, unpacked in a folder named outside
  # ASCII on a fresh runner with no Ruby and no runtime, runs its own
  # fledge build --from on a windowed project with file_associations and
  # installers; what it wrote runs, its identity read back with the
  # system's tools, and it refuses a project with a Gemfile, an app of
  # another release or platform, and a folder Fledge did not build. One
  # job for each operating system's family; the other platforms run the
  # same code paths.
  delivery-from-arm64-darwin:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
    steps: &delivery-from-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            test/fixtures/from
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      # What an AppImage needs that no app may carry: squashfs-tools is
      # GPL-2.0 (ADR 032; doc/contributors/design/desktop-apps.md,
      # "Building from a built app"). Pinned to Ubuntu 24.04's build.
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      - name: Build a windowed app with the builder's own fledge build --from, with no Ruby, and run it
        if: runner.os != 'Windows'
        run: .github/scripts/deliver-from.sh "${{ matrix.platform }}" "$RUNNER_TEMP/delivered/Builder-${{ matrix.platform }}.tar.gz" "$PWD/test/fixtures/from/game"

      - name: Build a windowed app with the builder's own fledge build --from, with no Ruby, and run and install it
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-from.ps1 -Platform ${{ matrix.platform }}
          -Archive "$env:RUNNER_TEMP/delivered/Builder-${{ matrix.platform }}.zip"
          -Game "$PWD\test\fixtures\from\game"

  delivery-from-x86_64-linux:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-from-steps

  delivery-from-x64-mingw-ucrt:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: *delivery-from-steps

  # The license audit's own checks on each runtime this run built: that
  # the release assets are the very notices the runtime carries, that a
  # second audit of the unpacked archive agrees with the build's, that the
  # SPDX project's own tool accepts the SBOM, and that the audit still
  # fails when a GPL library or a GPL gem is slipped into the runtime
  # (.github/scripts/plant_gpl.rb). The audit reads compiled files with
  # LLVM's tools, which read every format, so one Linux runner checks
  # every platform.
  licenses:
    name: Licenses (${{ matrix.platform }})
    needs: [runtime, runtime-musl, runtime-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64-darwin, x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl, x64-mingw-ucrt, aarch64-mingw-ucrt, ios, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      - name: Unpack the runtime and check its release assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM".tar.gz -C "$RUNNER_TEMP/tree"
          tree=$(echo "$RUNNER_TEMP"/tree/fledge-runtime-*)
          echo "TREE=$tree" >> "$GITHUB_ENV"
          cmp "$tree/notices/sbom.spdx.json" "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM".spdx.json
          cmp "$tree/notices/NOTICES.txt" "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM"-NOTICES.txt
          # The runtime's notices/sources/ holds the same folders, byte for
          # byte, as the release's source bundle, but its README.
          case "$PLATFORM" in
            *-linux | *-linux-musl | *-mingw-ucrt)
              mkdir -p "$RUNNER_TEMP/bundle"
              tar -xzvf "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM"-lgpl-sources.tar.gz -C "$RUNNER_TEMP/bundle"
              bundle=$(echo "$RUNNER_TEMP"/bundle/fledge-runtime-*-lgpl-sources)
              rm "$bundle/README.txt"
              diff -r "$bundle" "$tree/notices/sources"
              ;;
            *)
              if ls "$RUNNER_TEMP"/runtimes/*-lgpl-sources.tar.gz 2>/dev/null; then echo "::error::$PLATFORM ships no LGPL library"; exit 1; fi
              if [ -e "$tree/notices/sources" ]; then echo "::error::$PLATFORM's runtime holds notices/sources/, but ships nothing that asks for its source"; exit 1; fi
              ;;
          esac

      - name: Audit the unpacked runtime
        run: ruby tasks/license_audit.rb --platform "${{ matrix.platform }}" --tree "$TREE"

      - name: Validate the SBOM with the SPDX tools
        run: pipx run --spec spdx-tools==0.8.3 pyspdxtools -i "$TREE/notices/sbom.spdx.json"

      - name: Fail the audit with a GPL library and a GPL gem slipped in
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          extension=$(ruby .github/scripts/plant_gpl.rb "$PLATFORM" "$TREE")
          if ruby tasks/license_audit.rb --platform "$PLATFORM" --tree "$TREE" > "$RUNNER_TEMP/tampered.txt"; then
            cat "$RUNNER_TEMP/tampered.txt"
            echo "::error::the audit passed a runtime with a GPL library and a GPL gem in it"
            exit 1
          fi
          grep -F "VIOLATION: unlisted-binary: $extension:" "$RUNNER_TEMP/tampered.txt"
          grep -F "gem-copyleft-1.0.0 is GPL-3.0-only, which the policy does not allow" "$RUNNER_TEMP/tampered.txt"

  # The same audit of the whole tree each runtime comes from, rv-ruby's or
  # RubyInstaller's, bundled gems, bin/ruby, and all: it must find exactly
  # what .github/license-expectations/ lists, which is what the runtime
  # builder removes (rv-ruby's bin/ruby, which links libxcrypt
  # statically, and its libcrypt.a; nkf's Java sources; MSYS2's keyring).
  # It shows the audit catching the real thing, not only planted files.
  licenses-upstream:
    name: Licenses of the whole upstream tree (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64-darwin, x86_64-linux, aarch64-linux, x64-mingw-ucrt, aarch64-mingw-ucrt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: upstream-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      - name: Download and unpack the pinned upstream Ruby
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb ruby platforms "$PLATFORM")
          mkdir -p "$RUNNER_TEMP/upstream"
          case "$archive" in
            *.7z) 7z x -y -bd -o"$RUNNER_TEMP/upstream" "$archive" > /dev/null ;;
            *) tar -xzf "$archive" -C "$RUNNER_TEMP/upstream" ;;
          esac
          version=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("ruby", "version")')
          tree=$(find "$RUNNER_TEMP/upstream" -mindepth 1 -maxdepth 3 -type d \( -name "$version" -o -name 'rubyinstaller-*' \) | head -n 1)
          echo "TREE=$tree" >> "$GITHUB_ENV"

      - name: Audit the whole tree
        run: >-
          ruby tasks/license_audit.rb --platform "${{ matrix.platform }}" --tree "$TREE"
          --expect ".github/license-expectations/${{ matrix.platform }}.yml"

  # doc/licensing.md, the page that tells app developers what ships and
  # what it asks of them, is generated from the audit of every
  # platform's runtime (tasks/licensing_page.rb); it fails here when it
  # no longer matches them.
  licensing-page:
    name: Licensing page is current
    needs: [runtime, runtime-musl, runtime-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      - name: Compare doc/licensing.md with the runtimes
        run: ruby tasks/licensing_page.rb --check "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: licensing-page
          path: ${{ runner.temp }}/runtimes/licensing.md
          retention-days: 14

  # Whoever receives a Linux app may replace lib/libcrypt.so.2 (LGPL-2.1,
  # section 6(b)), as doc/licensing.md tells app developers. The built
  # hello, with libxcrypt rebuilt with only its strong hashes from the
  # source the app carries in notices/sources/libxcrypt/, and with
  # musl's crypt in its place, must load each and behave as each does
  # (.github/scripts/replace-libcrypt.sh), which also measures what
  # String#crypt loses without libxcrypt.
  replace-libcrypt-x86_64-linux:
    name: Replace libcrypt (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &replace-libcrypt-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Replace lib/libcrypt.so.2 and run the app with each replacement
        run: |
          tar -xzf "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP"
          # Assigned first, so a missing file or a download that fails stops
          # the step here: bash -e ignores a failed $(...) inside another
          # command's arguments. libxcrypt's source is the one the app
          # itself carries, so the replacement is built as a person who
          # received only the app would build it (LGPL-2.1, section 6(a)).
          xcrypt=$(ls "$RUNNER_TEMP/Hello-${{ matrix.platform }}"/notices/sources/libxcrypt/libxcrypt-*.tar.xz)
          musl=$(ruby .github/scripts/fetch_pin.rb replaceability musl)
          sh .github/scripts/replace-libcrypt.sh "$RUNNER_TEMP/Hello-${{ matrix.platform }}" Hello "$xcrypt" "$musl"

  replace-libcrypt-aarch64-linux:
    name: Replace libcrypt (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *replace-libcrypt-steps

  # Another GNU MP for Windows, cross-built with the pinned llvm-mingw
  # against the UCRT, for Replace GMP to swap in.
  gmp-replacement:
    name: Build a replacement libgmp-10.dll (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-mingw-ucrt
            triple: x86_64-w64-mingw32
          - platform: aarch64-mingw-ucrt
            triple: aarch64-w64-mingw32
    env:
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Cross-build GNU MP as libgmp-10.dll
        run: |
          toolchain="$RUNNER_TEMP/llvm-mingw"
          source="$RUNNER_TEMP/gmp"
          mkdir -p "$toolchain" "$source" "$RUNNER_TEMP/gmp-dll"
          llvm_mingw=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          gmp=$(ruby .github/scripts/fetch_pin.rb replaceability gmp)
          tar -xJf "$llvm_mingw" -C "$toolchain" --strip-components=1
          tar -xJf "$gmp" -C "$source" --strip-components=1
          export PATH="$toolchain/bin:$PATH"
          cd "$source"
          # GMP 6.2.1's config.sub predates aarch64-w64-mingw32; llvm-mingw's
          # own autoconf scripts know it.
          cp /usr/share/misc/config.sub configfsf.sub 2>/dev/null || true
          ./configure --quiet --host="$TRIPLE" CC="$TRIPLE-clang" CC_FOR_BUILD=cc \
            --enable-shared --disable-static --disable-assembly
          make --quiet -j"$(nproc)" > /dev/null
          cp .libs/libgmp-10.dll "$RUNNER_TEMP/gmp-dll/"
          "$TRIPLE-objdump" -p .libs/libgmp-10.dll | grep 'DLL Name'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmp-replacement-${{ matrix.platform }}
          path: ${{ runner.temp }}/gmp-dll/libgmp-10.dll
          if-no-files-found: error
          retention-days: 14

  # Whoever receives a Windows app may replace
  # ruby\bin\ruby_builtin_dlls\libgmp-10.dll (LGPL-3.0, section 4(d)(1)),
  # as doc/licensing.md tells app developers: the built hello must load
  # the replacement (Integer::GMP_VERSION changes) and compute the same
  # big numbers (.github/scripts/replace-gmp.ps1).
  replace-gmp-x64-mingw-ucrt:
    name: Replace GMP (${{ matrix.platform }})
    needs: [build-x64-mingw-ucrt, gmp-replacement]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: &replace-gmp-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gmp-replacement-${{ matrix.platform }}
          path: ${{ runner.temp }}/gmp-dll

      - name: Replace libgmp-10.dll and run the app
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/replace-gmp.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.zip"
          -Dll "$env:RUNNER_TEMP/gmp-dll/libgmp-10.dll" -Version 6.2.1

  replace-gmp-aarch64-mingw-ucrt:
    name: Replace GMP (${{ matrix.platform }})
    needs: [build-aarch64-mingw-ucrt, gmp-replacement]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    steps: *replace-gmp-steps
