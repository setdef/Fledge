# Basket's name, version, icon, and license, as each system shows them in
# a Dock, a Start menu, a launcher, an installer, and an app store. The
# Gemfile lists etcetera, which finds the folder each system keeps an
# app's data in, and fiddle, which each system's screen reaches its
# widgets with.

name: Basket
# What iOS and Android know it by (doc/contributors/design/phone-projects.md).
identifier: com.setdef.fledge.Basket
# Its Ruby draws the screen in windows of its own, so a desktop builds
# it as a windowed app; a phone runs its Ruby on the main thread, where
# the widgets are made, as it runs every app's
# (doc/contributors/design/phone-widgets.md).
kind: windowed
version: "1.0.0"
publisher: setdef
copyright: © 2026 setdef
description: Keeps a shopping list
long_description: |
  Basket keeps a shopping list. Type an item and add it, and remove it
  once it is in the cart; the list is still there when you open Basket
  again.

  Each system draws Basket with that system's widgets: UIKit on iOS,
  Android's views on Android, GTK 4 with libadwaita on Linux, and WinUI 3
  on Windows, or Win32's common controls where Windows has no WinUI. It
  is an example of Fledge, which makes an app of its Ruby for each of
  them.
homepage: https://github.com/setdef/Fledge/tree/trunk/examples/basket
# The Windows setup program shows it, and a .deb installs it.
license_file: LICENSE.txt
# The files in icons/, which icons/render.rb draws from icons/icon.svg.
icon: icons/icon
# Every installer a desktop makes: a disk image, a setup program, an
# AppImage, a .deb, and an MSIX package.
installers: [dmg, nsis, appimage, deb, msix]
linux:
  # Its Ruby opens GTK 4 and libadwaita by name (lib/basket/gtk.rb), as
  # no compiled file does, so a .deb asks apt for the packages that
  # provide libgtk-4.so.1 and libadwaita-1.so.0.
  deb_depends: [libgtk-4-1, libadwaita-1-0]
windows:
  # A test identity for the MSIX package. A submission to the Microsoft
  # Store replaces both with the identity Partner Center assigns.
  msix_name: setdef.Basket
  msix_publisher: CN=setdef
  # Its Ruby draws with WinUI 3 where Microsoft's Windows App Runtime is
  # on the computer (lib/basket/winui.rb), so its package depends on that
  # framework package, which the Store installs with it.
  # The setup program and the .zip ask for nothing, and Basket draws with
  # Win32 on a computer that lacks the runtime.
  msix_dependencies:
    - name: Microsoft.WindowsAppRuntime.2
      publisher: CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US
      min_version: 2.7.0.0
