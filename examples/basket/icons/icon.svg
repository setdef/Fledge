      <path d="M560 360 l76 18 M560 420 l76 18" stroke="#B9782F" stroke-width="14" stroke-linecap="round"/>
    </g>
    <!-- The handle. -->
    <path d="M334 470 C330 214 694 214 690 470" fill="none" stroke="#FFF1D6" stroke-width="46" stroke-linecap="round"/>
    <!-- The body and its weave. -->
    <path d="M284 506 L740 506 L688 790 Q684 812 662 812 L362 812 Q340 812 336 790 Z" fill="#FFF1D6"/>
    <g clip-path="url(#body-clip)" stroke="#D9B677" stroke-width="20" stroke-linecap="butt" fill="none">
