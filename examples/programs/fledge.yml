# One project, two programs (ADR 024): a windowed one, Shared Save, and
# a console one, shared-save, that open the same save, as a game's GUI
# and command line might, so a player can quit one and go on in the
# other. They ship in one folder, Shared Save-PLATFORM, with one runtime,
# one copy of this project, and one set of gems. The project keeps the
# name of that folder, its version, and its publisher; each program has
# its own path and kind, and the windowed one its identifier. The
# windowed one takes the project's name, and the console one its file's.
# Like hello, it sits inside Fledge's own gem, and this file makes its
# folder a project's root (ADR 005).
name: Shared Save
version: "1.0.0"
publisher: setdef
programs:
  - path: window.rb
    kind: windowed
    identifier: com.setdef.fledge.SharedSave
  - path: bin/shared-save
