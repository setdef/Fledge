# The gems a release would publish on RubyGems.org (ADR 030), built from
# the runtimes its pins name and installed on a fresh runner of every
# platform, offline, before anyone pushes them. Nothing here pushes a
# gem: from 1.0.0 a person downloads this run's gems artifact and pushes
# each gem by hand (doc/contributors/handoff.md; AGENTS.md, Releasing).
#
# One job builds every gem with tasks/release_gems.rb from the runtimes
# of a CI run, or of a published release, and keeps them, with their
# SHA256SUMS, as the run's gems artifact. Then on each desktop platform
# tasks/gems_check.rb installs fledge and its runtime gem with RubyGems,
# and with Bundler from a vendor/cache, into empty gem folders, and
# builds and runs hello with every download refused; on a Mac and on
# Linux it installs fledge with a phone's runtime gem and writes hello's
# project for iOS and Android the same way.
#
# A release runs it by hand once its pin commit's short CI has passed
# (doc/contributors/handoff.md, How to release): with the pin commit as
# ref and the parent's CI run, whose runtimes the pins name (ADR 014),
# so the gems of a release are built from the very runtimes its pins
# name, and checked, before anyone pushes them. It is not a job of
# ci.yml: such a job would be skipped on every other commit, and the
# release commit's run may skip none (ADR 014, section 5). Run it with a
# tag instead of a run to build and check the gems of a published
# release's assets, from a ref whose version and pins are that
# release's.

name: Gems

on:
  workflow_call:
    inputs:
      ref:
        description: The commit the fledge gem is built from and the checks run at (default, the commit this runs on)
        required: false
        default: ""
        type: string
      run:
        description: The CI run whose runtime artifacts the gems carry
        required: false
        default: ""
        type: string
      tag:
        description: Or the release whose assets the gems carry, such as v0.4.0
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: The commit the fledge gem is built from and the checks run at (default, the commit this runs on)
        required: false
        default: ""
        type: string
      run:
        description: The CI run whose runtime artifacts the gems carry
        required: false
        default: ""
        type: string
      tag:
        description: Or the release whose assets the gems carry, such as v0.4.0
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the gems
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Downloading a CI run's runtimes, or a release's assets.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.run != ''
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}

      - name: Download the release's assets
        if: inputs.run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "::error::Name a CI run or a release tag"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" --pattern 'fledge-runtime-*'

      # Every gem's assets must be the ones lib/fledge/SHA256SUMS pins, or
      # nothing is built.
      - name: Build the gems from the pinned runtimes
        run: |
          ruby tasks/release_gems.rb "$RUNNER_TEMP/assets" "$RUNNER_TEMP/gems"
          cat "$RUNNER_TEMP/gems/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gems
          path: ${{ runner.temp }}/gems
          if-no-files-found: error
          retention-days: 30

  installed:
    name: Install the gems, and build hello (${{ matrix.phone || matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
          - os: macos-26
            platform: arm64-darwin
            phone: ios
          - os: ubuntu-24.04
            platform: x86_64-linux
            phone: android
    steps:
      # The check and hello; fledge itself comes from the gems.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            examples/hello
            lib
            tasks/gems_check.rb
            mise.toml
            runtime/sources.yml
          sparse-checkout-cone-mode: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      # fledge build ios runs XcodeGen, as installed.yml installs it.
      - name: Select the pinned Xcode, and install XcodeGen, pinned by SHA-256
        if: matrix.phone == 'ios'
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          url=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcodegen", "url")')
          sha256=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcodegen", "sha256")')
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "$url"
          echo "$sha256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gems
          path: ${{ runner.temp }}/gems

      - name: Install the gems offline, and build hello from them
        env:
          PHONE: ${{ matrix.phone }}
        run: ruby tasks/gems_check.rb "$RUNNER_TEMP/gems" ${PHONE:+"$PHONE"}

  # musl Linux (ADR 017), in Alpine with Ruby, as a developer on Alpine
  # installs the gems.
  installed-musl:
    name: Install the gems, and build hello (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            .github/scripts/alpine-packages.sh
            examples/hello
            lib
            tasks/gems_check.rb
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gems
          path: ${{ runner.temp }}/gems

      - name: Install the gems offline in Alpine, and build hello from them
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP/gems:/gems" -w /work "$ALPINE_RUBY"
          sh -c '.github/scripts/alpine-packages.sh apps && ruby tasks/gems_check.rb /gems'
