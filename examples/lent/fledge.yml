# A windowed app whose window is a web view: on macOS WebKit, on Windows
# Microsoft Edge's WebView2, and on Linux WebKitGTK, each the system's
# own, which the app does not carry. Its icon is the bird of Fledge, as
# icons/ holds it for each system (and tokra.conf.json names a PNG of it
# for the window). It ships as an archive alone: Focus Timer and Markdown
# Preview show the installers.
#
# On Linux, Tokra's library links WebKitGTK 4.1 and the GTK 3, libsoup
# 3, Pango, and cairo it is built on, and libxdo, which the desktop's
# distribution provides and no gem carries, so the app names them as the
# distribution's (doc/gems.md, "A gem that links a library from the Linux
# distribution"). On Debian and Ubuntu they come with the packages
# libwebkit2gtk-4.1-0 and libxdo3; on a computer without them, Lent says
# which library it lacks and exits with status 72. Windows 11 has
# WebView2, and the gem carries the DLL that loads it.
name: Lent
kind: windowed
identifier: com.setdef.fledge.Lent
version: "1.0.0"
publisher: setdef
copyright: © 2026 setdef
description: Keeps a list of the things you have lent, and to whom
long_description: |
  Lent keeps a list of the things you have lent out: what, to whom,
  since when, and a note. When a thing comes back, mark it returned.

  The list shows what is still out, longest first, with how many days
  each has been away.
homepage: https://github.com/setdef/Fledge
license_file: LICENSE.txt
icon: icons/icon
installers: []
linux:
  system_libraries: [libcairo.so.2, libcairo-gobject.so.2, libgdk-3.so.0, libgdk_pixbuf-2.0.so.0, libgio-2.0.so.0,
    libgtk-3.so.0, libjavascriptcoregtk-4.1.so.0, libpango-1.0.so.0, libsoup-3.0.so.0, libwebkit2gtk-4.1.so.0,
    libxdo.so.3]
