# cmake_phone is a lone script with a gem whose extconf.rb runs CMake to
# build a C++ library, and then mkmf to build the C extension that links
# it (doc/contributors/design/phone-projects.md, "CMake toolchain files").
# It sits inside Fledge's own gem, so without this file
# fledge build would take Fledge's Gemfile for its own. The
# identifier is what iOS and Android know it by (ADR 012).
name: CmakePhone
identifier: com.setdef.fledge.CmakePhone

# On Android, a host of its own, as a framework that owns startup
# ships one, which loads the native libraries a host may name in a
# fixed list (host/android).
android:
  host: host/android
