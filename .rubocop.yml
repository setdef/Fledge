inherit_from:
  - ./vendor/goodcop/base.yml

# The cops for the two kinds of Ruby this repository has besides lib/:
# Minitest tests and Rake tasks.
plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: "4.0"
  Exclude:
    # Build staging directory
    - "tmp/**/*"
    # What fledge build writes
    - "dist/**/*"
# RDoc mis-parses endless methods: the methods after one lose their comments
# and visibility (doc/contributors/documentation_style.md, section 4). Every
# file RDoc reads uses def ... end.
Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: disallow
  Include:
    - "lib/**/*.rb"
    - "exe/**/*"
    - "examples/**/*.rb"
