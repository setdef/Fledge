# The trial of ADR 012, section 10, on the experiment/ios-archive
# branch: only the Mobile apps (iOS) job, archiving each app unsigned
# and checking the archive, with the runtimes of trunk's run
# 42440596461 (ec4b920), since the change touches no runtime.
name: CI
on:
  push:
    branches:
      - experiment/ios-archive
permissions:
  contents: read
  actions: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: 'false'
  BUNDLE_FROZEN: 'true'
  RUNTIMES_RUN: '42440596461'
jobs:
  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad)
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes
          cmake --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: mobile-parity-downloads-ios-${{ hashFiles('runtime/sources.yml') }}

      # XcodeGen writes each app's Xcode project in fledge build ios, as a
      # developer installs it; pinned by SHA-256.
      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      # The runtime of this Mac, whose Ruby runs mkmf to compile a gem's
      # extension for the phone (ADR 022).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - name: Build the apps with fledge build ios, and run them in the iOS Simulator
        run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mobile-apps-ios
          path: |
            tmp/mobile-parity/ios/*.ndjson
            tmp/mobile-parity/ios/*.log
            tmp/mobile-parity/ios/*.ips
          retention-days: 14
