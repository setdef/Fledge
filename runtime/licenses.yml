        evidence: "squashfuse 0.5.2"

  - id: zstd
    name: Zstandard (libzstd), which decompresses the AppImage's file system, linked into the AppImage runtime
    version: 1.5.6
    license: BSD-3-Clause OR GPL-2.0-only
    kind: program
    download: https://github.com/facebook/zstd/releases/tag/v1.5.6
    notice: zstd
    ships: linked into tools/appimage-runtime
    platforms: [x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl]
    embedded:
      - files: [tools/appimage-runtime]
        evidence: "1.5.6"

  - id: zlib-appimage
    name: zlib, linked into the AppImage runtime
    version: 1.3.1
    license: Zlib
    kind: program
    download: https://github.com/madler/zlib/releases/tag/v1.3.1
