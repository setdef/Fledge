# Experiment only (experiment/app-metadata), never for trunk: Plan 003's
# stories "A Linux build takes the icon sizes a developer has", "What an
# app says about itself", "A macOS build number", and "A license text
# with the app", on every platform they touch. examples/windowed_app is
# built on each, and a fresh runner reads each new value back with the
# system's own tool, through the Delivery scripts ci.yml runs. The
# runtimes are trunk's, from CI run RUN at 0160837, whose launchers this
# branch does not change.

name: app-metadata

on:
  push:
    branches: ["experiment/app-metadata"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RUN: "42089720531"
  MISE_RUBY_COMPILE: "false"
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: ubuntu-24.04, platform: x86_64-linux-musl }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows' && !endsWith(matrix.platform, '-musl')
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - name: Install mksquashfs and desktop-file-validate
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1 desktop-file-utils

      - name: Build windowed_app
        if: "!endsWith(matrix.platform, '-musl')"
        env:
          FLEDGE_RUNTIME_DIR: ${{ github.workspace }}/runtimes
        run: ruby -I lib exe/fledge build -o dist examples/windowed_app

      - name: Build windowed_app with three icon sizes, and with none
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-musl')
        env:
          FLEDGE_RUNTIME_DIR: ${{ github.workspace }}/runtimes
        run: |
          mkdir "$RUNNER_TEMP/icon-sizes"
          .github/scripts/check-icon-sizes.sh "$RUNNER_TEMP/icon-sizes"

      - name: Build windowed_app in Alpine
        if: endsWith(matrix.platform, '-musl')
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e FLEDGE_RUNTIME_DIR=/fledge/runtimes "$ALPINE_RUBY"
          sh -c '.github/scripts/alpine-packages.sh apps && ruby -I lib exe/fledge build -o dist examples/windowed_app'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  deliver:
    name: deliver (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: ubuntu-24.04, platform: x86_64-linux-musl }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Install desktop-file-validate
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        if: runner.os != 'Windows' && !endsWith(matrix.platform, '-musl')
        run: .github/scripts/deliver-windowed.sh "$PWD/delivered/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Start Hello Window on Alpine with no Ruby installed
        if: endsWith(matrix.platform, '-musl')
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$ALPINE"
          sh -c '.github/scripts/alpine-packages.sh deliver && .github/scripts/deliver-windowed.sh "delivered/Hello Window-${{ matrix.platform }}.tar.gz"'

      - name: Install Hello Window from its .deb with apt in Debian and Ubuntu, run it, and remove it
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-musl')
        run: |
          for image in debian:trixie-slim ubuntu:24.04; do
            docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$image" sh -c \
              'apt-get update -qq && apt-get install -y -qq desktop-file-utils >/dev/null && .github/scripts/deliver-deb.sh "delivered/Hello Window-'"${{ matrix.platform }}"'.deb"'
          done

      - name: Start Hello Window.exe as Explorer would
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$PWD/delivered/Hello Window-${{ matrix.platform }}.zip"

      - name: Read the license page, install Hello Window with its setup program, and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$PWD/delivered/Hello Window-${{ matrix.platform }}-setup.exe"
