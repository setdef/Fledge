# mise finds a precompiled Ruby among jdx/ruby's releases, but not among
# the ones GitHub marks as prereleases, as jdx/ruby marks 4.1.0-preview1,
# and then fails (CI sets MISE_RUBY_COMPILE=false) or compiles Ruby for
# ten minutes. This names jdx/ruby's own asset for each version and
# platform, so mise downloads the build it would download for a release.
# For a URL it is given, mise checks no artifact attestation, as it does
# for jdx/ruby's releases; the setting goes when Fledge moves to Ruby
# 4.1.0.
[settings]
ruby.precompiled_url = "https://github.com/jdx/ruby/releases/download/{version}/ruby-{version}.{platform}.tar.gz"

[tools]
ruby = "4.1.0-preview1"
python = "3.12"
pre-commit = "latest"
uv = "0.13.4"
# The REUSE tool checks licensing (rake reuse:lint). charset-normalizer, pure
# Python, detects file encodings without libmagic, which python-magic needs.
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer" }
# actionlint checks .github/workflows in the gate (rake lint:workflows), with
# shellcheck checking each step's script.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# clang-format checks the launcher's C in the gate (rake lint:c), against
# .clang-format.
"pipx:clang-format" = "23.1.3"
