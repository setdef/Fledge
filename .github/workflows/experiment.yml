# Package versions in Alpine 3.24, for pinning. Not part of trunk.
name: Spike (alpine versions)
on:
  push:
    branches: ["experiment/signing"]
permissions:
  contents: read
jobs:
  versions:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          docker run --rm alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a sh -c 'apk update -q; for p in squashfs-tools desktop-file-utils util-linux-misc procps-ng fuse3 build-base linux-headers rust cargo perl binutils file git xz tar zstd; do apk policy $p | head -2 | tr "\n" " "; echo; done'
          docker run --rm ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3 sh -c 'cat /etc/alpine-release; ruby -v; which script ps pgrep tar; apk info -v | grep -E "^(busybox|musl)-"'
