# Experiment only (experiment/from-delivery), never for trunk: trunk's
# ci.yml with just the Build steps the builder app needs and the
# Delivery of build --from, on the runtimes of trunk's run 42477767268.

name: CI
on:
  push:
    branches:
    - experiment/from-delivery
permissions:
  contents: read
  actions: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: 'false'
  RUST_TOOLCHAIN: 1.99.1
  BUNDLE_FROZEN: 'true'
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  FROM_REFUSES_A_BAD_APP_WITH: '2'
jobs:
  build-arm64-darwin:
    name: Build (${{ matrix.platform }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          platform: arm64-darwin
          rust: ''
    steps:
    - &1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - &2
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      if: runner.os != 'Windows'
      with:
        version: 2026.10.11
        install_args: ruby
    - &3
      name: Read the Ruby pin
      if: runner.os == 'Windows'
      id: pins
      run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
    - &4
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
      if: runner.os == 'Windows'
      with:
        ruby-version: "${{ steps.pins.outputs.ruby }}"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-${{ matrix.platform }}
        path: "${{ runner.temp }}/runtimes"
        run-id: '42477767268'
        github-token: "${{ github.token }}"
    - &5
      name: Install mksquashfs
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1
    - &6
      name: Build the app that builds apps, with build_tools and Fledge as a gem
      if: matrix.platform == 'arm64-darwin' || matrix.platform == 'x86_64-linux' ||
        matrix.platform == 'x64-mingw-ucrt'
      env:
        FLEDGE_RUNTIME_DIR: "${{ runner.temp }}/runtimes"
      run: .github/scripts/prepare-from.sh "$RUNNER_TEMP/from" "${{ matrix.platform
        }}"
    - &7
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: apps-${{ matrix.platform }}
        path: |
          dist/*-${{ matrix.platform }}.tar.gz
          dist/*-${{ matrix.platform }}.zip
          dist/*-${{ matrix.platform }}.dmg
          dist/*-${{ matrix.platform }}-setup.exe
          dist/*-${{ matrix.platform }}.AppImage
          dist/*-${{ matrix.platform }}.deb
          dist/*.expected
        if-no-files-found: error
        retention-days: 14
  build-x86_64-linux:
    name: Build (${{ matrix.platform }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          platform: x86_64-linux
          rust: ''
    steps:
    - *1
    - *2
    - *3
    - *4
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-${{ matrix.platform }}
        path: "${{ runner.temp }}/runtimes"
        run-id: '42477767268'
        github-token: "${{ github.token }}"
    - *5
    - *6
    - *7
  build-x64-mingw-ucrt:
    name: Build (${{ matrix.platform }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          platform: x64-mingw-ucrt
          rust: "-x86_64-pc-windows-gnu"
    steps:
    - *1
    - *2
    - *3
    - *4
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-${{ matrix.platform }}
        path: "${{ runner.temp }}/runtimes"
        run-id: '42477767268'
        github-token: "${{ github.token }}"
    - *5
    - *6
    - *7
  delivery-from-arm64-darwin:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          platform: arm64-darwin
    steps: &8
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/scripts
          test/fixtures/from
        sparse-checkout-cone-mode: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: apps-${{ matrix.platform }}
        path: "${{ runner.temp }}/delivered"
    - name: Install mksquashfs
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1
    - name: Build a windowed app with the builder's own fledge build --from, with
        no Ruby, and run it
      if: runner.os != 'Windows'
      run: .github/scripts/deliver-from.sh "${{ matrix.platform }}" "$RUNNER_TEMP/delivered/Builder-${{
        matrix.platform }}.tar.gz" "$PWD/test/fixtures/from/game"
    - name: Build a windowed app with the builder's own fledge build --from, with
        no Ruby, and run and install it
      if: runner.os == 'Windows'
      shell: pwsh
      run: pwsh -NoProfile -File .github/scripts/deliver-from.ps1 -Platform ${{ matrix.platform
        }} -Archive "$env:RUNNER_TEMP/delivered/Builder-${{ matrix.platform }}.zip"
        -Game "$PWD\test\fixtures\from\game"
  delivery-from-x86_64-linux:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          platform: x86_64-linux
    steps: *8
  delivery-from-x64-mingw-ucrt:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          platform: x64-mingw-ucrt
    steps: *8
