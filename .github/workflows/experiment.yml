# An experiment for Plan 002's console story. Not part of trunk.
name: Experiment (console)
on:
  push:
    branches: ["experiment/signing"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          ruby -v; script --version
          sh scripts/deliver-console.sh --reference "$(command -v ruby)" scripts/main.rb
          echo "=== through Open3, as the tests run it"
          timeout 120 ruby -ropen3 -e 'out, st = Open3.capture2e("scripts/deliver-console.sh", "--reference", RbConfig.ruby, "scripts/main.rb"); puts out; p st' || echo "timed out $?"

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - run: |
          & ./scripts/deliver-console.ps1 -Reference @((Get-Command ruby.exe).Source, 'scripts/main.rb') -WindowedReference @((Get-Command rubyw.exe).Source, 'scripts/windowed.rb')
