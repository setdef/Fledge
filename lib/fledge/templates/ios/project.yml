# Written by fledge build (doc/contributors/design/phone-projects.md): XcodeGen's description of this
# Xcode project, which fledge build generated it from; change it and run
# xcodegen again, or change the project in Xcode. One app for iPhone and
# iPad, iOS 15 and later, on arm64 devices and Apple silicon Simulators,
# as Fledge's iOS runtime is (ADR 099), linking
# FledgeRuby.xcframework, and embedding it where its Ruby is a
# framework, with the identity fledge.yml gives. Each of that Ruby's own
# extensions is Frameworks/NAME.xcframework, embedded and not linked,
# which a link at the extension's path in the slice's lib/ruby leads to
# in the app. Its Ruby
# is the XCFramework slice's lib/, libexec/, and include/, which the build phase
# "Copy Ruby and the app" copies into the bundle's fledge/ folder for the
# SDK it builds for, as CPython's iOS apps copy their slice's standard
# library, and then the folder fledge/: the app's program, its gems, and
# fledge.cfg. When the app's gems have extensions, they are compiled for
# both slices into FledgeExtensions.xcframework, linked the same way, and
# Host/fledge_extensions.c registers them. Each library a gem's build
# made for Ruby's ffi is Frameworks/NAME.xcframework, embedded and not
# linked, which a link at the gem's path in fledge/ leads to in the
# app. An app whose Ruby draws its own screen (kind: windowed in
# fledge.yml) is compiled with FLEDGE_WINDOWED=1, so that Host/main.m
# runs its Ruby on the main thread, which the linker gives a 64 MB
# stack (-stack_size), as Ruby's own thread has; the linker takes that
# only for an executable, so the app's code is never the debug dylib
# Xcode would otherwise make of it (ENABLE_DEBUG_DYLIB). No signing is configured:
# choose your team under Signing & Capabilities to run it on a device.
name: @@NAME@@
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  @@NAME@@:
    type: application
    platform: iOS
    sources:
      - path: Host
    dependencies:
      - framework: FledgeRuby.xcframework
        embed: @@RUBY_EMBED@@
      @@EXTENSIONS@@
    postCompileScripts:
      - name: Copy Ruby and the app
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          slice=ios-arm64
          if [ "$PLATFORM_NAME" = iphonesimulator ]; then slice=ios-arm64-simulator; fi
          root="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/fledge"
          rm -rf "$root"
          ditto "$PROJECT_DIR/FledgeRuby.xcframework/$slice/lib" "$root/lib"
          ditto "$PROJECT_DIR/FledgeRuby.xcframework/$slice/libexec" "$root/libexec"
          ditto "$PROJECT_DIR/FledgeRuby.xcframework/$slice/include" "$root/include"
          ditto "$PROJECT_DIR/fledge" "$root"
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: @@NAME@@
        PRODUCT_BUNDLE_IDENTIFIER: @@IDENTIFIER@@
        MARKETING_VERSION: @@VERSION@@
        CURRENT_PROJECT_VERSION: @@VERSION@@
        INFOPLIST_FILE: Host/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: @@APP_ICON@@
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        GCC_PREPROCESSOR_DEFINITIONS: @@DEFINITIONS@@
        OTHER_LDFLAGS: @@LDFLAGS@@
