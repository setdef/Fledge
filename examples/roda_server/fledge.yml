# A server a person starts from a terminal, or by opening the app, and
# uses in the browser. It is a console app, so the console window it
# runs in shows its address, and closing that window stops it. With
# kind: windowed, Windows would give it no console, and nothing would
# show it running or stop it but the Task Manager.
name: Jot
kind: console
version: "1.0.0"
publisher: setdef
description: A notes board in your browser
