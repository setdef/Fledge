# Experiment only (experiment/rooibos-console), never for trunk: builds
# examples/rooibos_console (Fledge Check, a Rooibos terminal UI) on a
# runner of each desktop platform that has a runtime in trunk's CI run
# RUN, runs it in a pseudo-terminal or console on a fresh runner with no
# Ruby on its PATH, and uploads each platform's archive for the
# maintainer to download and run on real hardware.

name: rooibos-console

on:
  push:
    branches: ["experiment/rooibos-console"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RUN: "42056214466"
  RUST_TOOLCHAIN: "1.99.1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      # ratatui_ruby is published precompiled for macOS on Apple silicon,
      # x86-64 Linux, and 64-bit Windows; for the others cargo compiles it.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: matrix.platform == 'aarch64-linux' || matrix.platform == 'aarch64-mingw-ucrt'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build Fledge Check
        env:
          FLEDGE_RUNTIME_DIR: ${{ github.workspace }}/runtimes
        run: ruby -I lib exe/fledge build -o dist examples/rooibos_console

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fledge-check-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  run:
    name: run (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fledge-check-${{ matrix.platform }}
          path: ${{ runner.temp }}/app

      - name: Run it in a terminal, with no Ruby
        if: runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP/app"
          tar xzf "Fledge Check-${{ matrix.platform }}.tar.gz"
          python3 -I "$GITHUB_WORKSPACE/.github/rooibos_console/deliver.py" "$PWD/Fledge Check-${{ matrix.platform }}/Fledge Check"

      - name: Run it in a console, with no Ruby
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem "$env:RUNNER_TEMP/app" -Filter *.zip | Select-Object -First 1).FullName
          pwsh -NoProfile -File .github/rooibos_console/deliver.ps1 -Archive $archive
