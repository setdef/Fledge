# native_phone is a lone script with a gem that has a C and C++
# extension (ADR 022). It sits inside Fledge's own gem, so without this
# file fledge build would take Fledge's Gemfile for its own (ADR 005).
# The identifier is what iOS and Android know it by (ADR 012).
identifier: com.setdef.fledge.NativePhone
