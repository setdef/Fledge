# A windowed app whose window comes from a third party's GUI gem, LibUI,
# shipped as an archive for each system, with no installers.
#
# On Linux, libui-ng's library links GTK 3, its Pango and Cairo, and
# GDK, which the desktop provides and no gem carries, so the app names
# them as the distribution's (doc/gems.md, "A gem that links a library
# from the Linux distribution").
#
# On Windows, LibUI's DLL needs Microsoft's Visual C++ runtime, which
# Windows does not include. With local, the app carries the copies the
# building computer has, which you may distribute only if you hold the
# rights to (doc/gems.md, "A gem whose DLL needs the Visual C++
# runtime").
name: Focus Timer
kind: windowed
identifier: com.setdef.fledge.FocusTimer
version: "1.0.0"
publisher: setdef
installers: []
linux:
  system_libraries: [libgtk-3.so.0, libgdk-3.so.0, libpangocairo-1.0.so.0, libpango-1.0.so.0, libcairo.so.2]
windows:
  visual_c_runtime: local
