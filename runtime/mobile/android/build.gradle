//
// No CMake or ndk-build: the runtime builder links libfledgeruby.so and
// the ruby program, libfledgerubyexe.so, with the NDK itself, and the
// AAR carries them as they are, unstripped by the plugin (they are
// stripped already), beside the Java class.
plugins {
    id 'com.android.library'
}

layout.buildDirectory = file(providers.gradleProperty('fledge.buildDir').get())

android {
    namespace = 'org.setdef.fledge'
    compileSdk = 36

    defaultConfig {
        minSdk = 26
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [providers.gradleProperty('fledge.jniLibs').get()]
        }
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
