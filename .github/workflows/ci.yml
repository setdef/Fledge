---
name: CI
"on":
  push:
    branches:
    - "**"
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: 'false'
  RUST_TOOLCHAIN: 1.99.1
  BUNDLE_FROZEN: 'true'
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
jobs:
  runtime:
    name: Runtime (${{ matrix.platform }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          platform: arm64-darwin
        - os: ubuntu-24.04
          platform: x64-mingw-ucrt
        - os: ubuntu-24.04
          platform: aarch64-mingw-ucrt
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Install patchelf
      if: runner.os == 'Linux' && !endsWith(matrix.platform, '-mingw-ucrt')
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq patchelf=0.18.0-1.1build1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: tmp/downloads
        key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml')
          }}
    - name: Build the runtime
      run: |
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        export SOURCE_DATE_EPOCH
        ruby tasks/runtime_builder.rb "${{ matrix.platform }}"
    - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
      if: endsWith(matrix.platform, '-mingw-ucrt')
      env:
        PLATFORM: "${{ matrix.platform }}"
      run: |
        case "$PLATFORM" in
          x64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp package) folder=ucrt64 ;;
          aarch64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp arm64 package) folder=clangarm64 ;;
        esac
        mkdir -p "$RUNNER_TEMP/gmp-package"
        tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" "$folder/bin/libgmp-10.dll"
        cmp "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll" tmp/runtime/"$PLATFORM"/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
        sha256sum "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runtime-${{ matrix.platform }}
        path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
        if-no-files-found: error
        retention-days: 14
  runtime-mobile:
    name: Runtime (${{ matrix.platform }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-26
          platform: ios
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Select the pinned Xcode
      if: matrix.platform == 'ios'
      run: |
        xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
        sudo xcode-select -s "/Applications/Xcode_$xcode.app"
        xcodebuild -version
    - name: Use Java 21
      if: matrix.platform == 'android'
      run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: tmp/downloads
        key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml')
          }}
    - name: Build the runtime
      run: ruby tasks/runtime_builder.rb "${{ matrix.platform }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runtime-${{ matrix.platform }}
        path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: failure()
      with:
        name: runtime-${{ matrix.platform }}-logs
        path: tmp/runtime/${{ matrix.platform }}/logs
        retention-days: 14
  test:
    name: Test (${{ matrix.platform }})
    needs: runtime
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          platform: arm64-darwin
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Place Bundler outside the checkout
      id: paths
      run: |
        echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
        echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: "~/.cache/fledge/bundle"
        key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby
          }}-${{ hashFiles('Gemfile.lock') }}
    - name: Install the bundle
      run: bundle install
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-${{ matrix.platform }}
        path: "${{ runner.temp }}/runtimes"
    - name: Install mksquashfs
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1
        echo "FLEDGE_REQUIRE_MKSQUASHFS=1" >> "$GITHUB_ENV"
        echo "FLEDGE_REQUIRE_DPKG_DEB=1" >> "$GITHUB_ENV"
    - name: Make a code signing identity
      if: runner.os == 'macOS'
      run: .github/scripts/make-test-identity.sh "$RUNNER_TEMP/certificate.pem"
    - name: Run the tests
      timeout-minutes: 10
      env:
        A: "--verbose"
        FLEDGE_RUNTIME_DIR: "${{ runner.temp }}/runtimes"
        FLEDGE_REQUIRE_RUNTIME: '1'
      run: bundle exec rake test
    - name: Check parity with ruby main.rb and bundle exec
      timeout-minutes: 10
      env:
        FLEDGE_RUNTIME_DIR: "${{ runner.temp }}/runtimes"
      run: bundle exec rake parity
    - name: Interrupt ruby main.rb in a terminal
      run: .github/scripts/deliver-console.sh --reference "$(command -v ruby)" test/fixtures/console/main.rb
  test-windows:
    name: Test (${{ matrix.platform }})
    needs: runtime
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          platform: x64-mingw-ucrt
        - os: windows-11-arm
          platform: aarch64-mingw-ucrt
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Read the Ruby pin
      id: pins
      run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
      with:
        ruby-version: "${{ steps.pins.outputs.ruby }}"
        bundler-cache: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-${{ matrix.platform }}
        path: "${{ runner.temp }}/runtimes"
    - name: Point RubyInstaller at setup-ruby's MSYS2
      run: echo "MSYS2_PATH=$RI_DEVKIT" >> "$GITHUB_ENV"
    - name: Make a code signing certificate
      shell: pwsh
      run: pwsh -NoProfile -File .github/scripts/make-test-identity.ps1 -Certificate
        "$env:RUNNER_TEMP/certificate.cer"
    - name: Run the tests
      timeout-minutes: 15
      env:
        A: "--verbose"
        FLEDGE_RUNTIME_DIR: "${{ runner.temp }}/runtimes"
        FLEDGE_REQUIRE_RUNTIME: '1'
      run: bundle exec rake test
    - name: Check parity with ruby main.rb and bundle exec
      timeout-minutes: 10
      env:
        FLEDGE_RUNTIME_DIR: "${{ runner.temp }}/runtimes"
      run: bundle exec rake parity
    - name: Interrupt ruby.exe main.rb in a console, and close it
      shell: pwsh
      run: "& .github/scripts/deliver-console.ps1 -Reference @((Get-Command ruby.exe).Source,
        'test/fixtures/console/main.rb') -WindowedReference @((Get-Command rubyw.exe).Source,
        'examples/windowed_app/main.rb')"
