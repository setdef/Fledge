# The shipped path, end to end (Plan 001's walking skeleton in
# production): on a fresh runner of each platform, a developer's project
# installs Fledge from its git tag with Bundler, as the README says, never
# from RubyGems.org; fledge build, with no FLEDGE_RUNTIME_DIR and an empty
# cache, downloads that version's runtime from the GitHub Release and
# checks it against the release's SHA256SUMS, and, to compile
# examples/native_app's gems from source, its build-only companion; and
# each app it builds is delivered as CI delivers every push's (.github/scripts/deliver.sh, or
# deliver.ps1 on Windows). The windowed app's installer, which needs, on
# Windows, the release's makensis for the computer, is installed and its
# app run, as CI installs every push's (ADR 009). Another job downloads
# every asset of the release and checks it against SHA256SUMS.
#
# release.yml calls this after it publishes a release; run it by hand
# (workflow_dispatch) to check any published tag again.

name: Installed from a tag

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to install, such as v0.0.1.pre.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to install, such as v0.0.1.pre.1
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The Rust that compiles native_app's Rust gem, as in ci.yml.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  sums:
    name: The release's assets match its SHA256SUMS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download every asset and check it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -l
          sha256sum -c SHA256SUMS
          for asset in *; do
            [ "$asset" = SHA256SUMS ] || grep -q "  $asset\$" SHA256SUMS || { echo "::error::$asset is not in SHA256SUMS"; exit 1; }
          done

  installed:
    name: Install, build, and deliver (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            ruby-platform: arm64-darwin23
          - os: ubuntu-24.04
            platform: x86_64-linux
            ruby-platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-platform: x64-mingw-ucrt
    steps:
      # Only what a developer would have of Fledge's repository: hello,
      # my_cool_app, native_app, windowed_app, and the parity probe to
      # build, and the scripts that check the result, at the tag. Fledge
      # itself comes from Bundler.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/my_cool_app
            examples/native_app
            examples/windowed_app
            test/fixtures/parity
            .github/scripts
            mise.toml
          sparse-checkout-cone-mode: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      # native_app's Rust gem compiles on each platform for itself, as in
      # ci.yml's Build from source jobs, which say why Windows takes Rust's
      # GNU toolchain and how bindgen finds MSYS2.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}${{ runner.os == 'Windows' && '-x86_64-pc-windows-gnu' || '' }}

      # SPDX-SnippetBegin
      # SPDX-License-Identifier: AGPL-3.0-or-later
      # SPDX-SnippetCopyrightText: 2026 Kerrick Long <me@kerricklong.com>
      # SPDX-SnippetComment: Adapted from Ferro's .github/workflows/ci.yml at
      #   ef2407b1f44cd3c23d98c5085042857761598b85 (setdef/Ferro), its step
      #   "Point bindgen at Ruby's MSYS2 headers".
      - name: Point bindgen and RubyInstaller at MSYS2
        if: runner.os == 'Windows'
        run: |
          sysroot="${RI_DEVKIT//\\//}${MSYSTEM_PREFIX:?setup-ruby did not set MSYSTEM_PREFIX}"
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-gnu --sysroot=$sysroot -D__AVX512VLFP16INTRIN_H -D__AVX512FP16INTRIN_H"
            echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin"
            echo "MSYS2_PATH=$RI_DEVKIT"
          } >> "$GITHUB_ENV"
      # SPDX-SnippetEnd

      - name: Install Fledge from the tag with Bundler
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          cat > "$RUNNER_TEMP/project/Gemfile" <<GEMFILE
          source "https://rubygems.org"
          gem "fledge", git: "https://github.com/setdef/Fledge", tag: "$TAG"
          GEMFILE
          cd "$RUNNER_TEMP/project"
          bundle install
          bundle exec fledge --version

      # No FLEDGE_RUNTIME_DIR and an empty cache: the runtime must come
      # from the release, checked against its SHA256SUMS.
      - name: Build hello, my_cool_app, windowed_app, and the parity probe with runtimes from the release
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag }}
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          for app in examples/hello test/fixtures/parity examples/my_cool_app examples/windowed_app; do
            bundle exec fledge build -t "$PLATFORM" -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/$app" 2>> "$RUNNER_TEMP/build.err"
          done
          cat "$RUNNER_TEMP/build.err"
          grep -F "Downloading fledge-runtime-" "$RUNNER_TEMP/build.err"
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" "$RUNNER_TEMP/build.err"
          if [ "$PLATFORM" = x64-mingw-ucrt ]; then grep -F "Downloading fledge-makensis-" "$RUNNER_TEMP/build.err"; fi
          ls -l "$XDG_CACHE_HOME/fledge/runtimes" "$RUNNER_TEMP/dist"

      # Compiling a gem downloads the runtime's build-only companion from
      # the release too (ADR 006).
      - name: Build native_app from source with the release's build-only companion
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          bundle exec fledge build -t "$PLATFORM" -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/examples/native_app" 2> "$RUNNER_TEMP/native.err" ||
            { cat "$RUNNER_TEMP/native.err"; exit 1; }
          grep -F "Downloading fledge-runtime-" "$RUNNER_TEMP/native.err" | grep -F -- "-dev.tar.gz"
          cd "$GITHUB_WORKSPACE/examples/native_app"
          bundle install
          bundle exec ruby main.rb | tee "$RUNNER_TEMP/native_app.expected"

      # What my_cool_app prints as its developer runs it, which the built
      # app must print too.
      - name: Run my_cool_app with bundle exec
        working-directory: examples/my_cool_app
        run: |
          bundle install
          bundle exec ruby exe/my_cool_app | tee "$RUNNER_TEMP/my_cool_app.expected"

      - name: Run hello and my_cool_app as someone with no Ruby would
        if: runner.os != 'Windows'
        run: |
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/Hello-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.ruby-platform }}"
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/MyCoolApp-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/my_cool_app.expected")"
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/NativeApp-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/native_app.expected")"

      # The windowed app (ADR 008), as ci.yml delivers it.
      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        if: runner.os != 'Windows'
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.dmg"

      - name: Install FUSE
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fuse3=3.14.0-5build1

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.AppImage" fuse

      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/dist/Hello Window-x64-mingw-ucrt-setup.exe"

      - name: Start Hello Window.exe as Explorer would
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/dist/Hello Window-x64-mingw-ucrt.zip"

      - name: Run Hello.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/Hello-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected "Hello from Ruby 4.0.9 on x64-mingw-ucrt"

      - name: Run MyCoolApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/MyCoolApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/my_cool_app.expected" -Raw).TrimEnd()

      - name: Run NativeApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/NativeApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/native_app.expected" -Raw).TrimEnd()
