    <clipPath id="body-clip">
      <path d="M284 506 L740 506 L688 790 Q684 812 662 812 L362 812 Q340 812 336 790 Z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <g transform="translate(512 519) scale(1.1) translate(-512 -540)">
