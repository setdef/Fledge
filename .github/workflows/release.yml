# Publishes a Fledge release when a vX.Y.Z tag is pushed (ADR 001,
# section 7; ADR 004; AGENTS.md, Releasing). It runs all of CI on the
# tagged commit, and only when every job passes, the license audit and
# Delivery included, does it create the GitHub Release, with, for each
# platform (macOS, two Linux, and Windows):
#
#   fledge-runtime-VERSION-PLATFORM.tar.gz              the runtime
#   fledge-runtime-VERSION-PLATFORM.spdx.json           its SPDX 2.3 SBOM
#   fledge-runtime-VERSION-PLATFORM-NOTICES.txt         its notices
#   fledge-runtime-VERSION-PLATFORM-lgpl-sources.tar.gz the source of its
#                                                       LGPL libraries
#                                                       (Linux, Windows)
#   fledge-runtime-VERSION-PLATFORM-dev.tar.gz          its build-only
#                                                       companion
#   fledge-makensis-VERSION-PLATFORM.tar.gz             NSIS's compiler for
#                                                       computers of the
#                                                       platform (ADR 009)
#
# and a SHA256SUMS over all of them. fledge build at that version
# downloads its runtimes from this release, by the names
# Fledge::Runtimes gives them, and checks them against SHA256SUMS. A
# version with "pre" in it (RubyGems' prerelease form, such as
# 0.0.1.pre.1) is marked a prerelease.
#
# Releases are never deleted: each runtime's NOTICES points at its LGPL
# source bundle here, and app developers may rely on that link for as
# long as their apps are out (doc/licensing.md).
#
# After publishing, it installs Fledge from the tag on a fresh runner of
# each platform and builds and delivers hello with runtimes downloaded
# from the release itself (installed.yml).
#
# Before 1.0, agents may push tags and create releases (AGENTS.md,
# Releasing; decision 6 in doc/contributors/decisions.md), on a commit
# whose CI is green. Nothing here publishes to RubyGems.org, ever.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Creating a release and uploading its assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # A runtime's file name carries Fledge::VERSION, and fledge build
      # looks for its runtimes under the tag v#{Fledge::VERSION}, so a tag
      # that disagrees with the version would publish runtimes no Fledge
      # ever downloads.
      - name: Check the tag matches Fledge::VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(ruby -Ilib -rfledge/version -e 'print Fledge::VERSION')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match Fledge::VERSION $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: makensis-*
          merge-multiple: true
          path: release

      # Every name fledge build and each runtime's NOTICES will ask for
      # must be here, and nothing else: the names come from
      # Fledge::Runtimes and RuntimeBuilder#assets, the code that uses
      # them (RuntimeBuilder.release_assets).
      - name: Check the assets are exactly the ones Fledge asks for
        run: |
          ruby -e 'require "./tasks/runtime_builder"; puts RuntimeBuilder.release_assets' > "$RUNNER_TEMP/expected"
          (cd release && ls) | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          diff "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          cat "$RUNNER_TEMP/actual"

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum fledge-runtime-* fledge-makensis-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create the release with its assets attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$VERSION" in *pre*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" --title "Fledge $TAG" \
            --notes "Runtimes for fledge build at $TAG, each with its SPDX SBOM and NOTICES, and the source of the LGPL libraries the Linux and Windows runtimes ship, and makensis, which builds a Windows app's installer, for each computer that builds apps. What Fledge puts into each platform's app and installer, and what its licenses ask of you: doc/licensing.md at $TAG. What changed: CHANGELOG.md." \
            release/fledge-runtime-* release/fledge-makensis-* release/SHA256SUMS

  installed:
    name: Installed from the tag
    needs: release
    uses: ./.github/workflows/installed.yml
    with:
      tag: ${{ github.ref_name }}
