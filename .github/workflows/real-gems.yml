# Experiment (Plan 003, "The gems real apps lock"): examples/real_gems,
# built with the released runtimes of FLEDGE_TAG on a runner of each
# platform, through a credentialed loopback mirror of RubyGems.org, then
# delivered on a fresh runner. The native build tests (a path gem with an
# extension, a gem's executables) run first, with the same runtimes.
name: Real gems experiment

on:
  push:
    branches:
      - experiment/real-gems

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLEDGE_TAG: v0.0.1.pre.16

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - name: Point RubyInstaller at MSYS2
        if: runner.os == 'Windows'
        run: echo "MSYS2_PATH=$RI_DEVKIT" >> "$GITHUB_ENV"

      - name: Install the bundle
        run: bundle install

      - name: Download the released runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${FLEDGE_TAG#v}"
          gh release download "$FLEDGE_TAG" --repo setdef/Fledge --dir "$RUNNER_TEMP/runtimes" \
            --pattern "fledge-runtime-$version-${{ matrix.platform }}.tar.gz" --pattern "fledge-runtime-$version-${{ matrix.platform }}-dev.tar.gz"
          ls -l "$RUNNER_TEMP/runtimes"

      - name: Run the native build tests with the released runtime
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_REQUIRE_RUNTIME: "1"
        run: |
          for test in native_build_test bundle_test git_checkout_test gem_fetcher_test download_test; do
            bundle exec ruby -Ilib:test "test/$test.rb"
          done

      - name: Build real_gems through a credentialed mirror for ${{ matrix.platform }}
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle")' "$RUNNER_TEMP/parity-bundle"
          ruby -I lib exe/fledge build -o dist "$RUNNER_TEMP/parity-bundle"
          ruby .github/scripts/gem-mirror.rb 9292 fledge:mirror-password "$RUNNER_TEMP/mirror.log" &
          mirror=$!
          sleep 3
          status=0
          ruby -I lib exe/fledge build -o dist examples/real_gems || status=$?
          kill "$mirror" || true
          cat "$RUNNER_TEMP/mirror.log"
          [ "$status" = 0 ] || exit "$status"
          for gem in rainbow-3.1.1 paint-2.3.0; do
            grep -q "^GET /gems/$gem.gem 200\$" "$RUNNER_TEMP/mirror.log" || { echo "::error::$gem did not come through the mirror, with its login"; exit 1; }
          done
          echo "rainbow 3.1.1 through a mirror that wanted a login; shared from outside the project; greeter compiled for the runtime's Ruby; fledge_submodule_gem says Hello World!; paint 2.3.0 from an optional group; shared-cli says shared from outside the project" > dist/real_gems.expected

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.tar.gz
            dist/*-${{ matrix.platform }}.zip
            dist/*.expected
          if-no-files-found: error
          retention-days: 3

  delivery:
    name: Delivery (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run real_gems as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/RealGems-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/real_gems.expected")"

      - name: Run RealGems.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/RealGems-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/real_gems.expected" -Raw).TrimEnd()
