# Experiment (Plan 003, "Android on arm64"): does Windows on ARM64 expose
# the Windows Hypervisor Platform that an emulator would need?
name: Android arm64 probe

on:
  push:
    branches:
      - experiment/android-arm64

permissions:
  contents: read

jobs:
  whp:
    name: Windows Hypervisor Platform (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - shell: pwsh
        run: |
          Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform | Format-List
          Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-Hypervisor | Format-List
          Add-Type -Namespace Probe -Name Whp -MemberDefinition '[DllImport("WinHvPlatform.dll")] public static extern int WHvGetCapability(int code, IntPtr buf, int size, out int written);'
          $buf = [Runtime.InteropServices.Marshal]::AllocHGlobal(64)
          $w = 0
          $hr = [Probe.Whp]::WHvGetCapability(0, $buf, 64, [ref]$w)
          "WHvGetCapability(HypervisorPresent) hr=0x{0:X8} present={1}" -f $hr, [Runtime.InteropServices.Marshal]::ReadInt32($buf)
