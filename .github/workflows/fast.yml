# The fast tier (ADR 069): on every push and pull request, the lint and
# the unit tests (bundle exec rake test, CONTRIBUTING.md, "The tests"),
# in a few minutes, so each push to trunk gets a verdict of its own
# while ci.yml's full run, about an hour, covers the pushes in batches.
#
# It is a workflow of its own because GitHub ends a run, and gh run
# list reports its conclusion, only when its slowest job ends, and
# ci.yml's slowest jobs end an hour after its first.
#
# The lint runs once, on Linux: RuboCop, RubyCritic, RDoc coverage,
# REUSE, the RBS checks, actionlint and shellcheck, clang-format, and
# Steep read the same files on every OS. The unit tests run on Linux,
# macOS, and Windows, each with the Ruby and the bundle cache ci.yml's
# test jobs use there. Nothing here builds a runtime, so the integration
# tier, the gate in full, and the pin commit's check stay in ci.yml.

name: Fast

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# On trunk every push has a group of its own, named for its commit, so
# no push cancels or replaces another's run, and each commit at the head
# of a push is judged alone. On a branch a push cancels the run before
# it, as in ci.yml.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

env:
  # As in ci.yml: a missing precompiled Ruby fails instead of compiling.
  MISE_RUBY_COMPILE: "false"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every tool mise.toml pins, as the gate in ci.yml installs them:
      # the REUSE tool, actionlint, shellcheck, and clang-format.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      # The key ci.yml's gate and test jobs use, so each restores what
      # the other saved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # The checks of bundle exec rake that fix nothing: lint:fix is left
      # out, so an offense fails here instead of being corrected.
      - name: Lint
        run: bundle exec rake lint steep

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - name: Run the unit tests
        env:
          A: --verbose
        run: bundle exec rake test

  # Windows' Ruby is RubyInstaller's, with the DLLs and the MSYS2 its gems
  # compile with, set up as ci.yml's Windows test job sets it up.
  unit-windows:
    name: Unit tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2
          add_shims_to_path: false
          mise_dir: ${{ runner.temp }}\mise

      - name: Give Windows' Ruby the rest of setup-ruby's environment
        run: .github/scripts/windows-ruby-env.sh

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}

      - name: Install the bundle
        run: bundle install

      - name: Run the unit tests
        env:
          A: --verbose
        run: bundle exec rake test
