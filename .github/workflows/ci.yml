# Experiment only (experiment/one-point-oh), never for trunk: the Windows
# installer Delivery on both Windows platforms with a long, hyphenated
# identifier, on the runtimes of trunk's run 42477767268 (ADR 032, section 3).

name: CI
on:
  push:
    branches:
      - experiment/one-point-oh
permissions:
  contents: read
  actions: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: "false"
  BUNDLE_FROZEN: "true"
  LONG_IDENTIFIER: io.github.some-one.my-very-long-hyphenated-application-that-goes-well-past-a-prog-id.hello-window
jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Ruby pin
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes
          run-id: "42477767268"
          github-token: ${{ github.token }}
      - name: Build windowed_app under the long identifier
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          sed -i "s/^identifier: .*/identifier: $LONG_IDENTIFIER/" examples/windowed_app/fledge.yml
          grep '^identifier:' examples/windowed_app/fledge.yml
          ruby -I lib exe/fledge build -o dist examples/windowed_app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: dist/*-${{ matrix.platform }}-setup.exe
          if-no-files-found: error
          retention-days: 14
  delivery:
    name: Delivery of the installer (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered
      - name: Install, open through the shell, and uninstall
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM-setup.exe" -Identifier $env:LONG_IDENTIFIER
