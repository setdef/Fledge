# SPDX-License-Identifier: MIT

# Plan 001's pipeline, on every push and pull request: the gate, then a
# runtime per platform, then the tests on each platform with its own
# runtime, then each platform building the examples for itself on a
# runner of its own (ADR 010), then Delivery: each built app unpacked and
# run on a fresh computer that has never had Ruby.
#
# The gate runs once, on Linux: its lints (RuboCop, Steep, RDoc
# coverage, REUSE, actionlint, clang-format) read the same files on
# every OS, so one run answers for all three.
#
# A pushed pin commit, which changes only lib/fledge/SHA256SUMS (ADR
# 053; doc/contributors/design/releases.md, "A pin commit's short CI"),
# runs only the gate and a check that its pins match
# the runtimes of its parent's run; every other job is skipped (the
# Changes job). Every other commit runs everything below.
#
# The macOS and Linux runtimes build on each platform's own runner
# (macos-15 is Apple Silicon, ubuntu-24.04-arm is aarch64), because their
# launchers link Ruby itself. The Windows runtime builds on Linux: its
# launcher loads Ruby's DLL when it runs, so it cross-compiles with a
# pinned llvm-mingw from Ruby's headers alone (runtime/sources.yml), and
# Windows runners test it, build apps with it, and deliver them. Each
# platform's apps are built on that platform, as developers build them.
#
# A windowed app gets an installer too (ADR 009): a disk image for macOS,
# an NSIS setup program for Windows, and an AppImage for Linux (and a
# .deb, which windowed_app asks for), each written on its own platform's
# runner; and Delivery installs each on a
# fresh runner and runs the app it installed.
#
# The mobile runtimes (ADR 011) build from Ruby's source, iOS's on a Mac
# with Xcode and Android's on Linux with the NDK, and their Delivery is
# apps built with fledge build ios and fledge build android (ADR 012),
# whose Xcode and Gradle projects build unsigned, the Gradle ones as APKs
# and as the app bundles Google Play takes, run in the iOS Simulator on an
# iPhone and an iPad and on Android emulators with 4 KB and 16 KB pages,
# from an APK and from a bundle's APKs: hello, a gem-shaped app with pure-Ruby gems, a script
# that requires json and a bundled gem and reaches a server over HTTPS,
# and the parity probe (tasks/mobile_parity.rb).
#
# Every runtime build runs the license audit and refuses to archive a
# runtime that breaks Fledge's license policy (ADR 004). The Licenses
# jobs check what it wrote and that it still fails on GPL code; the
# upstream jobs show it catching what rv-ruby and RubyInstaller ship and
# runtimes remove; the licensing page job keeps doc/licensing.md true to
# the runtimes; and the Replace jobs prove that whoever receives an app
# can replace its LGPL libraries, as that page tells developers.
#
# ruby/spec runs on stock Ruby and in a built app from each runtime,
# desktop and phone, and any example that fails on one side only, unless
# justified, fails the job (ruby-spec.yml, tasks/ruby_spec.rb).
#
# release.yml, on a v* tag, publishes the runtimes this workflow built
# from the release commit, once it has passed on trunk on the release
# commit and on the pin commit tagged (ADR 053). It looks those runs up
# and does not run this again. Nothing here, or ever, publishes to
# RubyGems.org (doc/contributors/design/releases.md, "Where releases
# are").

name: CI

on:
  push:
    # Not on tags: release.yml looks up the tagged commit's run on trunk.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds where they exist
  # (mise's Ruby documentation); false makes a missing build fail instead
  # of compiling Ruby for ten minutes.
  MISE_RUBY_COMPILE: "false"
  # The Rust that compiles the examples' Rust gems in the Build from
  # source jobs, the release Ferro's gems are tested with (its mise.toml).
  RUST_TOOLCHAIN: "1.99.1"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # musl Linux (ADR 017): the Alpine a developer with Ruby builds apps
  # on, and the bare Alpine Delivery runs them on, pinned by digest.
  ALPINE_RUBY: ruby:4.1.0-preview1-alpine3.24@sha256:3377ef9d7e5c4c430ccc9c3459d172158c575771e1aac2010702dee54388ace0
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  # The status fledge build --from exits with for an APP of another release
  # or platform, or a folder Fledge did not build (Fledge::BuiltApp).
  FROM_REFUSES_A_BAD_APP_WITH: "1"

jobs:
  changes:
    name: Changes, and a pin commit's pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Finding the parent's run and downloading its runtimes.
      actions: read
    outputs:
      pins-only: ${{ steps.kind.outputs.pins-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Tell whether this is a pin commit
        id: kind
        run: |
          pins_only=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then pins_only=$(.github/scripts/pins-only.sh); fi
          echo "Pin commit: $pins_only"
          echo "pins-only=$pins_only" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: steps.kind.outputs.pins-only == 'true'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Find the parent's run, in which every job passed
        if: steps.kind.outputs.pins-only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(git rev-parse HEAD^)
          run=$(ruby tasks/ci_runs.rb green "$built" --every-job --branch "$GITHUB_REF_NAME")
          echo "The pins name the runtimes of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, built from $built"
          echo "RUN=$run" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.kind.outputs.pins-only == 'true'
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Check the runtimes against the pins
        if: steps.kind.outputs.pins-only == 'true'
        run: .github/scripts/check-pins.sh "$RUNNER_TEMP/runtimes" lib/fledge/SHA256SUMS

  # One runtime per platform (rake runtime): the launcher compiled with
  # warnings as errors and the compiler's static analyzer, the pinned
  # Ruby's standard library pruned beside it (rv-ruby's, or for Windows
  # RubyInstaller's, checked against its PGP signature), and the license
  # audit (ADR 004), which fails the build of a runtime that breaks
  # Fledge's license policy and writes its NOTICES and SBOM. Beside each
  # archive go the release assets that describe it: the SBOM, the
  # NOTICES, and the source of its LGPL libraries.
  runtime:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder needs only Ruby's standard library, so mise installs
      # only Ruby, and no bundle.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # The compiler and linker that build the launcher, bin/ruby, and
      # libxcrypt, pinned to the Ubuntu 24.04 builds of gcc 13 and
      # binutils that built the runtimes before this pin, and patchelf,
      # which removes the RUNPATHs rv-ruby's build left in its extensions.
      # make, perl, and xz, which libxcrypt's build needs, are on the
      # runner already. Ubuntu's archive lists only a package's newest
      # update, so a pin that stops resolving fails the job, and is moved
      # on purpose.
      - name: Install the pinned compiler, linker, and patchelf
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-mingw-ucrt')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-13=13.3.0-6ubuntu2~24.04.1 binutils=2.42-4ubuntu2.10 patchelf=0.18.0-1.1build1
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          gcc-13 --version | head -n 1
          ld --version | head -n 1

      # The Xcode whose clang and linker build the launcher and bin/ruby,
      # chosen by version as the iOS runtime's is, since Apple publishes
      # no download to pin: 16.4, macos-15's default, whose macOS 15.5 SDK
      # built the runtimes before this pin.
      - name: Select the pinned Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      # rv-ruby, RubyInstaller, llvm-mingw, and libxcrypt downloads, keyed
      # by the file that pins their SHA-256s, so a changed pin downloads
      # afresh. The builder checks every cached file's SHA-256 again
      # before using it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      # The archive's timestamps are the commit's, so two builds of one
      # commit differ only where the compiler's output does.
      - name: Build the runtime
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      # The Windows source bundle holds MSYS2's source package of GMP as
      # the exact source of RubyInstaller's libgmp-10.dll. That holds only
      # if MSYS2's binary package of that build holds the very file the
      # runtime ships, byte for byte.
      - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
        if: endsWith(matrix.platform, '-mingw-ucrt')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            x64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp package) folder=ucrt64 ;;
            aarch64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp arm64 package) folder=clangarm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gmp-package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" "$folder/bin/libgmp-10.dll"
          cmp "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll" tmp/runtime/"$PLATFORM"/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
          sha256sum "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

  # The musl Linux runtimes (ADR 017): CRuby built from its pinned source
  # in Alpine, on a runner of each architecture, as rv-ruby builds its
  # own musl Rubies, with docker run rather than a job container, since
  # GitHub's JavaScript actions cannot run in an Alpine container on an
  # ARM runner (rv-ruby's build-alpine.yml says the same).
  runtime-mobile:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: ios
          - os: ubuntu-24.04
            platform: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        if: matrix.platform == 'ios'
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcodebuild -version

      # The Android Gradle plugin runs on Java 17 or newer; the runner's
      # Android SDK gives it the API 36 platform.
      - name: Use Java 21
        if: matrix.platform == 'android'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime
        run: ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: runtime-${{ matrix.platform }}-logs
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  # Delivery on phones (doc/contributors/design/phone-projects.md, "Parity on a
  # phone"; ADR 012): apps built as a
  # developer builds them, with fledge build ios, and their Xcode projects
  # built with xcodebuild for the Simulator and, unsigned, for devices, to
  # show the device slice links and the privacy manifest names every
  # category of API the app's executable imports that Apple asks a reason
  # for; then each run in the Simulator on an iPhone and an iPad, its
  # output read from os_log: examples/hello; examples/mobile_app, whose
  # pure-Ruby gems Bundler sets up; examples/native_phone and
  # examples/cmake_phone, whose gems' extensions are compiled for the
  # phone, the second's C++ library by CMake from its extconf.rb, with
  # the runner's CMake (ADR 022, ADR 027); a script that requires json and csv,
  # a bundled gem, and reaches rubygems.org over HTTPS; and the parity
  # probe, against ruby main.rb on this Mac's desktop Ruby, with every
  # difference justified for a phone (tasks/mobile_parity.rb).
  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad)
    needs: [runtime, runtime-mobile]
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes
          cmake --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: mobile-parity-downloads-ios-${{ hashFiles('runtime/sources.yml') }}

      # XcodeGen writes each app's Xcode project in fledge build ios, as a
      # developer installs it; pinned by SHA-256.
      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes

      # The runtime of this Mac, whose Ruby runs mkmf to compile a gem's
      # extension for the phone (ADR 022).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes

      - name: Build the apps with fledge build ios, and run them in the iOS Simulator
        run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mobile-apps-ios
          path: |
            tmp/mobile-parity/ios/*.ndjson
            tmp/mobile-parity/ios/*.log
            tmp/mobile-parity/ios/*.ips
          retention-days: 14

  # The same on Android emulators of API 36 with 4 KB and with 16 KB
  # pages: the apps built with fledge build android, each Gradle project
  # built with its own wrapper, debug and unsigned release, as APKs and as
  # the app bundles Google Play takes, and each APK checked for Play's 16
  # KB alignment and target API; each release bundle signed with a
  # throwaway upload key, validated with bundletool, made into the APKs
  # Play would serve, which are checked the same way and against Play's
  # size limit (doc/contributors/design/phone-projects.md, "The Android App Bundle
  # check"), and each app run from its debug APK
  # and again from its bundle's APKs, as Play installs them. No GitHub-hosted
  # runner boots an arm64-v8a emulator with hardware acceleration (ADR
  # 011), so the arm64-v8a library is built and checked but run on no
  # emulator here.
  mobile-apps-android:
    name: Mobile apps (Android emulator, API 36, ${{ matrix.target }})
    needs: [runtime, runtime-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          cmake --version

      # Every Gradle wrapper in a project fledge build writes must be the
      # one Gradle released (runtime/sources.yml pins its SHA-256 too).
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-x86_64-linux
          path: ${{ runner.temp }}/runtimes

      # fledge build android compiles a gem's extension with the NDK on the
      # computer (ADR 022), as a developer's own: the very NDK the runtime
      # is built with, pinned by SHA-256.
      - name: Install the pinned NDK
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile ndk hosts x86_64-linux)
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_ROOT=$(echo "$RUNNER_TEMP"/ndk/android-ndk-*)" >> "$GITHUB_ENV"

      # bundletool makes and installs the APKs Play would serve from a
      # bundle, pinned by SHA-256 (runtime/sources.yml).
      - name: Fetch the pinned bundletool
        run: |
          jar=$(ruby .github/scripts/fetch_pin.rb mobile bundletool)
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      - name: Build the apps with fledge build android and Gradle, as APKs and bundles, and check each for 16 KB pages, API 36, and Play's size limit
        run: ruby tasks/mobile_parity.rb android-build "$RUNNER_TEMP/runtimes"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 4 GB of RAM, as the phones that ship 16 KB pages have at least
      # twice that: with the emulator's default, the 16 KB system ran out
      # of memory and its low-memory killer killed the app in front, one
      # app in one run and another in the next.
      - name: Run the apps on the emulator, from their APKs and from their bundles
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ruby tasks/mobile_parity.rb android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mobile-apps-android-${{ matrix.target }}
          path: tmp/mobile-parity/android/logcat-*.txt
          retention-days: 14

  # An Android app's project is built on macOS and Windows too, as Google
  # supports its SDK there and Briefcase, Flutter, React Native, and Tauri
  # build Android apps there (ADR 012): examples/mobile_app, written with
  # fledge build android and built with its Gradle wrapper and the
  # runner's Android SDK, as an APK and as the release bundle Play takes,
  # which is signed, validated, and made into Play's APKs with bundletool.
  ruby-spec:
    name: ruby/spec
    needs: [runtime, runtime-mobile]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ruby-spec.yml
    with:
      full: "${{ startsWith(github.event.head_commit.message, 'chore: release ') }}"

  # The tests on Windows, with the Windows runtime, on RubyInstaller's
  # Ruby, which the runtime ships too (ADR 035), through setup-ruby at
  # mise.toml's pin, or for a preview, which RubyInstaller does not
  # build, its head build of that day (.github/scripts/ruby-pin.sh).
  # test/built_app_test.rb unpacks hello and my_cool_app
  # with Windows' own Expand-Archive, from the .zip Windows' own tar
  # wrote, and runs Hello.exe and MyCoolApp.exe. As on the other
  # platforms, sqlite3 compiles from source on Ruby 4.1, which the limits
  # below leave room for.
