# An experiment for Plan 002's console story. Not part of trunk.
name: Experiment (console)
on:
  push:
    branches: ["experiment/signing"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          ruby -v; script --version
          sh -x scripts/deliver-console.sh --reference "$(command -v ruby)" scripts/console.rb
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - run: |
          & ./scripts/deliver-console.ps1 -Reference @((Get-Command ruby.exe).Source, 'scripts/console.rb') -WindowedReference @((Get-Command rubyw.exe).Source, 'scripts/windowed.rb')
