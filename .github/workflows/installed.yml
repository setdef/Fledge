# SPDX-FileCopyrightText: 2026 setdef <kerrick@setdef.com>
# SPDX-License-Identifier: MIT

# The shipped path, end to end (Plan 001's walking skeleton in
# production): on a fresh runner of each platform, a developer's project
# installs Fledge from its git tag with Bundler, as the README says, never
# from RubyGems.org; fledge build, with no FLEDGE_RUNTIME_DIR and an empty
# cache, downloads that version's runtime from the GitHub Release and
# checks it against the SHA-256 the gem pins (ADR 014), and, to compile
# examples/native_app's gems from source, its build-only companion; and
# each app it builds is delivered as CI delivers every push's
# (.github/scripts/deliver.sh, or deliver.ps1 on Windows). The windowed app's installer, made with the
# runtime's own tools, is installed and its app run, as CI installs every
# push's (ADR 009 and ADR 010). Another job writes phones' projects from
# the tag and builds them with Xcode and Gradle (ADR 012), and another
# downloads every asset of the release and checks it against SHA256SUMS,
# which must be the tag's lib/fledge/SHA256SUMS, the pins the gem ships.
# The next jobs build the .gem from the tag and install that file instead
# of the tag on each platform, which proves what the gemspec packs; and
# package-managers.yml installs hello with Scoop, Homebrew, winget,
# Chocolatey, and pacman, from the recipes in the guide.
#
# release.yml calls this after it publishes a release; run it by hand
# (workflow_dispatch) to check any published tag again.

name: Installed from a tag

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to install, such as v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to install, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The Rust that compiles native_app's Rust gem, as in ci.yml.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # The guide's recipes, installed with each package manager's own tool
  # (doc/package_managers.md).
  package-managers:
    name: Package managers
    uses: ./.github/workflows/package-managers.yml
    with:
      tag: ${{ inputs.tag }}

  sums:
    name: The release's assets match its SHA256SUMS and the gem's pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download every asset and check it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -l
          sha256sum --strict -c SHA256SUMS
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/lib/fledge/SHA256SUMS?ref=$TAG" |
            diff - SHA256SUMS
          for asset in *; do
            [ "$asset" = SHA256SUMS ] || grep -q "  $asset\$" SHA256SUMS || { echo "::error::$asset is not in SHA256SUMS"; exit 1; }
          done

  installed:
    name: Install, build, and deliver (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            ruby-platform: arm64-darwin23
          - os: ubuntu-24.04
            platform: x86_64-linux
            ruby-platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-platform: x64-mingw-ucrt
          # Windows on ARM64 (ADR 018), whose apps here need no gem
          # compiled for it: no my_cool_app or native_app.
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            ruby-platform: aarch64-mingw-ucrt
    steps:
      # Only what a developer would have of Fledge's repository: hello,
      # my_cool_app, native_app, windowed_app, and the parity probe to
      # build, at the tag. Fledge itself comes from Bundler.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/my_cool_app
            examples/native_app
            examples/windowed_app
            test/fixtures/parity
            mise.toml
          sparse-checkout-cone-mode: false

      # The scripts that check the result come from this workflow's own
      # commit: the tag's, when release.yml calls it, and the checks as
      # they are now when a published tag is checked again by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checks
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Put the checks where the steps run them
        run: |
          mkdir -p .github
          cp -R checks/.github/scripts .github/scripts

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      # native_app's Rust gem compiles on each platform for itself, as in
      # ci.yml's Build from source jobs, which say why Windows takes Rust's
      # GNU toolchain and how bindgen finds MSYS2.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: matrix.platform != 'aarch64-mingw-ucrt'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}${{ runner.os == 'Windows' && '-x86_64-pc-windows-gnu' || '' }}

      # SPDX-SnippetBegin
      # SPDX-License-Identifier: MIT
      # SPDX-SnippetCopyrightText: 2026 setdef <kerrick@setdef.com>
      # SPDX-SnippetComment: Adapted from Ferro's .github/workflows/ci.yml at
      #   ef2407b1f44cd3c23d98c5085042857761598b85 (setdef/Ferro), its step
      #   "Point bindgen at Ruby's MSYS2 headers".
      - name: Point bindgen and RubyInstaller at MSYS2
        if: matrix.platform == 'x64-mingw-ucrt'
        run: |
          sysroot="${RI_DEVKIT//\\//}${MSYSTEM_PREFIX:?setup-ruby did not set MSYSTEM_PREFIX}"
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-gnu --sysroot=$sysroot -D__AVX512VLFP16INTRIN_H -D__AVX512FP16INTRIN_H"
            echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin"
            echo "MSYS2_PATH=$RI_DEVKIT"
          } >> "$GITHUB_ENV"
      # SPDX-SnippetEnd

      - name: Install Fledge from the tag with Bundler
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          cat > "$RUNNER_TEMP/project/Gemfile" <<GEMFILE
          source "https://rubygems.org"
          gem "fledge", git: "https://github.com/setdef/Fledge", tag: "$TAG"
          GEMFILE
          cd "$RUNNER_TEMP/project"
          bundle install
          bundle exec fledge --version

      # mksquashfs, which writes windowed_app's AppImage (ADR 010), as a
      # Linux developer installs it, pinned to Ubuntu 24.04's build.
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      # No FLEDGE_RUNTIME_DIR and an empty cache: the runtime must come
      # from the release, checked against the gem's pins.
      - name: Build hello, my_cool_app, windowed_app, and the parity probe with runtimes from the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          apps="examples/hello test/fixtures/parity examples/my_cool_app examples/windowed_app"
          [ "${{ matrix.platform }}" != aarch64-mingw-ucrt ] || apps="examples/hello test/fixtures/parity examples/windowed_app"
          for app in $apps; do
            bundle exec fledge build -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/$app" 2>> "$RUNNER_TEMP/build.err"
          done
          cat "$RUNNER_TEMP/build.err"
          grep -F "Downloading fledge-runtime-" "$RUNNER_TEMP/build.err"
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" "$RUNNER_TEMP/build.err"
          ls -l "$XDG_CACHE_HOME/fledge/runtimes" "$RUNNER_TEMP/dist"

      # Compiling a gem downloads the runtime's build-only companion from
      # the release too (ADR 006).
      - name: Build native_app from source with the release's build-only companion
        if: matrix.platform != 'aarch64-mingw-ucrt'
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          bundle exec fledge build -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/examples/native_app" 2> "$RUNNER_TEMP/native.err" ||
            { cat "$RUNNER_TEMP/native.err"; exit 1; }
          grep -F "Downloading fledge-runtime-" "$RUNNER_TEMP/native.err" | grep -F -- "-dev.tar.gz"
          cd "$GITHUB_WORKSPACE/examples/native_app"
          bundle install
          bundle exec ruby main.rb | tee "$RUNNER_TEMP/native_app.expected"

      # What my_cool_app prints as its developer runs it, which the built
      # app must print too.
      - name: Run my_cool_app with bundle exec
        if: matrix.platform != 'aarch64-mingw-ucrt'
        working-directory: examples/my_cool_app
        run: |
          bundle install
          bundle exec ruby exe/my_cool_app | tee "$RUNNER_TEMP/my_cool_app.expected"

      - name: Run hello and my_cool_app as someone with no Ruby would
        if: runner.os != 'Windows'
        run: |
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/Hello-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.ruby-platform }}"
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/MyCoolApp-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/my_cool_app.expected")"
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/NativeApp-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/native_app.expected")"

      # The windowed app (ADR 008), as ci.yml delivers it.
      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        if: runner.os != 'Windows'
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.dmg"

      - name: Install FUSE
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fuse3=3.14.0-5build1

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.AppImage" fuse

      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}-setup.exe"

      - name: Start Hello Window.exe as Explorer would
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.zip"

      - name: Run Hello.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/Hello-${{ matrix.platform }}.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.zip" -Platform ${{ matrix.platform }}
          -Expected "Hello from Ruby 4.0.9 on ${{ matrix.platform }}"

      - name: Run MyCoolApp.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/MyCoolApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/my_cool_app.expected" -Raw).TrimEnd()

      - name: Run NativeApp.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/NativeApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/native_app.expected" -Raw).TrimEnd()

  # musl Linux from the tag (ADR 017): in Alpine with Ruby, as a developer
  # on Alpine installs Fledge, with Bundler, from the tag, fledge build
  # downloads the musl runtime from the release, checked against the
  # gem's pins, and builds hello and my_cool_app; then a bare Alpine with
  # no Ruby runs each, as ci.yml's Delivery does.
  installed-musl:
    name: Install, build, and deliver (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/my_cool_app
            test/fixtures/parity
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checks
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Install Fledge from the tag in Alpine, and build hello, the parity probe, and my_cool_app
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/install.sh" <<'SH'
          set -eu
          /checks/.github/scripts/alpine-packages.sh apps
          mkdir -p /project
          printf 'source "https://rubygems.org"\ngem "fledge", git: "https://github.com/setdef/Fledge", tag: "%s"\n' "$TAG" > /project/Gemfile
          cd /project
          bundle install
          bundle exec fledge --version
          export XDG_CACHE_HOME=/tmp/cache
          for app in examples/hello test/fixtures/parity examples/my_cool_app; do
            bundle exec fledge build -o /work/dist "/work/$app" 2>> /tmp/build.err
          done
          cat /tmp/build.err
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" /tmp/build.err
          cd /work/examples/my_cool_app && bundle install && bundle exec ruby exe/my_cool_app > /work/dist/my_cool_app.expected
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/checks:/checks" -v "$RUNNER_TEMP:/scripts" -e TAG \
            "$ALPINE_RUBY" sh /scripts/install.sh

      - name: Run hello and my_cool_app on Alpine with no Ruby installed
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work -e PLATFORM "$ALPINE" sh -c '
          checks/.github/scripts/deliver.sh "dist/Hello-$PLATFORM.tar.gz" "dist/Parity-$PLATFORM.tar.gz" "Hello from Ruby 4.0.9 on $PLATFORM" --no-ruby-installed &&
          checks/.github/scripts/deliver.sh "dist/MyCoolApp-$PLATFORM.tar.gz" "dist/Parity-$PLATFORM.tar.gz" "$(cat dist/my_cool_app.expected)" --no-ruby-installed'

  # A phone's project from the tag (ADR 012): fledge build ios on a Mac and
  # fledge build android on Linux, installed from the tag with Bundler,
  # download that version's mobile runtime from the release, checked
  # against the gem's pins, and write the projects of examples/hello and
  # examples/mobile_app, which each system's own tools then build, as a
  # developer builds them: xcodebuild for the iOS Simulator, unsigned,
  # with XcodeGen installed as the README says; and each project's Gradle
  # wrapper, with the runner's Android SDK.
  installed-mobile:
    name: Install, and build phones' projects (${{ matrix.phone }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            phone: ios
          - os: ubuntu-24.04
            phone: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/mobile_app
            mise.toml
            runtime/sources.yml
          sparse-checkout-cone-mode: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode, and install XcodeGen, pinned by SHA-256
        if: matrix.phone == 'ios'
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          url=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcodegen", "url")')
          sha256=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcodegen", "sha256")')
          curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused -o "$RUNNER_TEMP/xcodegen.zip" "$url"
          echo "$sha256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Use Java 21
        if: matrix.phone == 'android'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Install Fledge from the tag with Bundler
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          cat > "$RUNNER_TEMP/project/Gemfile" <<GEMFILE
          source "https://rubygems.org"
          gem "fledge", git: "https://github.com/setdef/Fledge", tag: "$TAG"
          GEMFILE
          cd "$RUNNER_TEMP/project"
          bundle install
          bundle exec fledge --version

      # No FLEDGE_RUNTIME_DIR and an empty cache: the runtime must come
      # from the release, checked against the gem's pins.
      - name: Write hello's and mobile_app's projects with the runtime from the release
        env:
          TAG: ${{ inputs.tag }}
          PHONE: ${{ matrix.phone }}
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          for app in examples/hello examples/mobile_app; do
            bundle exec fledge build "$PHONE" -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/$app" 2>> "$RUNNER_TEMP/build.err"
          done
          cat "$RUNNER_TEMP/build.err"
          grep -F "Downloading fledge-runtime-" "$RUNNER_TEMP/build.err" | grep -F -- "-$PHONE.tar.gz"
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" "$RUNNER_TEMP/build.err"
          ls -l "$XDG_CACHE_HOME/fledge/runtimes" "$RUNNER_TEMP/dist"

      - name: Build each Xcode project for the iOS Simulator and, unsigned, for devices
        if: matrix.phone == 'ios'
        run: |
          for name in Hello "Mobile App"; do
            for sdk in iphonesimulator iphoneos; do
              xcodebuild -project "$RUNNER_TEMP/dist/$name-ios/$name.xcodeproj" -scheme "$name" -sdk "$sdk" \
                -derivedDataPath "$RUNNER_TEMP/derived" build CODE_SIGNING_ALLOWED=NO -quiet
            done
          done

      - name: Build each Gradle project with its wrapper
        if: matrix.phone == 'android'
        run: |
          for name in Hello "Mobile App"; do
            (cd "$RUNNER_TEMP/dist/$name-android" && ./gradlew --no-daemon --quiet assembleDebug assembleRelease)
            ls "$RUNNER_TEMP/dist/$name-android/build/outputs/apk/debug" "$RUNNER_TEMP/dist/$name-android/build/outputs/apk/release"
          done

  # The built gem, which holds only what the gemspec's file list packs: a
  # tag's checkout has every file, so the jobs above cannot show a file the
  # list forgot, and from 1.0.0 people install this .gem from RubyGems.org
  # (Plan 003, "Fledge on RubyGems.org"). One Linux runner builds it, as a
  # person builds the one gem they push, and each platform installs that
  # file, with no Fledge checkout, and builds and delivers hello and the
  # windowed app, builds an app --from one that carries its tools, and on
  # a Mac and on Linux writes a phone's project from the gem's templates.
  gem:
    name: Build the gem from the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Build the gem from what the tag tracks
        run: gem build fledge.gemspec --output "$RUNNER_TEMP/fledge.gem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fledge-gem
          path: ${{ runner.temp }}/fledge.gem
          if-no-files-found: error
          retention-days: 14

  installed-gem:
    name: Install the built gem, build, and deliver (${{ matrix.platform }})
    needs: gem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            ruby-platform: arm64-darwin23
          - os: ubuntu-24.04
            platform: x86_64-linux
            ruby-platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-platform: x64-mingw-ucrt
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            ruby-platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/windowed_app
            test/fixtures/parity
            mise.toml
            runtime/sources.yml
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checks
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Put the checks where the steps run them
        run: |
          mkdir -p .github
          cp -R checks/.github/scripts .github/scripts

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fledge-gem
          path: ${{ runner.temp }}/gem

      # --local, and bundle install --local: only this file can answer.
      - name: Install the built gem, and name it in a Gemfile as RubyGems would resolve it
        env:
          TAG: ${{ inputs.tag }}
        run: |
          gem install --local --no-document "$RUNNER_TEMP/gem/fledge.gem"
          mkdir -p "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          printf 'source "https://rubygems.org"\ngem "fledge", "%s"\n' "${TAG#v}" > Gemfile
          bundle install --local
          bundle exec fledge --version
          fledge --version

      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      # hello through the gem's own executable, as after gem install, and
      # the others through bundle exec, as with a Gemfile.
      - name: Build hello, the parity probe, and windowed_app with runtimes from the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          fledge build -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/examples/hello" 2>> "$RUNNER_TEMP/build.err"
          for app in test/fixtures/parity examples/windowed_app; do
            bundle exec fledge build -o "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE/$app" 2>> "$RUNNER_TEMP/build.err"
          done
          cat "$RUNNER_TEMP/build.err"
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" "$RUNNER_TEMP/build.err"

      # With an empty cache and a mirror that answers nothing, so --from
      # can only have what the gem and the app carry.
      - name: Build an app with build_tools, and another --from it with no runtime at hand
        run: |
          unset FLEDGE_RUNTIME_DIR
          mkdir -p "$RUNNER_TEMP/player" "$RUNNER_TEMP/game"
          printf 'puts "player"\n' > "$RUNNER_TEMP/player/main.rb"
          printf 'name: Player\nbuild_tools: true\n' > "$RUNNER_TEMP/player/fledge.yml"
          printf 'puts "game"\n' > "$RUNNER_TEMP/game/main.rb"
          printf 'name: Game\n' > "$RUNNER_TEMP/game/fledge.yml"
          cd "$RUNNER_TEMP/project"
          XDG_CACHE_HOME="$RUNNER_TEMP/cache" bundle exec fledge build -o "$RUNNER_TEMP/from" "$RUNNER_TEMP/player"
          XDG_CACHE_HOME="$RUNNER_TEMP/empty" FLEDGE_RUNTIME_MIRROR=http://127.0.0.1:9 \
            bundle exec fledge build --from "$RUNNER_TEMP/from/Player-${{ matrix.platform }}" -o "$RUNNER_TEMP/from" "$RUNNER_TEMP/game"
          [ "$("$RUNNER_TEMP/from/Game-${{ matrix.platform }}/Game" | tr -d '\r')" = game ]

      - name: Install XcodeGen, pinned by SHA-256
        if: matrix.platform == 'arm64-darwin'
        run: |
          url=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcodegen", "url")')
          sha256=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcodegen", "sha256")')
          curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused -o "$RUNNER_TEMP/xcodegen.zip" "$url"
          echo "$sha256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Write hello's iOS project from the gem's templates
        if: matrix.platform == 'arm64-darwin'
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          bundle exec fledge build ios -o "$RUNNER_TEMP/phones" "$GITHUB_WORKSPACE/examples/hello"
          test -f "$RUNNER_TEMP/phones/Hello-ios/project.yml"
          test -f "$RUNNER_TEMP/phones/Hello-ios/Host/main.m"

      - name: Write hello's Android project from the gem's templates
        if: matrix.platform == 'x86_64-linux'
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/project"
          bundle exec fledge build android -o "$RUNNER_TEMP/phones" "$GITHUB_WORKSPACE/examples/hello"
          test -x "$RUNNER_TEMP/phones/Hello-android/gradlew"
          test -f "$RUNNER_TEMP/phones/Hello-android/gradle/wrapper/gradle-wrapper.jar"

      - name: Run hello as someone with no Ruby would
        if: runner.os != 'Windows'
        run: |
          .github/scripts/deliver.sh "$RUNNER_TEMP/dist/Hello-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.ruby-platform }}"

      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        if: runner.os != 'Windows'
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.dmg"

      - name: Install FUSE
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fuse3=3.14.0-5build1

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.AppImage" fuse

      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}-setup.exe"

      - name: Start Hello Window.exe as Explorer would
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/dist/Hello Window-${{ matrix.platform }}.zip"

      - name: Run Hello.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/dist/Hello-${{ matrix.platform }}.zip"
          -Probe "$env:RUNNER_TEMP/dist/Parity-${{ matrix.platform }}.zip" -Platform ${{ matrix.platform }}
          -Expected "Hello from Ruby 4.0.9 on ${{ matrix.platform }}"

  installed-gem-musl:
    name: Install the built gem, build, and deliver (${{ matrix.platform }})
    needs: gem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            examples/hello
            examples/windowed_app
            test/fixtures/parity
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checks
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fledge-gem
          path: gem

      - name: Install the built gem in Alpine, and build hello, the parity probe, and windowed_app
        env:
          TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cat > "$RUNNER_TEMP/install.sh" <<'SH'
          set -eu
          /checks/.github/scripts/alpine-packages.sh apps
          gem install --local --no-document /work/gem/fledge.gem
          mkdir -p /project
          printf 'source "https://rubygems.org"\ngem "fledge", "%s"\n' "${TAG#v}" > /project/Gemfile
          cd /project
          bundle install --local
          bundle exec fledge --version
          fledge --version
          export XDG_CACHE_HOME=/tmp/cache
          fledge build -o /work/dist /work/examples/hello 2>> /tmp/build.err
          for app in test/fixtures/parity examples/windowed_app; do
            bundle exec fledge build -o /work/dist "/work/$app" 2>> /tmp/build.err
          done
          cat /tmp/build.err
          grep -F "https://github.com/setdef/Fledge/releases/download/$TAG" /tmp/build.err
          mkdir -p /tmp/player /tmp/game
          printf 'puts "player"\n' > /tmp/player/main.rb
          printf 'name: Player\nbuild_tools: true\n' > /tmp/player/fledge.yml
          printf 'puts "game"\n' > /tmp/game/main.rb
          printf 'name: Game\n' > /tmp/game/fledge.yml
          bundle exec fledge build -o /tmp/from /tmp/player
          XDG_CACHE_HOME=/tmp/empty FLEDGE_RUNTIME_MIRROR=http://127.0.0.1:9 \
            bundle exec fledge build --from "/tmp/from/Player-$PLATFORM" -o /tmp/from /tmp/game
          [ "$("/tmp/from/Game-$PLATFORM/Game")" = game ]
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/checks:/checks" -v "$RUNNER_TEMP:/scripts" -e TAG -e PLATFORM \
            "$ALPINE_RUBY" sh /scripts/install.sh

      - name: Run hello and windowed_app on Alpine with no Ruby installed
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cat > "$RUNNER_TEMP/deliver.sh" <<'SH'
          set -eu
          checks/.github/scripts/alpine-packages.sh deliver
          checks/.github/scripts/deliver.sh "dist/Hello-$PLATFORM.tar.gz" "dist/Parity-$PLATFORM.tar.gz" "Hello from Ruby 4.0.9 on $PLATFORM" --no-ruby-installed
          checks/.github/scripts/deliver-windowed.sh "dist/Hello Window-$PLATFORM.tar.gz"
          checks/.github/scripts/deliver-appimage.sh "dist/Hello Window-$PLATFORM.AppImage" extract
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/scripts" -w /work -e PLATFORM "$ALPINE" sh /scripts/deliver.sh
