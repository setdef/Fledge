# Trial for experiment/ci-lookup only: release.yml's lookup of green CI
# runs (tasks/ci_runs.rb) and its pin check (.github/scripts/check-pins.sh)
# against 0.2.1's real runs, 41656379469 (8269dd3) and 41662135309
# (10c8a9b), and the runtimes the first one built.

name: CI

on:
  push:
    branches: ["experiment/ci-lookup"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lookup:
    name: Lookup and pins, as release.yml runs them
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: 8269dd338c043b1d7851134666ca2cd8fe4ae09e
      PINNED: 10c8a9be14e3fd1540888f6c3a911ac105d6f41e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: The tagged commit's run is green
        run: |
          run=$(ruby tasks/ci_runs.rb green "$PINNED")
          echo "tagged: $run"
          [ "$run" = 41662135309 ]

      - name: The release commit's run is green on every job
        run: |
          run=$(ruby tasks/ci_runs.rb green "$RELEASE" --every-job)
          echo "release: $run"
          [ "$run" = 41656379469 ]
          echo "RUN=$run" >> "$GITHUB_ENV"

      - name: A commit with no run is refused, with an annotation
        run: |
          if ruby tasks/ci_runs.rb green 0000000000000000000000000000000000000000 > out.txt 2> err.txt; then exit 1; fi
          cat err.txt
          grep -q '^::error::0000000000000000000000000000000000000000 has no run of ci.yml on a push to trunk' err.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          merge-multiple: true
          path: release
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: The runtimes match 0.2.1's pins
        run: .github/scripts/check-pins.sh release lib/fledge/SHA256SUMS

      - name: A wrong pin is refused
        run: |
          ruby -e 's = File.read(ARGV[0]); s[0] = (s[0] == "0" ? "1" : "0"); print s' lib/fledge/SHA256SUMS > "$RUNNER_TEMP/wrong"
          if cmp -s lib/fledge/SHA256SUMS "$RUNNER_TEMP/wrong"; then exit 1; fi
          if .github/scripts/check-pins.sh release "$RUNNER_TEMP/wrong"; then exit 1; fi
