# What the license audit finds in RubyInstaller's whole ARM64 tree, which a
# runtime prunes (ci.yml, Licenses of the whole upstream tree): MSYS2's
# package-signing keyring, GPL, which only ridk uses. GMP passes as a
# replaceable shared library with its source pinned.
- "policy: packages/msys2-keyring-"
- "missing-notice: msys2-keyring "
# nkf ships JRuby's Java sources (EPL-2.0 OR LGPL-2.1-or-later) in its
# folder and in its cached .gem; a runtime prunes them
# (RuntimeBuilder::Pruning.prune_jruby).
- "copyleft-text: lib/ruby/gems/4.1.0+6/gems/nkf-0.3.0/ext/java/"
- "copyleft-text: lib/ruby/gems/4.1.0+6/cache/nkf-0.3.0.gem!ext/java/"
# RubyInstaller's head build ships no libz-1.dll, which its zlib.so
# imports; a runtime adds it from MSYS2's package (runtime/sources.yml,
# windows-dlls).
- "unresolved: lib/ruby/4.1.0+6/aarch64-mingw-ucrt/zlib.so: needs libz-1.dll"
# RubyInstaller's own ruby.exe and rubyw.exe are Ruby's main.c alone; a
# runtime's carry Fledge's code beside it (runtime/launcher/ruby_main.c and
# windows_relaunch.c, ADR 089), which the audit looks for by a string of
# windows_relaunch.c's.
- "stale: bin/ruby.exe: should hold Fledge launcher and RubyGems defaults"
- "stale: bin/rubyw.exe: should hold Fledge launcher and RubyGems defaults"
