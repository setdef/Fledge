# rake_phone is a lone script with a gem from rubygems.org whose
# extensions a Rakefile builds, not an extconf.rb. It sits inside
# Fledge's own gem, so without this file fledge build would take
# Fledge's Gemfile for its own (ADR 005). The identifier is what iOS and
# Android know it by (ADR 012).
name: RakePhone
identifier: com.setdef.fledge.RakePhone
