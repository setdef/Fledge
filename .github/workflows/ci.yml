# The trial of ADR 027 on the experiment/cmake-phone branch: only the
# Mobile apps jobs, building examples/cmake_phone (and native_phone
# beside it) with fledge build ios and fledge build android, with the
# runtimes of trunk's run 41764673083 (19efbfa), since the change touches
# no runtime.
name: CI
on:
  push:
    branches:
      - experiment/cmake-phone
permissions:
  contents: read
  actions: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: 'false'
  BUNDLE_FROZEN: 'true'
  RUNTIMES_RUN: '41764673083'
jobs:
  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad)
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes
          cmake --version

      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - name: Build the apps with fledge build ios, and run them in the iOS Simulator
        run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-apps-ios
          path: |
            tmp/mobile-parity/ios/*.ndjson
            tmp/mobile-parity/ios/*.log
            tmp/mobile-parity/ios/*.ips
          retention-days: 14

  mobile-apps-android:
    name: Mobile apps (Android emulator, API 36, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          cmake --version

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-x86_64-linux
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - name: Install the pinned NDK
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile ndk hosts x86_64-linux)
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_ROOT=$(echo "$RUNNER_TEMP"/ndk/android-ndk-*)" >> "$GITHUB_ENV"

      - name: Build the apps with fledge build android and Gradle, and check each for 16 KB pages and API 36
        run: ruby tasks/mobile_parity.rb android-build "$RUNNER_TEMP/runtimes"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the apps on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ruby tasks/mobile_parity.rb android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-apps-android-${{ matrix.target }}
          path: tmp/mobile-parity/android/logcat-*.txt
          retention-days: 14
