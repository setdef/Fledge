# Trial for experiment/musl-apk only: the two musl Runtime jobs.
# SPDX-FileCopyrightText: 2026 Kerrick Long <me@kerricklong.com>
# SPDX-License-Identifier: AGPL-3.0-or-later

# Plan 001's pipeline, on every push and pull request: the gate, then a
# runtime per platform, then the tests on each platform with its own
# runtime, then each platform building the examples for itself on a
# runner of its own (ADR 010), then Delivery: each built app unpacked and
# run on a fresh computer that has never had Ruby.
#
# The gate runs once, on Linux: its lints (RuboCop, Steep, RDoc
# coverage, REUSE, actionlint, clang-format) read the same files on
# every OS, so one run answers for all three.
#
# A pushed pin commit, which changes only lib/fledge/SHA256SUMS (ADR
# 014, section 5), runs only the gate and a check that its pins match
# the runtimes of its parent's run; every other job is skipped (the
# Changes job). Every other commit runs everything below.
#
# The macOS and Linux runtimes build on each platform's own runner
# (macos-15 is Apple Silicon, ubuntu-24.04-arm is aarch64), because their
# launchers link Ruby itself. The Windows runtime builds on Linux: its
# launcher loads Ruby's DLL when it runs, so it cross-compiles with a
# pinned llvm-mingw from Ruby's headers alone (runtime/sources.yml), and
# Windows runners test it, build apps with it, and deliver them. Each
# platform's apps are built on that platform, as developers build them.
#
# A windowed app gets an installer too (ADR 009): a disk image for macOS,
# an NSIS setup program for Windows, and an AppImage for Linux (and a
# .deb, which windowed_app asks for), each written on its own platform's
# runner; and Delivery installs each on a
# fresh runner and runs the app it installed.
#
# The mobile runtimes (ADR 011) build from Ruby's source, iOS's on a Mac
# with Xcode and Android's on Linux with the NDK, and their Delivery is
# apps built with fledge build ios and fledge build android (ADR 012),
# whose Xcode and Gradle projects build unsigned, run in the iOS
# Simulator on an iPhone and an iPad and on Android emulators with 4 KB
# and 16 KB pages: hello, a gem-shaped app with pure-Ruby gems, a script
# that requires json and a bundled gem and reaches a server over HTTPS,
# and the parity probe (tasks/mobile_parity.rb).
#
# Every runtime build runs the license audit and refuses to archive a
# runtime that breaks Fledge's license policy (ADR 004). The Licenses
# jobs check what it wrote and that it still fails on GPL code; the
# upstream jobs show it catching what rv-ruby and RubyInstaller ship and
# runtimes remove; the licensing page job keeps doc/licensing.md true to
# the runtimes; and the Replace jobs prove that whoever receives an app
# can replace its LGPL libraries, as that page tells developers.
#
# release.yml, on a v* tag, publishes the runtimes this workflow built
# from the release commit, once it has passed on trunk on the release
# commit and on the pin commit tagged (ADR 014). It looks those runs up
# and does not run this again. Nothing here, or ever, publishes to
# RubyGems.org (ADR 001).

name: CI

on:
  push:
    branches: ["experiment/musl-apk"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds where they exist
  # (mise's Ruby documentation); false makes a missing build fail instead
  # of compiling Ruby for ten minutes.
  MISE_RUBY_COMPILE: "false"
  # The Rust that compiles the examples' Rust gems in the Build from
  # source jobs, the release Ferro's gems are tested with (its mise.toml).
  RUST_TOOLCHAIN: "1.99.1"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # musl Linux (ADR 017): the Alpine a developer with Ruby builds apps
  # on, and the bare Alpine Delivery runs them on, pinned by digest.
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

jobs:
  runtime-musl:
    name: Runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime in Alpine
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e SOURCE_DATE_EPOCH -e PLATFORM "$ALPINE_RUBY" \
            sh -c '.github/scripts/alpine-packages.sh build && ruby tasks/runtime_builder.rb "$PLATFORM"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: runtime-${{ matrix.platform }}-logs
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

