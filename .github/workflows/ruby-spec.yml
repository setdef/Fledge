# ruby/spec on stock Ruby and in a built app, on the same runner, from
# the same runtime (tasks/ruby_spec.rb): every example that fails on one
# side only fails the job unless RubySpec::JUSTIFIED explains it (ADR
# 003; doc/contributors/design/parity.md, "ruby/spec"; AGENTS.md, Design
# precedence 2).
#
# ci.yml calls this on every push, once its runtimes are built, for
# x86_64-linux and arm64-darwin and in phone apps, in the iOS Simulator
# and on Android emulators (tasks/ruby_spec/phone.rb), and for all seven
# desktop platforms too on a release commit ("chore: release X.Y.Z"),
# whose run a release publishes from (ADR 053). Every night, and when
# run by hand, it runs all of them on the runtimes of trunk's newest run
# of ci.yml that passed. A desktop run costs about 3 to 4 minutes on
# Linux and macOS and 12 to 16 on Windows (experiment/ruby-spec, run
# 41776558621).

name: ruby/spec

on:
  workflow_call:
    inputs:
      full:
        description: Run on all seven desktop platforms, not only x86_64-linux and arm64-darwin
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Downloading the runtimes of trunk's newest green run, at night.
  actions: read

defaults:
  run:
    shell: bash

env:
  MISE_RUBY_COMPILE: "false"
  ALPINE_RUBY: ruby:4.1.0-preview1-alpine3.24@sha256:3377ef9d7e5c4c430ccc9c3459d172158c575771e1aac2010702dee54388ace0

jobs:
  # Which platforms, and whose runtimes: the calling run's, or at night
  # trunk's newest run of ci.yml that passed.
  plan:
    name: ruby/spec's platforms and runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Choose
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          REPOSITORY: ${{ github.repository }}
        run: |
          run=""
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            FULL=true
            # A pin commit's short run passes too, and holds no runtimes: take
            # the newest passing run that has them.
            for candidate in $(gh run list --repo "$REPOSITORY" --workflow ci.yml --branch trunk --event push --status success \
              --limit 20 --json databaseId --jq '.[].databaseId'); do
              if [ "$(gh api "repos/$REPOSITORY/actions/runs/$candidate/artifacts" \
                --jq '[.artifacts[]|select(.name=="runtime-x86_64-linux" and .expired==false)]|length')" != 0 ]; then
                run=$candidate
                break
              fi
            done
            [ -n "$run" ] || { echo "::error::trunk has no run of ci.yml that passed and still holds its runtimes"; exit 1; }
            echo "Runtimes of $GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$run"
          fi
          two='{"os":"ubuntu-24.04","platform":"x86_64-linux"},{"os":"macos-15","platform":"arm64-darwin"}'
          rest='{"os":"ubuntu-24.04-arm","platform":"aarch64-linux"},{"os":"windows-latest","platform":"x64-mingw-ucrt",'
          rest+='"mise":"http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2"},'
          rest+='{"os":"windows-11-arm","platform":"aarch64-mingw-ucrt","mise":"http:rubyinstaller-head http:msys2-zlib http:msys2"},{"os":"ubuntu-24.04","platform":"x86_64-linux-musl"},'
          rest+='{"os":"ubuntu-24.04-arm","platform":"aarch64-linux-musl"}'
          if [ "$FULL" = true ]; then matrix="[$two,$rest]"; else matrix="[$two]"; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  specs:
    name: ruby/spec (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.run == ''
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.run != ''
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ github.token }}

      # The pinned Ruby the runtime came from, and ruby/spec and MSpec,
      # keyed by the files that pin their SHA-256s. The comparison checks
      # every cached file's SHA-256 again before using it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: ruby-spec-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml', 'tasks/ruby_spec.rb') }}

      # Ruby at mise.toml's pin; on Windows, RubyInstaller's build the
      # runtime came from, with the DLLs it lacks and its MSYS2, named by
      # matrix.mise, and PATH holds the tools' own folders, not shims.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: "!endsWith(matrix.platform, '-musl')"
        # mise-action unpacks mise under os.tmpdir(), which is TEMP on
        # Windows, then renames it into mise_dir; a rename cannot leave
        # its drive, so the unpacking happens on mise_dir's drive too.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise || 'ruby' }}
          add_shims_to_path: ${{ runner.os != 'Windows' }}
          mise_dir: ${{ runner.os == 'Windows' && format('{0}\mise', runner.temp) || '' }}

      # What setup-ruby gave a Windows job beyond mise.toml's environment
      # (TMPDIR above all), so builds see what they saw under it.
      - name: Give Windows' Ruby the rest of setup-ruby's environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - name: Compare stock Ruby and the built app
        if: "!endsWith(matrix.platform, '-musl')"
        env:
          FLEDGE_RUNTIME_DIR: runtimes
          RUBY_SPEC_OUT: ${{ runner.temp }}/ruby-spec
          PLATFORM: ${{ matrix.platform }}
        run: ruby tasks/ruby_spec.rb "$PLATFORM"

      # In Alpine, as the musl runtimes build and their parity runs (ci.yml).
      - name: Compare stock Ruby and the built app, in Alpine
        if: endsWith(matrix.platform, '-musl')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -v "$RUNNER_TEMP:/out" -v "$GITHUB_STEP_SUMMARY:/summary.md" -w /fledge
          -e PLATFORM -e FLEDGE_RUNTIME_DIR=/fledge/runtimes -e RUBY_SPEC_OUT=/out/ruby-spec -e GITHUB_STEP_SUMMARY=/summary.md
          "$ALPINE_RUBY"
          sh -c '.github/scripts/alpine-packages.sh apps && git config --global --add safe.directory /fledge &&
          ruby tasks/ruby_spec.rb "$PLATFORM"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ruby-spec-${{ matrix.platform }}
          path: ${{ runner.temp }}/ruby-spec
          if-no-files-found: warn
          retention-days: 14

  # The same in a phone app (tasks/ruby_spec/phone.rb): ruby/spec in an
  # app built with fledge build ios, and its Xcode project with
  # xcodebuild, run in the iOS Simulator on an iPhone and an iPad, its
  # output read from os_log, and compared with ruby main.rb on this Mac's
  # stock Ruby, the release the arm64-darwin runtime is made from, which
  # must be the phone runtime's version and revision. What no phone can
  # run is left out of both runs (RubySpec::Phone::EXCLUDED).
  ios:
    name: ruby/spec (iOS Simulator, iPhone and iPad)
    needs: plan
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.run == ''
        with:
          name: runtime-ios
          path: runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.run != ''
        with:
          name: runtime-ios
          path: runtimes
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: ruby-spec-downloads-ios-${{ hashFiles('runtime/sources.yml', 'tasks/ruby_spec.rb') }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes

      # XcodeGen writes the app's Xcode project in fledge build ios, as a
      # developer installs it; pinned by SHA-256.
      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Compare stock Ruby and the app in the iOS Simulator
        env:
          RUBY_SPEC_OUT: ${{ runner.temp }}/ruby-spec
        run: ruby tasks/ruby_spec.rb ios runtimes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ruby-spec-ios
          path: ${{ runner.temp }}/ruby-spec
          if-no-files-found: warn
          retention-days: 14

  # The same on Android emulators of API 36 with 4 KB and with 16 KB
  # pages, as ci.yml's Mobile apps jobs run theirs: the app built with
  # fledge build android and its Gradle wrapper as a debug APK, and
  # compared with ruby main.rb on this runner's stock Ruby, the release
  # the x86_64-linux runtime is made from. GitHub's Linux runners
  # emulate only x86_64.
  android:
    if: false
    name: ruby/spec (Android emulator, API 36, ${{ matrix.target }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.run == ''
        with:
          name: runtime-android
          path: runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.run != ''
        with:
          name: runtime-android
          path: runtimes
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: ruby-spec-downloads-android-${{ hashFiles('runtime/sources.yml', 'tasks/ruby_spec.rb') }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # Every Gradle wrapper in a project fledge build writes must be the
      # one Gradle released (runtime/sources.yml pins its SHA-256 too).
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run stock Ruby, and build the app with fledge build android and Gradle
        env:
          RUBY_SPEC_OUT: ${{ runner.temp }}/ruby-spec
        run: ruby tasks/ruby_spec.rb android-build runtimes

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 4 GB of RAM, as ci.yml's Mobile apps jobs give theirs.
      - name: Compare stock Ruby and the app on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RUBY_SPEC_OUT: ${{ runner.temp }}/ruby-spec
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ruby tasks/ruby_spec.rb android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ruby-spec-android-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/ruby-spec
            tmp/ruby-spec-android-work/logcat-*.txt
          if-no-files-found: warn
          retention-days: 14
