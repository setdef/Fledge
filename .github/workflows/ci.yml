# Experiment only, never for trunk: binding.irb under bundle exec on
# stock Ruby, on Windows and on Linux for comparison.
name: CI

on:
  push:
    branches: ["experiment/win-irb"]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  BUNDLE_FROZEN: "false"

jobs:
  stock-irb:
    name: Stock binding.irb (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-24.04]
    steps:
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0.9"

      # Stock Ruby under bundle exec, in a bundle of the system's gems that
      # names neither irb nor fiddle, then one that names fiddle.
      - name: binding.irb under bundle exec on stock Ruby
        run: |
          unset BUNDLE_FROZEN BUNDLE_PATH BUNDLE_GEMFILE
          gem list "^(irb|reline|fiddle|json)$"
          for extra in "" 'gem "fiddle"'; do
            dir="$RUNNER_TEMP/stock-irb-${#extra}"
            mkdir -p "$dir"
            cd "$dir"
            printf 'source "https://rubygems.org"\ngem "json"\n%s\n' "$extra" > Gemfile
            bundle install --local
            bundle config
            set +e
            printf 'answer\nexit\n' | bundle exec ruby -e 'answer = 42; binding.irb'
            echo "exit status $? with Gemfile extra: ${extra:-none}"
            set -e
          done
