# Experiment only (experiment/ruby-spec), never for trunk: ruby/spec, run
# by MSpec, on the Ruby each runtime was made from (ruby main.rb) and in
# an app fledge build made from that runtime, clean and under Delivery's
# hostile environment. The runtimes are trunk's, from CI run RUN at
# 19efbfa. The outputs are the run's artifacts, compared off the runner.

name: ruby/spec

on:
  push:
    branches: ["experiment/ruby-spec"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  RUN: "41764673083"
  SPEC: 47b10f1d7b1c29bda01d6903cceddd5b0b4c857d
  MSPEC: 521207f313abfaffd56dca274475c56012f90221
  MISE_RUBY_COMPILE: "false"
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3

jobs:
  specs:
    name: ruby/spec (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: x86_64-linux }
          - { os: macos-15, platform: arm64-darwin }
          - { os: windows-latest, platform: x64-mingw-ucrt }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: windows-11-arm, platform: aarch64-mingw-ucrt }
          - { os: ubuntu-24.04, platform: x86_64-linux-musl }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl }
    steps:
      # As ruby/spec's own CI: its fixtures compare bytes.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ruby/spec
          ref: ${{ env.SPEC }}
          path: spec-src
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ruby/mspec
          ref: ${{ env.MSPEC }}
          path: mspec-src
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows' && !endsWith(matrix.platform, '-musl')
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - name: Install the bundle
        if: "!endsWith(matrix.platform, '-musl')"
        run: bundle install

      - name: Run ruby/spec
        if: "!endsWith(matrix.platform, '-musl')"
        run: bundle exec ruby .github/ruby_spec/run.rb "${{ matrix.platform }}" runtimes spec-src mspec-src "$RUNNER_TEMP/ruby-spec"

      - name: Run ruby/spec, in Alpine
        if: endsWith(matrix.platform, '-musl')
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -v "$RUNNER_TEMP:/out" -w /fledge -e RUBY_SPEC_NO_BUNDLE=1 "$ALPINE_RUBY"
          sh -c '.github/scripts/alpine-packages.sh apps && git config --global --add safe.directory /fledge &&
          ruby .github/ruby_spec/run.rb "${{ matrix.platform }}" runtimes spec-src mspec-src /out/ruby-spec'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ruby-spec-${{ matrix.platform }}
          path: ${{ runner.temp }}/ruby-spec
          if-no-files-found: warn
