#
# XcodeGen's description of the mobile parity check's iOS and iPadOS
# host app (main.m). tasks/mobile_parity/ios.rb copies the runtime's
# FledgeRuby.xcframework, the Ruby of the slice it builds (ruby/), and
# the scripts (app/) into staged/ beside this file, runs xcodegen, and
# builds the project with xcodebuild, unsigned.
name: FledgeParity
options:
  bundleIdPrefix: org.setdef.fledge
  deploymentTarget:
    iOS: "15.0"
targets:
  FledgeParity:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: main.m
      - path: staged/ruby
        type: folder
        buildPhase: resources
      - path: staged/app
        type: folder
        buildPhase: resources
    dependencies:
      - framework: staged/FledgeRuby.xcframework
        embed: false
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: org.setdef.fledge.parity
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
