# Plan 001's pipeline, on every push and pull request: the gate, then a
# runtime per platform, then the tests on each platform with its own
# runtime, then each platform building the examples for itself on a
# runner of its own (ADR 010), then Delivery: each built app unpacked and
# run on a fresh computer that has never had Ruby.
#
# The gate runs once, on Linux: its lints (RuboCop, Steep, RDoc
# coverage, REUSE, actionlint, clang-format) read the same files on
# every OS, so one run answers for all three.
#
# A pushed pin commit, which changes only lib/fledge/SHA256SUMS
# (doc/contributors/design/releases.md, "A pin commit's short CI"),
# runs only the gate and a check that its pins match the runtimes of
# its parent's run; every other job is skipped (the Changes job). Every other commit runs everything below.
#
# The macOS and Linux runtimes build on each platform's own runner
# (macos-26 is Apple Silicon, ubuntu-24.04-arm is aarch64), because their
# launchers link Ruby itself. The Windows runtime builds on Linux: its
# launcher loads Ruby's DLL when it runs, so it cross-compiles with a
# pinned llvm-mingw from Ruby's headers alone (runtime/sources.yml), and
# Windows runners test it, build apps with it, and deliver them. Each
# platform's apps are built on that platform, as developers build them.
#
# Each macOS job names the label whose Xcode or macOS is part of what it
# proves, never macos-latest, which moves (doc/contributors/design/
# releases.md, "Which macOS each job runs on"): macos-26, the macOS 26
# floor, for every job that builds a Mac's apps or runs them, and for
# the Xcode 26.5 the arm64-darwin runtime and the iOS jobs build with.
#
# A windowed app gets an installer too: a disk image for macOS,
# an NSIS setup program for Windows, and an AppImage for Linux (and a
# .deb and an MSIX package, which windowed_app asks for), each written
# on its own platform's runner; and Delivery installs each on a fresh
# runner and runs the app it installed.
#
# The mobile runtimes (ADR 099) build from Ruby's source, iOS's on a Mac
# with Xcode and Android's on Linux with the NDK, and their Delivery is
# apps built with fledge build ios and fledge build android (ADR 012),
# whose Xcode and Gradle projects build unsigned, the Gradle ones as APKs
# and as the app bundles Google Play takes, run in the iOS Simulator on an
# iPhone and an iPad and on Android emulators with 4 KB and 16 KB pages,
# from an APK and from a bundle's APKs: hello, a gem-shaped app with pure-Ruby gems, a script
# that requires json and a bundled gem and reaches a server over HTTPS,
# and the parity probe (tasks/mobile_parity.rb).
#
# Every runtime build runs the license audit and refuses to archive a
# runtime that breaks Fledge's license policy. The Licenses
# jobs check what it wrote and that it still fails on GPL code; the
# upstream jobs show it catching what rv-ruby, jdx/ruby, and
# RubyInstaller ship and runtimes remove; the licensing page job keeps
# doc/licensing.md true to the runtimes; and the Replace jobs prove that
# whoever receives an app can replace its LGPL libraries, as that page
# tells developers.
#
# ruby/spec runs on stock Ruby and in a built app from each runtime,
# desktop and phone, and any example that fails on one side only, unless
# justified, fails the job (ruby-spec.yml, tasks/ruby_spec.rb).
#
# release.yml, on a v* tag, publishes the runtimes this workflow built
# from the release commit, once it has passed on trunk on the release
# commit and on the pin commit tagged. It looks those runs up
# and does not run this again. Nothing here, or ever, publishes to
# RubyGems.org (doc/contributors/design/releases.md, "Where releases
# are").

name: CI

on:
  push:
    # Not on tags: release.yml looks up the tagged commit's run on trunk.
    # Not on other branches either: a full run asks for about an hour of
    # several macOS and Windows runners, and a branch's run is started on
    # purpose (gh workflow run ci.yml --ref BRANCH), as pin-watch.yml and
    # cut.yml start theirs (doc/contributors/design/releases.md, "Runs,
    # batches, and the release commit").
    branches: [trunk]
  pull_request:
  # pin-watch.yml starts a run on the branch pin-move to prove a move of
  # the pins, and on trunk after it lands a move rebased there, since a
  # push made with a workflow's token starts no run.
  workflow_dispatch:

permissions:
  contents: read

# A run on a branch, a pull request's or one started by hand, cancels
# that branch's run in progress. A push to
# trunk never does: GitHub keeps one run going and one waiting in a
# group, and a newer push replaces only the waiting one, so every
# run that starts finishes, and covers every commit pushed since the
# run before it started. A red run blames that batch, and a commit
# inside a batch has no run of its own. A release commit ("chore:
# release X.Y.Z") and a pin commit ("chore: pin ...") get a group of
# their own, named for the commit, so their runs start at once and no
# push replaces them (doc/contributors/design/releases.md, "Runs,
# batches, and the release commit"). fast.yml and fast-macos.yml judge
# every push alone.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    (startsWith(github.event.head_commit.message, 'chore: release ')
    || startsWith(github.event.head_commit.message, 'chore: pin '))
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds where they exist
  # (mise's Ruby documentation); false makes a missing build fail instead
  # of compiling Ruby for ten minutes.
  MISE_RUBY_COMPILE: "false"
  # The Rust that compiles the examples' Rust gems in the Build from
  # source jobs, the release Ferro's gems are tested with (its mise.toml).
  RUST_TOOLCHAIN: "1.99.1"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # The status fledge build --from exits with for an APP of another release
  # or platform, or a folder Fledge did not build (Fledge::BuiltApp).
  FROM_REFUSES_A_BAD_APP_WITH: "1"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins the tools contributors use (tasks/setup.rb): Ruby, the
      # REUSE tool, actionlint, shellcheck, and clang-format. CI installs
      # the same pins the same way. Its cache is keyed by mise.toml's hash.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      # Bundler keeps its files outside the checkout, where RuboCop and
      # the REUSE tool would read them.
      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?the runner sets no ImageOS}" >> "$GITHUB_OUTPUT"

      # Gems with native extensions compile against one Ruby on one
      # runner image, so the key names the system, the image (ImageOS, as
      # mise-action keys its own cache), the Ruby's version, revision, and
      # platform, and the lockfile, as every installed-gems key does
      # (doc/contributors/design/releases.md, "Installed gems in CI").
      # Only an exact match restores. ubuntu-latest names whichever image
      # GitHub moves it to, without a commit (Ubuntu 26.04 by 26 October
      # 2026, by this job's logs), so this job keeps its bundle under that
      # image's key, apart from the jobs on ubuntu-24.04.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      # Minitest prints each test's name and time (A is Minitest::TestTask's
      # argument variable), so a stuck test shows which it is.
      - name: Run the gate
        timeout-minutes: 15
        env:
          A: --verbose
          # Every test of a compiled file runs, with this runner's GNU
          # objdump for ELF and LLVM's for the rest (test/test_helper.rb).
          FLEDGE_REQUIRE_READERS: "1"
        run: bundle exec rake

      # The gate starts with lint:fix, which corrects RuboCop offenses and
      # adds missing license headers, so an offense would pass as a fix
      # nobody committed. A changed or new file fails here instead.
      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

  # A pin commit (doc/contributors/design/releases.md, "A pin commit's
  # short CI") changes only lib/fledge/SHA256SUMS
  # from a parent whose run built and delivered every runtime it pins.
  # No runtime, app, or check below reads that file, so a pushed pin
  # commit runs the gate, which does, and this job, and every other job
  # is skipped: each job with no needs of its own waits for this one and
  # runs only for any other commit, and the jobs that need those are
  # skipped with them. Pull requests always run everything.
  #
  # On a pin commit, this job also checks that the pins are exactly the
  # runtimes its parent's run built, in which every job ran and passed:
  # the run release.yml will publish them from (tasks/ci_runs.rb),
  # checked as release.yml checks them. On any other commit those steps
  # are skipped and the job passes. It is one job that always runs, not
  # a second one skipped on every other commit, because release.yml
  # requires the release commit's run to have skipped no job.
  changes:
    name: Changes, and a pin commit's pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Finding the parent's run and downloading its runtimes.
      actions: read
    outputs:
      pins-only: ${{ steps.kind.outputs.pins-only }}
      release: ${{ steps.kind.outputs.release }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # The images runtime/sources.yml pins, by key, for the jobs whose
      # container one is: a job's container is chosen before its steps
      # run, so only an earlier job's output can name it.
      - name: Read the pinned images
        id: images
        run: .github/scripts/pinned-images.sh json >> "$GITHUB_OUTPUT"

      # From the commit alone, never the event, so a run started on a
      # branch whose head it is (workflow_dispatch) runs the jobs a push
      # of it would (releases.md, "Which runs are a commit's"). A pull
      # request's run checks out a merge, and runs everything.
      - name: Tell whether this is a pin commit or a release commit
        id: kind
        run: |
          pins_only=false
          release=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            pins_only=$(.github/scripts/pins-only.sh)
            case "$(git log -1 --format=%s)" in "chore: release "*) release=true ;; esac
          fi
          echo "Pin commit: $pins_only; release commit: $release"
          echo "pins-only=$pins_only" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: steps.kind.outputs.pins-only == 'true'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Find the parent's run, in which every job passed
        if: steps.kind.outputs.pins-only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(git rev-parse HEAD^)
          run=$(ruby tasks/ci_runs.rb green "$built" --every-job)
          echo "The pins name the runtimes of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, built from $built"
          echo "RUN=$run" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.kind.outputs.pins-only == 'true'
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Check the runtimes against the pins
        if: steps.kind.outputs.pins-only == 'true'
        run: .github/scripts/check-pins.sh "$RUNNER_TEMP/runtimes" lib/fledge/SHA256SUMS

  # One runtime per platform (rake runtime): the launcher compiled with
  # warnings as errors and the compiler's static analyzer, the pinned
  # Ruby's standard library pruned beside it (rv-ruby's on macOS,
  # jdx/ruby's on glibc Linux, or for Windows RubyInstaller's, checked
  # against its PGP signature), and the license
  # audit, which fails the build of a runtime that breaks
  # Fledge's license policy and writes its NOTICES and SBOM. Beside each
  # archive go the release assets that describe it: the SBOM, the
  # NOTICES, and the source of its LGPL libraries.
  runtime:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 for Xcode 26.5 (the Select the pinned Xcode step).
          - os: macos-26
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          # Cross-compiled; the runner's 7z unpacks RubyInstaller's archive
          # and its gpgv checks the signature. Windows on ARM64 too (ADR 100).
          - os: ubuntu-24.04
            platform: x64-mingw-ucrt
          - os: ubuntu-24.04
            platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder needs only Ruby's standard library, so mise installs
      # only Ruby, and no bundle.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # The Xcode whose clang and linker build the launcher and bin/ruby:
      # the one the iOS runtime is built with (runtime/sources.yml,
      # mobile.xcode), chosen by version since Apple publishes no download
      # to pin. Its macOS 26 SDK matches the floor; macos-15's Xcode 16.4
      # built the runtimes while the floor was 15.
      - name: Select the pinned Xcode
        if: runner.os == 'macOS'
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcodebuild -version

      # rv-ruby, jdx/ruby, RubyInstaller, llvm-mingw, and libxcrypt
      # downloads: the newest set saved for this platform, which the
      # builder takes a file from only when its SHA-256 is the pin's,
      # downloading the rest (doc/contributors/design/runtimes.md, "Pinned
      # downloads in CI"). The job's last steps save what it holds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ~/.cache/fledge/downloads
          key: runtime-downloads-${{ matrix.platform }}-files-

      # The archive's timestamps are the commit's, so two builds of one
      # commit differ only where the compiler's output does. glibc Linux
      # builds in the pinned manylinux_2_28 image, with its compiler,
      # linker, and patchelf, so that what the builder compiles needs no
      # newer glibc than the image's 2.28
      # (doc/contributors/design/runtimes.md, "The glibc floor").
      - name: Build the runtime
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          case "$PLATFORM" in
            x86_64-linux | aarch64-linux) .github/scripts/glibc-runtime.sh "$PLATFORM" ;;
            *) ruby tasks/runtime_builder.rb "$PLATFORM" ;;
          esac

      # The Windows source bundle holds MSYS2's source package of GMP as
      # the exact source of RubyInstaller's libgmp-10.dll. That holds only
      # if MSYS2's binary package of that build holds the very file the
      # runtime ships, byte for byte.
      - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
        if: endsWith(matrix.platform, '-mingw-ucrt')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            x64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp package) folder=ucrt64 ;;
            aarch64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp arm64 package) folder=clangarm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gmp-package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" "$folder/bin/libgmp-10.dll"
          cmp "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll" tmp/runtime/"$PLATFORM"/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
          sha256sum "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      # The downloads less any pin changed since, saved under the digest
      # of the files they are, unless that is the set restored.
      - name: Key the downloads by the files they hold
        id: downloads-key
        run: ruby .github/scripts/download_cache_key.rb

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads-key.outputs.files != '' && steps.downloads.outputs.cache-matched-key != format('runtime-downloads-{0}-files-{1}', matrix.platform, steps.downloads-key.outputs.files)
        with:
          path: ~/.cache/fledge/downloads
          key: runtime-downloads-${{ matrix.platform }}-files-${{ steps.downloads-key.outputs.files }}

  # The musl Linux runtimes: CRuby built from its pinned source
  # in Alpine, on a runner of each architecture, as rv-ruby builds its
  # own musl Rubies, with docker run rather than a job container, since
  # GitHub's JavaScript actions cannot run in an Alpine container on an
  # ARM runner (rv-ruby's build-alpine.yml says the same).
  runtime-musl:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned images
        run: .github/scripts/pinned-images.sh env >> "$GITHUB_ENV"

      # As the other runtimes' downloads are, with the runner's download
      # folder mounted in the container as its own, since a build in the
      # container would otherwise keep them under the container's home,
      # which nothing saves.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ~/.cache/fledge/downloads
          key: runtime-downloads-${{ matrix.platform }}-files-

      # The downloads are keyed, as the other runtimes' are, in the
      # container, which has the Ruby the script needs.
      - name: Build the runtime in Alpine, and key the downloads by the files they hold
        id: downloads-key
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          mkdir -p "$HOME/.cache/fledge/downloads"
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -v "$HOME/.cache/fledge/downloads:/cache/fledge/downloads" -v "$GITHUB_OUTPUT:/output" -w /fledge \
            -e SOURCE_DATE_EPOCH -e PLATFORM -e XDG_CACHE_HOME=/cache -e GITHUB_ACTIONS -e GITHUB_OUTPUT=/output "$ALPINE_RUBY" \
            sh -c '.github/scripts/alpine-packages.sh build && ruby tasks/runtime_builder.rb "$PLATFORM" && ruby .github/scripts/download_cache_key.rb'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads-key.outputs.files != '' && steps.downloads.outputs.cache-matched-key != format('runtime-downloads-{0}-files-{1}', matrix.platform, steps.downloads-key.outputs.files)
        with:
          path: ~/.cache/fledge/downloads
          key: runtime-downloads-${{ matrix.platform }}-files-${{ steps.downloads-key.outputs.files }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-runtime-${{ matrix.platform }}
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  # The mobile runtimes (ADR 099): CRuby built from its pinned source for
  # iOS and iPadOS, on a Mac with the pinned Xcode, and for Android, on
  # Linux with the pinned NDK and Gradle, each audited like every other
  # runtime. Xcode 26.5 is the newest on macos-26 and the one whose iOS
  # 26.5 Simulator runtime the image installs; the image's default Xcode
  # has none (spike/mobile/FINDINGS.txt). Android's Ruby has YJIT, which
  # rustc compiles, so its job installs mise.toml's Rust with the
  # Android targets' standard libraries.
  runtime-mobile:
    name: Runtime (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: ios
            mise: ruby
          - os: ubuntu-24.04
            platform: android
            mise: ruby rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise }}

      - name: Select the pinned Xcode
        if: matrix.platform == 'ios'
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcodebuild -version

      # The Android Gradle plugin runs on Java 17 or newer; the runner's
      # Android SDK gives it the API 36 platform.
      - name: Use Java 21
        if: matrix.platform == 'android'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # The pinned downloads, as the other runtimes keep theirs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ~/.cache/fledge/downloads
          key: runtime-downloads-${{ matrix.platform }}-files-

      # Gradle's dependency cache for the AAR's own project, which the
      # Android Gradle plugin packs, keyed on what decides its set: that
      # project's Gradle files and the pinned Gradle and plugin
      # (doc/contributors/design/phone-projects.md, "Gradle's downloads
      # in CI"). A key the cache lacks restores the newest set for the
      # same pins, which is saved again, with what Gradle added, under it.
      # Gradle retries what a repository refused, patiently
      # (.github/scripts/gradle-patience.sh says how).
      - name: Make Gradle patient with refused downloads
        if: matrix.platform == 'android'
        run: .github/scripts/gradle-patience.sh

      - name: Key Gradle's dependency cache
        if: matrix.platform == 'android'
        id: gradle-key
        run: ruby -ryaml -e 'm = YAML.safe_load_file("runtime/sources.yml").fetch("mobile"); print "pins=agp-#{m.fetch("agp")}-gradle-#{m.dig("gradle", "version")}"' >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform == 'android'
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: gradle-modules-${{ runner.os }}-runtime-${{ steps.gradle-key.outputs.pins }}-${{ hashFiles('runtime/mobile/android/*.gradle', 'runtime/mobile/android/gradle.properties') }}
          restore-keys: gradle-modules-${{ runner.os }}-runtime-${{ steps.gradle-key.outputs.pins }}-

      - name: Build the runtime
        run: ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform == 'android' && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - name: Key the downloads by the files they hold
        id: downloads-key
        run: ruby .github/scripts/download_cache_key.rb

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads-key.outputs.files != '' && steps.downloads.outputs.cache-matched-key != format('runtime-downloads-{0}-files-{1}', matrix.platform, steps.downloads-key.outputs.files)
        with:
          path: ~/.cache/fledge/downloads
          key: runtime-downloads-${{ matrix.platform }}-files-${{ steps.downloads-key.outputs.files }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-runtime-${{ matrix.platform }}
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  # Delivery on phones (doc/contributors/design/phone-projects.md, "Parity on a
  # phone"; ADR 012): apps built as a
  # developer builds them, with fledge build ios, and their Xcode projects
  # built with xcodebuild for the Simulator and, unsigned, for devices, to
  # show the device slice links and the privacy manifest names every
  # category of API the app's executable imports that Apple asks a reason
  # for; then each run in the Simulator on an iPhone and an iPad, its
  # output read from os_log: examples/hello; examples/mobile_app, whose
  # pure-Ruby gems Bundler sets up; examples/native_phone,
  # examples/cmake_phone, and examples/rust_phone, whose gems' extensions
  # are compiled for the phone, the second's C++ library by CMake from
  # its extconf.rb, with the runner's CMake, and the third's Rust by
  # Cargo, with mise.toml's Rust and its phone targets
  # (doc/contributors/design/phone-projects.md, "Gems with extensions"
  # and "CMake toolchain files");
  # examples/rake_phone, whose digest-crc builds its extensions from a
  # Rakefile (doc/contributors/design/phone-projects.md, "Rakefiles");
  # examples/ffi_phone,
  # whose ffi gem builds its own libffi and calls C with a Ruby block as
  # a callback; examples/ffi_library_phone, whose gems' Rakefiles build
  # libraries for ffi, each embedded as a framework of its own
  # (doc/contributors/design/phone-projects.md, "Libraries for ffi on
  # iOS"); a script that requires json and csv,
  # a bundled gem, and reaches rubygems.org over HTTPS; and the parity
  # probe, against ruby main.rb on this Mac's desktop Ruby, with every
  # difference justified for a phone (tasks/mobile_parity.rb).
  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad)
    needs: [runtime, runtime-mobile]
    runs-on: macos-26
    # The long step has a limit of its own, so that a slow runner cancels
    # the step, which the run's annotation names, and not the job at some
    # step's middle; the job's limit is the step's with the setup's, as a
    # backstop. A green run took about 28 minutes to build and run the
    # apps, and 38 on a slow runner (CONTRIBUTING.md, "When CI fails"),
    # before each of Ruby's extensions on iOS was a framework; archiving
    # the ten apps' 99 frameworks each adds about 4 minutes to that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby rust

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes
          cmake --version

      # The pinned downloads, as the runtime jobs keep theirs
      # (doc/contributors/design/runtimes.md, "Pinned downloads in CI").
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ~/.cache/fledge/downloads
          key: mobile-parity-downloads-ios-files-

      # XcodeGen writes each app's Xcode project in fledge build ios, as a
      # developer installs it; pinned by SHA-256.
      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes

      # The runtime of this Mac, whose Ruby runs mkmf to compile a gem's
      # extension for the phone (doc/contributors/design/phone-projects.md,
      # "Gems with extensions").
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes

      - name: Build the apps with fledge build ios, and run them in the iOS Simulator
        timeout-minutes: 50
        run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"

      - name: Key the downloads by the files they hold
        id: downloads-key
        run: ruby .github/scripts/download_cache_key.rb

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads-key.outputs.files != '' && steps.downloads.outputs.cache-matched-key != format('mobile-parity-downloads-ios-files-{0}', steps.downloads-key.outputs.files)
        with:
          path: ~/.cache/fledge/downloads
          key: mobile-parity-downloads-ios-files-${{ steps.downloads-key.outputs.files }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mobile-apps-ios
          path: |
            tmp/mobile-parity/ios/*.ndjson
            tmp/mobile-parity/ios/*.log
            tmp/mobile-parity/ios/*.ips
          retention-days: 14

  # The iOS integration tests, in a job of their own beside the apps', so
  # that the two, each about a quarter of an hour or more on the iOS
  # chain that is the full run's longest path, run at once and not one
  # after the other (doc/contributors/design/releases.md, "The full
  # run's longest path"). This is the one job with the iOS runtime, the
  # pinned Xcode, XcodeGen, CMake, and Rust's iOS targets that runs
  # them: test/integration/mobile_extensions_build_test.rb's iOS tests,
  # the iOS runtime's in test/integration/mobile_default_gems_test.rb, the
  # iOS apps of test/integration/mobile_linked_symbols_test.rb and
  # test/integration/mobile_built_files_test.rb, which it builds with
  # Xcode and runs on a Simulator of its own, and the iOS
  # tests of test/integration/mobile_separation_names_test.rb, which read
  # names with the pinned Xcode's nm from objects that carry bitcode, and
  # the iOS app of test/integration/mobile_ffi_extconf_test.rb, a library
  # for ffi an extconf.rb builds, as sassc's builds libsass.
  # FLEDGE_REQUIRE_IOS fails a test that would skip for want of any of
  # these, so a green job means every one of them ran.
  mobile-tests-ios:
    name: iOS integration tests (iOS Simulator)
    needs: [runtime, runtime-mobile]
    runs-on: macos-26
    # A green run takes 13 to 16 minutes for the tests; the step's limit
    # is 25, and the job's that with the setup's, as a backstop.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby rust

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes
          cmake --version

      # The pinned downloads, as the runtime jobs keep theirs
      # (doc/contributors/design/runtimes.md, "Pinned downloads in CI").
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ~/.cache/fledge/downloads
          key: mobile-parity-downloads-ios-files-

      # XcodeGen writes each app's Xcode project in fledge build ios, as a
      # developer installs it; pinned by SHA-256.
      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes

      # The runtime of this Mac, whose Ruby runs mkmf to compile a gem's
      # extension for the phone (doc/contributors/design/phone-projects.md,
      # "Gems with extensions").
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes

      # The tests' own gems, from the cache fast-macos.yml's Unit tests
      # save under the same key, of the same Ruby on the same image,
      # macos-26. This job only restores it.
      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?the runner sets no ImageOS}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # Their Android tests skip here, with no Android runtime or NDK, and
      # run in the Android emulator job with 4 KB pages.
      - name: Run the iOS integration tests
        timeout-minutes: 25
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
          FLEDGE_REQUIRE_IOS: "1"
        run: bundle exec rake test:integration TEST=test/integration/mobile_extensions_build_test.rb,test/integration/mobile_default_gems_test.rb,test/integration/mobile_linked_symbols_test.rb,test/integration/mobile_built_files_test.rb,test/integration/mobile_separation_names_test.rb,test/integration/mobile_ffi_extconf_test.rb

      - name: Key the downloads by the files they hold
        id: downloads-key
        run: ruby .github/scripts/download_cache_key.rb

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads-key.outputs.files != '' && steps.downloads.outputs.cache-matched-key != format('mobile-parity-downloads-ios-files-{0}', steps.downloads-key.outputs.files)
        with:
          path: ~/.cache/fledge/downloads
          key: mobile-parity-downloads-ios-files-${{ steps.downloads-key.outputs.files }}

  # The same on Android emulators of API 36 with 4 KB and with 16 KB
  # pages: the apps built with fledge build android, each Gradle project
  # built with its own wrapper, debug and unsigned release, as APKs and as
  # the app bundles Google Play takes, and each APK checked for Play's 16
  # KB alignment and target API; each release bundle signed with a
  # throwaway upload key, validated with bundletool, made into the APKs
  # Play would serve, which are checked the same way and against Play's
  # size limit (doc/contributors/design/phone-projects.md, "The Android App Bundle
  # check"), and each app run from its debug APK
  # and again from its bundle's APKs, as Play installs them. No GitHub-hosted
  # runner boots an arm64-v8a emulator with hardware acceleration
  # (doc/contributors/design/public-interface.md, "Phones"), so the
  # arm64-v8a library is built and checked but run on no
  # emulator here. examples/rust_phone's Rust is compiled with mise.toml's
  # Rust and its Android targets, and bindgen reads the phone's headers
  # with the runner's libclang. examples/ffi_library_phone's gems'
  # Rakefiles build libraries for ffi, which the app carries as native
  # libraries of its own, with ffi-compiler's ffi compiled by the
  # runner's C compiler. The Android
  # integration tests run here too, the one job with the Android runtime,
  # the NDK, CMake, Rust's Android targets, and an emulator: those that
  # need no device once, before the emulator starts, and
  # test/integration/mobile_extension_symbols_test.rb,
  # test/integration/mobile_linked_symbols_test.rb,
  # test/integration/mobile_built_files_test.rb, and
  # test/integration/mobile_ffi_extconf_test.rb, whose apps Gradle
  # builds, on each emulator.
  # FLEDGE_REQUIRE_ANDROID fails a test that would skip for want of any
  # of these, so a green job means every one of them ran.
  mobile-apps-android:
    name: Mobile apps (Android emulator, API 36, ${{ matrix.target }})
    needs: [runtime, runtime-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby rust

      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          cmake --version

      # Every Gradle wrapper in a project fledge build writes must be the
      # one Gradle released (runtime/sources.yml pins its SHA-256 too).
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-x86_64-linux
          path: ${{ runner.temp }}/runtimes

      # fledge build android compiles a gem's extension with the NDK on the
      # computer, as a developer's own
      # (doc/contributors/design/phone-projects.md, "Gems with
      # extensions"): the very NDK the runtime is built with, pinned by
      # SHA-256.
      - name: Install the pinned NDK
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile ndk hosts x86_64-linux)
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_ROOT=$(echo "$RUNNER_TEMP"/ndk/android-ndk-*)" >> "$GITHUB_ENV"

      # bundletool makes and installs the APKs Play would serve from a
      # bundle, pinned by SHA-256 (runtime/sources.yml).
      - name: Fetch the pinned bundletool
        run: |
          jar=$(ruby .github/scripts/fetch_pin.rb mobile bundletool)
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      # Gradle's dependency cache, the files and metadata Gradle downloaded
      # for the Android Gradle plugin and what it builds with, restored so
      # that Gradle asks Maven Central nothing it has already answered.
      # Maven Central refuses some of GitHub's runners' shared addresses,
      # with a 429, or with a 404 for files it has, which Gradle reports
      # as "Could not find" (doc/contributors/design/phone-projects.md,
      # "Gradle's downloads in CI"). The key is everything that decides
      # what Gradle resolves: the template's Gradle files, the plugin's
      # version, and the runner's system; the cache is the folder
      # Gradle's guide says may be copied, without its lock files. A key
      # the cache lacks restores the newest set for the same system and
      # plugin, and Gradle asks the repositories only for what that set
      # lacks. These jobs build every variant, so theirs is the set the
      # other jobs that build the template restore
      # (mobile-apps-android-hosts saves its own system's; ruby-spec.yml
      # and installed.yml only restore).
      # Gradle retries what a repository refused, patiently
      # (.github/scripts/gradle-patience.sh says how).
      - name: Make Gradle patient with refused downloads
        run: .github/scripts/gradle-patience.sh

      - name: Key Gradle's dependency cache
        id: gradle-key
        run: echo "agp=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "agp")')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: gradle-modules-${{ runner.os }}-agp-${{ steps.gradle-key.outputs.agp }}-${{ hashFiles('lib/fledge/templates/android/*.gradle', 'lib/fledge/templates/android/gradle.properties', 'lib/fledge/templates/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-${{ runner.os }}-agp-${{ steps.gradle-key.outputs.agp }}-

      - name: Build the apps with fledge build android and Gradle, as APKs and bundles, and check each for 16 KB pages, API 36, and Play's size limit
        run: ruby tasks/mobile_parity.rb android-build "$RUNNER_TEMP/runtimes"

      # Saved once Gradle has built every app, whatever the emulators do
      # after, unless the exact key was restored (an older set restored
      # through restore-keys is saved again, with what Gradle added, under
      # this key); the other target's job may save the same key first.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # The tests' own gems, from the cache the jobs on ubuntu-24.04 save
      # under the same key, of the same Ruby on the same image: Test
      # (x86_64-linux), and fast.yml's Lint and Unit tests. This job only
      # restores it.
      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?the runner sets no ImageOS}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # The Android integration tests that need no device, once.
      - name: Run the Android integration tests that need no device
        if: matrix.target == 'google_apis'
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
          FLEDGE_REQUIRE_ANDROID: "1"
        run: bundle exec rake test:integration TEST=test/integration/mobile_extensions_build_test.rb,test/integration/mobile_default_gems_test.rb,test/integration/mobile_separation_names_test.rb

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 4 GB of RAM, as the phones that ship 16 KB pages have at least
      # twice that: with the emulator's default, the 16 KB system ran out
      # of memory and its low-memory killer killed the app in front, one
      # app in one run and another in the next. Then the extensions' symbols
      # test runs its program on the emulator, which the action names in
      # ANDROID_SERIAL for each line of its script (src/main.ts at v2.38.0).
      - name: Run the apps on the emulator, from their APKs and from their bundles, and the symbols test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
          FLEDGE_REQUIRE_ANDROID: "1"
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ruby tasks/mobile_parity.rb android
            bundle exec rake test:integration TEST=test/integration/mobile_extension_symbols_test.rb,test/integration/mobile_linked_symbols_test.rb,test/integration/mobile_built_files_test.rb,test/integration/mobile_ffi_extconf_test.rb

      # A passing check keeps a logcat only of a parity probe launched
      # again for a report the log cut short (MobileParity::Android#check_launch).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || hashFiles('tmp/mobile-parity/android/logcat-*.txt') != ''
        with:
          name: mobile-apps-android-${{ matrix.target }}
          path: |
            tmp/mobile-parity/android/logcat-*.txt
            tmp/mobile-parity/android/gradle-*.log
          retention-days: 14

  # An Android app's project is built on macOS and Windows too, as Google
  # supports its SDK there and Briefcase, Flutter, React Native, and Tauri
  # build Android apps there (ADR 012): examples/mobile_app, written with
  # fledge build android and built with its Gradle wrapper and the
  # runner's Android SDK, as an APK and as the release bundle Play takes,
  # which is signed, validated, and made into Play's APKs with bundletool.
  mobile-apps-android-hosts:
    name: Mobile apps (Android project on ${{ matrix.host }})
    needs: runtime-mobile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, the macOS floor (the header).
          - os: macos-26
            host: arm64-darwin
          - os: windows-latest
            host: x64-mingw-ucrt
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Ruby pin
        if: runner.os != 'Windows'
        id: pins
        run: echo "ruby=$(.github/scripts/ruby-pin.sh)" >> "$GITHUB_OUTPUT"

      # Ruby's own on macOS. On Windows, RubyInstaller's build the
      # x64-mingw-ucrt runtime came from, at mise.toml's pins, the
      # platform Fledge builds on there.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os != 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os == 'Windows'
        # mise-action unpacks mise under os.tmpdir(), which is TEMP on
        # Windows, then renames it into mise_dir; a rename cannot leave
        # its drive, so the unpacking happens on mise_dir's drive too.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise }}
          add_shims_to_path: false
          # On the runner's fast drive, where setup-ruby put Ruby and MSYS2.
          mise_dir: ${{ runner.temp }}\mise

      # What setup-ruby gave a Windows job beyond mise.toml's environment
      # (TMPDIR above all), so builds see what they saw under it.
      - name: Give Windows' Ruby the rest of setup-ruby's environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - name: Use Java 21
        run: echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME_21_arm64}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtimes

      - name: Write examples/mobile_app's Android project with fledge build android
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: ruby -I lib exe/fledge build android -o dist examples/mobile_app

      - name: Fetch the pinned bundletool
        run: |
          jar=$(ruby .github/scripts/fetch_pin.rb mobile bundletool)
          echo "BUNDLETOOL=$jar" >> "$GITHUB_ENV"

      # Gradle's dependency cache for this system, keyed as the emulator
      # jobs key theirs (doc/contributors/design/phone-projects.md,
      # "Gradle's downloads in CI"): the plugin fetches aapt2 for the
      # system it runs on, so each system has a set of its own. A key the
      # cache lacks restores the newest set for the same system and
      # plugin, which is saved again, with what Gradle added, under it.
      # Gradle retries what a repository refused, patiently
      # (.github/scripts/gradle-patience.sh says how).
      - name: Make Gradle patient with refused downloads
        run: .github/scripts/gradle-patience.sh

      - name: Key Gradle's dependency cache
        id: gradle-key
        run: echo "agp=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "agp")')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: gradle-modules-${{ runner.os }}-agp-${{ steps.gradle-key.outputs.agp }}-${{ hashFiles('lib/fledge/templates/android/*.gradle', 'lib/fledge/templates/android/gradle.properties', 'lib/fledge/templates/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-${{ runner.os }}-agp-${{ steps.gradle-key.outputs.agp }}-

      - name: Build it with its Gradle wrapper and check the APK and the bundle
        run: |
          cd "dist/Mobile App-android"
          if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat --no-daemon assembleDebug bundleRelease; else ./gradlew --no-daemon assembleDebug bundleRelease; fi
          cd ../..
          ruby tasks/mobile_parity.rb android-check "dist/Mobile App-android/build/outputs/apk/debug/Mobile App-debug.apk"
          ruby tasks/mobile_parity.rb android-bundle "dist/Mobile App-android/build/outputs/bundle/release/Mobile App-release.aab"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  # Every test, both tiers, on each platform, with that platform's
  # runtime, so test/integration/built_app_test.rb builds and runs a
  # real app rather than skipping (FLEDGE_REQUIRE_RUNTIME turns a skip
  # into a failure); on Linux with squashfs-tools' mksquashfs, which
  # writes an AppImage's file system (ADR 010), and with GObject
  # introspection, so test/integration/typelib_test.rb builds an app
  # over ruby-gnome's gems. No sqlite3 gem is built for Ruby 4.1 yet, so the
  # builds of examples/my_cool_app and the gem-shaped probe compile it
  # from source, which the limits below leave room for.
  test:
    name: Test (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, the macOS floor (the header).
          - os: macos-26
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests need only Ruby, so mise installs only Ruby, at
      # mise.toml's pin, as on a contributor's machine.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # The bundle's compiled extensions target the image they were built
      # on, so the key names the runner's image (ImageOS, as mise-action
      # keys its own cache), and a bundle built on another image is never
      # restored here. On ubuntu-24.04 the key is the
      # one fast.yml's Lint and Unit tests and the Android emulator jobs
      # use.
      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?the runner sets no ImageOS}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # mksquashfs, pinned to Ubuntu 24.04's build, and GLib's gio, which
      # the parity check launches a desktop entry with, of the GLib the
      # runner has.
      - name: Install mksquashfs and gio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1 "libglib2.0-bin=$(dpkg-query -W -f '${Version}' libglib2.0-0t64)"
          echo "FLEDGE_REQUIRE_MKSQUASHFS=1" >> "$GITHUB_ENV"
          echo "FLEDGE_REQUIRE_DPKG_DEB=1" >> "$GITHUB_ENV"

      # The computer test/integration/typelib_test.rb needs: the
      # development files of GLib, of GObject introspection, and of
      # GDK-PixBuf, which the fixture's gems compile against, at the
      # versions of the GLib and GDK-PixBuf the runner has and of Ubuntu
      # 24.04's one libgirepository; and GDK-PixBuf's typelib, which
      # libgdk-pixbuf-2.0-dev depends on, moved where only GI_TYPELIB_PATH
      # leads, so the test can run the app as on a computer without it.
      # FLEDGE_REQUIRE_TYPELIBS turns the test's skip into a failure.
      - name: Set up GObject introspection for the typelib test
        if: runner.os == 'Linux'
        run: |
          glib=$(dpkg-query -W -f '${Version}' libglib2.0-0t64)
          pixbuf=$(dpkg-query -W -f '${Version}' libgdk-pixbuf-2.0-0)
          sudo apt-get install -y -qq --no-install-recommends "libglib2.0-dev=$glib" libgirepository1.0-dev=1.80.1-1 "libgdk-pixbuf-2.0-dev=$pixbuf"
          typelib=$(dpkg -L gir1.2-gdkpixbuf-2.0 | grep '/girepository-1.0/GdkPixbuf-2.0.typelib$')
          mkdir -p "$RUNNER_TEMP/typelibs"
          sudo mv "$typelib" "$RUNNER_TEMP/typelibs/"
          echo "GI_TYPELIB_PATH=$RUNNER_TEMP/typelibs" >> "$GITHUB_ENV"
          echo "FLEDGE_REQUIRE_TYPELIBS=1" >> "$GITHUB_ENV"

      # A self-signed identity for the signed build of
      # test/integration/built_app_test.rb, which no CI runner has
      # otherwise.
      - name: Make a code signing identity
        if: runner.os == 'macOS'
        run: .github/scripts/make-test-identity.sh "$RUNNER_TEMP/certificate.pem"

      - name: Run the tests
        timeout-minutes: 20
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
          FLEDGE_REQUIRE_RUNTIME: "1"
        run: bundle exec rake test:all

      # ADR 081: the probe app, built from this runtime,
      # against rv-ruby's own ruby running the same main.rb, then the probe
      # as examples/my_cool_app's program, built with its gems, against
      # bundle exec on that Ruby. The report lands in the job summary; an
      # unjustified difference fails the job.
      - name: Check parity with ruby main.rb and bundle exec
        timeout-minutes: 10
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: bundle exec rake parity

      # ADR 081 (doc/contributors/design/parity.md, "Console checks"):
      # Ctrl-C and a hangup, in a terminal of the probe's own,
      # end ruby main.rb as the console Delivery expects of a built app.
      - name: Interrupt ruby main.rb in a terminal
        run: .github/scripts/deliver-console.sh --reference "$(command -v ruby)" test/fixtures/console/main.rb

  # ADR 081 on musl Linux: the probe app, built from this
  # runtime in Alpine, against the Ruby the runtime build compiled, as
  # ruby main.rb, then as my_cool_app's program against bundle exec.
  parity-musl:
    name: Parity (${{ matrix.platform }})
    needs: runtime-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned images
        run: .github/scripts/pinned-images.sh env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes

      - name: Check parity with ruby main.rb and bundle exec, in Alpine
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e FLEDGE_RUNTIME_DIR=/fledge/runtimes -e FLEDGE_RUNTIME_DIR_UNCHECKED=1 "$ALPINE_RUBY"
          sh -c '.github/scripts/alpine-packages.sh apps && .github/scripts/alpine-packages.sh parity && git config --global --add safe.directory /fledge && ruby tasks/parity.rb'

  # ruby/spec on stock Ruby and in a built app (ruby-spec.yml): on every
  # push for x86_64-linux and arm64-darwin and in phone apps in the iOS
  # Simulator and on Android emulators, and on a release commit for all
  # seven desktop platforms too, which also run every night.
  ruby-spec:
    name: ruby/spec
    needs: [changes, runtime, runtime-musl, runtime-mobile]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ruby-spec.yml
    with:
      full: ${{ needs.changes.outputs.release == 'true' }}

  # The tests on Windows, with the Windows runtime, on RubyInstaller's
  # Ruby, which the runtime ships too (ADR 100): the very build the
  # runtime came from, with the DLLs it lacks and the MSYS2 that compiles
  # gems for it, which mise installs at mise.toml's pins, as on a
  # contributor's Windows computer (matrix.mise names those tools).
  # test/integration/built_app_test.rb unpacks hello and my_cool_app
  # with Windows' own Expand-Archive, from the .zip Windows' own tar
  # wrote, and runs Hello.exe and MyCoolApp.exe. As on the other
  # platforms, sqlite3 compiles from source on Ruby 4.1, which the limits
  # below leave room for.
  #
  # Each platform's tests run in two shards, two jobs at once on runners
  # of their own: shard 1 runs the tests of built_app_test.rb that
  # SHARD_1_TESTS matches, about two fifths of the time, and the parity
  # check; shard 2 every other test, and the console checks. One pattern
  # serves both, as minitest's -i in one and -x in the other
  # (test/workflow_shards_test.rb), so that together they run every test
  # once. Minitest::TestTask passes it through Shellwords.escape, whose
  # backslashes no shell removes on Windows, so it is written in
  # characters that escape leaves alone. Unsplit, ARM64's tests took 26
  # minutes on one runner and ran out the step's 35-minute limit on a
  # slower one.
  test-windows:
    name: Test (${{ matrix.platform }}, ${{ matrix.shard }} of 2)
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [x64-mingw-ucrt, aarch64-mingw-ucrt]
        shard: [1, 2]
        include:
          - platform: x64-mingw-ucrt
            os: windows-latest
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2
          # Windows 11 on ARM64, with RubyInstaller's ARM64 Ruby (ADR 100).
          - platform: aarch64-mingw-ucrt
            os: windows-11-arm
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PATH holds the tools' own folders, not mise's shims, so that
      # ruby.exe is RubyInstaller's (the console checks below).
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # mise-action unpacks mise under os.tmpdir(), which is TEMP on
        # Windows, then renames it into mise_dir; a rename cannot leave
        # its drive, so the unpacking happens on mise_dir's drive too.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise }}
          add_shims_to_path: false
          # On the runner's fast drive, where setup-ruby put Ruby and MSYS2.
          mise_dir: ${{ runner.temp }}\mise

      # What setup-ruby gave a Windows job beyond mise.toml's environment
      # (TMPDIR above all), so builds see what they saw under it.
      - name: Give Windows' Ruby the rest of setup-ruby's environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?the runner sets no ImageOS}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # A self-signed certificate for the signed build of
      # test/integration/built_app_test.rb, which no CI runner has
      # otherwise.
      - name: Make a code signing certificate
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/make-test-identity.ps1 -Certificate "$env:RUNNER_TEMP/certificate.cer"

      # Git Bash rewrites a value that looks like a path, as a /regexp/
      # may, when it starts a Windows program, unless its name is in
      # MSYS2_ENV_CONV_EXCL.
      - name: Run the tests
        timeout-minutes: 35
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
          FLEDGE_REQUIRE_RUNTIME: "1"
          SHARD: ${{ matrix.shard }}
          SHARD_1_TESTS: /BuiltAppTest.test_.+bundle/
          MSYS2_ENV_CONV_EXCL: N;X
        run: |
          case "$SHARD" in
            1) export N="$SHARD_1_TESTS" ;;
            2) export X="$SHARD_1_TESTS" ;;
            *) echo "no shard $SHARD" >&2; exit 64 ;;
          esac
          bundle exec rake test:all

      # ADR 081: the probe app, built from this runtime,
      # against RubyInstaller's own ruby.exe running the same main.rb, then
      # both again under code page 437, then the probe as
      # examples/my_cool_app's program against bundle exec (on ARM64, that
      # app without the sqlite3 that cannot be installed there). The report
      # lands in the job summary; an unjustified difference fails the job.
      - name: Check parity with ruby main.rb and bundle exec
        if: matrix.shard == 1
        timeout-minutes: 10
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: bundle exec rake parity

      # ADR 081 (doc/contributors/design/parity.md, "Console checks"):
      # Ctrl-C on two code pages and closing the console end
      # ruby.exe main.rb as the console Delivery expects of a built app,
      # and rubyw.exe, typed into a console, gets none.
      - name: Interrupt ruby.exe main.rb in a console, and close it
        if: matrix.shard == 2
        shell: pwsh
        run: >-
          & .github/scripts/deliver-console.ps1
          -Reference @((Get-Command ruby.exe).Source, 'test/fixtures/console/main.rb')
          -WindowedReference @((Get-Command rubyw.exe).Source, 'test/fixtures/windowed_app/main.rb')

  # Each platform's apps, built on a runner of that platform from the
  # runtime the runtime job built for it, with that platform's own tools
  # (ADR 010), as a developer builds them: examples/hello, the parity
  # probe (test/fixtures/parity), which Delivery asks what a child Ruby
  # sees, and the probe as a gem-shaped app's program (Parity.gem_probe),
  # which Delivery asks what Bundler.with_original_env and
  # with_unbundled_env give a child; the HTTPS probe (test/fixtures/https),
  # which asks rubygems.org over HTTPS; examples/my_cool_app, whose gems come
  # from RubyGems.org, each checked against its Gemfile.lock's checksum,
  # precompiled for the platform; test/fixtures/bundled_with,
  # whose Gemfile.lock names a Bundler no runtime ships;
  # test/fixtures/windowed_app, a
  # windowed app with its installer;
  # test/fixtures/programs, a windowed and a console program of one project in
  # one folder; examples/file_drop, Drop, a file drop that Sinatra and
  # Puma serve to the network, whose Puma and nio4r compile from source
  # on every platform, Windows on ARM64 and musl Linux included;
  # examples/markdown_preview, Markdown Preview, a windowed and a console
  # program in an app a person would use, which opens Markdown files,
  # with its installers; and
  # test/fixtures/native_app, whose gems must be compiled: redcarpet,
  # a C gem published only as source, ferro-idna, a Rust gem (rb-sys and
  # magnus) from its git tag, but not on Windows, where magnus 0.9.3 does
  # not compile against Ruby's rb_len_t, each compiled against the
  # runtime's own Ruby, with nothing but the runtime; libusb, whose
  # precompiled build ships on Windows and which compiles from source
  # elsewhere, with the ffi it needs compiled everywhere; and
  # spreadsheet, a GPL gem, with the bigdecimal it needs, the one the
  # runtime's Ruby bundles. test/fixtures/rust_lengths, a Rust gem on
  # rb-sys alone, whose line says its bindings agree with Ruby on
  # rb_len_t, Windows on x64 included.
  # test/fixtures/real_gems (doc/contributors/design/gems.md, "Examples that
  # exercise these rules"): the gems real apps lock, from a credentialed
  # mirror, a folder outside the project, a path gem with an extension, git
  # with a submodule, and an optional group. The Mac and Windows build
  # test/fixtures/nokogiri_app too, nokogiri from
  # source: with macOS's own iconv on the Mac, and with GNU libiconv
  # linked in on Windows, which ships as any gem's compiled code does
  # (doc/contributors/design/gems.md, "Checks that are not about
  # licenses"). Each records what bundle exec prints, which the built app must
  # print too. And the LibUI probe (test/fixtures/libui), a window from
  # LibUI's precompiled gem, on macOS and glibc Linux for Delivery, and
  # on x64 Windows, where the app carries Microsoft's Visual C++ runtime,
  # built and run in this job alone, with nothing of it uploaded; each
  # Windows upload is first checked to hold none of that runtime.
  #
  # Each platform's build is a job of its own, and so is each platform's
  # leg of every job that delivers what a build made, the steps written
  # once and shared through a YAML anchor (&build-steps, *build-steps).
  # A job's needs cannot name one leg of a matrix, so with one Build
  # matrix the Mac's and Linux's Delivery waited for Windows' build,
  # fifteen minutes after their own had finished; now each waits for its
  # own platform's build only.
  build-arm64-darwin:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, the macOS floor (the header).
          - os: macos-26
            platform: arm64-darwin
            rust: ""
            mise: ruby
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ruby at mise.toml's pin; on Windows, RubyInstaller's build the
      # runtime came from, with the DLLs it lacks and the MSYS2 that
      # compiles gems for it, which fledge build finds as RubyInstaller
      # does (MSYS2_PATH, which mise sets, first), named by matrix.mise.
      # There PATH holds the tools' own folders, not mise's shims.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # mise-action unpacks mise under os.tmpdir(), which is TEMP on
        # Windows, then renames it into mise_dir; a rename cannot leave
        # its drive, so the unpacking happens on mise_dir's drive too.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          version: 2026.10.11
          install_args: ${{ matrix.mise }}
          add_shims_to_path: ${{ runner.os != 'Windows' }}
          mise_dir: ${{ runner.os == 'Windows' && format('{0}\mise', runner.temp) || '' }}

      # What setup-ruby gave a Windows job beyond mise.toml's environment
      # (TMPDIR above all), so builds see what they saw under it.
      - name: Give Windows' Ruby the rest of setup-ruby's environment
        if: runner.os == 'Windows'
        run: .github/scripts/windows-ruby-env.sh

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: matrix.platform != 'aarch64-mingw-ucrt'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}${{ matrix.rust }}

      # bindgen, which rb-sys runs, parses Ruby's MinGW headers, so clang
      # must target MinGW and find the MSYS2 tree mise installs, as
      # Ferro's CI sets it up (after oxidize-rb/actions' setup-ruby-and-rust,
      # with its two AVX-512 defines, rust-bindgen #2500); libclang comes
      # from the LLVM the runner image ships.
      # SPDX-SnippetBegin
      # SPDX-License-Identifier: MIT
      # SPDX-SnippetCopyrightText: 2026 setdef <kerrick@setdef.com>
      # SPDX-SnippetComment: Adapted from Ferro's .github/workflows/ci.yml at
      #   ef2407b1f44cd3c23d98c5085042857761598b85 (setdef/Ferro), its step
      #   "Point bindgen at Ruby's MSYS2 headers".
      - name: Point bindgen and RubyInstaller at MSYS2
        if: matrix.platform == 'x64-mingw-ucrt'
        run: |
          sysroot="${MSYS2_PATH:?mise did not set MSYS2_PATH}"
          sysroot="${sysroot//\\//}/ucrt64"
          libclang="C:/Program Files/LLVM/bin"
          test -f "$sysroot/include/stdio.h" || { echo "::error::no C headers (stdio.h) in $sysroot/include"; exit 1; }
          test -f "$libclang/libclang.dll" || { echo "::error::no libclang.dll in $libclang"; exit 1; }
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-gnu --sysroot=$sysroot -D__AVX512VLFP16INTRIN_H -D__AVX512FP16INTRIN_H"
            echo "LIBCLANG_PATH=$libclang"
          } >> "$GITHUB_ENV"
      # SPDX-SnippetEnd

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # mksquashfs, which writes windowed_app's AppImage, pinned to Ubuntu
      # 24.04's build, as a developer installs it.
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      - name: Build hello, the parity, console, and HTTPS probes, my_cool_app, windowed_app, programs, Drop, markdown_preview, and native_app for ${{ matrix.platform }}
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle", source: Parity.gem_app(ARGV.fetch(1)))' "$RUNNER_TEMP/parity-bundle" "${{ matrix.platform }}"
          apps=(examples/hello test/fixtures/parity test/fixtures/console test/fixtures/https "$RUNNER_TEMP/parity-bundle" examples/my_cool_app test/fixtures/windowed_app test/fixtures/programs examples/file_drop examples/markdown_preview test/fixtures/native_app test/fixtures/bundled_with/exe/bundled_with)
          [ "${{ matrix.platform }}" != aarch64-mingw-ucrt ] || apps=(examples/hello test/fixtures/parity test/fixtures/console test/fixtures/https "$RUNNER_TEMP/parity-bundle" test/fixtures/windowed_app test/fixtures/programs examples/file_drop examples/markdown_preview)
          for app in "${apps[@]}"; do
            ruby -I lib exe/fledge build -o dist "$app"
          done

      # test/fixtures/rust_lengths, a Rust gem on rb-sys alone, which says
      # how its bindings declare rb_len_t and calls two functions whose
      # results differ when that is not the runtime's Ruby's
      # (doc/contributors/design/gems.md, "Rust gems on Windows and
      # rb_len_t"), on every platform with Rust here. Its Delivery prints
      # what a person with no Ruby sees, which no bundle exec can: Bundler
      # compiles no path gem's extension, and on Windows gem install binds
      # rb_len_t 4 bytes wide.
      - name: Build rust_lengths for ${{ matrix.platform }}
        if: matrix.platform != 'aarch64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          ruby -I lib exe/fledge build -o dist test/fixtures/rust_lengths
          echo "RustLengths binds rb_len_t in 8 bytes, finds 3 at -1 of [1, 2, 3], and takes 2 and 3 of 10 for 2..4 with its canaries whole" > dist/rust_lengths.expected

      # test/fixtures/system_library, whose png_version gem links the
      # distribution's libpng, which fledge.yml lists under linux:
      # system_libraries. Its headers come from libpng-dev at the version
      # of the libpng the runner's image has; dpkg-dev, whose
      # dpkg-shlibdeps finds the package the .deb depends on, is on the
      # runner already. The same project without the list must fail,
      # naming the key.
      - name: Build system_library for ${{ matrix.platform }}, and refuse it without its list
        if: runner.os == 'Linux'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          sudo apt-get install -y -qq "libpng-dev=$(dpkg-query -W -f '${Version}' libpng16-16t64)"
          ruby -I lib exe/fledge build -o dist test/fixtures/system_library
          unlisted="$RUNNER_TEMP/unlisted"
          cp -R test/fixtures/system_library "$unlisted"
          sed -i '/^linux:/,$d' "$unlisted/fledge.yml"
          status=0
          ruby -I lib exe/fledge build -o "$RUNNER_TEMP/unlisted-dist" "$unlisted" 2> "$RUNNER_TEMP/unlisted.err" || status=$?
          cat "$RUNNER_TEMP/unlisted.err"
          [ "$status" = 1 ] || { echo "::error::system_library without its list exited with $status, not 1"; exit 1; }
          grep -q "needs libpng16.so.16, .*list it in fledge.yml as linux: { system_libraries: \[libpng16.so.16\] }" "$RUNNER_TEMP/unlisted.err" ||
            { echo "::error::the refusal does not name linux: system_libraries"; exit 1; }

      # test/fixtures/libui, the LibUI probe: a window from a third
      # party's GUI gem, whose precompiled gems carry libui-ng's library,
      # which links GTK 3 on Linux, named under linux: system_libraries.
      # And examples/libui_app, Focus Timer, the same gem in an app a
      # person would use, built but not uploaded: the probe is what
      # Delivery runs, since a timer nobody watches reports nothing.
      # Neither on musl Linux (build-musl) nor aarch64-mingw-ucrt: LibUI
      # publishes no gem with its library for them, so neither could run
      # there under bundle exec either. On x64-mingw-ucrt their DLL
      # needs Microsoft's Visual C++ runtime, which the apps then carry,
      # so they are built at the end of the job instead, outside dist,
      # and nothing of them is uploaded (below).
      - name: Build the LibUI probe and Focus Timer for ${{ matrix.platform }}
        if: runner.os != 'Windows'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          ruby -I lib exe/fledge build -o dist test/fixtures/libui
          ruby -I lib exe/fledge build -o "$RUNNER_TEMP/libui-example" examples/libui_app

      # Plan 003, "A Linux build takes the icon sizes a developer has":
      # windowed_app with only three of its PNGs builds, warns, and ships
      # three icons in its .deb and AppImage; with none it fails.
      - name: Build windowed_app with three icon sizes, and with none, for ${{ matrix.platform }}
        if: runner.os == 'Linux'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          mkdir "$RUNNER_TEMP/icon-sizes"
          .github/scripts/check-icon-sizes.sh "$RUNNER_TEMP/icon-sizes"

      # Builds hello and windowed_app again, signed with a self-signed
      # identity made for this run, as a developer signs with their own;
      # Delivery verifies them on a fresh runner with the certificate.
      - name: Make a code signing identity
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-signed
          .github/scripts/make-test-identity.sh dist-signed/certificate.pem

      - name: Make a code signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-signed | Out-Null
          pwsh -NoProfile -File .github/scripts/make-test-identity.ps1 -Certificate dist-signed/certificate.cer

      - name: Build hello and windowed_app, signed, for ${{ matrix.platform }}
        if: runner.os != 'Linux'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          for app in examples/hello test/fixtures/windowed_app; do
            ruby -I lib exe/fledge build --sign "$FLEDGE_TEST_SIGN_IDENTITY" -o dist-signed "$app"
          done

      # The same two apps signed through the developer's own
      # command, here the Windows SDK's signtool with the same
      # certificate, as a developer runs a cloud signer's tool: hello
      # with --sign-command, typed in PowerShell, and windowed_app with
      # FLEDGE_SIGN_COMMAND. Delivery verifies them as it verifies
      # --sign's.
      - name: Build hello and windowed_app, signed through a signing command, for ${{ matrix.platform }}
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          $signtool = ruby -I lib -r fledge -e 'print Fledge::Nsis.host_path(Fledge::WindowsSigning.signtool(ENV))'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $command = "`"$signtool`" sign /sha1 $env:FLEDGE_TEST_SIGN_IDENTITY /fd sha256 /tr http://timestamp.digicert.com /td sha256 %1"
          ruby -I lib exe/fledge build --sign-command $command -o dist-signed/command examples/hello
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:FLEDGE_SIGN_COMMAND = $command
          ruby -I lib exe/fledge build -o dist-signed/command test/fixtures/windowed_app
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Nothing setdef publishes carries Microsoft's Visual C++ runtime,
      # "not an app that Fledge's CI builds and uploads"
      # (doc/contributors/decisions.md), and anyone can download a public
      # repository's artifacts: before each upload from Windows, no file,
      # and no file in an archive, of what it uploads may be one of its
      # DLLs.
      - name: Check that nothing signed holds Microsoft's Visual C++ runtime
        if: runner.os == 'Windows'
        run: .github/scripts/check-no-visual-c-runtime.sh dist-signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'Linux'
        with:
          name: signed-${{ matrix.platform }}
          path: |
            dist-signed/*-${{ matrix.platform }}.tar.gz
            dist-signed/*-${{ matrix.platform }}.zip
            dist-signed/*-${{ matrix.platform }}.dmg
            dist-signed/*-${{ matrix.platform }}-setup.exe
            dist-signed/*-${{ matrix.platform }}.msix
            dist-signed/command/*-${{ matrix.platform }}.zip
            dist-signed/command/*-${{ matrix.platform }}-setup.exe
            dist-signed/command/*-${{ matrix.platform }}.msix
            dist-signed/certificate.*
          if-no-files-found: error
          retention-days: 14

      - name: Build nokogiri_app from source for ${{ matrix.platform }}
        if: matrix.platform == 'arm64-darwin' || matrix.platform == 'x64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: ruby -I lib exe/fledge build -o dist test/fixtures/nokogiri_app

      # doc/contributors/design/gems.md, "Examples that exercise these
      # rules": the gems real apps lock. test/fixtures/real_gems takes RubyGems.org
      # through a mirror that wants a login, as its .bundle/config says in
      # Bundler's own settings, from a loopback server of ours
      # (.github/scripts/gem-mirror.rb); a gem from a folder outside its
      # project, with an executable; a path gem with a C extension; a gem from
      # git with a submodule (the experiment/submodule-gem branch); and an
      # optional group. Its Delivery prints what a person with no Ruby sees,
      # which no bundle exec can: Bundler compiles no path gem's extension.
      - name: Build real_gems through a credentialed mirror for ${{ matrix.platform }}
        shell: bash
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          ruby .github/scripts/gem-mirror.rb 9292 fledge:mirror-password "$RUNNER_TEMP/mirror.log" &
          mirror=$!
          sleep 3
          status=0
          ruby -I lib exe/fledge build -o dist test/fixtures/real_gems || status=$?
          kill "$mirror" || true
          cat "$RUNNER_TEMP/mirror.log"
          [ "$status" = 0 ] || exit "$status"
          for gem in wisper-2.0.1 paint-2.3.0; do
            grep -q "^GET /gems/$gem.gem 200\$" "$RUNNER_TEMP/mirror.log" || { echo "::error::$gem did not come through the mirror, with its login"; exit 1; }
          done
          echo "wisper 2.0.1 through a mirror that wanted a login; shared from outside the project; greeter compiled for the runtime's Ruby; fledge_submodule_gem says Hello World!; paint 2.3.0 from an optional group; shared-cli says shared from outside the project" > dist/real_gems.expected

      # The gems bundle exec runs the examples with below, installed for
      # this runner's own Ruby, kept between runs: on Windows, compiling
      # nokogiri and the Rust gems for that Ruby took most of nine
      # minutes of the longest chain in CI. They only make the .expected
      # files; fledge build compiled each app's gems afresh above, for the
      # runtime's Ruby, which is the check. The key names the
      # Ruby, the Rust, and each lockfile and Bundler setting, and only an
      # exact match restores.
      - name: Read the runner's Ruby
        if: matrix.platform != 'aarch64-mingw-ucrt'
        id: host
        run: echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform != 'aarch64-mingw-ucrt'
        with:
          path: ${{ runner.temp }}/examples-bundle
          key: examples-bundle-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.ruby }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('examples/my_cool_app/Gemfile.lock', 'test/fixtures/native_app/Gemfile.lock', 'test/fixtures/nokogiri_app/Gemfile.lock', 'test/fixtures/nokogiri_app/.bundle/config') }}

      # What each app prints as its developer runs it, which its built app
      # must print too.
      - name: Run the examples with bundle exec
        if: matrix.platform != 'aarch64-mingw-ucrt'
        env:
          BUNDLE_PATH: ${{ runner.temp }}/examples-bundle
        run: |
          (cd examples/my_cool_app && bundle install)
          (cd examples/my_cool_app && bundle exec ruby exe/my_cool_app) | tee dist/my_cool_app.expected
          (cd test/fixtures/bundled_with && bundle install)
          (cd test/fixtures/bundled_with && bundle exec ruby exe/bundled_with) | tee dist/bundled_with.expected
          apps=test/fixtures/native_app
          case "${{ matrix.platform }}" in arm64-darwin | x64-mingw-ucrt) apps="test/fixtures/native_app test/fixtures/nokogiri_app" ;; esac
          for app in $apps; do
            (cd "$app" && bundle install)
            (cd "$app" && bundle exec ruby main.rb) | tee "dist/$(basename "$app").expected"
          done

      # The HTML Markdown Preview's md2html prints for its welcome page
      # under bundle exec, which the built md2html must print too. Its
      # gems are pure Ruby, so this runs on every platform.
      - name: Run Markdown Preview's md2html with bundle exec
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/examples/markdown_preview/Gemfile
          BUNDLE_PATH: ${{ runner.temp }}/markdown-bundle
        run: |
          bundle install
          bundle exec ruby examples/markdown_preview/bin/md2html examples/markdown_preview/welcome.md > dist/markdown_preview.expected

      # The builder app Delivery runs fledge build --from inside
      # (doc/contributors/design/desktop-apps.md, "Building from a built
      # app"), on one platform of each operating system.
      - name: Build the app that builds apps, with build_tools and Fledge as a gem
        if: matrix.platform == 'arm64-darwin' || matrix.platform == 'x86_64-linux' || matrix.platform == 'x64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: .github/scripts/prepare-from.sh "$RUNNER_TEMP/from" "${{ matrix.platform }}"

      - name: Check that no app to upload holds Microsoft's Visual C++ runtime
        if: runner.os == 'Windows'
        run: .github/scripts/check-no-visual-c-runtime.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.tar.gz
            dist/*-${{ matrix.platform }}.zip
            dist/*-${{ matrix.platform }}.dmg
            dist/*-${{ matrix.platform }}-setup.exe
            dist/*-${{ matrix.platform }}.msix
            dist/*-${{ matrix.platform }}.AppImage
            dist/*-${{ matrix.platform }}.deb
            dist/*.expected
          if-no-files-found: error
          retention-days: 14

      # The LibUI probe and Focus Timer on Windows, whose fledge.yml files
      # say windows: visual_c_runtime: local, so the apps carry the
      # runner's copies of Microsoft's Visual C++ runtime, which setdef
      # may not publish (above). So they are built after every upload,
      # into a folder no upload or cache names, and the probe is run
      # here, from /, with System32 alone on its PATH, carrying the
      # runtime's three DLLs; no Delivery job can have it. The runner's
      # System32 has the runtime too, so this proves the build and that
      # the app holds its copies, not that it runs where Windows has
      # none.
      - name: Build the LibUI probe and Focus Timer outside dist, and run the probe, uploading none of them
        if: matrix.platform == 'x64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_RUNTIME_DIR_UNCHECKED: "1"
        run: |
          probe="$(cygpath -u "$RUNNER_TEMP")/libui-probe"
          ruby -I lib exe/fledge build -o "$(cygpath -w "$probe")" test/fixtures/libui
          ruby -I lib exe/fledge build -o "$(cygpath -w "$probe")" examples/libui_app
          .github/scripts/deliver-libui.sh "$probe/LibUIProbe-${{ matrix.platform }}.zip" libui.x64.dll

  build-x86_64-linux:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
            rust: ""
            mise: ruby
    steps: *build-steps

  build-aarch64-linux:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            rust: ""
            mise: ruby
    steps: *build-steps

  build-x64-mingw-ucrt:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # RubyInstaller's Ruby is a MinGW build, and rb-sys refuses to
          # build for it with Rust's MSVC target (Ferro's ci.yml), so
          # Windows takes the GNU host toolchain.
          - os: windows-latest
            platform: x64-mingw-ucrt
            rust: -x86_64-pc-windows-gnu
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2
    steps: *build-steps

  build-aarch64-mingw-ucrt:
    name: Build (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows on ARM64 (ADR 100) builds no my_cool_app: sqlite3
          # publishes no aarch64-mingw-ucrt build and its source does not
          # configure there, mini_portile2 passing configure clang's name
          # for the target (doc/contributors/design/gems.md, "Examples that
          # exercise these rules"), so the gem-shaped probe is that app
          # without sqlite3 (Parity.gem_app). It builds no native_app
          # either: the job installs no Rust, and ferro-idna's rb-sys would
          # need Rust's aarch64-pc-windows-gnullvm target, which no job of
          # Fledge's has tried; and no nokogiri_app, as on Linux. real_gems,
          # whose path gem's C compiles with MSYS2's CLANGARM64 clang, it
          # builds as x64 does.
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            rust: ""
            mise: http:rubyinstaller-head http:msys2-zlib http:msys2
    steps: *build-steps

  # musl Linux's apps, built in Alpine with Ruby, as a developer
  # on Alpine builds them: hello, the parity and console probes, the
  # probe as a gem-shaped app's program, my_cool_app, whose sqlite3
  # compiles from source, windowed_app, with its AppImage, programs, Drop,
  # the server example, markdown_preview, and ffi_libc, whose ffi
  # compiles from source with the libffi it carries, which needs
  # linux-headers (doc/contributors/design/gems.md, "Examples that
  # exercise these rules"). It builds no native_app, whose ferro-idna
  # needs Rust, which the apps set leaves out.
  build-musl:
    name: Build (${{ matrix.platform }})
    needs: runtime-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned images
        run: .github/scripts/pinned-images.sh env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtimes

      - name: Build the examples in Alpine, and run my_cool_app and ffi_libc with bundle exec
        run: |
          cat > "$RUNNER_TEMP/build-apps.sh" <<'SH'
          set -eu
          .github/scripts/alpine-packages.sh apps
          git config --global --add safe.directory /fledge
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle")' /tmp/parity-bundle
          for app in examples/hello test/fixtures/parity test/fixtures/console test/fixtures/https /tmp/parity-bundle examples/my_cool_app test/fixtures/windowed_app test/fixtures/programs examples/file_drop examples/markdown_preview test/fixtures/ffi_libc; do
            ruby -I lib exe/fledge build -o dist "$app"
          done
          (cd examples/my_cool_app && bundle install)
          (cd examples/my_cool_app && bundle exec ruby exe/my_cool_app) > dist/my_cool_app.expected
          cat dist/my_cool_app.expected
          BUNDLE_GEMFILE="$PWD/examples/markdown_preview/Gemfile" bundle install
          BUNDLE_GEMFILE="$PWD/examples/markdown_preview/Gemfile" bundle exec ruby examples/markdown_preview/bin/md2html examples/markdown_preview/welcome.md > dist/markdown_preview.expected
          (cd test/fixtures/ffi_libc && bundle install)
          (cd test/fixtures/ffi_libc && bundle exec ruby main.rb) > dist/ffi_libc.expected
          cat dist/ffi_libc.expected
          SH
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -v "$RUNNER_TEMP:/scripts" -w /fledge -e FLEDGE_RUNTIME_DIR=/fledge/runtimes -e FLEDGE_RUNTIME_DIR_UNCHECKED=1 \
            -e BUNDLE_FROZEN "$ALPINE_RUBY" sh /scripts/build-apps.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.tar.gz
            dist/*-${{ matrix.platform }}.AppImage
            dist/*.expected
          if-no-files-found: error
          retention-days: 14

  # Delivery of native_app, rust_lengths, and nokogiri_app, on a fresh
  # runner of each platform, as Delivery runs the others.
  delivery-native-arm64-darwin:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, the macOS floor (the header).
          - os: macos-26
            platform: arm64-darwin
    steps: &delivery-native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run native_app as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NativeApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/native_app.expected")"

      - name: Run nokogiri_app as someone with no Ruby would
        if: matrix.platform == 'arm64-darwin'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NokogiriApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/nokogiri_app.expected")"

      - name: Run rust_lengths as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/RustLengths-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/rust_lengths.expected")"

      - name: Run RustLengths.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/RustLengths-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/rust_lengths.expected" -Raw).TrimEnd()

      - name: Run real_gems as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/RealGems-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/real_gems.expected")"

      - name: Run NativeApp.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NativeApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/native_app.expected" -Raw).TrimEnd()

      - name: Run RealGems.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/RealGems-${{ matrix.platform }}.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.zip" -Platform ${{ matrix.platform }}
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/real_gems.expected" -Raw).TrimEnd()

      - name: Run NokogiriApp.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NokogiriApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/nokogiri_app.expected" -Raw).TrimEnd()

  delivery-native-x86_64-linux:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-native-steps

  delivery-native-aarch64-linux:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-native-steps

  delivery-native-x64-mingw-ucrt:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: *delivery-native-steps
  # real_gems alone: ARM64 Windows builds no native_app or nokogiri_app
  # (build-aarch64-mingw-ucrt says why).
  delivery-native-aarch64-mingw-ucrt:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-aarch64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    steps: *delivery-native-steps

  # Delivery (Plan 001): each app on a fresh runner of its platform, with
  # nothing of Fledge but the archive and the script that checks it, and
  # no Ruby set up. Runners come with Rubies installed, so the script runs
  # the app with an empty PATH and checks that no ruby is on it, then
  # runs it in a clean and in a hostile environment
  # (.github/scripts/deliver.sh).
  delivery-arm64-darwin:
    name: Delivery (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, the macOS floor (the header).
          - os: macos-26
            platform: arm64-darwin
    steps: &delivery-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # runtime/licenses.yml gives the platform the runtime's Ruby
          # names (.github/scripts/ruby-platform.sh).
          sparse-checkout: |
            .github/scripts
            runtime/licenses.yml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run hello as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.1.0 on $(.github/scripts/ruby-platform.sh ${{ matrix.platform }})"

      - name: Run my_cool_app as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/my_cool_app.expected")"

      # The HTTPS probe asks a server on the runner, whose certificate a
      # test authority made for the run signed (.github/scripts/https-server.sh),
      # with that authority nowhere, in SSL_CERT_FILE, in the runtime's
      # own CA bundle, and in the runner's store, and must trust it or
      # refuse it as the platform's Ruby does (.github/scripts/deliver-https.sh).
      - name: Ask a server on this runner over HTTPS as someone with no Ruby would
        run: |
          server="$RUNNER_TEMP/https-server"
          .github/scripts/https-server.sh start "$server"
          trap '.github/scripts/https-server.sh stop "$server"' EXIT
          .github/scripts/deliver-https.sh "$RUNNER_TEMP/delivered/Https-${{ matrix.platform }}.tar.gz" "$server"

      # Drop, a server, from a read-only folder: another process must
      # reach it at the runner's own private address, with its password
      # alone, and a file sent to it must arrive in ~/Drop and come back
      # byte for byte; SIGINT stops it with 0
      # (.github/scripts/deliver-server.sh).
      - name: Run Drop, a file drop on the network, as someone with no Ruby would
        run: .github/scripts/deliver-server.sh "$RUNNER_TEMP/delivered/Drop-${{ matrix.platform }}.tar.gz"

      # An app whose Gemfile.lock names a Bundler the runtime's
      # Ruby does not ship runs with it, as bundle exec did where it was
      # built.
      - name: Run bundled_with as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/BundledWith-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/bundled_with.expected")"

      # ADR 081 (doc/contributors/design/parity.md, "Console checks"):
      # the console probe in a terminal of its own, a
      # pseudo-terminal, ended by Ctrl-C typed into it and by a hangup,
      # must end as ruby main.rb does (.github/scripts/deliver-console.sh).
      - name: Interrupt the console probe in a terminal, as a person would
        run: .github/scripts/deliver-console.sh "$RUNNER_TEMP/delivered/Console-${{ matrix.platform }}.tar.gz"

      # The signed build, verified by Apple's codesign on a fresh
      # Mac that trusts the run's test certificate, and run
      # (.github/scripts/deliver-signed.sh).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'macOS'
        with:
          name: signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/signed

      - name: Verify and run the signed apps
        if: runner.os == 'macOS'
        run: >-
          .github/scripts/deliver-signed.sh "$RUNNER_TEMP/signed/Hello-arm64-darwin.tar.gz"
          "$RUNNER_TEMP/signed/Hello Window-arm64-darwin.tar.gz" "$RUNNER_TEMP/signed/Hello Window-arm64-darwin.dmg"
          "$RUNNER_TEMP/signed/certificate.pem"

  delivery-x86_64-linux:
    name: Delivery (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-steps

  delivery-aarch64-linux:
    name: Delivery (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-steps

  # Delivery of the windowed app, on a fresh runner of each
  # platform: on macOS its .app bundle must pass codesign --verify --strict
  # --deep, plutil must read its identity, and it must run through open -W,
  # as Finder starts it, and through its own program, and open -a with a
  # document must give its program the document's path; on Linux
  # desktop-file-validate must accept its desktop entry, and its icons and
  # program must be there and run (.github/scripts/deliver-windowed.sh).
  # Then its installer: on macOS the disk image, attached,
  # verified, and dragged to an Applications folder, with the app run from
  # both (deliver-dmg.sh); on Linux the AppImage, mounted with FUSE, and
  # extracted with APPIMAGE_EXTRACT_AND_RUN=1, where there is none, run
  # each way and in a hostile environment, and unpacked by
  # --appimage-extract (deliver-appimage.sh). And test/fixtures/programs:
  # a windowed and a console program from one folder, with one
  # project and one Ruby, sharing one save (deliver-programs.sh). And
  # examples/markdown_preview: its md2html prints what it printed under
  # bundle exec, it declares Markdown files to the system, and its
  # windowed program, opened with a file as each system's file manager
  # opens it (open -a on macOS), previews the file in the browser
  # (deliver-markdown.sh). On
  # macOS, the LibUI probe opens its window through its own program,
  # through open -W, and through open -a with a document, and reports it
  # shown (deliver-libui.sh).
  delivery-windowed-arm64-darwin:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, the macOS floor (the header).
          - os: macos-26
            platform: arm64-darwin
    steps: &delivery-windowed-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scripts, and the Markdown file Markdown Preview's step
          # previews, as a person would open one of their own.
          sparse-checkout: |
            .github/scripts
            examples/markdown_preview/welcome.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      # freedesktop.org's validator, pinned to Ubuntu 24.04's build of it.
      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Run Shared Save and shared-save from one folder, with one save
        run: .github/scripts/deliver-programs.sh "$RUNNER_TEMP/delivered/Shared Save-${{ matrix.platform }}.tar.gz"

      - name: Preview a Markdown file with Markdown Preview, and print its HTML with md2html
        run: >-
          .github/scripts/deliver-markdown.sh "$RUNNER_TEMP/delivered/Markdown Preview-${{ matrix.platform }}.tar.gz"
          examples/markdown_preview/welcome.md "$RUNNER_TEMP/delivered/markdown_preview.expected"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.dmg"

      # On Linux the LibUI probe runs in the .deb jobs' containers, which
      # start with no GTK 3 and then install it, as a desktop has it.
      - name: Open the LibUI probe's window through its own program and as Finder would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-libui.sh "$RUNNER_TEMP/delivered/LibUIProbe-${{ matrix.platform }}.tar.gz" libui.arm64.dylib

      # FUSE 3, which desktops ship and the runner's image may not,
      # pinned to Ubuntu 24.04's build: the AppImage's runtime mounts with
      # its fusermount3.
      - name: Install FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fuse3=3.14.0-5build1
          ls -l /dev/fuse

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.AppImage" fuse

  delivery-windowed-x86_64-linux:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-windowed-steps

  delivery-windowed-aarch64-linux:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-windowed-steps

  # Delivery again, in Debian 13 containers with no Ruby installed at all
  # (deliver.sh --no-ruby-installed checks), glibc 2.41, and no CA
  # certificates package.
  delivery-debian-x86_64-linux:
    name: Delivery (${{ matrix.platform }}, debian-trixie-slim)
    needs: [changes, build-x86_64-linux]
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(needs.changes.outputs.images)['debian-trixie-slim'] }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &delivery-debian-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Run hello on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/Hello-${{ matrix.platform }}.tar.gz"
          "delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.1.0 on ${{ matrix.platform }}" --no-ruby-installed

      - name: Run my_cool_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat delivered/my_cool_app.expected)" --no-ruby-installed

      # A container has no FUSE, so the AppImage says so, and extracts
      # itself and runs when asked to, as AppImage documents.
      - name: Run Hello Window as an AppImage on a computer with no FUSE
        run: .github/scripts/deliver-appimage.sh "delivered/Hello Window-${{ matrix.platform }}.AppImage" extract

      # native_app, compiled on Ubuntu 24.04, on Debian 13's newer glibc.
      - name: Run native_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/NativeApp-${{ matrix.platform }}.tar.gz"
          "delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat delivered/native_app.expected)" --no-ruby-installed

  delivery-debian-aarch64-linux:
    name: Delivery (${{ matrix.platform }}, debian-trixie-slim)
    needs: [changes, build-aarch64-linux]
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(needs.changes.outputs.images)['debian-trixie-slim'] }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-debian-steps

  # Delivery of the windowed app's .deb, in a fresh Debian and a
  # fresh Ubuntu container of each architecture, with no Ruby installed:
  # apt installs it as a person would, its dependency on glibc 2.28 met by
  # Ubuntu 24.04's and by Debian 13's; the
  # MIME database knows the file type the app defines by its extension;
  # the app runs from /usr/lib, as root and as an ordinary user; and removing
  # the package leaves nothing of it (.github/scripts/deliver-deb.sh).
  # First, test/fixtures/system_library runs from its archive and
  # its AppImage without libpng, which its gem links, and says so; then
  # apt installs its .deb, which depends on libpng's package, and it runs
  # (.github/scripts/deliver-system-library.sh). The LibUI probe, whose
  # gem's library links GTK 3, says so too while there is no GTK; last,
  # apt installs GTK 3 and Xvfb, and the probe opens its window there
  # and reports it shown (.github/scripts/deliver-libui.sh).
  delivery-deb-x86_64-linux:
    name: Delivery of a .deb (${{ matrix.platform }}, ${{ matrix.image }})
    needs: [changes, build-x86_64-linux]
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(needs.changes.outputs.images)[matrix.image] }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [debian-trixie-slim, ubuntu-noble]
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &delivery-deb-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      # apt's package lists, once for the job, and every package the
      # steps after this one install: the validator, and what each .deb
      # depends on (test/workflow_apt_test.rb). In amd64 Ubuntu they come
      # from the Azure mirror the runners themselves use, with the
      # image's own hosts as a second attempt, each under a time limit,
      # so a host that stops answering fails the step saying so inside
      # the job's limit, and no later step fetches anything
      # (.github/scripts/apt-update.sh says why).
      - name: Fetch apt's package lists and the packages the job installs
        run: .github/scripts/apt-update.sh desktop-file-utils shared-mime-info libgtk-3-0t64 xvfb ./delivered/*.deb

      # Before apt brings anything else, the app whose gem links
      # libpng names it, and exits with 72, from its archive and its
      # AppImage, until apt installs its .deb, which brings libpng.
      - name: Run System Library without libpng, then install its .deb with apt
        run: .github/scripts/deliver-system-library.sh delivered

      # The LibUI probe, whose gem's library links GTK 3, names a
      # library it lacks and exits with 72 while the computer has no GTK.
      - name: Run the LibUI probe without GTK 3
        run: |
          platform=${{ matrix.platform }}
          .github/scripts/deliver-libui.sh "delivered/LibUIProbe-$platform.tar.gz" "libui.${platform%-linux}.so" without-gtk

      # freedesktop.org's validator, and the MIME database a desktop
      # finds a file's type in, which a desktop has: the .deb's
      # definition of its type goes into the database by
      # shared-mime-info's trigger, so it is installed first.
      - name: Install desktop-file-validate and shared-mime-info
        run: apt-get install -y -qq desktop-file-utils shared-mime-info

      - name: Install Hello Window from its .deb with apt, run it, and remove it
        run: .github/scripts/deliver-deb.sh "delivered/Hello Window-${{ matrix.platform }}.deb"

      # GTK 3, as a desktop has it, and an X server with no screen,
      # where the probe opens its window and reports it shown.
      - name: Install GTK 3 and Xvfb with apt, and open the LibUI probe's window
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-3-0t64 xvfb
          platform=${{ matrix.platform }}
          .github/scripts/deliver-libui.sh "delivered/LibUIProbe-$platform.tar.gz" "libui.${platform%-linux}.so"

  delivery-deb-aarch64-linux:
    name: Delivery of a .deb (${{ matrix.platform }}, ${{ matrix.image }})
    needs: [changes, build-aarch64-linux]
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(needs.changes.outputs.images)[matrix.image] }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [debian-trixie-slim, ubuntu-noble]
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-deb-steps

  # Delivery where the glibc floor says an app runs (runtimes.md, "The
  # glibc floor"), in the oldest systems it admits, each pinned by
  # digest, with no Ruby installed: AlmaLinux 8 (glibc 2.28), Amazon
  # Linux 2023 (2.34), Ubuntu 22.04 (2.35), and Debian 12 (2.36). hello
  # comes from the Build job; my_cool_app, whose sqlite3 compiles from
  # source, is built here in manylinux_2_28, as a developer who follows
  # fledge build's warning about a gem compiled on a newer glibc builds
  # it (.github/scripts/glibc-app.sh), so that its floor is the image's;
  # and the HTTPS probe asks a server on the runner, which the image
  # reaches on the runner's network (.github/scripts/deliver-https.sh):
  # in AlmaLinux 8 and Amazon Linux 2023, whose images have a
  # certificate store, the store is read and the runtime's CA bundle is
  # not; in Ubuntu's and Debian's, which have none, the bundle is. Each
  # image runs from a step with docker run
  # (.github/scripts/deliver-glibc-floor.sh), not as the job's
  # container, since GitHub's actions run inside a job's container and
  # need what some of these images lack.
  delivery-glibc-floor-x86_64-linux:
    name: Delivery on the oldest glibc (${{ matrix.platform }})
    needs: [runtime, build-x86_64-linux]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &delivery-glibc-floor-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The computer's own Ruby only fetches the pinned Ruby that runs
      # fledge build in the image, so mise installs only Ruby.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Read the pinned images
        run: .github/scripts/pinned-images.sh env >> "$GITHUB_ENV"

      - name: Build my_cool_app in manylinux_2_28, whose glibc is the floor
        run: .github/scripts/glibc-app.sh "${{ matrix.platform }}" "$RUNNER_TEMP/runtimes" "$RUNNER_TEMP/floor" examples/my_cool_app

      - name: Run hello, my_cool_app, and the HTTPS probe in AlmaLinux 8 (glibc 2.28)
        run: .github/scripts/deliver-glibc-floor.sh "$ALMALINUX_8" "${{ matrix.platform }}" "$RUNNER_TEMP/delivered" "$RUNNER_TEMP/floor"

      - name: Run hello, my_cool_app, and the HTTPS probe in Amazon Linux 2023 (glibc 2.34)
        run: .github/scripts/deliver-glibc-floor.sh "$AMAZONLINUX_2023" "${{ matrix.platform }}" "$RUNNER_TEMP/delivered" "$RUNNER_TEMP/floor" tar gzip

      - name: Run hello, my_cool_app, and the HTTPS probe in Ubuntu 22.04 (glibc 2.35)
        run: .github/scripts/deliver-glibc-floor.sh "$UBUNTU_JAMMY" "${{ matrix.platform }}" "$RUNNER_TEMP/delivered" "$RUNNER_TEMP/floor"

      - name: Run hello, my_cool_app, and the HTTPS probe in Debian 12 (glibc 2.36)
        run: .github/scripts/deliver-glibc-floor.sh "$DEBIAN_BOOKWORM_SLIM" "${{ matrix.platform }}" "$RUNNER_TEMP/delivered" "$RUNNER_TEMP/floor"

  delivery-glibc-floor-aarch64-linux:
    name: Delivery on the oldest glibc (${{ matrix.platform }})
    needs: [runtime, build-aarch64-linux]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *delivery-glibc-floor-steps

  # Delivery on musl Linux: each app in a bare Alpine container,
  # with no Ruby at all, as deliver.sh --no-ruby-installed checks: hello,
  # my_cool_app, and ffi_libc, whose ffi was compiled in Alpine, the
  # console probe interrupted in a terminal, and the
  # windowed app, its desktop entry, and its AppImage, which has no FUSE
  # in a container, so says so and runs extracted; and the HTTPS probe,
  # asking a server on the runner, which the container reaches on the
  # runner's network (.github/scripts/deliver-https.sh).
  delivery-musl:
    name: Delivery (${{ matrix.platform }}, alpine:3.24)
    needs: build-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            runtime/sources.yml
            examples/markdown_preview/welcome.md
          sparse-checkout-cone-mode: false

      - name: Read the pinned images
        run: .github/scripts/pinned-images.sh env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Run hello, my_cool_app, ffi_libc, the console and HTTPS probes, windowed_app, programs, Drop, and markdown_preview on Alpine with no Ruby installed
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cat > "$RUNNER_TEMP/deliver-all.sh" <<'SH'
          set -eu
          .github/scripts/alpine-packages.sh deliver
          d=delivered
          .github/scripts/deliver.sh "$d/Hello-$PLATFORM.tar.gz" "$d/Parity-$PLATFORM.tar.gz" "Hello from Ruby 4.1.0 on $PLATFORM" --no-ruby-installed
          .github/scripts/deliver.sh "$d/MyCoolApp-$PLATFORM.tar.gz" "$d/ParityBundle-$PLATFORM.tar.gz" "$(cat "$d/my_cool_app.expected")" --no-ruby-installed
          .github/scripts/deliver.sh "$d/FfiLibc-$PLATFORM.tar.gz" "$d/ParityBundle-$PLATFORM.tar.gz" "$(cat "$d/ffi_libc.expected")" --no-ruby-installed
          .github/scripts/deliver-console.sh "$d/Console-$PLATFORM.tar.gz"
          .github/scripts/deliver-windowed.sh "$d/Hello Window-$PLATFORM.tar.gz"
          .github/scripts/deliver-appimage.sh "$d/Hello Window-$PLATFORM.AppImage" extract
          .github/scripts/deliver-programs.sh "$d/Shared Save-$PLATFORM.tar.gz"
          .github/scripts/deliver-markdown.sh "$d/Markdown Preview-$PLATFORM.tar.gz" examples/markdown_preview/welcome.md "$d/markdown_preview.expected"
          .github/scripts/deliver-https.sh "$d/Https-$PLATFORM.tar.gz" /https --store-may-change
          .github/scripts/deliver-server.sh "$d/Drop-$PLATFORM.tar.gz"
          SH
          server="$RUNNER_TEMP/https-server"
          .github/scripts/https-server.sh start "$server"
          trap '.github/scripts/https-server.sh stop "$server"' EXIT
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/scripts" -v "$server:/https:ro" -w /work -e PLATFORM "$ALPINE" sh /scripts/deliver-all.sh

  # Delivery on a fresh Windows runner, with nothing of Fledge but the
  # .zip and the script that checks it, and no Ruby set up: the runner's
  # own Rubies and MSYS2 are kept off the app's PATH, and the script runs
  # Hello.exe and MyCoolApp.exe from another drive, under a folder name
  # outside ASCII, in a clean and in a hostile environment, and checks
  # the version information each carries (.github/scripts/deliver.ps1).
  delivery-windows-x64-mingw-ucrt:
    name: Delivery (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    env:
      PLATFORM: ${{ matrix.platform }}
    steps: &delivery-windows-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scripts, and the Markdown file Markdown Preview's step
          # previews, as a person would open one of their own.
          sparse-checkout: |
            .github/scripts
            examples/markdown_preview/welcome.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run Hello.exe as someone with no Ruby would
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/Parity-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected "Hello from Ruby 4.1.0 on $env:PLATFORM"

      - name: Run MyCoolApp.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/MyCoolApp-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/my_cool_app.expected" -Raw).TrimEnd()

      # The app whose Gemfile.lock names another Bundler, as on macOS
      # and Linux.
      - name: Run BundledWith.exe as someone with no Ruby would
        if: matrix.platform == 'x64-mingw-ucrt'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/BundledWith-$env:PLATFORM.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-$env:PLATFORM.zip" -Platform $env:PLATFORM
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/bundled_with.expected" -Raw).TrimEnd()

      # The HTTPS probe asks a server on the runner, as on macOS and
      # Linux, with the test authority nowhere, in SSL_CERT_FILE, in the
      # bundle RubyInstaller's OpenSSL reads, and in Windows' own store,
      # which it must not read (.github/scripts/deliver-https.ps1).
      - name: Ask a server on this runner over HTTPS as someone with no Ruby would
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-https.ps1 -Archive "$env:RUNNER_TEMP/delivered/Https-$env:PLATFORM.zip"

      # Drop, a server, in a console of its own: another process must
      # reach it at the runner's own private address, with its password
      # alone, and a file sent to it must arrive in HOME\Drop and come
      # back byte for byte; Ctrl-C stops it with 0, and it writes nothing
      # in its own folder (.github/scripts/deliver-server.ps1).
      - name: Run Drop.exe, a file drop on the network, as someone with no Ruby would
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-server.ps1 -Archive "$env:RUNNER_TEMP/delivered/Drop-$env:PLATFORM.zip"

      # ADR 081 (doc/contributors/design/parity.md, "Console checks"):
      # the console probe in a console of its own, ended by
      # Ctrl-C on code pages 65001 and 437 and by its window closing, and
      # the windowed app typed into a console, which gets none, each as
      # ruby.exe and rubyw.exe do (.github/scripts/deliver-console.ps1).
      - name: Interrupt the console probe in a console, close it, and start the windowed app from one
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-console.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Console-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.zip"

      # The windowed app: a GUI program with its version
      # information and icon, started as Explorer starts it, with no
      # console and its identifier as its AppUserModelID
      # (.github/scripts/deliver-windowed.ps1).
      - name: Start Hello Window.exe as Explorer would
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.zip"

      # test/fixtures/programs: a GUI and a console program from one
      # folder, with one project and one Ruby, sharing one save
      # (.github/scripts/deliver-programs.ps1).
      - name: Run Shared Save.exe and shared-save.exe from one folder, with one save
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-programs.ps1 -Archive "$env:RUNNER_TEMP/delivered/Shared Save-$env:PLATFORM.zip"

      # examples/markdown_preview, from its NSIS installer: md2html.exe in
      # the installed folder prints what it printed under bundle exec, and
      # a .md file opened through the shell with the app's ProgID starts
      # Markdown Preview.exe with its path, which previews it in the
      # browser (.github/scripts/deliver-markdown.ps1).
      - name: Install Markdown Preview, preview a Markdown file with it, and print its HTML with md2html
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-markdown.ps1
          -Installer "$env:RUNNER_TEMP/delivered/Markdown Preview-$env:PLATFORM-setup.exe"
          -Sample examples/markdown_preview/welcome.md -Expected "$env:RUNNER_TEMP/delivered/markdown_preview.expected"

      # The NSIS installer: installed silently for this person,
      # its Start menu shortcut's AppUserModelID read back and matched to
      # the app's own, the app started from it, installed again over
      # itself, and uninstalled (.github/scripts/deliver-installer.ps1).
      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM-setup.exe"

      # The signed build, refused by signtool on a fresh Windows
      # until it trusts the run's test certificate, then verified, every
      # PE file, the setup program, and the uninstaller it installs
      # (.github/scripts/deliver-signed.ps1).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ matrix.platform }}
          path: ${{ runner.temp }}/signed

      # The MSIX package (Fledge::Msix): the unsigned one, as the
      # Microsoft Store takes it, read and refused; the ones --sign and
      # --sign-command signed, refused until the run's test certificate
      # is trusted, then installed, listed in the Start menu, started
      # through their AppUserModelID with the package's identity, and
      # removed (.github/scripts/deliver-msix.ps1). The certificate
      # leaves TrustedPeople after each, so the step after it still sees
      # a Windows that trusts it nowhere.
      - name: Install Hello Window's MSIX packages, run them, and remove them
        shell: pwsh
        run: |
          foreach ($signed in "signed", "signed/command") {
            pwsh -NoProfile -File .github/scripts/deliver-msix.ps1 `
              -Package "$env:RUNNER_TEMP/delivered/Hello Window-$env:PLATFORM.msix" `
              -Signed "$env:RUNNER_TEMP/$signed/Hello Window-$env:PLATFORM.msix" `
              -Certificate "$env:RUNNER_TEMP/signed/certificate.cer"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Verify, install, and run the signed apps
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-signed.ps1
          -Hello "$env:RUNNER_TEMP/signed/Hello-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/signed/Hello Window-$env:PLATFORM.zip"
          -Installer "$env:RUNNER_TEMP/signed/Hello Window-$env:PLATFORM-setup.exe"
          -Certificate "$env:RUNNER_TEMP/signed/certificate.cer"

      # The apps --sign-command signed with signtool, verified
      # the same way, with the certificate the step above trusted.
      - name: Verify, install, and run the apps signed through a signing command
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-signed.ps1
          -Hello "$env:RUNNER_TEMP/signed/command/Hello-$env:PLATFORM.zip"
          -Windowed "$env:RUNNER_TEMP/signed/command/Hello Window-$env:PLATFORM.zip"
          -Installer "$env:RUNNER_TEMP/signed/command/Hello Window-$env:PLATFORM-setup.exe"
          -Certificate "$env:RUNNER_TEMP/signed/certificate.cer" -Trusted

  delivery-windows-aarch64-mingw-ucrt:
    name: Delivery (${{ matrix.platform }})
    needs: build-aarch64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Natively on Windows 11 on ARM64 (ADR 100).
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    env:
      PLATFORM: ${{ matrix.platform }}
    steps: *delivery-windows-steps

  # Delivery of fledge build --from: a console app built with
  # build_tools and Fledge as a gem, unpacked in a folder named outside
  # ASCII on a fresh runner with no Ruby and no runtime, runs its own
  # fledge build --from on a windowed project with file_associations and
  # installers; what it wrote runs, its identity read back with the
  # system's tools, and it refuses a project with a Gemfile, an app of
  # another release or platform, and a folder Fledge did not build. One
  # job for each operating system's family; the other platforms run the
  # same code paths.
  delivery-from-arm64-darwin:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-arm64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, the macOS floor (the header).
          - os: macos-26
            platform: arm64-darwin
    steps: &delivery-from-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            test/fixtures/from
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      # What an AppImage needs that no app may carry: squashfs-tools is
      # GPL-2.0 (doc/contributors/design/desktop-apps.md,
      # "Building from a built app"). Pinned to Ubuntu 24.04's build.
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1

      - name: Build a windowed app with the builder's own fledge build --from, with no Ruby, and run it
        if: runner.os != 'Windows'
        run: .github/scripts/deliver-from.sh "${{ matrix.platform }}" "$RUNNER_TEMP/delivered/Builder-${{ matrix.platform }}.tar.gz" "$PWD/test/fixtures/from/game"

      - name: Build a windowed app with the builder's own fledge build --from, with no Ruby, and run and install it
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver-from.ps1 -Platform ${{ matrix.platform }}
          -Archive "$env:RUNNER_TEMP/delivered/Builder-${{ matrix.platform }}.zip"
          -Game "$PWD\test\fixtures\from\game"

  delivery-from-x86_64-linux:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: *delivery-from-steps

  delivery-from-x64-mingw-ucrt:
    name: Delivery of build --from (${{ matrix.platform }})
    needs: build-x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: *delivery-from-steps

  # The license audit's own checks on each runtime this run built: that
  # the release assets are the very notices the runtime carries, that a
  # second audit of the unpacked archive agrees with the build's, that the
  # SPDX project's own tool accepts the SBOM, and that the audit still
  # fails when a GPL library or a GPL gem is slipped into the runtime
  # (.github/scripts/plant_gpl.rb). The audit reads compiled files with
  # LLVM's tools, which read every format, so one Linux runner checks
  # every platform.
  licenses:
    name: Licenses (${{ matrix.platform }})
    needs: [runtime, runtime-musl, runtime-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64-darwin, x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl, x64-mingw-ucrt, aarch64-mingw-ucrt, ios, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      - name: Unpack the runtime and check its release assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM".tar.gz -C "$RUNNER_TEMP/tree"
          tree=$(echo "$RUNNER_TEMP"/tree/fledge-runtime-*)
          echo "TREE=$tree" >> "$GITHUB_ENV"
          cmp "$tree/notices/sbom.spdx.json" "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM".spdx.json
          cmp "$tree/notices/NOTICES.txt" "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM"-NOTICES.txt
          # The runtime's notices/sources/ holds the same folders, byte for
          # byte, as the release's source bundle, but its README.
          case "$PLATFORM" in
            *-linux | *-linux-musl | *-mingw-ucrt)
              mkdir -p "$RUNNER_TEMP/bundle"
              tar -xzvf "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM"-lgpl-sources.tar.gz -C "$RUNNER_TEMP/bundle"
              bundle=$(echo "$RUNNER_TEMP"/bundle/fledge-runtime-*-lgpl-sources)
              rm "$bundle/README.txt"
              diff -r "$bundle" "$tree/notices/sources"
              ;;
            *)
              if ls "$RUNNER_TEMP"/runtimes/*-lgpl-sources.tar.gz 2>/dev/null; then echo "::error::$PLATFORM ships no LGPL library"; exit 1; fi
              if [ -e "$tree/notices/sources" ]; then echo "::error::$PLATFORM's runtime holds notices/sources/, but ships nothing that asks for its source"; exit 1; fi
              ;;
          esac

      - name: Audit the unpacked runtime
        run: ruby tasks/license_audit.rb --platform "${{ matrix.platform }}" --tree "$TREE"

      - name: Validate the SBOM with the SPDX tools
        run: pipx run --spec spdx-tools==0.8.3 pyspdxtools -i "$TREE/notices/sbom.spdx.json"

      - name: Fail the audit with a GPL library and a GPL gem slipped in
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          extension=$(ruby .github/scripts/plant_gpl.rb "$PLATFORM" "$TREE")
          if ruby tasks/license_audit.rb --platform "$PLATFORM" --tree "$TREE" > "$RUNNER_TEMP/tampered.txt"; then
            cat "$RUNNER_TEMP/tampered.txt"
            echo "::error::the audit passed a runtime with a GPL library and a GPL gem in it"
            exit 1
          fi
          grep -F "VIOLATION: unlisted-binary: $extension:" "$RUNNER_TEMP/tampered.txt"
          grep -F "gem-copyleft-1.0.0 is GPL-3.0-only, which the policy does not allow" "$RUNNER_TEMP/tampered.txt"

  # The same audit of the whole tree each runtime comes from, rv-ruby's,
  # jdx/ruby's, or RubyInstaller's, bundled gems, bin/ruby, and all: it
  # must find exactly what .github/license-expectations/ lists, which is
  # what the runtime builder removes (rv-ruby's and jdx/ruby's bin/ruby,
  # which link libxcrypt statically, and their libcrypt.a; nkf's Java
  # sources; MSYS2's keyring).
  # It shows the audit catching the real thing, not only planted files.
  licenses-upstream:
    name: Licenses of the whole upstream tree (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64-darwin, x86_64-linux, aarch64-linux, x64-mingw-ucrt, aarch64-mingw-ucrt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # The pinned downloads, as the runtime jobs keep theirs
      # (doc/contributors/design/runtimes.md, "Pinned downloads in CI"),
      # saved once the job has downloaded the last of them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ~/.cache/fledge/downloads
          key: upstream-downloads-${{ matrix.platform }}-files-

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      - name: Download and unpack the pinned upstream Ruby
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb ruby platforms "$PLATFORM")
          mkdir -p "$RUNNER_TEMP/upstream"
          case "$archive" in
            *.7z) 7z x -y -bd -o"$RUNNER_TEMP/upstream" "$archive" > /dev/null ;;
            *) tar -xzf "$archive" -C "$RUNNER_TEMP/upstream" ;;
          esac
          version=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("ruby", "version")')
          tree=$(find "$RUNNER_TEMP/upstream" -mindepth 1 -maxdepth 3 -type d \( -name "$version" -o -name "ruby-$version" -o -name 'rubyinstaller-*' \) | head -n 1)
          echo "TREE=$tree" >> "$GITHUB_ENV"

      - name: Key the downloads by the files they hold
        id: downloads-key
        run: ruby .github/scripts/download_cache_key.rb

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads-key.outputs.files != '' && steps.downloads.outputs.cache-matched-key != format('upstream-downloads-{0}-files-{1}', matrix.platform, steps.downloads-key.outputs.files)
        with:
          path: ~/.cache/fledge/downloads
          key: upstream-downloads-${{ matrix.platform }}-files-${{ steps.downloads-key.outputs.files }}

      - name: Audit the whole tree
        run: >-
          ruby tasks/license_audit.rb --platform "${{ matrix.platform }}" --tree "$TREE"
          --expect ".github/license-expectations/${{ matrix.platform }}.yml"

  # doc/licensing.md, the page that tells app developers what ships and
  # what it asks of them, is generated from the repository and
  # runtime/audited.yml, which records what the page reads of every
  # platform's runtime (tasks/licensing_page.rb). A unit test checks the
  # page against that record before a push; this job checks the record
  # and the page against the runtimes CI built, fails when either no
  # longer matches them, and uploads the files it expected.
  licensing-page:
    name: Licensing page is current
    needs: [runtime, runtime-musl, runtime-mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes

      # LLVM's llvm-objdump and llvm-readobj, which read every platform's
      # compiled files on one Linux runner (Fledge::Binary::Readers.llvm):
      # the llvm-mingw runtime/sources.yml pins, as the Windows runtime
      # builds with.
      - name: Unpack LLVM's tools for reading compiled files
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "FLEDGE_LLVM=$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_ENV"

      - name: Compare doc/licensing.md with the runtimes
        run: ruby tasks/licensing_page.rb --check "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: licensing-page
          path: |
            ${{ runner.temp }}/runtimes/licensing.md
            ${{ runner.temp }}/runtimes/audited.yml
          retention-days: 14

  # Whoever receives a Linux app may replace lib/libcrypt.so.2 (LGPL-2.1,
  # section 6(b)), as doc/licensing.md tells app developers. The built
  # hello, with libxcrypt rebuilt with only its strong hashes from the
  # source the app carries in notices/sources/libxcrypt/, and with
  # musl's crypt in its place, must load each and behave as each does
  # (.github/scripts/replace-libcrypt.sh), which also measures what
  # String#crypt loses without libxcrypt.
  replace-libcrypt-x86_64-linux:
    name: Replace libcrypt (${{ matrix.platform }})
    needs: build-x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
    steps: &replace-libcrypt-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Replace lib/libcrypt.so.2 and run the app with each replacement
        run: |
          tar -xzf "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP"
          # Assigned first, so a missing file or a download that fails stops
          # the step here: bash -e ignores a failed $(...) inside another
          # command's arguments. libxcrypt's source is the one the app
          # itself carries, so the replacement is built as a person who
          # received only the app would build it (LGPL-2.1, section 6(a)).
          xcrypt=$(ls "$RUNNER_TEMP/Hello-${{ matrix.platform }}"/notices/sources/libxcrypt/libxcrypt-*.tar.xz)
          musl=$(ruby .github/scripts/fetch_pin.rb replaceability musl)
          sh .github/scripts/replace-libcrypt.sh "$RUNNER_TEMP/Hello-${{ matrix.platform }}" Hello "$xcrypt" "$musl"

  replace-libcrypt-aarch64-linux:
    name: Replace libcrypt (${{ matrix.platform }})
    needs: build-aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps: *replace-libcrypt-steps

  # Another GNU MP for Windows, cross-built with the pinned llvm-mingw
  # against the UCRT, for Replace GMP to swap in.
  gmp-replacement:
    name: Build a replacement libgmp-10.dll (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pins-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-mingw-ucrt
            triple: x86_64-w64-mingw32
          - platform: aarch64-mingw-ucrt
            triple: aarch64-w64-mingw32
    env:
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Cross-build GNU MP as libgmp-10.dll
        run: |
          toolchain="$RUNNER_TEMP/llvm-mingw"
          source="$RUNNER_TEMP/gmp"
          mkdir -p "$toolchain" "$source" "$RUNNER_TEMP/gmp-dll"
          llvm_mingw=$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)
          gmp=$(ruby .github/scripts/fetch_pin.rb replaceability gmp)
          tar -xJf "$llvm_mingw" -C "$toolchain" --strip-components=1
          tar -xJf "$gmp" -C "$source" --strip-components=1
          export PATH="$toolchain/bin:$PATH"
          cd "$source"
          # GMP 6.2.1's config.sub predates aarch64-w64-mingw32; llvm-mingw's
          # own autoconf scripts know it.
          cp /usr/share/misc/config.sub configfsf.sub 2>/dev/null || true
          ./configure --quiet --host="$TRIPLE" CC="$TRIPLE-clang" CC_FOR_BUILD=cc \
            --enable-shared --disable-static --disable-assembly
          make --quiet -j"$(nproc)" > /dev/null
          cp .libs/libgmp-10.dll "$RUNNER_TEMP/gmp-dll/"
          "$TRIPLE-objdump" -p .libs/libgmp-10.dll | grep 'DLL Name'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmp-replacement-${{ matrix.platform }}
          path: ${{ runner.temp }}/gmp-dll/libgmp-10.dll
          if-no-files-found: error
          retention-days: 14

  # Whoever receives a Windows app may replace
  # ruby\bin\ruby_builtin_dlls\libgmp-10.dll (LGPL-3.0, section 4(d)(1)),
  # as doc/licensing.md tells app developers: the built hello must load
  # the replacement (Integer::GMP_VERSION changes) and compute the same
  # big numbers (.github/scripts/replace-gmp.ps1).
  replace-gmp-x64-mingw-ucrt:
    name: Replace GMP (${{ matrix.platform }})
    needs: [build-x64-mingw-ucrt, gmp-replacement]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps: &replace-gmp-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gmp-replacement-${{ matrix.platform }}
          path: ${{ runner.temp }}/gmp-dll

      - name: Replace libgmp-10.dll and run the app
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/replace-gmp.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.zip"
          -Dll "$env:RUNNER_TEMP/gmp-dll/libgmp-10.dll" -Version 6.2.1

  replace-gmp-aarch64-mingw-ucrt:
    name: Replace GMP (${{ matrix.platform }})
    needs: [build-aarch64-mingw-ucrt, gmp-replacement]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
    steps: *replace-gmp-steps
