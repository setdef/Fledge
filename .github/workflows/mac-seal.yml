# Experiment, not for trunk: how Gatekeeper treats a downloaded
# (quarantined) app sealed ad hoc (A), sealed then altered (B), and
# unsealed with only the linker's signature, then altered (C).

name: Mac seal

on:
  push:
    branches: ["experiment/mac-seal"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  seal:
    name: Seal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - name: System
        run: |
          set -x
          sw_vers
          uname -a
          xcodebuild -version || true
          clang --version
          spctl --status || true
          sudo spctl --global-enable || sudo spctl --master-enable || true
          spctl --status || true
          csrutil status || true
          command -v syspolicy_check || true

      - name: Build A, B, C, D, E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p "$HOME/seal/src" /tmp/mac-seal
          cd "$HOME/seal"
          cat > src/t.c <<'EOF'
          #include <stdio.h>
          int main(int argc, char **argv) {
            FILE *f = fopen("/tmp/mac-seal/" FORM, "a");
            if (!f) return 1;
            fprintf(f, "ran %s\n", argv[0]);
            fclose(f);
            return 0;
          }
          EOF
          mkapp() {
            form=$1; where=$2; app=$3
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            clang -O2 -arch arm64 -DFORM="\"$form-$where\"" \
              -o "$app/Contents/MacOS/T" src/t.c
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>T</string>
            <key>CFBundleIdentifier</key><string>com.example.t$form</string>
            <key>CFBundleName</key><string>T</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          </dict>
          </plist>
          EOF
            sed -i '' 's/^          //' "$app/Contents/Info.plist"
            echo resource > "$app/Contents/Resources/original.txt"
          }
          alter() {
            echo fused > "$1/Contents/Resources/game.love"
            plutil -replace CFBundleShortVersionString -string 1.1 "$1/Contents/Info.plist"
          }
          for where in quarantined clean; do
            mkdir -p "$where/A" "$where/B" "$where/C"
            mkapp a "$where" "$where/A/T.app"
            codesign --force --sign - --identifier com.example.t "$where/A/T.app"
            mkapp b "$where" "$where/B/T.app"
            codesign --force --sign - --identifier com.example.t "$where/B/T.app"
            alter "$where/B/T.app"
            mkapp c "$where" "$where/C/T.app"
            alter "$where/C/T.app"
          done
          # D: LÖVE as released, plain (D) and fused with a .love (E).
          # Pinned; nothing runs unless the digest matches.
          curl -sSLf -o love-11.5-macos.zip \
            https://github.com/love2d/love/releases/download/11.5/love-11.5-macos.zip
          echo "6795bb3a1656af6a2fdfe741e150787b481886d3a280327a261a3fdded586913  love-11.5-macos.zip" | shasum -a 256 -c
          mkdir love115 && ditto -x -k love-11.5-macos.zip love115
          ls love115
          mkdir -p game
          cat > game/main.lua <<'EOF'
          local f = io.open("/tmp/mac-seal/" .. MARK, "a")
          if f then f:write("ran love\n") f:close() end
          love.event.quit()
          EOF
          for where in quarantined clean; do
            mkdir -p "$where/D" "$where/E"
            ditto love115/love.app "$where/D/love.app"
            ditto love115/love.app "$where/E/love.app"
            (cd game && printf 'MARK = "e-%s"\n' "$where" > conf.lua && zip -q -r "../$where/E/love.app/Contents/Resources/game.love" main.lua conf.lua)
          done
          # LÖVE 12 (main, def245102c): run 41957924703's love-macos
          # artifact, if this job's token may read it.
          if curl -sSLf -H "Authorization: Bearer $GH_TOKEN" -o love12.zip \
              https://api.github.com/repos/love2d/love/actions/artifacts/13384396891/zip; then
            echo "e2c753765af21f7ffb7d68d7bd9be12f88760ee38bf67198aaed21a1afbfba5b  love12.zip" | shasum -a 256 -c
            mkdir love12 && ditto -x -k love12.zip love12
            find love12 -maxdepth 3 | head -20
            inner=$(find love12 -maxdepth 2 -name '*.zip' | head -1)
            if [ -n "$inner" ]; then ditto -x -k "$inner" love12/x; fi
            app12=$(find love12 -maxdepth 4 -name '*.app' -type d | head -1)
            echo "LÖVE 12 app: $app12"
            for where in quarantined clean; do
              mkdir -p "$where/F" "$where/G"
              ditto "$app12" "$where/F/love.app"
              ditto "$app12" "$where/G/love.app"
              (cd game && printf 'MARK = "g-%s"\n' "$where" > conf.lua && zip -q -r "../$where/G/love.app/Contents/Resources/game.love" main.lua conf.lua)
            done
          else
            echo "LOVE12_UNAVAILABLE: the job's token cannot read love2d/love's artifact"
          fi
          # As a browser marks a download, and Archive Utility every file
          # it extracts from one.
          q="0081;$(printf %x "$(date +%s)");Safari;$(uuidgen)"
          find quarantined -mindepth 2 -exec xattr -w com.apple.quarantine "$q" {} +
          xattr -l quarantined/A/T.app quarantined/A/T.app/Contents/MacOS/T

      - name: Inspect
        run: |
          cd "$HOME/seal"
          for where in quarantined clean; do for dir in "$where"/*; do
            app=$(echo "$dir"/*.app)
            exe="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
            echo "################ $app ($exe)"
            echo "+ codesign -dvvv $app"; codesign -dvvv "$app" 2>&1; echo "exit $?"
            echo "+ codesign -dvvv $exe"; codesign -dvvv "$exe" 2>&1; echo "exit $?"
            echo "+ codesign --verify --strict --deep -vv"; codesign --verify --strict --deep -vv "$app" 2>&1; echo "exit $?"
            echo "+ spctl --assess --type execute -vv"; spctl --assess --type execute -vv "$app" 2>&1; echo "exit $?"
            echo "+ spctl --assess --type execute -vv $exe"; spctl --assess --type execute -vv "$exe" 2>&1; echo "exit $?"
            if command -v syspolicy_check >/dev/null; then
              echo "+ syspolicy_check distribution"; syspolicy_check distribution "$app" 2>&1; echo "exit $?"
            fi
          done; done

      - name: Launch
        run: |
          cd "$HOME/seal"
          logs() {
            log show --start "$1" --info --debug --style compact --predicate \
              'subsystem BEGINSWITH "com.apple.syspolicy" OR process == "syspolicyd" OR process == "CoreServicesUIAgent" OR process == "amfid" OR (subsystem == "com.apple.launchservices" AND eventMessage CONTAINS[c] ".app") OR eventMessage CONTAINS[c] "quarantine"' \
              2>&1 | grep -v -e 'Recording' | tail -n 60
          }
          markers() { echo "+ markers:"; tail -n +1 /tmp/mac-seal/* 2>/dev/null; }
          for where in quarantined clean; do for dir in "$where"/*; do
            app="$PWD/$(echo "$dir"/*.app)"
            exe="$app/Contents/MacOS/$(defaults read "$app/Contents/Info" CFBundleExecutable)"
            echo "################ $where $(basename "$dir") $app"
            start=$(date '+%Y-%m-%d %H:%M:%S')
            echo "+ open"; open "$app" 2>&1; echo "exit $?"
            sleep 8
            echo "+ running after open:"; pgrep -fl "Contents/MacOS" || echo none
            pkill -f "$app/Contents/MacOS" || true
            markers
            echo "+ log"; logs "$start"
            start=$(date '+%Y-%m-%d %H:%M:%S')
            echo "+ exec $exe"; "$exe" & pid=$!
            sleep 6
            if kill -0 "$pid" 2>/dev/null; then echo "still running after 6 s"; kill "$pid"; wait "$pid"; echo "killed, exit $?"; else wait "$pid"; echo "exit $?"; fi
            markers
            echo "+ log"; logs "$start"
            echo "+ xattr after"; xattr -l "$app" 2>&1
            echo "+ spctl --add (the old Open Anyway by command)"; spctl --add --label mac-seal "$app" 2>&1; echo "exit $?"
          done; done
          echo "+ windows"
          osascript -e 'tell application "System Events" to get name of every process whose visible is true' 2>&1 || true
          ls -l /tmp/mac-seal
