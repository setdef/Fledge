# A spike for issue 162, never for trunk: it runs only on the branch
# probe/162-winui-arm64, on Windows on ARM64, and builds a WinUI 3 app in
# C#, with no Ruby, for ARM64 and for x64, to see whether the failure of
# XamlControlsResources is WinUI's own.

name: Probe 162

on:
  push:
    branches:
      - probe/162-winui-arm64

permissions:
  contents: read

jobs:
  probe:
    name: Probe 162 (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/probe-162
          sparse-checkout-cone-mode: false

      - name: Build and run a WinUI 3 app in C#, for ARM64 and for x64
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy RemoteSigned -File .github/scripts/probe-162/cs/probe-cs.ps1
          -Out "$env:RUNNER_TEMP/probe-out-cs"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-162-5
          path: ${{ runner.temp }}/probe-out-cs
