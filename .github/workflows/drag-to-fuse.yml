# Experiment only (experiment/drag-to-fuse), never for trunk: can a
# player app built once with fledge build write a fused game app on a
# computer with no Ruby, compiler, Bundler, or network, from a game
# folder or zip handed to it as Windows hands a dropped path, and does
# the fused app run there? Also: what macOS gives an app for a folder
# opened with it through LaunchServices, as a drop on its icon is; and
# whether Windows' own tar.exe reads a zip appended to a program, the
# single-file building block. The runtimes are trunk's, from CI run RUN
# at ece8356, the commit this branch starts from.

name: drag-to-fuse

on:
  push:
    branches: ["experiment/drag-to-fuse"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RUN: "41966470848"
  MISE_RUBY_COMPILE: "false"

jobs:
  player:
    name: player (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: arm64-darwin }
          - { os: windows-latest, platform: x64-mingw-ucrt }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - name: Build the player with fledge build
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: ruby -I lib exe/fledge build -o dist .github/drag_to_fuse/player

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  fuse-macos:
    name: fuse (arm64-darwin)
    needs: player
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: player-arm64-darwin
          path: ${{ runner.temp }}/player

      - name: Fuse a game folder and a game zip, with no Ruby, and run what comes out
        run: |
          set -eux
          work="$RUNNER_TEMP/w"
          mkdir -p "$work/folder" "$work/zip" "$work/empty"
          tar -xzf "$RUNNER_TEMP/player/FusePlayer-arm64-darwin.tar.gz" -C "$work"
          app="$work/FusePlayer-arm64-darwin/FusePlayer.app"
          cp -R .github/drag_to_fuse/game "$work/folder/spike"
          (cd .github/drag_to_fuse/game && ditto -c -k . "$work/zip/spike.zip")
          hostile() { env -i PATH="$work/empty" HOME="$work" RUBYOPT=-rbogus RUBYLIB=/nope GEM_HOME=/nope "$@"; }
          if hostile /bin/sh -c 'command -v ruby'; then echo "::error::ruby is reachable"; exit 1; fi

          echo "== a folder, as an argument"
          rm -f /tmp/fuse_player.json
          time hostile "$app/Contents/MacOS/FusePlayer" "$work/folder/spike"
          cat /tmp/fuse_player.json
          fused="$work/folder/fused/Spike Game.app"
          codesign --verify --deep --strict --verbose=2 "$fused"
          codesign -dv "$fused" 2>&1 | grep -E 'Identifier|Signature'
          plutil -p "$fused/Contents/Info.plist"
          xattr -l "$fused" || true
          du -sh "$app" "$fused"
          hostile "$fused/Contents/MacOS/Spike Game" "$work/report-direct.json"
          cat "$work/report-direct.json"
          grep -q '"asset":"hello from an asset"' "$work/report-direct.json"
          grep -q '"rubyopt":"-rbogus"' "$work/report-direct.json"
          open -W "$fused" --args "$work/report-open.json"
          cat "$work/report-open.json"

          echo "== a zip, as an argument"
          rm -f /tmp/fuse_player.json
          time hostile "$app/Contents/MacOS/FusePlayer" "$work/zip/spike.zip"
          cat /tmp/fuse_player.json
          codesign --verify --deep --strict "$work/zip/fused/Spike Game.app"
          hostile "$work/zip/fused/Spike Game.app/Contents/MacOS/Spike Game" "$work/report-zip.json"
          cat "$work/report-zip.json"

          echo "== a folder opened with the player through LaunchServices, as a drop on its icon"
          rm -f /tmp/fuse_player.json
          open -W -a "$app" "$work/folder/spike" || echo "open exited $?"
          cat /tmp/fuse_player.json || echo "no log: the player did not run"

  fuse-windows:
    name: fuse (x64-mingw-ucrt)
    needs: player
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: player-x64-mingw-ucrt
          path: ${{ runner.temp }}/player

      - name: Fuse a game folder and a game zip, with no Ruby, and run what comes out
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'w'
          New-Item -ItemType Directory -Force "$work\folder", "$work\zip", "$work\single" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\player\FusePlayer-x64-mingw-ucrt.zip" -DestinationPath $work
          $exe = "$work\FusePlayer-x64-mingw-ucrt\FusePlayer.exe"
          Copy-Item -Recurse .github\drag_to_fuse\game "$work\folder\spike"
          $tar = "$env:SystemRoot\System32\tar.exe"
          & $tar -a -c -f "$work\zip\spike.zip" -C .github\drag_to_fuse\game .
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:RUBYOPT = '-rbogus'; $env:RUBYLIB = 'C:\nope'; $env:GEM_HOME = 'C:\nope'
          if (Get-Command ruby -ErrorAction SilentlyContinue) { throw 'ruby is reachable' }
          $log = Join-Path ([IO.Path]::GetTempPath()) 'fuse_player.json'

          Write-Host '== a folder, as an argument, as Explorer passes a dropped one'
          Remove-Item -Force -ErrorAction SilentlyContinue $log
          $t = Measure-Command { Start-Process -FilePath $exe -ArgumentList "`"$work\folder\spike`"" -Wait }
          Write-Host "fuse took $($t.TotalSeconds) s"
          Get-Content $log
          $fusedDir = "$work\folder\fused\Spike Game-x64-mingw-ucrt"
          $fused = "$fusedDir\Spike Game.exe"
          Get-Content "$fusedDir\fledge.cfg"
          (Get-Item $fused).VersionInfo | Format-List FileDescription, ProductName, OriginalFilename
          Start-Process -FilePath $fused -ArgumentList "`"$work\report-folder.json`"" -Wait
          Get-Content "$work\report-folder.json"
          if (-not (Select-String -Quiet -SimpleMatch '"asset":"hello from an asset"' "$work\report-folder.json")) { throw 'no asset' }

          Write-Host '== a zip, as an argument'
          Remove-Item -Force -ErrorAction SilentlyContinue $log
          Start-Process -FilePath $exe -ArgumentList "`"$work\zip\spike.zip`"" -Wait
          Get-Content $log
          Start-Process -FilePath "$work\zip\fused\Spike Game-x64-mingw-ucrt\Spike Game.exe" -ArgumentList "`"$work\report-zip.json`"" -Wait
          Get-Content "$work\report-zip.json"

          Write-Host '== single file: the fused folder zipped and appended to a program, read back by tar.exe'
          & $tar -a -c -f "$work\fused.zip" -C "$work\folder\fused" "Spike Game-x64-mingw-ucrt"
          cmd /c copy /b "`"$fused`"+`"$work\fused.zip`"" "`"$work\single.exe`""
          Get-ChildItem $fused, "$work\fused.zip", "$work\single.exe" | Format-Table Name, Length
          $t = Measure-Command { & $tar -x -f "$work\single.exe" -C "$work\single" }
          Write-Host "extracting the appended zip took $($t.TotalSeconds) s, exit $LASTEXITCODE"
          (Get-ChildItem -Recurse -File "$work\single" | Measure-Object -Sum Length) | Format-List Count, Sum
          Start-Process -FilePath "$work\single\Spike Game-x64-mingw-ucrt\Spike Game.exe" -ArgumentList "`"$work\report-single.json`"" -Wait
          Get-Content "$work\report-single.json"
