# Keeps the pins of runtime/sources.yml current, each day, with nobody
# in the loop unless that fails. The watch asks every upstream whether it
# has released a newer version than the pin (tasks/pin_watch.rb reads
# where from runtime/upstreams.yml), writes what it found into the
# run's summary, and keeps it as the pin-watch artifact, as JSON.
#
# When a pin is behind, Move moves every such pin at once, proves the
# move with a full run of ci.yml on the branch pin-move, and puts it on
# trunk once that run is green (.github/scripts/pin-prove.sh). When it
# is red, Alone moves and proves each pin by itself, one after another,
# and lands each that passes. pin-move is this workflow's alone: no
# person or agent pushes it, and it is deleted after each proof.
#
# The run fails, and GitHub tells the account that owns its schedule,
# only when a person is needed: an upstream could not be read or listed
# no version its pattern takes, a pin held for a person has been behind
# for longer than PinWatch::HELD_DAYS, a pin's line has ended, a pin
# could not be moved, or a pin's proof was red. A pin held for a person and behind for less is
# only reported in the summary, and the rest move beside it.
#
# Once a move is on trunk and green there, Release cuts a release of it
# (cut.yml), so that the fix reaches apps with nobody in the loop; a
# red run of that calls a person as the rest do.

name: Pin watch

on:
  schedule:
    # Each day, at a minute when few other schedules start.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      land:
        description: Put a proven move on trunk (false proves it only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pin-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch the pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      behind: ${{ steps.watch.outputs.behind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: ruby

      # The token only raises GitHub's limit for reading public releases
      # from 60 requests an hour, which runners share, to the token's own.
      - name: Ask each upstream for its newest release
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/pin-watch.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pin-watch
          path: tmp/pin-watch.json
          retention-days: 30
          if-no-files-found: ignore

  # The proof waits in the job for the run of ci.yml it started, rather
  # than in a workflow of its own that the run's end starts, since GitHub
  # does not say whether the end of a run that the workflow's token
  # started starts another. A full run of ci.yml takes one to three
  # hours; a job may take six. It runs when the watch failed too, for an
  # unread upstream, an overdue hold, or an ended line, so that those do
  # not keep the other pins from moving.
  move:
    name: Move the pins and prove them
    needs: watch
    if: ${{ !cancelled() && needs.watch.outputs.behind == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
      actions: write
      # Reading each red job's annotations, for tasks/runnerless_runs.rb.
      checks: read
    outputs:
      moved: ${{ steps.prove.outputs.moved }}
      proven: ${{ steps.prove.outputs.proven }}
      release: ${{ steps.prove.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: ruby

      - name: Install the bundle
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pin-watch
          path: tmp

      - name: Move, prove, and land
        id: prove
        env:
          # The move asks GitHub's API for each release's digests: with no token,
          # 60 requests an hour, which runners share.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PIN_PROVE_LAND: ${{ github.event_name != 'workflow_dispatch' || inputs.land }}
        run: .github/scripts/pin-prove.sh tmp/pin-watch.json

  # Only when the proof of every pin together was red: each pin again,
  # by itself, on trunk as it stands then, one after another, so that a
  # red one is named by its job and the rest land.
  alone:
    name: Prove ${{ matrix.pin }} alone
    needs: move
    if: always() && needs.move.outputs.proven == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
      actions: write
      # Reading each red job's annotations, for tasks/runnerless_runs.rb.
      checks: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pin: ${{ fromJSON(needs.move.outputs.moved) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: ruby

      - name: Install the bundle
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pin-watch
          path: tmp

      - name: Move, prove, and land ${{ matrix.pin }}
        env:
          # The move asks GitHub's API for each release's digests: with no token,
          # 60 requests an hour, which runners share.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ matrix.pin }}
          PIN_PROVE_LAND: ${{ github.event_name != 'workflow_dispatch' || inputs.land }}
        run: .github/scripts/pin-prove.sh tmp/pin-watch.json "$PIN"

  # The commit to release: Move's release output, the move's own commit
  # or a later one that holds it, whose own run is green; or else, for
  # what Alone landed, whose matrix's jobs share no outputs, the newest
  # move of this run, found on trunk by its author and subject, and the
  # first commit from it on whose own run is green
  # (tasks/green_walk.rb).
  pick:
    name: Pick the move to release
    needs: [move, alone]
    if: always() && (needs.move.outputs.release != '' || needs.alone.result == 'success' || needs.alone.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.pick.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: trunk
          fetch-depth: 200

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: ruby

      - name: Pick the newest move this run landed
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.move.outputs.release }}
        run: |
          commit=$RELEASE
          if [ -z "$commit" ]; then
            since=$(gh run view "$GITHUB_RUN_ID" --json createdAt --jq .createdAt)
            moved=$(git log --format=%H --author='github-actions\[bot\]' --since="$since" --grep='^chore: move ' -1)
            # A move that was rebased has no green run of its own when a
            # push followed it: the first commit from it on with one holds it.
            if [ -n "$moved" ]; then
              commit=$(ruby tasks/green_walk.rb "$moved" trunk) || {
                echo "::warning::The move $moved landed on trunk, and no commit from it to trunk's head has a green run of ci.yml: nothing to release"
                commit=
              }
            fi
          fi
          # A move of pins that ship nothing adds no CHANGELOG line, and
          # a release of nothing fails (releases.md, "How a release is
          # made"): none is started unless the picked commit has an
          # unreleased entry from before.
          if [ -n "$commit" ]; then
            git show "$commit:CHANGELOG.md" > "$RUNNER_TEMP/changelog.md"
            ruby tasks/release_commit.rb pending "$RUNNER_TEMP/changelog.md" || commit=
          fi
          echo "Release: ${commit:-nothing to release}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: pick
    if: always() && needs.pick.outputs.commit != ''
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/cut.yml
    with:
      commit: ${{ needs.pick.outputs.commit }}
      # Stops before the tag until cut.yml has gone that far on GitHub
      # once, green (runtimes.md, "The proof"); then true.
      publish: false
