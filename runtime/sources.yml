    x64-mingw-ucrt:
      url: https://github.com/setdef/Fledge/releases/download/inputs-rubyinstaller-head-20261110/rubyinstaller-head-x64.7z
      sha256: 901473edafd6b174d79978fc109d3df3ab73b1436719233f35c1a31b5b18bf58
