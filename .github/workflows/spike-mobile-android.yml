# Spike (throwaway, spike/mobile only): cross-build CRuby 4.0.9 with the
# Android NDK for arm64-v8a and x86_64, link it into the smallest JNI
# host, build the APK with Gradle, check 16 KB page alignment, and run
# the bundled main.rb on API 36 emulators with 4 KB and 16 KB pages,
# printing logcat. Findings are in spike/mobile/FINDINGS.md.

name: Spike mobile Android

on:
  push:
    branches: [spike/mobile]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GRADLE_URL: https://services.gradle.org/distributions/gradle-9.8.2-bin.zip
  GRADLE_SHA256: 21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607

jobs:
  ruby:
    name: Ruby for ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: 4.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge-spike-mobile
          key: spike-mobile-android-sources-${{ hashFiles('spike/mobile/sources.sh') }}
      - name: Build Ruby and the native library
        run: time spike/mobile/android/build-ruby.sh ${{ matrix.abi }}
      - name: Archive the build
        if: always()
        run: tar -C spike/mobile/out/android -czf ruby-android-${{ matrix.abi }}.tar.gz --exclude work ${{ matrix.abi }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ruby-android-${{ matrix.abi }}
          path: ruby-android-${{ matrix.abi }}.tar.gz

  apk:
    name: APK, 16 KB alignment
    needs: ruby
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ruby-android-*
          merge-multiple: true
      - name: Unpack Ruby
        run: |
          mkdir -p spike/mobile/out/android
          for f in ruby-android-*.tar.gz; do tar -C spike/mobile/out/android -xzf "$f"; done
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge-spike-mobile
          key: spike-mobile-android-sources-${{ hashFiles('spike/mobile/sources.sh') }}
      - name: Install Gradle and the NDK's readelf
        run: |
          curl -sSfL -o gradle.zip "$GRADLE_URL"
          echo "$GRADLE_SHA256  gradle.zip" | sha256sum -c
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-9.8.2/bin/gradle" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          . spike/mobile/sources.sh
          zip=$(fetch "$NDK_LINUX_URL" "$NDK_LINUX_SHA256")
          [ -d "$SPIKE_CACHE/android-ndk-$NDK_VERSION" ] || (cd "$SPIKE_CACHE" && unzip -q "$zip")
          echo "ANDROID_NDK_ROOT=$SPIKE_CACHE/android-ndk-$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build the APK and check 16 KB alignment
        run: time spike/mobile/android/build-apk.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: spike/mobile/out/android/FledgeSpike-debug.apk

  emulator:
    name: Emulator, API 36 ${{ matrix.target }}
    needs: apk
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: spike/mobile/out/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: spike/mobile/android/run-emulator.sh spike/mobile/out/android/logcat-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logcat-${{ matrix.target }}
          path: spike/mobile/out/android/logcat-*.txt
