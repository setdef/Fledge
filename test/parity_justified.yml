#
# Every difference from ruby main.rb that Parity::JUSTIFIED and
# Parity::MOBILE_JUSTIFIED may allow
# (doc/contributors/design/public-interface.md, "Frozen for 1.x"). After
# 1.0 this list may only shrink: adding to it needs a major version.
- fact: "$0"
  reference:
  - \A"main\.rb"\z
  app:
  - \A"<app>/main\.rb"\z
  platforms:
  checks:
  - script
- fact: __FILE__
  reference:
  - \A"main\.rb"\z
  app:
  - \A"<app>/main\.rb"\z
  platforms:
  checks:
  - script
- fact: "$PROGRAM_NAME"
  reference:
  - \A"main\.rb"\z
  app:
  - \A"<app>/main\.rb"\z
  platforms:
  checks:
  - script
- fact: "$0"
  reference:
  - \A"exe/(?:my_cool_app|bundled_with)"\z
  app:
  - \A"<app>/(?:my_cool_app|bundled_with)"\z
  platforms:
  checks:
  - bundle
- fact: __FILE__
  reference:
  - \A"exe/(?:my_cool_app|bundled_with)"\z
  app:
  - \A"<app>/(?:my_cool_app|bundled_with)"\z
  platforms:
  checks:
  - bundle
- fact: "$PROGRAM_NAME"
