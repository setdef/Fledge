version = 1

[[annotations]]
path = 'Gemfile.lock'
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "CC0-1.0"

# Bundler writes a lockfile, and its own settings, and gives neither a
# place for a header; nor does Cargo its lockfile.
[[annotations]]
path = ['examples/my_cool_app/Gemfile.lock', 'test/fixtures/native_app/Gemfile.lock', 'test/fixtures/nokogiri_app/Gemfile.lock',
  'test/fixtures/native_app/.bundle/config', 'test/fixtures/nokogiri_app/.bundle/config', 'test/fixtures/raylib/Gemfile.lock',
  'test/fixtures/raylib/.bundle/config',
  'examples/mobile_app/Gemfile.lock', 'test/fixtures/real_gems/Gemfile.lock',
  'test/fixtures/real_gems/.bundle/config', 'test/fixtures/native_phone/Gemfile.lock', 'examples/sdl_phone/Gemfile.lock',
  'test/fixtures/cmake_phone/Gemfile.lock', 'examples/rake_phone/Gemfile.lock', 'examples/ffi_phone/Gemfile.lock', 'examples/ffi_library_phone/Gemfile.lock',
  'test/fixtures/system_library/Gemfile.lock', 'examples/rooibos_console/Gemfile.lock', 'test/fixtures/libui/Gemfile.lock', 'examples/libui_app/Gemfile.lock', 'examples/file_drop/Gemfile.lock', 'examples/markdown_preview/Gemfile.lock',
  'test/fixtures/rust_phone/Gemfile.lock', 'test/fixtures/rust_phone/gems/rusty/ext/rusty/Cargo.lock',
  'test/fixtures/rust_lengths/Gemfile.lock', 'test/fixtures/rust_lengths/gems/lengths/ext/lengths/Cargo.lock',
  'test/fixtures/bundled_with/Gemfile.lock', 'test/fixtures/mobile_commands/Gemfile.lock', 'test/fixtures/ffi_extconf/Gemfile.lock', 'test/fixtures/ffi_libc/Gemfile.lock',
  'test/fixtures/my_cool_app_without_sqlite3/Gemfile.lock', 'test/fixtures/typelib/Gemfile.lock',
  'test/fixtures/carried_libraries/Gemfile.lock', 'test/fixtures/msys2_linked/Gemfile.lock', 'test/fixtures/openssl_gem/Gemfile.lock']
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "MIT-0"

# The SHA-256 of every asset of a release, as sha256sum writes them,
# which the release workflow checks with sha256sum -c and publishes as
# the release's SHA256SUMS; that format has no comments.
[[annotations]]
path = 'lib/fledge/SHA256SUMS'
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "CC0-1.0"

# The windowed apps' icon, drawn by a script, saved as a PNG, and
# made into each system's files with sips and iconutil, none of which
# has a place for a header.
[[annotations]]
path = ['test/fixtures/windowed_app/icons/**', 'examples/mobile_app/icons/**', 'examples/libui_app/icons/**', 'examples/markdown_preview/icons/**']
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "MIT-0"

# The iOS project template's asset catalog, in the JSON Xcode reads,
# which has no place for a header.
[[annotations]]
path = 'lib/fledge/templates/ios/Host/Assets.xcassets/**'
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "MIT"

# The JSON Schema of fledge.yml (doc/contributors/design/public-interface.md), which editors read as JSON,
# which has no comments.
[[annotations]]
path = 'lib/fledge/config.schema.json'
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "MIT"

# Gradle's wrapper, as Gradle's gradle wrapper task writes it, in
# every Android project fledge build writes (ADR 012); the jar is the one
# Gradle publishes, whose SHA-256 runtime/sources.yml pins.
[[annotations]]
path = ['lib/fledge/templates/android/gradlew', 'lib/fledge/templates/android/gradlew.bat',
  'lib/fledge/templates/android/gradle/wrapper/**']
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = 'README.rdoc'
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

