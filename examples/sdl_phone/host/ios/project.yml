#
# Written by fledge build (ADR 012): XcodeGen's description of this
# Xcode project, which fledge build generated it from; change it and run
# xcodegen again, or change the project in Xcode. One app for iPhone and
# iPad, iOS 15 and later, on arm64 devices and Apple silicon Simulators,
# as Fledge's iOS runtime is (ADR 011), linking
# FledgeRuby.xcframework, with the identity fledge.yml gives. Its Ruby
# is the XCFramework slice's lib/ and libexec/, which the build phase
# "Copy Ruby and the app" copies into the bundle's fledge/ folder for the
# SDK it builds for, as CPython's iOS apps copy their slice's standard
# library, and then the folder fledge/: the app's program, its gems, and
# fledge.cfg. When the app's gems have C or C++ extensions (ADR 022), they
# are compiled for both slices into FledgeExtensions.xcframework, linked
# the same way, and Host/fledge_extensions.c registers them. No signing is configured: choose your team under Signing &
# Capabilities to run it on a device.
#
# sdl_phone's copy (ADR 025), which fledge.yml's ios host lays over
# Fledge's, and in which fledge build fills the same marks. Ruby runs on
# the main thread, inside SDL_RunApp, so the project asks the linker for
# a 64 MB main thread stack, the stack Fledge's host gives Ruby's own
# thread; ld takes -stack_size only for the main executable, so the
# Debug configuration keeps the app's code in it (ENABLE_DEBUG_DYLIB).
# The target's OTHER_LDFLAGS inherits the project's. SdlPhoneUITests
# taps the screen once the game draws, from the app's scheme, as Fledge's
# CI checks the game (host/ios/UITests/TapTest.m).
name: @@NAME@@
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    OTHER_LDFLAGS: -Wl,-stack_size,0x4000000
    ENABLE_DEBUG_DYLIB: NO
targets:
  SdlPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SdlPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SdlPhone
        PRODUCT_BUNDLE_IDENTIFIER: com.setdef.fledge.SdlPhoneUITests
        CLANG_ENABLE_MODULES: YES
  @@NAME@@:
    type: application
    platform: iOS
    sources:
      - path: Host
    dependencies:
      - framework: FledgeRuby.xcframework
        embed: false
      @@EXTENSIONS@@
    postCompileScripts:
      - name: Copy Ruby and the app
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          slice=ios-arm64
          if [ "$PLATFORM_NAME" = iphonesimulator ]; then slice=ios-arm64-simulator; fi
          root="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/fledge"
          rm -rf "$root"
          ditto "$PROJECT_DIR/FledgeRuby.xcframework/$slice/lib" "$root/lib"
          ditto "$PROJECT_DIR/FledgeRuby.xcframework/$slice/libexec" "$root/libexec"
          ditto "$PROJECT_DIR/fledge" "$root"
    scheme:
      testTargets:
        - SdlPhoneUITests
    settings:
      base:
        PRODUCT_NAME: @@NAME@@
        PRODUCT_BUNDLE_IDENTIFIER: @@IDENTIFIER@@
        MARKETING_VERSION: @@VERSION@@
        CURRENT_PROJECT_VERSION: @@VERSION@@
        INFOPLIST_FILE: Host/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: @@APP_ICON@@
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: @@LDFLAGS@@
