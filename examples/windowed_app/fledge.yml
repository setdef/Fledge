# A windowed app (ADR 008), with everything an app says about itself to
# the operating system and the person who runs it: the name in a Dock,
# taskbar, or menu, which may have spaces; the identifier macOS and
# Windows know it by, a reverse-DNS name of a domain its developer
# controls; its version, publisher, and copyright, which Explorer's
# Properties dialog shows; and its icon, the files each operating system
# takes it from, named as Briefcase names them: icons/icon.icns for
# macOS, icons/icon.ico for Windows, and icons/icon-16.png to
# icons/icon-512.png for Linux; what it says about itself, a line, a
# paragraph, and a web page, which menus, packages, and Windows' Settings
# show; its license, which its setup program shows and its .deb installs,
# and its changelog, which the .deb installs too; and its Mac build
# number. Like hello, it sits inside Fledge's own gem, and this file makes
# its folder a project's root (ADR 005).
name: Hello Window
kind: windowed
identifier: com.setdef.fledge.HelloWindow
version: "1.2.3"
publisher: setdef
copyright: © 2026 setdef
description: Says hello from a window
long_description: |
  Hello Window is the example windowed app of Fledge, which ships a Ruby
  app to people who don't have Ruby.

  It opens no window: given a path, it writes a report there.
homepage: https://github.com/setdef/Fledge
license_file: LICENSE.txt
icon: icons/icon
installers: [dmg, nsis, appimage, deb]
linux:
  deb_changelog: CHANGES.txt
macos:
  build: "1.2.417"

# The files and folders it opens (ADR 032, section 3): every folder, which
# it writes its report into, and its own reports, which it writes over.
# macOS offers it for them, Windows' setup program adds it to their "Open
# with" and to every folder's menu, and a Linux desktop passes their
# paths to it.
file_associations:
  - name: Hello Window folder
    folders: true
  - name: Hello Window report
    role: editor
    extensions: [hellowindow]
    mime_types: [application/x-hellowindow]
