# GNU MP, which RubyInstaller's Ruby DLL imports for big-integer
# arithmetic, ships unchanged as ruby/bin/ruby_builtin_dlls/libgmp-10.dll.
# That file is byte for byte the one in MSYS2's package
# mingw-w64-ucrt-x86_64-gmp 6.3.0-2 (package), and MSYS2 built the
# package from its source package (url): GMP's release, MSYS2's patches,
# and the PKGBUILD. GMP is LGPL-3.0-or-later OR GPL-2.0-or-later, so the
# LGPL source bundle each Windows runtime release carries holds the
# source package (tasks/license_audit/source_bundle.rb); the license
# audit checks the DLL's SHA-256 (runtime/licenses.yml), so a
# RubyInstaller that ships another GMP fails until this pin follows; and
# CI checks that the package holds that very DLL (ci.yml, Runtime).
gmp:
  version: 6.3.0
  url: https://repo.msys2.org/mingw/sources/mingw-w64-gmp-6.3.0-2.src.tar.zst
  sha256: f288f944fd9609db220bcf6a8dd0703a5674eeb906ef35eb8485bb8192135994
  package:
    url: https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-gmp-6.3.0-2-any.pkg.tar.zst
    sha256: e82a75968a556484a50084578238a84eb60fb93e34986fd6695c537975bd39ea
  dll_sha256: c2567ccf3f410c3411ba7cd4b7ba14f393a0e70a1d0c0593297df6706b5fba96
  # The same source's build for Windows on ARM64, in MSYS2's CLANGARM64
  # environment, whose libgmp-10.dll RubyInstaller's ARM64 Ruby ships
  # byte for byte (doc/contributors/design/runtimes.md, "Windows on ARM64").
  arm64:
    package:
      url: https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-gmp-6.3.0-2-any.pkg.tar.zst
      sha256: edfaa0517787819ec3ad5da2cc4d691563962a576d0102e91eea507abdc3bdfb
    dll_sha256: bfc6046e374a27838b54bde5602851c7cc426ac9438cb65f019b9e67a961f47c

# Two DLLs RubyInstaller's head build of 2026-11-10 needs and does not
# ship, which each Windows runtime adds from the MSYS2 packages of the
# builds RubyInstaller's own files come from. Its zlib.so imports
# libz-1.dll, the name MSYS2's zlib 1.4 gives the DLL, where the build
# ships the same package's zlib1.dll and names that in
# zlib.so-assembly.manifest, so Ruby's zlib does not load; and on x64 its
# digest/blake3.so imports libgcc_s_seh-1.dll, GCC's runtime library, for
# one function (__popcountdi2). Each is pinned by its package's SHA-256
# (package), the path of the DLL in it (path), and the DLL's own SHA-256
# (dll_sha256), which the license audit checks too (runtime/licenses.yml);
# and by MSYS2's source package of that build (url), which holds the
# upstream release, MSYS2's patches, and the PKGBUILD. Neither license
# asks for the source (zlib's; GCC's runtime library exception), so no
# runtime carries it. The x64 builds are MSYS2's UCRT64 environment's,
# whose zlib1.dll RubyInstaller ships byte for byte, and the ARM64 one
# CLANGARM64's, whose clang links its own builtins, so blake3.so needs no
# libgcc there.
windows-dlls:
