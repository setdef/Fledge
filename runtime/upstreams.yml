# Where each pin of runtime/sources.yml is released upstream, so that
# tasks/pin_watch.rb can find a release newer than the pin with nobody
# remembering to look (doc/contributors/design/runtimes.md, "Keeping the
# pins current"). A test fails when a component of runtime/sources.yml
# is in neither list below, so a new pin is watched, or says why not.
#
# Each watched entry names:
#
# pins: the components of runtime/sources.yml it is the upstream of, as
#   dotted paths; every one holds the same version, or the watch fails.
# field: the key of each pin that holds its version (version by
#   default), and current, a pattern whose version capture takes it out
#   of that value when the value holds more than the version.
# github: the repository whose releases are listed, with tag, a pattern
#   whose version capture is a release's version, which a tag that does
#   not match is not. Drafts and releases GitHub marks as prereleases
#   are left out.
# page: or the URL of a listing with no API, with pattern, which finds
#   every version on it.
# apk: or the URL of an Alpine branch's index, with {repository} and
#   {arch} for each of repositories and architectures; its pin is a
#   mapping of packages, each of which is an upstream of its own, behind
#   when its indexes serve another build than the pin.
# line: when set, how many leading numbers of the version make a line
#   the pin stays in: a newer release in the line is the pin's next
#   version, and one beyond it is reported but not taken.
# ships: false for an input no runtime or app carries, which CI alone
#   uses; true by default. A move of one that ships adds a line to
#   CHANGELOG.md.
#
# What tasks/pin_move.rb needs to move the pin when the watch finds it
# behind:
#
# hold: why a person moves this pin and the move does not, when it does
#   not. The watch reports it behind as held, with this, and fails only
#   once it has been behind for longer than PinWatch::HELD_DAYS; the move
#   refuses it.
# checksum: where each new SHA-256 comes from: github, the digest
#   GitHub's API lists beside each release asset (the default for a
#   repository); beside, the .sha256 file the upstream publishes beside
#   each download; or download, the file downloaded and hashed (the
#   default for a page). A github asset with no digest is downloaded.
#   A container image, pinned as REPOSITORY:TAG@sha256:DIGEST, takes its
#   new digest from its registry's record of the new tag (quay.io's or
#   Docker Hub's).
# keep: keys beside a moved URL that do not depend on the version, which
#   the move leaves as they are. Any other key stops the move.
# member: for a pin of one file inside an archive, the key of its path
#   there, beside file_sha256, its SHA-256. The move rewrites the
#   version in the path, downloads the new archive, and hashes the file
#   it unpacks from it (with zstd, or 7-Zip's 7zz, and tar).
# linked: for an input whose build links libraries whose versions only
#   its upstream's own build script names, that script's url, with
#   {version} for the new version, and the ids of runtime/licenses.yml's
#   entries for those libraries, each with a pattern whose version
#   capture finds its version in the script. The move rewrites each
#   entry whose version the script no longer names.
# platform: for an input that is a Ruby, each platform of its pin with a
#   pattern whose arch capture finds the Ruby's own name for its platform
#   in a path of the new archive. The move lists the archive and moves
#   runtime/licenses.yml's platform to that name when it gives another.
# compiled: for an input that compiles libraries into its own files,
#   each platform of its pin with the ids of runtime/licenses.yml's
#   entries for those libraries, each with file, a pattern for the path
#   of the file in the new archive that holds the library, version, a
#   pattern whose version capture finds the library's version in that
#   file's bytes, as the license audit's evidence does, and title, what
#   CHANGELOG.md calls it. The move reads them from the archive it lists
#   for platform, in the same download, and rewrites each entry whose
#   version the file no longer holds.
# licenses: the ids of runtime/licenses.yml's entries that name the
#   pin's version, which the move rewrites: their version, their
#   download, and the evidence their files hold.
# also: other files that name the pin, each with patterns whose version
#   capture the move rewrites; each URL and SHA-256 the move replaces is
#   replaced in them too.
# release: for an input whose URLs carry a release name other than the
#   version the watch compares (the NDK's release name, beside its revision), the
#   key of that name (field), a pattern whose version capture finds the
#   new release's name in the listing, with {version} for the new
#   version, and the licenses and also that name it. The move rewrites
#   the name as it rewrites the version.
# names: what prose calls the input, the first in CHANGELOG.md; the key
#   by default. test/pin_move_test.rb fails when a line names a movable
#   pin's version beside one of these anywhere but in the files above,
#   the records of what changed (CHANGELOG.md, the research and plans
#   kept as they were on their day), and the files of named.
# named: files that name the version for itself and not as the pin: a
#   fact about that release, a source cited at it, a test's own data, or
#   another build's copy of the same input (mise.toml's MSYS2 zlib). A
#   move leaves them as they are, and they stay true.
#
# A version that Ruby's Gem::Version calls a prerelease (one with a
# letter in it, as 4.1.0-preview2 or 9.6.0-alpha05) counts only when the
# pin is a prerelease too.
watched:
  # Ruby itself, from Ruby's own index of every release it has published,
  # which gives each tarball's SHA-256. Ruby's minor versions are lines:
  # a move to the next one is a planned change (releases.md, "Ruby minors
  # and runtimes").
  ruby:
    pins: [ruby, mobile.ruby, musl-ruby.ruby, ruby-build.ruby]
    page: https://cache.ruby-lang.org/pub/ruby/index.txt
    pattern: '^ruby-(?<version>\d+\.\d+\.\d+(?:-(?:preview|rc)\d+)?)\t\S+\.tar\.gz\t'
    line: 2
    names: [Ruby]
    hold: The step from Ruby 4.1's preview to 4.1.0 is the maintainer's to take (releases.md, "The day Ruby 4.1.0 appears"); a patch of 4.1 after it waits on the code runtimes.md, "Ruby's patches, with no person", names.
  # jdx/ruby's release of the macOS and glibc Linux Rubies, one per Ruby
  # version, tagged with it, so a newer one is a Ruby those platforms can
  # take. A rebuild of the same Ruby, with newer OpenSSL or zlib, is
  # tagged VERSION-N, which Ruby's Gem::Version orders before VERSION, so
  # the pattern leaves rebuilds out and the watch does not report them.
  # Its Mac Ruby names its platform for the macOS it was built on, which
  # a new runner changes (platform).
  jdx-ruby:
    pins: [ruby]
    field: jdx_release
    github: jdx/ruby
    tag: '\A(?<version>\d+\.\d+\.\d+(?:-(?:preview|rc)\d+)?)\z'
    line: 2
    platform:
      arm64-darwin: '/lib/ruby/[^/]+/(?<arch>arm64-darwin\d*)/rbconfig\.rb\z'
    hold: jdx/ruby releases one build per Ruby version, so its next release is a move of Ruby, which is planned work (ruby, above).
  # PyPA's manylinux_2_28 image, which the glibc Linux runtimes build
  # in, from quay.io's listing of its tags, newest first (the first page
  # of 100 holds the newest). Each processor's image has its own
  # repository with the same tags; the x86_64 one is asked, and the move
  # takes each repository's digest of the new tag from the same API.
  manylinux:
    pins: [manylinux]
    page: https://quay.io/api/v1/repository/pypa/manylinux_2_28_x86_64/tag/?onlyActiveTags=true&limit=100
    pattern: '"name": ?"(?<version>\d{4}\.\d{2}\.\d{2}-\d+)"'
    names: [manylinux_2_28]
  # The Docker Hub images CI runs in. A tag that names a release moves in
  # its line, from Docker Hub's list of the repository's tags, newest
  # first; a tag that names none is the same tag pushed again, so its
  # version is the day Docker Hub's record of the tag says it was last
  # pushed. Either way the move takes the new digest from that record.
  # None ships: what the musl runtimes are built with is pinned by
  # package (alpine-packages, below), not by image.
  alpine-ruby:
    pins: [images.alpine-ruby]
    page: https://hub.docker.com/v2/namespaces/library/repositories/ruby/tags/4.1.0-preview1-alpine3.24
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  alpine:
    pins: [images.alpine]
    page: https://hub.docker.com/v2/namespaces/library/repositories/alpine/tags?page_size=100
    pattern: '"name": ?"(?<version>\d+\.\d+\.\d+)"'
    line: 2
    ships: false
  debian-trixie-slim:
    pins: [images.debian-trixie-slim]
    page: https://hub.docker.com/v2/namespaces/library/repositories/debian/tags/trixie-slim
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  ubuntu-noble:
    pins: [images.ubuntu-noble]
    page: https://hub.docker.com/v2/namespaces/library/repositories/ubuntu/tags/24.04
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  almalinux-8:
    pins: [images.almalinux-8]
    page: https://hub.docker.com/v2/namespaces/library/repositories/almalinux/tags/8
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  amazonlinux-2023:
    pins: [images.amazonlinux-2023]
    page: https://hub.docker.com/v2/namespaces/library/repositories/amazonlinux/tags/2023
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  ubuntu-jammy:
    pins: [images.ubuntu-jammy]
    page: https://hub.docker.com/v2/namespaces/library/repositories/ubuntu/tags/22.04
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  debian-bookworm-slim:
    pins: [images.debian-bookworm-slim]
    page: https://hub.docker.com/v2/namespaces/library/repositories/debian/tags/bookworm-slim
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  archlinux-base-devel:
    pins: [images.archlinux-base-devel]
    page: https://hub.docker.com/v2/namespaces/library/repositories/archlinux/tags/base-devel
    pattern: '"tag_last_pushed": ?"(?<version>\d{4}-\d{2}-\d{2})'
    ships: false
  # The Alpine packages CI installs, one upstream for each package of
  # the mapping alpine-packages, read from the branch's index for each
  # repository and architecture. A branch keeps only each package's
  # newest build, so a pin is behind when every architecture serves one
  # other build, older or newer, since the pinned one no longer installs.
  # The branch is the image's: 3.25 moves with images.alpine, by a person.
  # None ships: what the musl runtimes compile in from GCC and Rust is
  # recorded in runtime/licenses.yml by its upstream version, which the
  # license audit checks in every runtime the proof builds.
  alpine-packages:
    pins: [alpine-packages]
    apk: https://dl-cdn.alpinelinux.org/alpine/v3.24/{repository}/{arch}/APKINDEX.tar.gz
    repositories: [main, community]
    architectures: [x86_64, aarch64]
    ships: false
  # RubyInstaller's numbered release of the pinned Ruby, which replaces
  # the head build Windows runs while Ruby 4.1 is a preview (runtimes.md,
  # "Windows' Ruby until Ruby 4.1.0").
  rubyinstaller:
    pins: [ruby]
    github: oneclick/rubyinstaller2
    tag: '\ARubyInstaller-(?<version>\d+\.\d+\.\d+)-\d+\z'
    line: 2
    names: [RubyInstaller]
    hold: RubyInstaller's numbered release replaces the head build with the step to Ruby 4.1.0, which is the maintainer's to take (releases.md, "The day Ruby 4.1.0 appears"); a patch after it waits on the code runtimes.md, "Ruby's patches, with no person", names.
  llvm-mingw:
    pins: [llvm-mingw]
    github: mstorsjo/llvm-mingw
    tag: '\A(?<version>\d{8})\z'
    licenses: [compiler-rt]
  libxcrypt:
    pins: [libxcrypt]
    github: besser82/libxcrypt
    tag: '\Av(?<version>\d+\.\d+\.\d+)\z'
    line: 1
    licenses: [libxcrypt, libxcrypt-static, libxcrypt-source]
    named: [doc/contributors/design/runtimes.md, tasks/runtime_builder/linux.rb, test/runtime_builder_test.rb,
      test/license_audit_test.rb, test/integration/licensing_page_test.rb]
  rcedit:
    pins: [rcedit]
    github: electron/rcedit
    tag: '\Av(?<version>\d+\.\d+\.\d+)\z'
    licenses: [rcedit]
  llvm-readobj:
    pins: [llvm-readobj]
    github: llvm/llvm-project
    tag: '\Allvmorg-(?<version>\d+\.\d+\.\d+)\z'
    names: [llvm-readobj, LLVM]
    member: path
    licenses: [llvm-readobj]
    linked:
      url: https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-{version}/llvm/utils/release/build_llvm_release.bat
      zlib-llvm-readobj: '^set zlib_version=(?<version>\S+)'
      zstd-llvm-readobj: '^set zstd_version=(?<version>\S+)'
  # continuous is its rolling tag, and old its archive.
  appimage-runtime:
    pins: [appimage-runtime]
    github: AppImage/type2-runtime
    tag: '\A(?<version>\d{8})\z'
    names: [AppImage's runtime, appimage-runtime]
    hold: Its release lists neither its commit nor its source archive's SHA-256, and the versions of libfuse, squashfuse, zstd, zlib, musl, mimalloc, and GCC it links come from Alpine's packages on the day it was built, which no file names; only the new runtimes' own bytes say them, and libfuse's own source pin moves with them (runtimes.md, "Held pins").
  # The files SourceForge lists in the NSIS 3 folder, as an RSS feed.
  nsis:
    pins: [nsis]
    page: https://sourceforge.net/projects/nsis/rss?path=/NSIS%203
    pattern: '/NSIS%203/(?<version>3\.\d+(?:\.\d+)?)/'
    names: [NSIS]
    licenses: [nsis, nsis-source]
    named: [doc/contributors/design/signing.md]
  # The OpenSSL release line RubyInstaller's Windows Ruby links.
  openssl:
    pins: [mobile.openssl, musl-ruby.openssl]
    github: openssl/openssl
    tag: '\Aopenssl-(?<version>\d+\.\d+\.\d+)\z'
    line: 2
    names: [OpenSSL]
    licenses: [openssl-fledge, openssl-musl, openssl-mobile]
    named: [runtime/mobile/openssl_certificates.c]
  libyaml:
    pins: [mobile.libyaml, musl-ruby.libyaml]
    github: yaml/libyaml
    tag: '\A(?<version>\d+\.\d+\.\d+)\z'
    licenses: [libyaml-mobile, libyaml-musl]
    named: [doc/contributors/design/runtimes.md]
  libffi:
    pins: [mobile.libffi, musl-ruby.libffi]
    github: libffi/libffi
    tag: '\Av(?<version>\d+\.\d+\.\d+)\z'
    licenses: [libffi-mobile, libffi-musl]
  zlib:
    pins: [musl-ruby.zlib]
    github: madler/zlib
    tag: '\Av(?<version>\d+\.\d+(?:\.\d+)*)\z'
    line: 1
    licenses: [zlib-musl]
    named: [mise.toml]
  # curl's page of Mozilla's CA certificates, which links every dated
  # extract it has published.
  ca-certificates:
    pins: [mobile.ca-certificates, musl-ruby.ca-certificates]
    current: '\Acacert-(?<version>\d{4}-\d{2}-\d{2})\z'
    page: https://curl.se/docs/caextract.html
    pattern: 'cacert-(?<version>\d{4}-\d{2}-\d{2})\.pem'
    names: [Mozilla's CA certificates, cacert, ca-certificates]
    checksum: beside
    licenses: [ca-certificates]
  # Google's repository of Android's SDK packages, the one Android
  # Studio's SDK manager reads; channel-0 is its stable channel, which
  # lists betas too, marked by a preview in their revision. Its revision
  # orders the releases, and the name of each release's archives (r30,
  # r29b) is the release name its URLs carry.
  ndk:
    pins: [mobile.ndk]
    field: revision
    page: https://dl.google.com/android/repository/repository2-3.xml
    pattern: 'path="ndk;(?<version>[\d.]+)">(?:(?!</remotePackage>|<preview>).)*?<channelRef ref="channel-0"/>'
    names: [NDK]
    named: [doc/contributors/design/phone-projects.md, lib/fledge/mobile_extensions/cmake.rb]
    also:
      lib/fledge/mobile_extensions/ndk.rb: ['RECOMMENDED = "(?<version>[^"]+)"']
      doc/contributors/device-test.md: ['"ndk;(?<version>[\d.]+)"', 'ndk/(?<version>[\d.]+)\n']
    release:
      field: version
      pattern: 'path="ndk;{version}">(?:(?!</remotePackage>).)*?<url>android-ndk-(?<version>r\d+[a-z]?)-linux\.zip</url>'
      licenses: [compiler-rt-ndk]
      also:
        mise.android.toml: ['\[tools\."http:android-ndk"\]\nversion = "(?<version>[^"]+)"']
        doc/contributors/device-test.md: ['NDK (?<version>r\d+[a-z]?)\.\*\*', 'NDK (?<version>r\d+[a-z]?) is the one']
  gradle:
    pins: [mobile.gradle]
    page: https://services.gradle.org/versions/current
    pattern: '"version" : "(?<version>[^"]+)"'
    names: [Gradle]
    checksum: beside
    keep: [wrapper_sha256]
    named: [doc/contributors/design/phone-projects.md]
    also:
      lib/fledge/templates/android/gradle/wrapper/gradle-wrapper.properties: ['distributions/gradle-(?<version>[\d.]+)-bin\.zip']
  agp:
    pins: [mobile.agp]
    page: https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml
    pattern: '<version>(?<version>[^<]+)</version>'
    names: [Android Gradle plugin, AGP]
    named: [doc/contributors/design/phone-projects.md]
    also:
      lib/fledge/mobile_project/android.rb: ['AGP = "(?<version>[^"]+)"']
  xcodegen:
    pins: [mobile.xcodegen]
    github: yonaskolb/XcodeGen
    tag: '\A(?<version>\d+\.\d+\.\d+)\z'
    ships: false
    names: [XcodeGen]
    named: [doc/contributors/device-test.md]
    also:
      mise.toml: ['\[tools\."http:xcodegen"\]\nversion = "(?<version>[^"]+)"']
  bundletool:
    pins: [mobile.bundletool]
    github: google/bundletool
    tag: '\A(?<version>\d+\.\d+\.\d+)\z'
    ships: false

# Components that are not watched on their own, each with the reason.
unwatched:
  gmp: Moves with the Windows Ruby, whose DLL a runtime ships byte for byte from RubyInstaller.
  windows-dlls.libz-1.dll: Moves with the Windows Ruby, whose zlib1.dll comes from the same MSYS2 build.
  windows-dlls.libgcc_s_seh-1.dll: Moves with the Windows Ruby, the MSYS2 build its blake3.so was linked against.
  libfuse: Moves with appimage-runtime, as the libfuse its install-dependencies.sh builds in.
  replaceability.musl: CI's stand-in for libxcrypt in the replaceability proof, which no runtime carries.
  replaceability.gmp: CI's stand-in for an older GMP in the replaceability proof, which must stay older.
  mobile.xcode: Apple publishes no download to pin; CI chooses Xcode by version on the runner.
  ruby-build.rust: Builds no runtime; it follows the Rust that mise.toml pins.
  almalinux-perl.perl-open: AlmaLinux's repository keeps every build it has published, of this Perl's stream and of module streams for other Perls, so the pinned build keeps resolving and a newer one is a choice of stream, which the move cannot make; and its version-release (1.11-423.el8_10.1) is no version Ruby's Gem::Version can order. A person moves the three AlmaLinux Perl packages together when the image's Perl needs it (runtimes.md, "Alpine's packages").
  almalinux-perl.perl-encoding: Its newest build cannot be read mechanically, as almalinux-perl.perl-open's cannot; it moves with that package.
  almalinux-perl.perl-Filter: Its newest build cannot be read mechanically, as almalinux-perl.perl-open's cannot; it moves with that package.
