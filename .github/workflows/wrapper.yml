# Experiment (Plan 003, "A framework wrapper ships an app through Fledge"):
# what Rooibos's own CI would do. Rooibos's "first app" example is built
# with a tagged Fledge, as a Rooibos app developer builds it, on a runner
# of each platform; each app is then run in a terminal on a fresh runner
# with no Ruby, typed into, and ended with Ctrl-C.
name: Wrapper experiment (Rooibos)

on:
  push:
    branches:
      - experiment/wrapper

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLEDGE_TAG: v0.0.1.pre.16
  ROOIBOS_TAG: v0.8.0
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rooibos's repository, at a release tag: where its example lives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: setdef/Rooibos
          ref: ${{ env.ROOIBOS_TAG }}
          path: rooibos
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      # ratatui_ruby is published precompiled for macOS on Apple silicon,
      # x86-64 Linux, and 64-bit Windows, and as source, which compiles
      # with cargo, for ARM Linux.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: matrix.platform == 'aarch64-linux'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # The project a Rooibos app developer has: the example's program as
      # main.rb, a Gemfile with rooibos, and Fledge from a release tag in
      # the development group, which Fledge leaves out of the app.
      - name: Write the project
        run: |
          mkdir -p "$RUNNER_TEMP/rooibos_app"
          cp rooibos/examples/verify_website_hello_mvu/app.rb "$RUNNER_TEMP/rooibos_app/main.rb"
          cd "$RUNNER_TEMP/rooibos_app"
          cat > Gemfile <<GEMFILE
          source "https://rubygems.org"
          gem "rooibos", "0.8.0"
          group :development do
            gem "fledge", git: "https://github.com/setdef/Fledge", tag: "$FLEDGE_TAG"
          end
          GEMFILE
          bundle lock --add-platform arm64-darwin x86_64-linux aarch64-linux x64-mingw-ucrt
          bundle lock --add-checksums
          bundle install
          cat Gemfile.lock

      - name: Build with the release's runtime
        run: |
          unset FLEDGE_RUNTIME_DIR
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          cd "$RUNNER_TEMP/rooibos_app"
          bundle exec fledge build 2> "$RUNNER_TEMP/build.err" | tee "$RUNNER_TEMP/build.out" || { cat "$RUNNER_TEMP/build.err"; exit 1; }
          cat "$RUNNER_TEMP/build.err"
          grep -F "https://github.com/setdef/Fledge/releases/download/$FLEDGE_TAG" "$RUNNER_TEMP/build.err"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.platform }}
          path: ${{ runner.temp }}/rooibos_app/dist/RooibosApp-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 3

  deliver:
    name: Deliver (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ matrix.platform }}
          path: ${{ runner.temp }}/app

      - name: Run it in a terminal, with no Ruby
        if: runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP/app"
          tar xzf RooibosApp-${{ matrix.platform }}.tar.gz
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/deliver-tui.py" "$PWD/RooibosApp-${{ matrix.platform }}/RooibosApp"

      - name: Run it in a console, with no Ruby
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-tui.ps1 -Archive "$env:RUNNER_TEMP/app/RooibosApp-${{ matrix.platform }}.zip"
