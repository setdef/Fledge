//
// Written by fledge build (ADR 012): a Gradle project of one Android
// app, which ./gradlew assembleDebug builds as an APK, ./gradlew
// bundleRelease as the app bundle Google Play takes, or Android Studio
// opens.
// The Android Gradle plugin is the version Fledge's runtime is built and
// checked with.
pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
    plugins {
        id 'com.android.application' version '@@AGP@@'
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = '@@PROJECT_NAME@@'
