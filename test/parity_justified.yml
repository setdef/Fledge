  app:
  - \A"(?-mix:<prefix>\/lib\/ruby\/gems\/\d+\.\d+\.0(?:\+\d+)?)/(?<gem>(?:gems|extensions)/.*)\z
  platforms:
  checks:
  - bundle
- fact: "$LOADED_FEATURES"
  reference:
  - \A"(?-mix:<work>\/person-gems)/gems/(?<file>bundler-(?!.*/bundler/feature_flag\.rb"\z).*)\z
  app:
  - \A"(?-mix:<prefix>\/lib\/ruby\/gems\/\d+\.\d+\.0(?:\+\d+)?)/gems/(?<file>bundler-.*)\z
  platforms:
  checks:
  - bundle
- fact: ENV
  reference:
  - (?-mix:\A"(?<name>BUNDLE_BIN_PATH|BUNDLER_SETUP|RUBYLIB|RUBYOPT)"="(?<before>[^"]*))(?-mix:<work>\/person-gems)/gems/(?<after>bundler-.*)\z
  app:
  - (?-mix:\A"(?<name>BUNDLE_BIN_PATH|BUNDLER_SETUP|RUBYLIB|RUBYOPT)"="(?<before>[^"]*))(?-mix:<prefix>\/lib\/ruby\/gems\/\d+\.\d+\.0(?:\+\d+)?)/gems/(?<after>bundler-.*)\z
  platforms:
  checks:
  - bundle
- fact: child ENV
  reference:
  - (?-mix:\A"(?<name>BUNDLE_BIN_PATH|BUNDLER_SETUP|RUBYLIB|RUBYOPT)"="(?<before>[^"]*))(?-mix:<work>\/person-gems)/gems/(?<after>bundler-.*)\z
  app:
  - (?-mix:\A"(?<name>BUNDLE_BIN_PATH|BUNDLER_SETUP|RUBYLIB|RUBYOPT)"="(?<before>[^"]*))(?-mix:<prefix>\/lib\/ruby\/gems\/\d+\.\d+\.0(?:\+\d+)?)/gems/(?<after>bundler-.*)\z
  platforms:
  checks:
  - bundle
- fact: ENV
  reference:
  - \A"(?<name>GEM_HOME|PATH)"=
  app:
  - \A"(?<name>GEM_HOME|PATH)"=
  platforms:
  checks:
  - bundle
- fact: child ENV
  reference:
  - \A"(?<name>GEM_HOME|PATH)"=
  app:
  - \A"(?<name>GEM_HOME|PATH)"=
