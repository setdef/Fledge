# Experiment (Plan 003, "Android on arm64"): can a GitHub-hosted runner
# run an arm64-v8a Android emulator with hardware acceleration?
name: Android arm64 probe

on:
  push:
    branches:
      - experiment/android-arm64

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  emulator:
    name: Emulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    steps:
      - name: Find the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          ls "$ANDROID_HOME/emulator" 2>&1 | head -3 || true
          ls "$ANDROID_HOME/system-images" 2>&1 | head || true
          echo "JAVA_HOME_21_X64=${JAVA_HOME_21_X64:-} JAVA_HOME_21_arm64=${JAVA_HOME_21_arm64:-}"

      - name: Install the emulator and an arm64-v8a system image
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/dl"
            os=linux
            [ "$RUNNER_OS" = Windows ] && os=win
            curl -fsSL -o "$RUNNER_TEMP/dl/t.zip" "https://dl.google.com/android/repository/commandlinetools-${os}-11076708_latest.zip"
            unzip -q "$RUNNER_TEMP/dl/t.zip" -d "$RUNNER_TEMP/dl"
            mv "$RUNNER_TEMP/dl/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export JAVA_HOME="${JAVA_HOME_21_X64:-${JAVA_HOME_21_arm64:-$JAVA_HOME}}"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -e "$sdk" ] || sdk="$sdk.bat"
          yes | "$sdk" --licenses >/dev/null || true
          for ch in 0 1 2 3; do
            echo "--- channel $ch"
            "$sdk" --channel=$ch --list 2>&1 | grep -i -E "^ *emulator|Loading|Warning|Error" | head -5
          done
          "$sdk" --channel=3 emulator 2>&1 | tail -5
          "$sdk" --channel=3 "emulator" "platform-tools" "system-images;android-36;google_apis;arm64-v8a" 2>&1 | tail -15
          ls "$ANDROID_HOME/emulator" | head -30

      - name: Ask the emulator about acceleration
        continue-on-error: true
        run: |
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -5
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | head -10
          "$ANDROID_HOME/emulator/emulator" -help-accel 2>&1 | head -30 || true

      - name: Try to boot an arm64-v8a emulator
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-${JAVA_HOME_21_arm64:-$JAVA_HOME}}"
          avd="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          [ -e "$avd" ] || avd="$avd.bat"
          echo no | "$avd" create avd -n probe -k "system-images;android-36;google_apis;arm64-v8a" --force
          "$ANDROID_HOME/emulator/emulator" -avd probe -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel off -verbose > emulator.log 2>&1 &
          pid=$!
          start=$SECONDS
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do
            if [ $((SECONDS - start)) -gt 600 ]; then echo "NOT BOOTED after 600 s"; break; fi
            if ! kill -0 $pid 2>/dev/null; then echo "emulator exited"; break; fi
            sleep 10
          done
          echo "elapsed $((SECONDS - start)) s"
          adb shell getprop ro.product.cpu.abi || true
          grep -i -E "accel|hvf|kvm|whpx|hypervisor|HAXM|failed|error|cannot|not " emulator.log | head -30

      - name: Emulator log
        if: always()
        run: tail -40 emulator.log || true
