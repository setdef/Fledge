# Plan 001's pipeline, on every push and pull request: the gate, then a
# runtime per platform, then the tests on each platform with its own
# runtime, then one machine building examples/hello, the gem-shaped
# examples/my_cool_app, and the windowed examples/windowed_app for every
# platform, and each platform building the examples whose gems compile
# from source for itself (ADR 006), then
# Delivery: each built app unpacked and run on a fresh computer that has
# never had Ruby.
#
# The gate runs once, on Linux: its lints (RuboCop, Steep, RDoc
# coverage, REUSE, actionlint, clang-format) read the same files on
# every OS, so one run answers for all three.
#
# The macOS and Linux runtimes build on each platform's own runner
# (macos-15 is Apple Silicon, ubuntu-24.04-arm is aarch64), because their
# launchers link Ruby itself. The Windows runtime builds on Linux: its
# launcher loads Ruby's DLL when it runs, so it cross-compiles with a
# pinned llvm-mingw from Ruby's headers alone (runtime/sources.yml), and
# Windows runners test it and deliver it. Apps build for every platform
# from one Linux runner, as ADR 001 promises developers.
#
# A windowed app gets installers too (ADR 009): a disk image for macOS,
# an NSIS setup program for Windows, and an AppImage for Linux, all
# written on the one Linux runner, with makensis, which the makensis jobs
# build from NSIS's source for every computer that builds apps; and
# Delivery installs each on a fresh runner and runs the app it installed.
#
# Every runtime build runs the license audit and refuses to archive a
# runtime that breaks Fledge's license policy (ADR 004). The Licenses
# jobs check what it wrote and that it still fails on GPL code; the
# upstream jobs show it catching what rv-ruby and RubyInstaller ship and
# runtimes remove; the licensing page job keeps doc/licensing.md true to
# the runtimes; and the Replace jobs prove that whoever receives an app
# can replace its LGPL libraries, as that page tells developers.
#
# release.yml calls this workflow on a v* tag and publishes the runtimes
# it built once Delivery passes. Nothing here, or ever, publishes to
# RubyGems.org (ADR 001).

name: CI

on:
  push:
    # Tags run through release.yml, which calls this workflow itself.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds where they exist
  # (mise's Ruby documentation); false makes a missing build fail instead
  # of compiling Ruby for ten minutes.
  MISE_RUBY_COMPILE: "false"
  # The Rust that compiles the examples' Rust gems in the Build from
  # source jobs, the release Ferro's gems are tested with (its mise.toml).
  RUST_TOOLCHAIN: "1.99.1"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins the tools contributors use (bin/setup): Ruby, the
      # REUSE tool, actionlint, shellcheck, and clang-format. CI installs
      # the same pins the same way. Its cache is keyed by mise.toml's hash.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      # Bundler keeps its files outside the checkout, where RuboCop and
      # the REUSE tool would read them.
      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      # Gems with native extensions compile against one Ruby on one OS, so
      # the key names both, with the lockfile. Only an exact match
      # restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # Minitest prints each test's name and time (A is Minitest::TestTask's
      # argument variable), so a stuck test shows which it is.
      - name: Run the gate
        timeout-minutes: 15
        env:
          A: --verbose
        run: bundle exec rake

      # The gate starts with lint:fix, which corrects RuboCop offenses and
      # adds missing license headers, so an offense would pass as a fix
      # nobody committed. A changed or new file fails here instead.
      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

  # One runtime per platform (rake runtime): the launcher compiled with
  # warnings as errors and the compiler's static analyzer, the pinned
  # Ruby's standard library pruned beside it (rv-ruby's, or for Windows
  # RubyInstaller's, checked against its PGP signature), and the license
  # audit (ADR 004), which fails the build of a runtime that breaks
  # Fledge's license policy and writes its NOTICES and SBOM. Beside each
  # archive go the release assets that describe it: the SBOM, the
  # NOTICES, and the source of its LGPL libraries.
  runtime:
    name: Runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          # Cross-compiled; the runner's 7z unpacks RubyInstaller's archive
          # and its gpgv checks the signature.
          - os: ubuntu-24.04
            platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder needs only Ruby's standard library, so mise installs
      # only Ruby, and no bundle.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # patchelf removes the RUNPATHs rv-ruby's build left in its
      # extensions. libfuse's headers declare what the AppImage runtime's
      # fuse.c loads from the computer's own libfuse (ADR 009), which no
      # runtime links. Both pinned to Ubuntu 24.04's builds; gcc, clang,
      # make, patch, perl, and xz, which libxcrypt's and the AppImage
      # runtime's builds need, are on the runner already.
      - name: Install patchelf and libfuse's headers
        if: runner.os == 'Linux' && matrix.platform != 'x64-mingw-ucrt'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf=0.18.0-1.1build1 libfuse3-dev=3.14.0-5build1

      # rv-ruby, RubyInstaller, llvm-mingw, and libxcrypt downloads, keyed
      # by the file that pins their SHA-256s, so a changed pin downloads
      # afresh. The builder checks every cached file's SHA-256 again
      # before using it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      # The archive's timestamps are the commit's, so two builds of one
      # commit differ only where the compiler's output does.
      - name: Build the runtime
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      # The Windows source bundle holds MSYS2's source package of GMP as
      # the exact source of RubyInstaller's libgmp-10.dll. That holds only
      # if MSYS2's binary package of that build holds the very file the
      # runtime ships, byte for byte.
      - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
        if: matrix.platform == 'x64-mingw-ucrt'
        run: |
          package=$(ruby .github/scripts/fetch_pin.rb gmp package)
          mkdir -p "$RUNNER_TEMP/gmp-package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" ucrt64/bin/libgmp-10.dll
          cmp "$RUNNER_TEMP/gmp-package/ucrt64/bin/libgmp-10.dll" tmp/runtime/x64-mingw-ucrt/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
          sha256sum "$RUNNER_TEMP/gmp-package/ucrt64/bin/libgmp-10.dll"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

  # makensis, NSIS's compiler, for each computer that builds apps (ADR
  # 009; tasks/makensis_builder.rb): built from NSIS's pinned source on
  # each platform's own runner, and, for Windows, the pinned release's own
  # makensis.exe, repacked on Linux. It never ships in an app; what an
  # installer holds of NSIS is in the Windows runtime.
  makensis:
    name: makensis (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: ubuntu-24.04
            platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: makensis-downloads-${{ hashFiles('runtime/sources.yml') }}

      - name: Build makensis
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          ruby tasks/makensis_builder.rb "${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: makensis-${{ matrix.platform }}
          path: tmp/makensis/fledge-makensis-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The tests on each platform, with that platform's runtime, so
  # test/built_app_test.rb builds and runs a real app rather than
  # skipping (FLEDGE_REQUIRE_RUNTIME turns a skip into a failure), and its
  # makensis; on Linux with squashfs-tools' unsquashfs, which
  # test/squashfs_test.rb reads its file systems back with.
  test:
    name: Test (${{ matrix.platform }})
    needs: [runtime, makensis]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests need only Ruby, so mise installs only Ruby, at
      # mise.toml's pin, as on a contributor's machine.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/fledge/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fledge/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: makensis-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      # Pinned to Ubuntu 24.04's build.
      - name: Install unsquashfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools=1:4.6.1-1build1
          echo "FLEDGE_REQUIRE_UNSQUASHFS=1" >> "$GITHUB_ENV"

      - name: Run the tests
        timeout-minutes: 10
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_REQUIRE_RUNTIME: "1"
        run: bundle exec rake test

      # ADR 003 and ADR 005: the probe app, built from this runtime,
      # against rv-ruby's own ruby running the same main.rb, then the probe
      # as examples/my_cool_app's program, built with its gems, against
      # bundle exec on that Ruby. The report lands in the job summary; an
      # unjustified difference fails the job.
      - name: Check parity with ruby main.rb and bundle exec
        timeout-minutes: 10
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: bundle exec rake parity

  # The tests on Windows, with the Windows runtime, on RubyInstaller's
  # Ruby, which the runtime ships too (ADR 001), through setup-ruby at
  # mise.toml's pin. test/built_app_test.rb unpacks hello and my_cool_app
  # with Windows' own Expand-Archive and runs Hello.exe and MyCoolApp.exe;
  # test/zip_test.rb checks that Expand-Archive reads what Fledge::Zip
  # writes.
  test-windows:
    name: Test (x64-mingw-ucrt)
    needs: [runtime, makensis]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Ruby pin
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}
          bundler-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-x64-mingw-ucrt
          path: ${{ runner.temp }}/runtimes

      # test/nsis_test.rb and built_app_test.rb compile installers with
      # the release's own makensis.exe (FLEDGE_REQUIRE_MAKENSIS).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: makensis-x64-mingw-ucrt
          path: ${{ runner.temp }}/runtimes

      # test/native_build_test.rb compiles a C gem with the runtime's Ruby,
      # which finds MSYS2's tools as RubyInstaller does, MSYS2_PATH first:
      # the tree setup-ruby set up (ADR 006).
      - name: Point RubyInstaller at setup-ruby's MSYS2
        run: echo "MSYS2_PATH=$RI_DEVKIT" >> "$GITHUB_ENV"

      - name: Run the tests
        timeout-minutes: 15
        env:
          A: --verbose
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
          FLEDGE_REQUIRE_RUNTIME: "1"
          FLEDGE_REQUIRE_MAKENSIS: "1"
        run: bundle exec rake test

      # ADR 003 and ADR 005: the probe app, built from this runtime,
      # against RubyInstaller's own ruby.exe running the same main.rb, then
      # both again under code page 437, then the probe as
      # examples/my_cool_app's program against bundle exec. The report
      # lands in the job summary; an unjustified difference fails the job.
      - name: Check parity with ruby main.rb and bundle exec
        timeout-minutes: 10
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: bundle exec rake parity

  # Every platform's app from one Linux computer, from the runtimes the
  # runtime jobs built: the cross-building ADR 001 promises, now with each
  # platform's build of my_cool_app's native gem (ADR 005).
  build:
    name: Build the examples for every platform
    needs: [runtime, makensis]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fledge build needs only Ruby's standard library, so no bundle.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes

      # This runner's makensis, for windowed_app's NSIS installer.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: makensis-x86_64-linux
          path: ${{ runner.temp }}/runtimes

      # The parity probe (test/fixtures/parity) goes to Delivery too, which
      # asks it what a child Ruby sees, and so does the probe as a
      # gem-shaped app's program (Parity.gem_probe), which Delivery asks
      # what Bundler.with_original_env and with_unbundled_env give a child.
      # my_cool_app's gems come from RubyGems.org, each checked against its
      # Gemfile.lock's checksum.
      # examples/windowed_app is a windowed app (ADR 008): an .app bundle,
      # signed ad hoc, for macOS, a GUI program for Windows, and a folder
      # with a desktop entry for Linux, each with the identity its
      # fledge.yml gives, and each with its installer (ADR 009): a disk
      # image, an NSIS setup program, and an AppImage, all written on this
      # Linux runner.
      - name: Build hello, the parity probes, my_cool_app, and windowed_app for arm64-darwin, x86_64-linux, aarch64-linux, and x64-mingw-ucrt
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle")' "$RUNNER_TEMP/parity-bundle"
          for app in examples/hello test/fixtures/parity "$RUNNER_TEMP/parity-bundle" examples/my_cool_app examples/windowed_app; do
            ruby -I lib exe/fledge build -t arm64-darwin -t x86_64-linux -t aarch64-linux -t x64-mingw-ucrt -o dist "$app"
          done

      # What my_cool_app prints as its developer runs it, which every
      # platform's built app must print too.
      - name: Run my_cool_app with bundle exec
        working-directory: examples/my_cool_app
        run: |
          bundle install
          bundle exec ruby exe/my_cool_app | tee "$GITHUB_WORKSPACE/dist/my_cool_app.expected"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-arm64-darwin
          path: |
            dist/Hello-arm64-darwin.tar.gz
            dist/Parity-arm64-darwin.tar.gz
            dist/ParityBundle-arm64-darwin.tar.gz
            dist/MyCoolApp-arm64-darwin.tar.gz
            dist/Hello Window-arm64-darwin.tar.gz
            dist/Hello Window-arm64-darwin.dmg
            dist/my_cool_app.expected
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-x86_64-linux
          path: |
            dist/Hello-x86_64-linux.tar.gz
            dist/Parity-x86_64-linux.tar.gz
            dist/ParityBundle-x86_64-linux.tar.gz
            dist/MyCoolApp-x86_64-linux.tar.gz
            dist/Hello Window-x86_64-linux.tar.gz
            dist/Hello Window-x86_64-linux.AppImage
            dist/my_cool_app.expected
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-aarch64-linux
          path: |
            dist/Hello-aarch64-linux.tar.gz
            dist/Parity-aarch64-linux.tar.gz
            dist/ParityBundle-aarch64-linux.tar.gz
            dist/MyCoolApp-aarch64-linux.tar.gz
            dist/Hello Window-aarch64-linux.tar.gz
            dist/Hello Window-aarch64-linux.AppImage
            dist/my_cool_app.expected
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-x64-mingw-ucrt
          path: |
            dist/Hello-x64-mingw-ucrt.zip
            dist/Parity-x64-mingw-ucrt.zip
            dist/ParityBundle-x64-mingw-ucrt.zip
            dist/MyCoolApp-x64-mingw-ucrt.zip
            dist/Hello Window-x64-mingw-ucrt.zip
            dist/Hello Window-x64-mingw-ucrt-setup.exe
            dist/my_cool_app.expected
          if-no-files-found: error
          retention-days: 14

  # Gems that must be compiled compile only on the platform they are for
  # (ADR 006), so each platform's own runner builds examples/native_app:
  # redcarpet, a C gem published only as source, ferro-idna, a Rust gem
  # (rb-sys) from its git tag, and bigdecimal, which spreadsheet, a GPL
  # gem, needs, each compiled against the runtime's own Ruby and its
  # build-only companion, which the runtime job built. The Mac and
  # Windows build examples/nokogiri_app too, nokogiri from source: with
  # macOS's own iconv on the Mac, and with GNU libiconv linked in on
  # Windows, which ships as any gem's compiled code does (ADR 007). Each
  # also builds the gem-shaped parity probe, which Delivery asks what a
  # child Ruby sees, and records what bundle exec prints, which the built
  # app must print too.
  build-native:
    name: Build from source (${{ matrix.platform }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            rust: ""
          - os: ubuntu-24.04
            platform: x86_64-linux
            rust: ""
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            rust: ""
          # RubyInstaller's Ruby is a MinGW build, and rb-sys refuses to
          # build for it with Rust's MSVC target (Ferro's ci.yml), so
          # Windows takes the GNU host toolchain.
          - os: windows-latest
            platform: x64-mingw-ucrt
            rust: -x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: runner.os != 'Windows'
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Read the Ruby pin
        if: runner.os == 'Windows'
        id: pins
        run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      # RubyInstaller's Ruby, with the MSYS2 UCRT64 toolchain ridk installs,
      # which fledge build finds as RubyInstaller does (MSYS2_PATH first).
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: ${{ steps.pins.outputs.ruby }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}${{ matrix.rust }}

      # bindgen, which rb-sys runs, parses Ruby's MinGW headers, so clang
      # must target MinGW and find the MSYS2 tree setup-ruby installs, as
      # Ferro's CI sets it up (after oxidize-rb/actions' setup-ruby-and-rust,
      # with its two AVX-512 defines, rust-bindgen #2500); libclang comes
      # from the LLVM the runner image ships.
      # SPDX-SnippetBegin
      # SPDX-License-Identifier: AGPL-3.0-or-later
      # SPDX-SnippetCopyrightText: 2026 Kerrick Long <me@kerricklong.com>
      # SPDX-SnippetComment: Adapted from Ferro's .github/workflows/ci.yml at
      #   ef2407b1f44cd3c23d98c5085042857761598b85 (setdef/Ferro), its step
      #   "Point bindgen at Ruby's MSYS2 headers".
      - name: Point bindgen and RubyInstaller at MSYS2
        if: runner.os == 'Windows'
        run: |
          sysroot="${RI_DEVKIT//\\//}${MSYSTEM_PREFIX:?setup-ruby did not set MSYSTEM_PREFIX}"
          libclang="C:/Program Files/LLVM/bin"
          test -f "$sysroot/include/stdio.h" || { echo "::error::no C headers (stdio.h) in $sysroot/include"; exit 1; }
          test -f "$libclang/libclang.dll" || { echo "::error::no libclang.dll in $libclang"; exit 1; }
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-gnu --sysroot=$sysroot -D__AVX512VLFP16INTRIN_H -D__AVX512FP16INTRIN_H"
            echo "LIBCLANG_PATH=$libclang"
            echo "MSYS2_PATH=$RI_DEVKIT"
          } >> "$GITHUB_ENV"
      # SPDX-SnippetEnd

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      - name: Build native_app, and the parity probe, from source for ${{ matrix.platform }}
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: |
          ruby -e 'require "./tasks/parity"; Parity.gem_probe(ARGV.fetch(0), name: "ParityBundle")' "$RUNNER_TEMP/parity-bundle"
          ruby -I lib exe/fledge build -o dist "$RUNNER_TEMP/parity-bundle"
          ruby -I lib exe/fledge build -o dist examples/native_app

      - name: Build nokogiri_app from source for ${{ matrix.platform }}
        if: matrix.platform == 'arm64-darwin' || matrix.platform == 'x64-mingw-ucrt'
        env:
          FLEDGE_RUNTIME_DIR: ${{ runner.temp }}/runtimes
        run: ruby -I lib exe/fledge build -o dist examples/nokogiri_app

      # What each app prints as its developer runs it, which its built app
      # must print too.
      - name: Run the examples with bundle exec
        run: |
          examples=native_app
          case "${{ matrix.platform }}" in arm64-darwin | x64-mingw-ucrt) examples="native_app nokogiri_app" ;; esac
          for example in $examples; do
            (cd "examples/$example" && bundle install)
            (cd "examples/$example" && bundle exec ruby main.rb) | tee "dist/$example.expected"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            dist/NativeApp-${{ matrix.platform }}.*
            dist/NokogiriApp-${{ matrix.platform }}.*
            dist/ParityBundle-${{ matrix.platform }}.*
            dist/*.expected
          if-no-files-found: error
          retention-days: 14

  # Delivery of what Build from source built, on a fresh runner of each
  # platform, as Delivery runs the cross-built apps.
  delivery-native:
    name: Delivery from source (${{ matrix.platform }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run native_app as someone with no Ruby would
        if: runner.os != 'Windows'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NativeApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/native_app.expected")"

      - name: Run nokogiri_app as someone with no Ruby would
        if: matrix.platform == 'arm64-darwin'
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/NokogiriApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/nokogiri_app.expected")"

      - name: Run NativeApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NativeApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/native_app.expected" -Raw).TrimEnd()

      - name: Run NokogiriApp.exe as someone with no Ruby would
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/NokogiriApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/nokogiri_app.expected" -Raw).TrimEnd()

  # Delivery (Plan 001): each app on a fresh runner of its platform, with
  # nothing of Fledge but the archive and the script that checks it, and
  # no Ruby set up. Runners come with Rubies installed, so the script runs
  # the app with an empty PATH and checks that no ruby is on it, then
  # runs it in a clean and in a hostile environment
  # (.github/scripts/deliver.sh).
  delivery:
    name: Delivery (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
            ruby-platform: arm64-darwin23
          - os: ubuntu-24.04
            platform: x86_64-linux
            ruby-platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-platform: aarch64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Run hello as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.ruby-platform }}"

      - name: Run my_cool_app as someone with no Ruby would
        run: >-
          .github/scripts/deliver.sh "$RUNNER_TEMP/delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "$RUNNER_TEMP/delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat "$RUNNER_TEMP/delivered/my_cool_app.expected")"

  # Delivery of the windowed app (ADR 008), on a fresh runner of each
  # platform: on macOS its .app bundle must pass codesign --verify --strict
  # --deep, plutil must read its identity, and it must run through open -W,
  # as Finder starts it, and through its own program; on Linux
  # desktop-file-validate must accept its desktop entry, and its icons and
  # program must be there and run (.github/scripts/deliver-windowed.sh).
  # Then its installer (ADR 009): on macOS the disk image, attached,
  # verified, and dragged to an Applications folder, with the app run from
  # both (deliver-dmg.sh); on Linux the AppImage, mounted with FUSE and
  # extracted without, run each way and in a hostile environment, and
  # unpacked by --appimage-extract (deliver-appimage.sh).
  delivery-windowed:
    name: Delivery of a windowed app (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      # freedesktop.org's validator, pinned to Ubuntu 24.04's build of it.
      - name: Install desktop-file-validate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils=0.27-2build1

      - name: Start Hello Window as the desktop would
        run: .github/scripts/deliver-windowed.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.tar.gz"

      - name: Install Hello Window from its disk image as a person would
        if: runner.os == 'macOS'
        run: .github/scripts/deliver-dmg.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.dmg"

      # FUSE 3, which desktops ship and the runner's image may not,
      # pinned to Ubuntu 24.04's build: the AppImage loads its libfuse.
      - name: Install FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fuse3=3.14.0-5build1
          ls -l /dev/fuse

      - name: Run Hello Window as an AppImage, with FUSE
        if: runner.os == 'Linux'
        run: .github/scripts/deliver-appimage.sh "$RUNNER_TEMP/delivered/Hello Window-${{ matrix.platform }}.AppImage" fuse

  # Delivery again, in Debian 13 containers with no Ruby installed at all
  # (deliver.sh --no-ruby-installed checks), glibc 2.41, and no CA
  # certificates package.
  delivery-debian:
    name: Delivery (${{ matrix.platform }}, debian:trixie-slim)
    needs: [build, build-native]
    runs-on: ${{ matrix.os }}
    container: debian:trixie-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: delivered

      - name: Run hello on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/Hello-${{ matrix.platform }}.tar.gz"
          "delivered/Parity-${{ matrix.platform }}.tar.gz" "Hello from Ruby 4.0.9 on ${{ matrix.platform }}" --no-ruby-installed

      - name: Run my_cool_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "delivered/MyCoolApp-${{ matrix.platform }}.tar.gz"
          "delivered/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat delivered/my_cool_app.expected)" --no-ruby-installed

      # A container has no FUSE, so the AppImage extracts itself and runs.
      - name: Run Hello Window as an AppImage on a computer with no FUSE
        run: .github/scripts/deliver-appimage.sh "delivered/Hello Window-${{ matrix.platform }}.AppImage" extract

      # native_app, compiled on Ubuntu 24.04, on Debian 13's newer glibc.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.platform }}
          path: native

      - name: Run native_app on a computer with no Ruby installed
        run: >-
          .github/scripts/deliver.sh "native/NativeApp-${{ matrix.platform }}.tar.gz"
          "native/ParityBundle-${{ matrix.platform }}.tar.gz" "$(cat native/native_app.expected)" --no-ruby-installed

  # Delivery on a fresh Windows runner, with nothing of Fledge but the
  # .zip and the script that checks it, and no Ruby set up: the runner's
  # own Rubies and MSYS2 are kept off the app's PATH, and the script runs
  # Hello.exe and MyCoolApp.exe from another drive, under a folder name
  # outside ASCII, in a clean and in a hostile environment, and checks
  # the version information each carries (.github/scripts/deliver.ps1).
  delivery-windows:
    name: Delivery (x64-mingw-ucrt)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-x64-mingw-ucrt
          path: ${{ runner.temp }}/delivered

      - name: Run Hello.exe as someone with no Ruby would
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/Parity-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected "Hello from Ruby 4.0.9 on x64-mingw-ucrt"

      - name: Run MyCoolApp.exe as someone with no Ruby would
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/deliver.ps1
          -Archive "$env:RUNNER_TEMP/delivered/MyCoolApp-x64-mingw-ucrt.zip"
          -Probe "$env:RUNNER_TEMP/delivered/ParityBundle-x64-mingw-ucrt.zip" -Platform x64-mingw-ucrt
          -Expected (Get-Content -LiteralPath "$env:RUNNER_TEMP/delivered/my_cool_app.expected" -Raw).TrimEnd()

      # The windowed app (ADR 008): a GUI program with its version
      # information and icon, started as Explorer starts it, with no
      # console and its identifier as its AppUserModelID
      # (.github/scripts/deliver-windowed.ps1).
      - name: Start Hello Window.exe as Explorer would
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "$env:RUNNER_TEMP/delivered/Hello Window-x64-mingw-ucrt.zip"

      # The NSIS installer (ADR 009): installed silently for this person,
      # its Start menu shortcut's AppUserModelID read back and matched to
      # the app's own, the app started from it, installed again over
      # itself, and uninstalled (.github/scripts/deliver-installer.ps1).
      - name: Install Hello Window with its setup program, run it from the Start menu, and uninstall it
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "$env:RUNNER_TEMP/delivered/Hello Window-x64-mingw-ucrt-setup.exe"

  # The license audit's own checks on each runtime this run built: that
  # the release assets are the very notices the runtime carries, that a
  # second audit of the unpacked archive agrees with the build's, that the
  # SPDX project's own tool accepts the SBOM, and that the audit still
  # fails when a GPL library or a GPL gem is slipped into the runtime
  # (.github/scripts/plant_gpl.rb). The audit reads binaries in Ruby, so
  # one Linux runner checks every platform.
  licenses:
    name: Licenses (${{ matrix.platform }})
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64-darwin, x86_64-linux, aarch64-linux, x64-mingw-ucrt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtimes

      - name: Unpack the runtime and check its release assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM".tar.gz -C "$RUNNER_TEMP/tree"
          tree=$(echo "$RUNNER_TEMP"/tree/fledge-runtime-*)
          echo "TREE=$tree" >> "$GITHUB_ENV"
          cmp "$tree/notices/sbom.spdx.json" "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM".spdx.json
          cmp "$tree/notices/NOTICES.txt" "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM"-NOTICES.txt
          case "$PLATFORM" in
            *-linux | x64-mingw-ucrt) tar -tzvf "$RUNNER_TEMP"/runtimes/fledge-runtime-*-"$PLATFORM"-lgpl-sources.tar.gz ;;
            *) if ls "$RUNNER_TEMP"/runtimes/*-lgpl-sources.tar.gz 2>/dev/null; then echo "::error::$PLATFORM ships no LGPL library"; exit 1; fi ;;
          esac

      - name: Audit the unpacked runtime
        run: ruby tasks/license_audit.rb --platform "${{ matrix.platform }}" --tree "$TREE"

      - name: Validate the SBOM with the SPDX tools
        run: pipx run --spec spdx-tools==0.8.3 pyspdxtools -i "$TREE/notices/sbom.spdx.json"

      - name: Fail the audit with a GPL library and a GPL gem slipped in
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          extension=$(ruby .github/scripts/plant_gpl.rb "$PLATFORM" "$TREE")
          if ruby tasks/license_audit.rb --platform "$PLATFORM" --tree "$TREE" > "$RUNNER_TEMP/tampered.txt"; then
            cat "$RUNNER_TEMP/tampered.txt"
            echo "::error::the audit passed a runtime with a GPL library and a GPL gem in it"
            exit 1
          fi
          grep -F "VIOLATION: unlisted-binary: $extension:" "$RUNNER_TEMP/tampered.txt"
          grep -F "gem-copyleft-1.0.0 is GPL-3.0-only, which the policy does not allow" "$RUNNER_TEMP/tampered.txt"

  # The same audit of the whole tree each runtime comes from, rv-ruby's or
  # RubyInstaller's, bundled gems, bin/ruby, and all: it must find exactly
  # what .github/license-expectations/ lists, which is what the runtime
  # builder removes (rv-ruby's bin/ruby, which links libxcrypt
  # statically, and its libcrypt.a; nkf's Java sources; MSYS2's keyring).
  # It shows the audit catching the real thing, not only planted files.
  licenses-upstream:
    name: Licenses of the whole upstream tree (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64-darwin, x86_64-linux, aarch64-linux, x64-mingw-ucrt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: upstream-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Download and unpack the pinned upstream Ruby
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb ruby platforms "$PLATFORM")
          mkdir -p "$RUNNER_TEMP/upstream"
          case "$archive" in
            *.7z) 7z x -y -bd -o"$RUNNER_TEMP/upstream" "$archive" > /dev/null ;;
            *) tar -xzf "$archive" -C "$RUNNER_TEMP/upstream" ;;
          esac
          tree=$(find "$RUNNER_TEMP/upstream" -mindepth 1 -maxdepth 3 -type d \( -name '4.0.9' -o -name 'rubyinstaller-*' \) | head -n 1)
          echo "TREE=$tree" >> "$GITHUB_ENV"

      - name: Audit the whole tree
        run: >-
          ruby tasks/license_audit.rb --platform "${{ matrix.platform }}" --tree "$TREE"
          --expect ".github/license-expectations/${{ matrix.platform }}.yml"

  # doc/licensing.md, the page that tells app developers what ships and
  # what it asks of them, is generated from the audit of these four
  # runtimes (tasks/licensing_page.rb); it fails here when it no longer
  # matches them.
  licensing-page:
    name: Licensing page is current
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/runtimes

      - name: Compare doc/licensing.md with the runtimes
        run: ruby tasks/licensing_page.rb --check "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: licensing-page
          path: ${{ runner.temp }}/runtimes/licensing.md
          retention-days: 14

  # Whoever receives a Linux app may replace lib/libcrypt.so.2 (LGPL-2.1,
  # section 6(b)), as doc/licensing.md tells app developers. The built
  # hello, with libxcrypt rebuilt with only its strong hashes, and with
  # musl's crypt in its place, must load each and behave as each does
  # (.github/scripts/replace-libcrypt.sh), which also measures what
  # String#crypt loses without libxcrypt.
  replace-libcrypt:
    name: Replace libcrypt (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/delivered

      - name: Replace lib/libcrypt.so.2 and run the app with each replacement
        run: |
          tar -xzf "$RUNNER_TEMP/delivered/Hello-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP"
          sh .github/scripts/replace-libcrypt.sh "$RUNNER_TEMP/Hello-${{ matrix.platform }}" Hello \
            "$(ruby .github/scripts/fetch_pin.rb libxcrypt)" "$(ruby .github/scripts/fetch_pin.rb replaceability musl)"

  # Another GNU MP for Windows, cross-built with the pinned llvm-mingw
  # against the UCRT, for Replace GMP to swap in.
  gmp-replacement:
    name: Build a replacement libgmp-10.dll
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Cross-build GNU MP as libgmp-10.dll
        run: |
          toolchain="$RUNNER_TEMP/llvm-mingw"
          source="$RUNNER_TEMP/gmp"
          mkdir -p "$toolchain" "$source" "$RUNNER_TEMP/gmp-dll"
          tar -xJf "$(ruby .github/scripts/fetch_pin.rb llvm-mingw hosts x86_64-linux)" -C "$toolchain" --strip-components=1
          tar -xJf "$(ruby .github/scripts/fetch_pin.rb replaceability gmp)" -C "$source" --strip-components=1
          export PATH="$toolchain/bin:$PATH"
          cd "$source"
          ./configure --quiet --host=x86_64-w64-mingw32 CC=x86_64-w64-mingw32-clang CC_FOR_BUILD=cc \
            --enable-shared --disable-static --disable-assembly
          make --quiet -j"$(nproc)" > /dev/null
          cp .libs/libgmp-10.dll "$RUNNER_TEMP/gmp-dll/"
          x86_64-w64-mingw32-objdump -p .libs/libgmp-10.dll | grep 'DLL Name'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmp-replacement
          path: ${{ runner.temp }}/gmp-dll/libgmp-10.dll
          if-no-files-found: error
          retention-days: 14

  # Whoever receives a Windows app may replace
  # ruby\bin\ruby_builtin_dlls\libgmp-10.dll (LGPL-3.0, section 4(d)(1)),
  # as doc/licensing.md tells app developers: the built hello must load
  # the replacement (Integer::GMP_VERSION changes) and compute the same
  # big numbers (.github/scripts/replace-gmp.ps1).
  replace-gmp:
    name: Replace GMP (x64-mingw-ucrt)
    needs: [build, gmp-replacement]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-x64-mingw-ucrt
          path: ${{ runner.temp }}/delivered

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gmp-replacement
          path: ${{ runner.temp }}/gmp-dll

      - name: Replace libgmp-10.dll and run the app
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .github/scripts/replace-gmp.ps1
          -Archive "$env:RUNNER_TEMP/delivered/Hello-x64-mingw-ucrt.zip"
          -Dll "$env:RUNNER_TEMP/gmp-dll/libgmp-10.dll" -Version 6.2.1
