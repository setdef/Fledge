# The LibUI probe: a window from a third party's GUI gem,
# which CI builds and runs on each platform LibUI has a
# library for. On Linux, libui-ng's library links GTK 3,
# its Pango and Cairo, and GDK, which the desktop provides
# and no gem carries, so the app names them as the
# distribution's. On Windows, its DLL needs Microsoft's
# Visual C++ runtime, which the app carries from the
# building computer; so CI keeps that build to its own job
# and uploads none of it (ci.yml, the Build job).
name: LibUIProbe
kind: windowed
identifier: com.setdef.fledge.LibUIProbe
version: "1.0.0"
publisher: setdef
installers: []
# The probe's own files, so that Delivery on macOS can open one with it
# through Launch Services and see LibUI still show its window once the
# launcher has taken the document's Apple event (deliver-libui.sh).
file_associations:
  - name: LibUI probe report
    extensions: [libuiprobe]
linux:
  system_libraries: [libgtk-3.so.0, libgdk-3.so.0, libpangocairo-1.0.so.0, libpango-1.0.so.0, libcairo.so.2]
windows:
  visual_c_runtime: local
