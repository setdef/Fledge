[[annotations]]
path = "runtime/notices/gmp/**"
precedence = "override"
SPDX-FileCopyrightText = "1991-2023 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-3.0-or-later OR GPL-2.0-or-later"

[[annotations]]
path = "runtime/notices/mingw-w64/COPYING.MinGW-w64-runtime.txt"
precedence = "override"
SPDX-FileCopyrightText = "2009-2013 the mingw-w64 project"
SPDX-License-Identifier = "LicenseRef-MinGW-w64-runtime"

