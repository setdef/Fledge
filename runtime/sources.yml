# Everything a runtime is built from that comes from outside this
# repository, pinned by version and SHA-256 (doc/contributors/design/runtimes.md,
# "Sources and pins"). rake runtime reads this file; a download whose
# SHA-256 differs fails the build. Change a pin on purpose, and run
# Delivery (ci.yml) before trusting it.

# Ruby 4.1.0-preview1 for each target (doc/contributors/design/runtimes.md,
# "Where each platform's Ruby comes from" and "Sources and pins"), but Windows,
# whose Ruby is a snapshot of Ruby's master of a month later, below.
#
# macOS and glibc Linux: jdx/ruby's relocatable CRuby builds
# (github.com/jdx/ruby, a fork of rv-ruby, whose builds mise installs),
# from the release of one build of the Ruby, jdx_release, below. jdx/ruby
# publishes each build of a Ruby as its own release, VERSION-N, N one
# more than its last build of that Ruby, which it never publishes again,
# and beside it a release VERSION, which it deletes and publishes again
# with each build (its .github/workflows/release.yml), so a pin of
# VERSION's files would change under its SHA-256 at the next build
# (doc/contributors/design/runtimes.md, "Sources and pins"). The asset
# names carry the Ruby's version and not N. The Linux ones are built in
# manylinux2014 containers against glibc 2.17, where rv-ruby's builds on
# Ubuntu 24.04 need glibc 2.38 (doc/contributors/design/runtimes.md,
# "The glibc floor"), and the Mac one on GitHub's macos-26 runner, whose
# files declare macOS 26.0 ("The
# Mac's Ruby is jdx/ruby's"). Each carries a static libruby the launcher
# links, the standard library the runtime ships, and the OpenSSL and
# libyaml gems compile against ("What a runtime keeps for compiling
# gems"). The SHA-256s are those GitHub records for each asset. A pin's
# build key says whose build it is when it is not RubyInstaller's: jdx for jdx/ruby's,
# fledge for Fledge's own (ruby-build, below), so that the license audit
# asks for what that build holds (runtime/licenses.yml, ruby_build).
#
# Windows: RubyInstaller publishes no build of a Ruby preview, so the
# Windows runtimes take its rolling build of Ruby's master,
# rubyinstaller-head, as it stood on 2026-11-10: ruby 4.1.0dev (master
# 0e25874222), whose library folders are named 4.1.0+6, where the
# preview's are 4.1.0+5 (RuntimeBuilder.ruby_abi), built by RubyInstaller
# at 92a692c. It is the 7-Zip archive of the UCRT build, which the
# launcher loads as a DLL, x64 and ARM64 of the same day and the same
# commit. Its PGP signature is checked on every build too, with gpgv,
# against RubyInstaller's package signing key as rubyinstaller2's own
# repository records it (recipes/unpack/appveyor-repo-key.asc), at a
# pinned commit and pinned by SHA-256; the signature must be that key's,
# by fingerprint. The key expires on 2027-06-15; how to move to a renewed
# key is in doc/contributors/design/runtimes.md, "The RubyInstaller
# signing key". RubyInstaller published these files at
# https://github.com/oneclick/rubyinstaller2/releases/tag/rubyinstaller-head,
# which serves each day's build in place of the last, so Fledge keeps the
# exact files, unchanged, as a pre-release of its own repository named
# for their source and day, inputs-rubyinstaller-head-20261110
# (doc/contributors/design/runtimes.md, "Rolling upstream inputs"), and
# the pins name that copy. RubyInstaller-4.1.0-1 replaces this snapshot
# once it is released.
#
# bundled_gems lists Ruby 4.1.0-preview1's bundled gems, from
# gems/bundled_gems at its v4_1_0_preview1 tag (2d08b5f42f). A runtime
# keeps every default gem and every one of these that its Ruby installs
# (rv-ruby and jdx/ruby install all but win32ole and win32-registry,
# which only Windows builds; RubyInstaller all but syslog, which needs a
# Unix), and prunes any other gem its Ruby adds (rv-ruby and jdx/ruby
# add bootsnap and msgpack), so that an app finds exactly what a
# standard Ruby 4.1 has (doc/contributors/design/runtimes.md, "What a
# runtime keeps").
ruby:
  version: 4.1.0-preview1
  jdx_release: 4.1.0-preview1-1
  bundled_gems: [minitest, power_assert, rake, test-unit, rexml, rss, net-imap, net-smtp, matrix, prime, rbs, typeprof,
    debug, racc, mutex_m, getoptlong, base64, bigdecimal, observer, abbrev, resolv-replace, rinda, drb, nkf, syslog, csv,
    repl_type_completor, ostruct, pstore, benchmark, logger, rdoc, prism, win32ole, irb, reline, readline, fiddle, tsort,
    win32-registry]
  platforms:
    arm64-darwin:
      url: https://github.com/jdx/ruby/releases/download/4.1.0-preview1-1/ruby-4.1.0-preview1.macos.tar.gz
      sha256: 57fbc4a92f3dc3b21aad48ff6ba7b22fa12503946dba7e9f2c72726affbd4443
