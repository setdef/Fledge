# Experiment only (experiment/spec-ci), never for trunk: trunk's ci.yml
# trimmed to the runtime jobs and the ruby/spec job, which runs on all
# seven desktop platforms, as on a release commit.

name: CI

on:
  push:
    branches: ["experiment/spec-ci"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MISE_RUBY_COMPILE: "false"
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3

jobs:
  runtime:
    name: Runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          # Cross-compiled; the runner's 7z unpacks RubyInstaller's archive
          # and its gpgv checks the signature. Windows on ARM64 too (ADR 018).
          - os: ubuntu-24.04
            platform: x64-mingw-ucrt
          - os: ubuntu-24.04
            platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder needs only Ruby's standard library, so mise installs
      # only Ruby, and no bundle.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # patchelf removes the RUNPATHs rv-ruby's build left in its
      # extensions, pinned to Ubuntu 24.04's build; gcc, make, perl, and
      # xz, which libxcrypt's build needs, are on the runner already.
      - name: Install patchelf
        if: runner.os == 'Linux' && !endsWith(matrix.platform, '-mingw-ucrt')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf=0.18.0-1.1build1

      # rv-ruby, RubyInstaller, llvm-mingw, and libxcrypt downloads, keyed
      # by the file that pins their SHA-256s, so a changed pin downloads
      # afresh. The builder checks every cached file's SHA-256 again
      # before using it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      # The archive's timestamps are the commit's, so two builds of one
      # commit differ only where the compiler's output does.
      - name: Build the runtime
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          ruby tasks/runtime_builder.rb "${{ matrix.platform }}"

      # The Windows source bundle holds MSYS2's source package of GMP as
      # the exact source of RubyInstaller's libgmp-10.dll. That holds only
      # if MSYS2's binary package of that build holds the very file the
      # runtime ships, byte for byte.
      - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
        if: endsWith(matrix.platform, '-mingw-ucrt')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            x64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp package) folder=ucrt64 ;;
            aarch64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp arm64 package) folder=clangarm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gmp-package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" "$folder/bin/libgmp-10.dll"
          cmp "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll" tmp/runtime/"$PLATFORM"/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
          sha256sum "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

  # The musl Linux runtimes (ADR 017): CRuby built from its pinned source
  # in Alpine, on a runner of each architecture, as rv-ruby builds its
  # own musl Rubies, with docker run rather than a job container, since
  # GitHub's JavaScript actions cannot run in an Alpine container on an
  # ARM runner (rv-ruby's build-alpine.yml says the same).
  runtime-musl:
    name: Runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime in Alpine
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker run --rm -v "$GITHUB_WORKSPACE:/fledge" -w /fledge -e SOURCE_DATE_EPOCH -e PLATFORM "$ALPINE_RUBY" \
            sh -c '.github/scripts/alpine-packages.sh build && ruby tasks/runtime_builder.rb "$PLATFORM"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: runtime-${{ matrix.platform }}-logs
          path: tmp/runtime/${{ matrix.platform }}/logs
          retention-days: 14

  ruby-spec:
    name: ruby/spec
    needs: [runtime, runtime-musl]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ruby-spec.yml
    with:
      full: true
