# The trial of an iOS app launched with OS_ACTIVITY_DT_MODE, on the
# experiment/ios-output branch: only the iOS runtime, built from this
# branch's runtime/mobile, and the Mobile apps (iOS) job, once as on
# trunk and once with OS_ACTIVITY_DT_MODE=YES in each app's environment,
# reading the apps' streams with simctl launch --console as a developer
# tool reads them (tasks/mobile_parity/ios.rb). The macOS runtime, which
# only compiles gems' extensions, is trunk's run 41966470848 (ece8356).
name: CI
on:
  push:
    branches:
      - experiment/ios-output
permissions:
  contents: read
  actions: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: "false"
  BUNDLE_FROZEN: "true"
  RUNTIMES_RUN: "41966470848"
jobs:
  runtime-ios:
    name: Runtime (ios)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcodebuild -version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: runtime-downloads-ios-${{ hashFiles('runtime/sources.yml') }}

      - name: Build the runtime
        run: ruby tasks/runtime_builder.rb ios

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-ios
          path: tmp/runtime/fledge-runtime-*-ios*
          if-no-files-found: error
          retention-days: 14

  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad, OS_ACTIVITY_DT_MODE ${{ matrix.dt-mode || 'unset' }})
    needs: runtime-ios
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        dt-mode: ["", "YES"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      - name: Select the pinned Xcode
        run: |
          xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcrun simctl list runtimes
          cmake --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/downloads
          key: mobile-parity-downloads-ios-${{ hashFiles('runtime/sources.yml') }}

      - name: Install XcodeGen
        run: |
          archive=$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-ios
          path: ${{ runner.temp }}/runtimes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-arm64-darwin
          path: ${{ runner.temp }}/runtimes
          run-id: ${{ env.RUNTIMES_RUN }}
          github-token: ${{ github.token }}

      - name: Build the apps with fledge build ios, and run them in the iOS Simulator
        env:
          EXPERIMENT_DT_MODE: ${{ matrix.dt-mode }}
        run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-apps-ios-${{ matrix.dt-mode || 'unset' }}
          path: |
            tmp/mobile-parity/ios/*.ndjson
            tmp/mobile-parity/ios/*.log
            tmp/mobile-parity/ios/*.console
            tmp/mobile-parity/ios/*.ips
          retention-days: 14
