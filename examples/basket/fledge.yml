# Basket's Gemfile lists etcetera, which finds the folder each system
# keeps an app's data in, and fiddle, which each system's screen reaches
# its widgets with. The identifier is what iOS and Android know it by
# (doc/contributors/design/phone-projects.md). kind: windowed says that its
# Ruby draws the app's screen, so a phone runs that Ruby on the main thread,
# where the widgets are made (doc/contributors/design/phone-widgets.md).
name: Basket
identifier: com.setdef.fledge.Basket
kind: windowed
# The files in icons/, which icons/render.rb draws from icons/icon.svg:
# icon.icns, icon.ico, and the PNGs each system takes.
icon: icons/icon
