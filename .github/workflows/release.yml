# Publishes a Fledge release when a vX.Y.Z tag is pushed (ADR 001,
# section 7; ADR 004; AGENTS.md, Releasing). Only when CI passed on a
# push to trunk on every job, the license audit and Delivery included,
# for the tagged commit's parent, and for the tagged commit the short CI
# a pin commit runs, does it create the GitHub Release, with, for each
# platform:
#
#   fledge-runtime-VERSION-PLATFORM.tar.gz              the runtime
#   fledge-runtime-VERSION-PLATFORM.spdx.json           its SPDX 2.3 SBOM
#   fledge-runtime-VERSION-PLATFORM-NOTICES.txt         its notices
#   fledge-runtime-VERSION-PLATFORM-lgpl-sources.tar.gz the source of its
#                                                       LGPL libraries and
#                                                       of what its licenses
#                                                       ask the source of
#                                                       (Linux, Windows)
#   fledge-runtime-VERSION-PLATFORM-dev.tar.gz          its build-only
#                                                       companion
#
# and a SHA256SUMS over all of them, which is the tagged commit's
# lib/fledge/SHA256SUMS. fledge build at that version downloads its
# runtimes from this release, by the names Fledge::Runtimes gives them,
# and checks each against the SHA-256 its own gem pins. A version with
# "pre" in it (RubyGems' prerelease form, such as 0.0.1.pre.1, which
# the versions before 0.1.0 had) is marked a prerelease; an ordinary
# 0.MINOR.PATCH version, such as 0.1.0, is not.
#
# A release takes two commits (ADR 014), as Homebrew's bottles do: the
# release commit, whose CI run on trunk builds the runtimes, and on it a
# commit that changes only lib/fledge/SHA256SUMS, written from those
# runtimes by rake runtime:pin, which is the one tagged. Runtime builds
# are not reproducible, so this publishes the runtimes the release
# commit's CI run built, and only when every one matches its pin.
#
# It does not run CI again. CI ran on both commits when they were pushed
# to trunk, and this looks those runs up (tasks/ci_runs.rb) and refuses
# the tag unless both are green, naming a run still going, or a run and
# the jobs in it that did not pass. A second run of the same
# commit would test the same files, throw its runtimes away, and draw
# every flaky download again; that is how 0.2.0 went unpublished.
#
# Run it by hand (workflow_dispatch) with a tag that exists to check a
# release without making one: the same checks on that tag's commit and
# the same runtimes, with the checks from the commit it is run from, up
# to the assets it would publish, which it keeps as the run's artifact.
# Only the Publish job writes, and it runs on a pushed tag, or by hand
# with publish set. Try a change to this workflow so, from a branch,
# before a release depends on it.
#
# Releases are never deleted: each runtime's NOTICES points at its LGPL
# source bundle here, and app developers may rely on that link for as
# long as their apps are out (doc/licensing.md).
#
# After publishing, it installs Fledge from the tag on a fresh runner of
# each platform and builds and delivers the examples there with runtimes
# downloaded from the release itself (installed.yml).
#
# Before 1.0, agents may push tags and create releases (AGENTS.md,
# Releasing; decision 6 in doc/contributors/decisions.md), on a commit
# whose CI is green. Nothing here publishes to RubyGems.org.

name: Release

on:
  push:
    tags: ["v*"]
  # A dry run against a tag that exists: every check a release makes, on
  # that tag's commit and the runtimes its pins name, up to the assets it
  # would publish, and no write. Only with publish does it create the
  # release; a pushed tag always does.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to check, such as v0.2.1
        required: true
        type: string
      publish:
        description: Create the GitHub Release too (it must not exist yet)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Everything a release checks, with no permission to write to the
  # repository: the assets it would publish, checked against the tag's
  # pins, are kept as this run's artifact for the job that publishes.
  check:
    name: Check the tag and assemble its assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Finding both commits' CI runs and downloading the runtimes.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The tagged commit, and its parent, whose files are checked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: refs/tags/${{ env.TAG }}

      # The checks themselves come from this workflow's own commit: the
      # tag's, when a tag is pushed, and the checks as they are now in a
      # dry run against an older tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checks
          sparse-checkout: |
            .github/scripts
            tasks
          sparse-checkout-cone-mode: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: ruby

      # A runtime's file name carries Fledge::VERSION, and fledge build
      # looks for its runtimes under the tag v#{Fledge::VERSION}, so a tag
      # that disagrees with the version would publish runtimes no Fledge
      # ever downloads.
      - name: Check the tag matches Fledge::VERSION
        id: version
        run: |
          version=$(ruby -Ilib -rfledge/version -e 'print Fledge::VERSION')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match Fledge::VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The tagged commit pins the runtimes its parent's CI run built, and
      # changes nothing else, so the runtimes it pins were built from the
      # very source it tags.
      - name: Check the tagged commit changes only the pins
        run: |
          changed=$(git diff --name-only HEAD^ HEAD)
          if [ "$changed" != "lib/fledge/SHA256SUMS" ]; then
            echo "::error::The tagged commit must change only lib/fledge/SHA256SUMS, written by rake runtime:pin from its parent's runtimes; it changes: $changed"
            exit 1
          fi

      # AGENTS.md, Releasing: tag only a commit whose CI is green. Its run
      # on a push to trunk must have finished with the latest attempt of
      # every job a success, so failed jobs run again and passed count.
      # A pin commit's run is the short one: the gate and ci.yml's Changes
      # job, which checks the pins, pass, and every other job is skipped.
      - name: Check the tagged commit passed CI on trunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(ruby checks/tasks/ci_runs.rb green "$(git rev-parse HEAD)")
          echo "The tagged commit passed CI run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"

      # The parent's run, in which every job ran and passed, built the
      # runtimes the tag pins: the newest such run, as rake runtime:pin
      # and the pin commit's Changes job take it. With the short CI that
      # skipped the rest of the pin commit's jobs, this is what makes the
      # tagged commit green on every job (ADR 014, section 5).
      - name: Find the CI run whose runtimes the tag pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(git rev-parse HEAD^)
          run=$(ruby checks/tasks/ci_runs.rb green "$built" --every-job)
          echo "Publishing the runtimes CI run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run built from $built"
          echo "RUN=$run" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          merge-multiple: true
          path: release
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      # Every name fledge build and each runtime's NOTICES will ask for
      # must be here, and nothing else: the names come from the tagged
      # commit's Fledge::Runtimes and RuntimeBuilder#assets, the code that
      # uses them (RuntimeBuilder.release_assets). Every asset must be the
      # one the gem pins, and the gem must pin every asset; the pins
      # become the release's SHA256SUMS.
      - name: Check the assets against the gem's pins
        run: |
          checks/.github/scripts/check-pins.sh release lib/fledge/SHA256SUMS "$GITHUB_WORKSPACE"
          cp lib/fledge/SHA256SUMS release/SHA256SUMS
          ls -l release
          echo "$(find release -type f | wc -l) assets for $TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          retention-days: 3

  # The one job that writes: on a pushed tag, or a dry run asked to
  # publish. It checks the assets it received against the pins once more
  # and creates the release with them.
  release:
    name: Publish the GitHub Release
    needs: check
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Creating a release and uploading its assets.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Check the assets against the pins they came with
        run: (cd release && sha256sum --strict -c SHA256SUMS)

      - name: Create the release with its assets attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *pre*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" --title "Fledge $TAG" \
            --notes "Runtimes for fledge build at $TAG, one per platform, each to build that platform's apps on a computer of that platform, with its SPDX SBOM and NOTICES; and, for Linux and Windows, the source the runtime's licenses ask for: its LGPL libraries', AppImage's runtime's, and NSIS's. What Fledge puts into each platform's app and installer, and what its licenses ask of you: doc/licensing.md at $TAG. What changed: CHANGELOG.md." \
            release/fledge-runtime-* release/SHA256SUMS

  installed:
    name: Installed from the tag
    needs: release
    uses: ./.github/workflows/installed.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
