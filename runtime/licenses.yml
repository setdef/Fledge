# SPDX-FileCopyrightText: 2026 setdef <kerrick@setdef.com>
# SPDX-License-Identifier: MIT
# SPDX-FileComment: Adapted from runtime/licenses.yml on Fledge's spike/permissive
#   branch (58edf27d27912d062ccfa5c4960533a220c9eb24).

# What ships inside every app Fledge builds: the map the license audit
# checks every runtime against. tasks/license_audit.rb reads this file
# and a runtime tree (a built runtime, or the whole rv-ruby or
# RubyInstaller tree it came from), and fails unless:
#
#   - every file in the tree belongs to a component below or to a gem
#     whose specification the tree holds, and every compiled file is one
#     its component names as a binary;
#   - every shared library a compiled file needs is either one the
#     operating system provides (system_libraries) or a file in the tree;
#   - every component compiled into another file is still there, at the
#     version below, by the evidence string named here;
#   - no compiled file carries the code of a copyleft library (signatures)
#     except that library's own shared library;
#   - every text file whose words name a copyleft license is one a person
#     has reviewed (reviewed);
#   - and every component's license meets the policy, which
#     lib/fledge/license_policy.rb holds (Fledge::LicensePolicy; ADR
#     004).
#
# The maintainer's rule (decisions 8 and 24, and the replies of
# 2026-10-26 in doc/contributors/decisions.md; AGENTS.md, Licensing): an
# app's developer must owe nothing beyond notices for what Fledge copies
# into the app, Fledge's own MIT files among them (decisions,
# 2026-11-07), except for LGPL libraries, which may ship only as
# separate shared libraries the app's recipient can replace, with their
# source (never the app's) in each runtime's notices/sources/, so in
# every app, and published beside each runtime.
# RuntimeBuilder runs the audit on every runtime it builds and
# refuses to archive one that fails (ADR 004).
#
# Patterns are File.fnmatch globs relative to the tree (** crosses
# folders, {a,b} alternates). {prefix} is where Ruby's own tree starts
# ("ruby/" in a Windows runtime, "" elsewhere), {arch} is Ruby's archdir
# name, {gem_arch} the name of RubyGems' extensions folder, {so} the
# extension of a Ruby extension on that platform, and {abi} the name of
# the folders Ruby keeps its library and gems in, such as 4.1.0+5, which
# the audit reads from the tree (LicenseAudit#abi).

# What the operating system provides, which a runtime need not ship.
# MSVCP60.dll, which NSIS's makensis.exe needs, is Windows' own, in
# System32 on every Windows Fledge supports.
system_libraries:
  linux:
    - /\A(?:libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|libgcc_s\.so\.1|ld-linux[-\w.]*\.so\.\d)\z/
  # musl Linux's C library, by its own name and Alpine's, and its
  # dynamic linker (ADR 017).
  linux-musl:
    - /\A(?:libc\.so|libc\.musl-(?:x86_64|aarch64)\.so\.1|ld-musl-(?:x86_64|aarch64)\.so\.1)\z/
  darwin:
    - /\A\/usr\/lib\/[^\/]+\.dylib\z/
    - /\A\/System\/Library\/Frameworks\//
  # The mobile runtimes link Ruby statically: on iOS into an archive,
  # which needs nothing until an app links it with iOS's own libz and
  # frameworks, and on Android into one library, which needs only what
  # every Android provides (NDK, "Android NDK native APIs").
  ios: []
  android:
    - /\A(?:libc|libm|libdl|liblog|libz)\.so\z/
  windows:
    - /\Aapi-ms-win-[a-z0-9-]+\.dll\z/i
    - /\A(?:advapi32|bcrypt|comctl32|comdlg32|crypt32|dbghelp|gdi32|imagehlp|iphlpapi|kernel32|msvcp60|msvcrt|ncrypt|ntdll|ole32|oleaut32|rpcrt4|secur32|shell32|shlwapi|user32|userenv|uxtheme|version|winmm|ws2_32|wsock32)\.dll\z/i

platforms:
  arm64-darwin: {os: darwin, arch: arm64-darwin23, gem_arch: arm64-darwin-23, so: bundle}
  x86_64-linux: {os: linux, arch: x86_64-linux, gem_arch: x86_64-linux, so: so}
  aarch64-linux: {os: linux, arch: aarch64-linux, gem_arch: aarch64-linux, so: so}
  x86_64-linux-musl: {os: linux-musl, arch: x86_64-linux-musl, gem_arch: x86_64-linux-musl, so: so}
  aarch64-linux-musl: {os: linux-musl, arch: aarch64-linux-musl, gem_arch: aarch64-linux-musl, so: so}
  x64-mingw-ucrt: {os: windows, arch: x64-mingw-ucrt, gem_arch: x64-mingw-ucrt, so: so}
  aarch64-mingw-ucrt: {os: windows, arch: aarch64-mingw-ucrt, gem_arch: aarch64-mingw-ucrt, so: so}
  # iOS's Ruby reports arm64-darwin on devices and in the Simulator, and
  # each XCFramework slice carries its own
  # (doc/contributors/design/phone-runtimes.md, "What a phone runtime holds");
  # Android's one tree holds each ABI's arch folder, named for its
  # platform.
  ios:
    os: ios
    arch: arm64-darwin
    gem_arch: arm64-darwin
    so: so
    prefixes: [FledgeRuby.xcframework/ios-arm64/, FledgeRuby.xcframework/ios-arm64-simulator/]
  android: {os: android, arch: "{aarch64,x86_64}-linux-android", gem_arch: "{aarch64,x86_64}-linux-android", so: so}

# Code of copyleft libraries that must never be compiled into another
# file: bytes found only in that library's own code. A match anywhere but
# in a file the named component owns as a shared library fails.
signatures:
  - component: libxcrypt
    bytes: ["yescrypt-ROMhash", "$sm3y$"]
  - component: gmp
    bytes: ["GNU MP: Cannot allocate memory"]
  # libfuse's low-level library, which AppImage's runtime links
  # statically: allowed there only because Fledge publishes the
  # runtime's own source and libfuse's beside each Linux runtime.
  - component: libfuse
    bytes: ["fuse: unsupported protocol version: ", "fuse: failed to allocate fuse object"]

# Components, in the order that decides which owns a file two of them
# match. Gems come from the tree's own specifications and are placed
# before the components marked fallback.
#
#   kind: program        compiled code and the files around it
#         shared_library a library in its own file, which other files load
#         files          unmodified source or data files
#         source         the published source of a component with the
#                        same source pin, in notices/sources/ only
#   files:     what the component owns
#   binaries:  which of its files may be compiled code
#   embedded:  files the component is compiled into, each with a string
#              that proves its version is still the one named here
#   source:    the runtime/sources.yml pin of its source, for LGPL code
#   first_party: Fledge's own work, which NOTICES.txt and doc/licensing.md
#              name as Fledge's, and into which no LGPL library may be
#              linked
components:
  - id: fledge
    name: Fledge launcher and RubyGems defaults
    version: "{fledge_version}"
    license: MIT
    first_party: true
    kind: program
    supplier: "Organization: setdef"
    download: https://github.com/setdef/Fledge
    notice: fledge
    ships: "the program the app's user runs; on macOS and Linux bin/ruby, which holds Fledge's code beside Ruby's; and {prefix}lib/ruby/{abi}/rubygems/defaults/operating_system.rb"
    platforms: [arm64-darwin, x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl, x64-mingw-ucrt, aarch64-mingw-ucrt]
    files:
      - launcher
      - launcher.exe
      - launcherw.exe
      - {glob: "{prefix}lib/ruby/{abi}/rubygems/defaults/operating_system.rb", contains: "Fledge's RubyGems defaults"}
    binaries: [launcher, launcher.exe, launcherw.exe]
    # bin/ruby on macOS and Linux is Ruby's main.c with Fledge's code that
    # chooses its locale and hands an app's own program back to its
    # launcher (runtime/launcher/ruby_main.c; ADR 041 and ADR 026).
    embedded:
      - files: ["{prefix}bin/ruby"]
        evidence: "ruby: could not run "

  # A phone's app has no Fledge launcher: the host app the project
  # fledge build writes starts Ruby through the embedding API (ADR 012),
  # so of this component a phone's runtime holds only the RubyGems
  # defaults, in each Ruby it carries.
  - id: fledge
    name: Fledge's RubyGems defaults
    version: "{fledge_version}"
    license: MIT
    first_party: true
    kind: files
    supplier: "Organization: setdef"
    download: https://github.com/setdef/Fledge
    notice: fledge
    ships: lib/ruby/{abi}/rubygems/defaults/operating_system.rb in the runtime's Ruby (in each slice of the XCFramework, on iOS), which RubyGems loads as the app's Ruby starts
    platforms: [ios, android]
    files:
      - {glob: "{prefix}lib/ruby/{abi}/rubygems/defaults/operating_system.rb", contains: "Fledge's RubyGems defaults"}

  # The mobile runtimes' one library (ADR 079): Fledge's embedding API
  # (runtime/mobile/), compiled with Ruby and what Ruby links into
  # libfledgeruby.a in each slice of the iOS XCFramework, and into
  # libfledgeruby.so for each ABI in the Android AAR, beside the AAR's
  # Java class and its packaging, and the Android runtime's ruby program,
  # libfledgerubyexe.so, which links libfledgeruby.so (ADR 082).
  - id: fledge-embedding
    name: Fledge's embedding API, and the library and packages it is built into
    version: "{fledge_version}"
    license: MIT
    first_party: true
    kind: program
    supplier: "Organization: setdef"
    download: https://github.com/setdef/Fledge
    notice: fledge
    ships: libfledgeruby.a in each slice of FledgeRuby.xcframework, and libfledgeruby.so, the ruby program libfledgerubyexe.so, and the Java class org.setdef.fledge.FledgeRuby in FledgeRuby.aar
    platforms: [ios, android]
    files:
      - FledgeRuby.xcframework/Info.plist
      - FledgeRuby.xcframework/*/libfledgeruby.a
      - FledgeRuby.xcframework/*/Headers/{fledge_ruby.h,module.modulemap}
      - include/fledge_ruby.h
      - FledgeRuby.aar!{AndroidManifest.xml,classes.jar,R.txt,proguard.txt}
      - FledgeRuby.aar!META-INF/**
      - FledgeRuby.aar!jni/*/libfledgeruby.so
      - FledgeRuby.aar!jni/*/libfledgerubyexe.so
    binaries: [FledgeRuby.xcframework/*/libfledgeruby.a, FledgeRuby.aar!jni/*/libfledgeruby.so, FledgeRuby.aar!jni/*/libfledgerubyexe.so]

  - id: rust-std
    name: The Rust standard library, compiled into Ruby's YJIT and ZJIT
    version: 1.85.1
    license: MIT OR Apache-2.0
    kind: program
    download: https://github.com/rust-lang/rust/tree/1.85.1
    notice: rust
    ships: compiled into the launcher, bin/ruby, and the static libruby in lib/, which mkmf links against
    platforms: [arm64-darwin, x86_64-linux, aarch64-linux]
    embedded:
      - files: [launcher, "{prefix}bin/ruby", "{prefix}lib/libruby*-static.a"]
        evidence: /rustc/4eb161250e340c8f48f66e2b929ef4a5bed7c181/

  - id: gcc-runtime
    name: GCC's runtime library (libgcc), linked statically into the launcher and bin/ruby (-static-libgcc)
    version: "13"
    license: GPL-3.0-or-later WITH GCC-exception-3.1
    kind: program
    download: https://gcc.gnu.org/
    ships: compiled into the launcher and bin/ruby
    platforms: [x86_64-linux, aarch64-linux]
    embedded:
      - files: [launcher, bin/ruby]
        evidence: "GCC: ("

  # The musl runtimes build their Ruby from source in Alpine (ADR 017),
  # with Alpine's Rust and GCC, whose versions ci.yml pins.
  - id: rust-std
    name: The Rust standard library, compiled into Ruby's YJIT and ZJIT
    version: 1.96.1
    license: MIT OR Apache-2.0
    kind: program
    download: https://github.com/rust-lang/rust/tree/1.96.1
    notice: rust
    ships: compiled into the launcher, bin/ruby, and the static libruby in lib/, which mkmf links against
    platforms: [x86_64-linux-musl, aarch64-linux-musl]
    embedded:
      - files: [launcher, "{prefix}bin/ruby", "{prefix}lib/libruby*-static.a"]
        evidence: /rustc/31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd/

  - id: gcc-runtime
    name: GCC's runtime library (libgcc), linked statically into the launcher, bin/ruby, and Ruby's extensions (-static-libgcc)
    version: 15.2.0
    license: GPL-3.0-or-later WITH GCC-exception-3.1
    kind: program
    download: https://gcc.gnu.org/
    ships: compiled into the launcher, bin/ruby, and the extensions in lib/ruby/
    platforms: [x86_64-linux-musl, aarch64-linux-musl]
    embedded:
      - files: [launcher, bin/ruby]
        evidence: "GCC: (Alpine 15.2.0) 15.2.0"

  - id: gcc-runtime-msys2
    name: GCC's runtime library (libgcc), linked statically by MSYS2's GCC into RubyInstaller's DLLs
    version: "13 to 16"
    license: GPL-3.0-or-later WITH GCC-exception-3.1
    kind: program
    download: https://github.com/msys2/MINGW-packages/tree/master/mingw-w64-gcc
    ships: compiled into the DLLs and extensions in ruby/, which MSYS2's GCC built
    platforms: [x64-mingw-ucrt]
    embedded:
      - files: ["{prefix}bin/*.{dll,exe}", "{prefix}bin/ruby_builtin_dlls/*.dll", "{prefix}lib/ruby/**/*.{dll,so}"]
        evidence: "Built by MSYS2 project"

  - id: mingw-w64-runtime
    name: The MinGW-w64 runtime (CRT startup code), linked into the launcher and every DLL
    version: "14.0.0"
    license: LicenseRef-MinGW-w64-runtime
    kind: program
    download: https://github.com/mingw-w64/mingw-w64/tree/v14.0.0
    notice: mingw-w64
    ships: compiled into launcher.exe, launcherw.exe, and every DLL and extension in ruby/
    platforms: [x64-mingw-ucrt, aarch64-mingw-ucrt]
    embedded:
      - files: [launcher.exe, launcherw.exe, "{prefix}bin/*.{dll,exe}", "{prefix}lib/ruby/**/*.{dll,so}"]

  - id: compiler-rt
    name: LLVM's compiler-rt builtins, linked into the launcher by llvm-mingw
    version: "20261020"
    license: Apache-2.0 WITH LLVM-exception
    kind: program
    download: https://github.com/mstorsjo/llvm-mingw/releases/tag/20261020
    ships: compiled into launcher.exe and launcherw.exe
    platforms: [x64-mingw-ucrt, aarch64-mingw-ucrt]
    embedded:
      - files: [launcher.exe, launcherw.exe]

  - id: openssl
    name: OpenSSL, compiled into Ruby's openssl extension
    version: 3.6.2
    license: Apache-2.0
    kind: program
    download: https://github.com/openssl/openssl/releases/download/openssl-3.6.2/openssl-3.6.2.tar.gz
    notice: openssl
    ships: "compiled into lib/ruby/{abi}/{arch}/openssl.{so}"
    platforms: [arm64-darwin, x86_64-linux, aarch64-linux]
    embedded:
      - files: ["{prefix}lib/ruby/{abi}/{arch}/openssl.{so}"]
        evidence: "OpenSSL 3.6.2 "

  - id: openssl
    name: OpenSSL, compiled into Ruby's openssl extension
    version: 3.6.5
    license: Apache-2.0
    kind: program
    download: https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz
    notice: openssl
    ships: "compiled into lib/ruby/{abi}/{arch}/openssl.{so}"
    platforms: [x86_64-linux-musl, aarch64-linux-musl]
    embedded:
      - files: ["{prefix}lib/ruby/{abi}/{arch}/openssl.{so}"]
        evidence: "OpenSSL 3.6.5 "

  - id: openssl-mobile
    name: OpenSSL, compiled into the mobile runtimes' library
    version: 3.6.5
    license: Apache-2.0
    kind: program
    download: https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz
    notice: openssl
    ships: compiled into libfledgeruby.a and libfledgeruby.so
    platforms: [ios, android]
    embedded:
      - files: [FledgeRuby.xcframework/*/libfledgeruby.a, FledgeRuby.aar!jni/*/libfledgeruby.so]
        evidence: "OpenSSL 3.6.5 "

  - id: openssl-dlls
    name: OpenSSL (libcrypto-3-x64.dll, libssl-3-x64.dll, and its engines and providers)
    version: 3.6.5
    license: Apache-2.0
    kind: shared_library
    download: https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz
    notice: openssl
    ships: shared libraries in ruby/lib/ruby/{abi}/{arch}/ and ruby/lib/ruby/{abi}/lib/
    platforms: [x64-mingw-ucrt, aarch64-mingw-ucrt]
    files: ["{prefix}lib/ruby/{abi}/{arch}/lib{crypto,ssl}-3-{x64,arm64}.dll", "{prefix}lib/ruby/{abi}/lib/{engines-3,ossl-modules}/*.dll"]
    binaries: ["{prefix}lib/ruby/{abi}/{arch}/lib{crypto,ssl}-3-{x64,arm64}.dll", "{prefix}lib/ruby/{abi}/lib/{engines-3,ossl-modules}/*.dll"]
    embedded:
      - files: ["{prefix}lib/ruby/{abi}/{arch}/libcrypto-3-{x64,arm64}.dll"]
        evidence: "OpenSSL 3.6.5 "

  - id: libyaml
    name: libyaml, compiled into Ruby's psych extension
    version: 0.2.5
    license: MIT
    kind: program
    download: https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz
    notice: libyaml
    ships: "compiled into lib/ruby/{abi}/{arch}/psych.{so}"
    platforms: [arm64-darwin, x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl]
    embedded:
      - files: ["{prefix}lib/ruby/{abi}/{arch}/psych.{so}"]
        evidence: "0.2.5\0"

  - id: libyaml-mobile
    name: libyaml, compiled into the mobile runtimes' library
    version: 0.2.5
    license: MIT
    kind: program
    download: https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz
    notice: libyaml
    ships: compiled into libfledgeruby.a and libfledgeruby.so
    platforms: [ios, android]
    embedded:
      - files: [FledgeRuby.xcframework/*/libfledgeruby.a, FledgeRuby.aar!jni/*/libfledgeruby.so]
        evidence: "0.2.5\0"

  - id: libyaml-dll
    name: libyaml (libyaml-0-2.dll)
    version: 0.2.5
    license: MIT
    kind: shared_library
    download: https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz
    notice: libyaml
    ships: a shared library in ruby/lib/ruby/{abi}/x64-mingw-ucrt/
    platforms: [x64-mingw-ucrt, aarch64-mingw-ucrt]
    files: ["{prefix}lib/ruby/{abi}/{arch}/libyaml-0-2.dll"]
    binaries: ["{prefix}lib/ruby/{abi}/{arch}/libyaml-0-2.dll"]
    embedded:
      - files: ["{prefix}lib/ruby/{abi}/{arch}/libyaml-0-2.dll"]
        evidence: "0.2.5\0"

  - id: zlib
    name: zlib, compiled into Ruby's zlib extension
    version: 1.3.2
    license: Zlib
    kind: program
    download: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
    notice: zlib
    ships: "compiled into lib/ruby/{abi}/{arch}/zlib.so"
    platforms: [x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl]
    embedded:
      - files: ["{prefix}lib/ruby/{abi}/{arch}/zlib.so"]
        evidence: "deflate 1.3.2 "

  # BLAKE3's reference C implementation, which Ruby 4.1 vendors in
  # ext/digest/blake3 for Digest::BLAKE3 (ruby/ruby df881376ca, "initial
  # BLAKE3 import", and 70a0bfa820), with its three license files and no
  # line in Ruby's LEGAL: anyone who receives it may choose CC0-1.0,
  # Apache-2.0, or Apache-2.0 with LLVM's exception, so it asks for its
  # notice at most. Its evidence is BLAKE3_VERSION_STRING (blake3.h). On
  # Windows on x64, MSYS2's GCC compiles one of its functions into a call
  # to libgcc's __popcountdi2, from libgcc_s_seh-1.dll (gcc-runtime-dll).
  - id: blake3
    name: BLAKE3, compiled into Ruby's digest/blake3 extension
    version: 1.8.5
    license: CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception
    kind: program
    download: https://github.com/BLAKE3-team/BLAKE3/tree/1.8.5
    notice: blake3
    ships: compiled into lib/ruby/{abi}/{arch}/digest/blake3.{so} (on iOS and Android, into libfledgeruby)
    platforms: [arm64-darwin, x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl, x64-mingw-ucrt, aarch64-mingw-ucrt, ios, android]
    embedded:
      - files: ["{prefix}lib/ruby/{abi}/{arch}/digest/blake3.{so}", FledgeRuby.xcframework/*/libfledgeruby.a, FledgeRuby.aar!jni/*/libfledgeruby.so]
        evidence: "1.8.5\0"

  # AppImage's type 2 runtime, as AppImage released it (runtime/sources.yml),
  # and what its own build links into it statically (its
  # scripts/common/install-dependencies.sh and, for Alpine 3.21's
  # packages, scripts/docker/Dockerfile): libfuse, which is LGPL and
  # allowed linked into the runtime only because the runtime's source and
  # libfuse's are both published (source), so the runtime can be rebuilt
  # with another libfuse (LGPL-2.1, section 6(a)); and permissive
  # libraries.
  - id: appimage-runtime
    name: AppImage's type 2 runtime, the program at the front of an app's AppImage
    version: "20251108"
    license: MIT
    kind: program
    download: https://github.com/AppImage/type2-runtime/releases/tag/20251108
    notice: appimage-runtime
    source: appimage-runtime
    ships: tools/appimage-runtime, which fledge build puts at the front of the app's AppImage, and in its folder and archive only when fledge.yml sets build_tools
    platforms: [x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl]
    files: [tools/appimage-runtime]
    binaries: [tools/appimage-runtime]
    embedded:
      - files: [tools/appimage-runtime]
        evidence: "https://github.com/AppImage/type2-runtime/commit/dd6cebe"

  - id: libfuse
    name: libfuse, which mounts the AppImage's file system, linked into the AppImage runtime
    version: 3.15.0
    license: LGPL-2.1-only
    kind: program
    download: https://github.com/libfuse/libfuse/releases/download/fuse-3.15.0/fuse-3.15.0.tar.xz
    notice: libfuse
    source: libfuse
    ships: linked into tools/appimage-runtime, whose own source Fledge publishes with libfuse's, so it can be rebuilt with another libfuse
    platforms: [x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl]
    embedded:
      - files: [tools/appimage-runtime]
        evidence: "3.15.0"

  - id: squashfuse
    name: squashfuse, which reads the AppImage's file system, linked into the AppImage runtime
    version: 0.5.2
    license: BSD-2-Clause
    kind: program
    download: https://github.com/vasi/squashfuse/archive/0.5.2.tar.gz
    notice: squashfuse
    ships: linked into tools/appimage-runtime
    platforms: [x86_64-linux, aarch64-linux, x86_64-linux-musl, aarch64-linux-musl]
    embedded:
