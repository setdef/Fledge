# A spike for Plan 002's Windows on ARM story. Not part of trunk.
name: Spike (Windows on ARM)
on:
  push:
    branches: ["experiment/signing"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fledge at ac0282a with winarm.patch
        run: git clone -q https://github.com/setdef/Fledge f && cd f && git checkout -q ac0282a && git apply ../winarm.patch
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - name: Build the runtime
        working-directory: f
        run: ruby tasks/runtime_builder.rb aarch64-mingw-ucrt
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-aarch64-mingw-ucrt
          path: f/tmp/runtime/fledge-runtime-*-aarch64-mingw-ucrt*
  arm:
    needs: runtime
    runs-on: windows-11-arm
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Fledge at ac0282a with winarm.patch
        shell: bash
        run: git clone -q https://github.com/setdef/Fledge f && cd f && git checkout -q ac0282a && git apply ../winarm.patch
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - run: |
          ruby -v
          ruby -e 'p Gem::Platform.local.to_s, RbConfig::CONFIG["arch"]'
          Get-Command signtool -ErrorAction SilentlyContinue
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Get-Command 7z, tar -ErrorAction SilentlyContinue
      - uses: actions/download-artifact@v4
        with:
          name: runtime-aarch64-mingw-ucrt
          path: runtimes
      - name: Build hello, the probes, and windowed_app
        working-directory: f
        shell: bash
        env:
          FLEDGE_RUNTIME_DIR: ${{ github.workspace }}/runtimes
        run: |
          for app in examples/hello test/fixtures/parity test/fixtures/console examples/windowed_app; do
            ruby -I lib exe/fledge build -o dist "$app"
          done
          ls -l dist
      - name: Deliver hello
        working-directory: f
        run: pwsh -NoProfile -File .github/scripts/deliver.ps1 -Archive dist/Hello-aarch64-mingw-ucrt.zip -Probe dist/Parity-aarch64-mingw-ucrt.zip -Platform aarch64-mingw-ucrt -Expected "Hello from Ruby 4.0.9 on aarch64-mingw-ucrt"
      - name: Console
        if: always()
        working-directory: f
        run: pwsh -NoProfile -File .github/scripts/deliver-console.ps1 -Archive dist/Console-aarch64-mingw-ucrt.zip -Windowed "dist/Hello Window-aarch64-mingw-ucrt.zip"
      - name: Windowed
        if: always()
        working-directory: f
        run: pwsh -NoProfile -File .github/scripts/deliver-windowed.ps1 -Archive "dist/Hello Window-aarch64-mingw-ucrt.zip"
      - name: Installer
        if: always()
        working-directory: f
        run: pwsh -NoProfile -File .github/scripts/deliver-installer.ps1 -Installer "dist/Hello Window-aarch64-mingw-ucrt-setup.exe"
      - name: Parity
        if: always()
        working-directory: f
        env:
          FLEDGE_RUNTIME_DIR: ${{ github.workspace }}/runtimes
        run: ruby tasks/parity.rb aarch64-mingw-ucrt
