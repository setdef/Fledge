---
name: CI
on:
  push:
    branches:
    - "**"
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  MISE_RUBY_COMPILE: 'false'
  RUST_TOOLCHAIN: 1.99.1
  BUNDLE_FROZEN: 'true'
  ALPINE_RUBY: ruby:4.0.9-alpine3.24@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
  ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
jobs:
  runtime:
    name: Runtime (${{ matrix.platform }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          platform: arm64-darwin
        - os: ubuntu-24.04
          platform: x86_64-linux
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Install patchelf
      if: runner.os == 'Linux' && !endsWith(matrix.platform, '-mingw-ucrt')
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq patchelf=0.18.0-1.1build1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: tmp/downloads
        key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml')
          }}
    - name: Build the runtime
      run: |
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        export SOURCE_DATE_EPOCH
        ruby tasks/runtime_builder.rb "${{ matrix.platform }}"
    - name: Check that MSYS2's GMP package holds the runtime's libgmp-10.dll
      if: endsWith(matrix.platform, '-mingw-ucrt')
      env:
        PLATFORM: "${{ matrix.platform }}"
      run: |
        case "$PLATFORM" in
          x64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp package) folder=ucrt64 ;;
          aarch64-mingw-ucrt) package=$(ruby .github/scripts/fetch_pin.rb gmp arm64 package) folder=clangarm64 ;;
        esac
        mkdir -p "$RUNNER_TEMP/gmp-package"
        tar --zstd -xf "$package" -C "$RUNNER_TEMP/gmp-package" "$folder/bin/libgmp-10.dll"
        cmp "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll" tmp/runtime/"$PLATFORM"/stage/fledge-runtime-*/ruby/bin/ruby_builtin_dlls/libgmp-10.dll
        sha256sum "$RUNNER_TEMP/gmp-package/$folder/bin/libgmp-10.dll"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runtime-${{ matrix.platform }}
        path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
        if-no-files-found: error
        retention-days: 14
  runtime-mobile:
    name: Runtime (${{ matrix.platform }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-26
          platform: ios
        - os: ubuntu-24.04
          platform: android
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Select the pinned Xcode
      if: matrix.platform == 'ios'
      run: |
        xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
        sudo xcode-select -s "/Applications/Xcode_$xcode.app"
        xcodebuild -version
    - name: Use Java 21
      if: matrix.platform == 'android'
      run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: tmp/downloads
        key: runtime-downloads-${{ matrix.platform }}-${{ hashFiles('runtime/sources.yml')
          }}
    - name: Build the runtime
      run: ruby tasks/runtime_builder.rb "${{ matrix.platform }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runtime-${{ matrix.platform }}
        path: tmp/runtime/fledge-runtime-*-${{ matrix.platform }}*
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: failure()
      with:
        name: runtime-${{ matrix.platform }}-logs
        path: tmp/runtime/${{ matrix.platform }}/logs
        retention-days: 14
  mobile-apps-ios:
    name: Mobile apps (iOS Simulator, iPhone and iPad)
    needs:
    - runtime
    - runtime-mobile
    runs-on: macos-26
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Select the pinned Xcode
      run: |
        xcode=$(ruby -ryaml -e 'print YAML.safe_load_file("runtime/sources.yml").dig("mobile", "xcode")')
        sudo xcode-select -s "/Applications/Xcode_$xcode.app"
        xcrun simctl list runtimes
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: tmp/downloads
        key: mobile-parity-downloads-ios-${{ hashFiles('runtime/sources.yml') }}
    - name: Install XcodeGen
      run: |
        unzip -q "$(ruby .github/scripts/fetch_pin.rb mobile xcodegen)" -d "$RUNNER_TEMP/xcodegen"
        echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-ios
        path: "${{ runner.temp }}/runtimes"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-arm64-darwin
        path: "${{ runner.temp }}/runtimes"
    - name: Build the apps with fledge build ios, and run them in the iOS Simulator
      run: ruby tasks/mobile_parity.rb ios "$RUNNER_TEMP/runtimes"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: failure()
      with:
        name: mobile-apps-ios
        path: |
          tmp/mobile-parity/ios/*.ndjson
          tmp/mobile-parity/ios/*.log
          tmp/mobile-parity/ios/*.ips
        retention-days: 14
  mobile-apps-android:
    name: Mobile apps (Android emulator, API 36, ${{ matrix.target }})
    needs:
    - runtime
    - runtime-mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
        - google_apis
        - google_apis_ps16k
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
      with:
        version: 2026.10.11
        install_args: ruby
    - name: Use Java 21
      run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
    - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-android
        path: "${{ runner.temp }}/runtimes"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-x86_64-linux
        path: "${{ runner.temp }}/runtimes"
    - name: Install the pinned NDK
      run: |
        unzip -q "$(ruby .github/scripts/fetch_pin.rb mobile ndk hosts x86_64-linux)" -d "$RUNNER_TEMP/ndk"
        echo "ANDROID_NDK_ROOT=$(echo "$RUNNER_TEMP"/ndk/android-ndk-*)" >> "$GITHUB_ENV"
    - name: Build the apps with fledge build android and Gradle, and check each for
        16 KB pages and API 36
      run: ruby tasks/mobile_parity.rb android-build "$RUNNER_TEMP/runtimes"
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run the apps on the emulator
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: "${{ matrix.target }}"
        arch: x86_64
        ram-size: 4096M
        disable-animations: true
        emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          -no-snapshot"
        script: ruby tasks/mobile_parity.rb android
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: failure()
      with:
        name: mobile-apps-android-${{ matrix.target }}
        path: tmp/mobile-parity/android/logcat-*.txt
        retention-days: 14
  mobile-apps-android-hosts:
    name: Mobile apps (Android project on ${{ matrix.host }})
    needs: runtime-mobile
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          host: arm64-darwin
        - os: windows-latest
          host: x64-mingw-ucrt
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Read the Ruby pin
      id: pins
      run: echo "ruby=$(sed -n 's/^ruby = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
      with:
        ruby-version: "${{ steps.pins.outputs.ruby }}"
    - name: Use Java 21
      run: echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME_21_arm64}" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: runtime-android
        path: "${{ runner.temp }}/runtimes"
    - name: Write examples/mobile_app's Android project with fledge build android
      env:
        FLEDGE_RUNTIME_DIR: "${{ runner.temp }}/runtimes"
      run: ruby -I lib exe/fledge build android -o dist examples/mobile_app
    - name: Build it with its Gradle wrapper and check the APK
      run: |
        cd "dist/Mobile App-android"
        if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat --no-daemon assembleDebug; else ./gradlew --no-daemon assembleDebug; fi
        cd ../..
        ruby tasks/mobile_parity.rb android-check "dist/Mobile App-android/build/outputs/apk/debug/Mobile App-debug.apk"
